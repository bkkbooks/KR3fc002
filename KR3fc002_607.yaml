body:
  text: 以等數五約子母為七分升之三得菽一斛二升三十五分升之三十以等數約子母為七分升之六合問說曰注云并全得三齊子并之得二十四同母得二十七約之得九分之八者置米一之粟一三分之二菽二之粟二九分之二并全一二得三母互乘子三分之二得十八九分之二得六并之得二十四是齊子并之也分母三與九相乘得二十七是同其母也以等數三約分母二十七得九約分子二十四得八故云并之得三九分之八即米一菽二所當之粟率也云亦有置米一菽二求其為粟之率以為列衰副并為法以粟乘列衰為實所得即米一菽二所求粟也者置米一之粟一三分之二通之即三分之五菽二之粟二九分之二通之即九分之二十母互乘子米一之粟得四十五菽二之粟得六十以為列衰副并得一百五為法以粟二斛乘列衰四十五得九十斛為米實以粟二斛乘列衰六十得一百二十斛為菽實實如法得一百五分斛之九十為米一所求粟一百五分斛之
