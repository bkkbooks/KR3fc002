body:
  text: 以等數五約子母爲七分升之三得菽一斛二升三十五分升之三十以等數約子母爲七分升之六合問説曰注云并全得三齊子并之得二十四同母得二十七約之得九分之八者置米一之粟一三分之二菽二之粟二九分之二并全一二得三母互乘子三分之二得十八九分之二得六并之得二十四是齊子并之也分母三與九相乘得二十七是同其母也以等數三約分母二十七得九約分子二十四得八故云并之得三九分之八卽米一菽二所當之粟率也云亦有置米一菽二求其爲粟之率以爲列衰副并爲法以粟乘列衰爲實所得卽米一菽二所求粟也者置米一之粟一三分之二通之卽三分之五菽二之粟二九分之二通之卽九分之二十母互乘子米一之粟得四十五菽二之粟得六十以爲列衰副并得一百五爲法以粟二斛乘列衰四十五得九十斛爲米實以粟二斛乘列衰六十得一百二十斛爲菽實實如法得一百五分斛之九十爲米一所求粟一百五分斛之
  hash: sha256:bfda1bac06e3d7e2f8b0f05563ee916ace44f5e2e4cb5a1eb80f89f00cad4db6
