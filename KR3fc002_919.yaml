body:
  text: 左行去右行答位右行餘菽十斗負答空黍五斗正又各以五約之上為二下為一次以右行去第二行下位第二行餘麥一斗負菽二斗負答二斗正以第二行去第四行下位第四行餘麻一斗負麥二斗負菽五斗正又以減左行下位左行餘麥一斗正菽三斗負答一斗正次左行去第二行下位第二行餘麥三斗負菽四斗正是為麥三當菽四次以第二行減第四行下位第四行餘麻一斗負麥一斗正菽一斗正次以第四行去第二行下位第二行餘麻四斗正麥七斗負上得四下得七是為麻四當麥七是為相當之率舉矣說曰注云以新術為此至是菽五當答三即新術所云以正負術入之令左右相減先去下實又轉去物位求其一行二物正負相借者是孔刻誤作易其相當之率也云次以左行去第二行菽位至是為相當之率舉矣即新術所云又令二物與他物互相去取轉其二物相借之數即皆相當之率也云據麻四當麥七即為麻價率七而麥價率四又麥三當菽四即為麥價率四而
  hash: sha256:dea2451a6af955770e2299dd0bcff98869b28b714c6b8256dc820a766dca563d
