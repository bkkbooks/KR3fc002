body:
  text: 百約之為四分錢之三合問說曰此重今有也於今有術以貸人千錢為所有率月息三十為所求率今貸人七百五十錢為所有數而今有之得貸人七百五十錢三十日之息次以一月三十日為所有率貸人七百五十錢三十日之息為所求率九日為所有數而今有之得貸人七百五十錢九日之息試置今貸人七百五十錢於位以息三十乘之得二萬二千五百錢為實以貸人千錢為法除之得二十二錢二分錢之一此一次乘除也又置二十二錢二分錢之一於位通分內子得四十五錢以九日乘之得四百五錢為實以分母二乘月三十日得六十為法除之得六錢四分錢之三此又一次乘除也今并二次乘除為一次乘除不用中間故令後實乘前實後法乘前法而并除此術文意也注云是為貸人錢三萬一日息三十者月息三十是一日息一錢也貸人千錢一日息一錢則貸人三萬一日息三十也云以九日乘今所貸錢為今一日所有錢者以九日乘今貸錢七百五十得六千七百五十錢為
