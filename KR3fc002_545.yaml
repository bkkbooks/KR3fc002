body:
  text: 術曰令縣戶數各如其本行道日數而一以為衰據甲行道八日出使八戶其出一車乙行道十日因使十戶共出一車計其在道則皆戶一日出一車故可為均平之率也甲衰一百二十五乙丙衰各九十五丁衰六十一副并為法以賦粟車數乘未并者各自為實衰分科率實如法得一車各置所當出車以其行道日數乘之如戶數而一得率戶用車二百四十七分日之三十一故謂之均求此率以戶當各計車之衰分也臣淳風等謹按縣戶有多少之差行道有遠近之異欲其均等故各令行道日數約戶為衰行道多者少其戶行道少者多其戶故各令約戶為衰以八日約除甲縣得一百二十五乙丙各九十五丁六十一於今有術副并為所有率未并者各為所求率以賦粟車數為所有數而今有之各得車數一旬除乙十三除丙各得九十五二旬除丁得六十一也有分者上下輩之輩配也車牛人之數不可分裂推少就多均賦之宜今按甲分既少宜從於乙滿法除之有餘從丙丁分又少亦宜就丙除之適盡加乙丙各一上下輩益以少從多也以二十五斛乘車數即粟數潢按注得率戶用車二百百字當作日故各令約戶為衰下文有錯誤攺正於後以八日約除甲縣得一百二十五一旬除乙十三除丙各得九十五二旬除丁得六十一於今有術副并為所有率未并者各為所求率以賦粟車數為所有數而今有之各得車數草曰令甲縣一萬戶如行道八日而一得一千
