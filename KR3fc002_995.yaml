body:
  text: 荅曰甲出南門八百步邪東北行四千八百八十七步半及乙乙東行四千三百一十二步半如圖乙東行爲股率甲南行爲句率邪行爲弦率自南門至邑東隅爲小股求出南門步數爲小股之句術曰令五自乘三亦自乘并而半之爲邪行率邪行率減於五自乘者餘爲南行率以三乘五爲乙東行率求三率之意與上甲乙同置邑方半之以南行率乘之如東行率而一卽得出南門步數邑半方自南門至東隅五里以爲小股求出南門步數爲小股之句以東行爲股率南行爲句率故置邑方半之以南行句率乘之如股率而一以增邑方半卽南行半邑者謂從邑心中停也置南行步求弦者以邪行率乘之求東者以東行率乘之各自爲實實如南行率得一步此術與上甲乙同草曰置甲行率五爲句弦并自乘得二十五爲句弦并幂卽爲帶分句弦并以句弦并爲母又置乙行
