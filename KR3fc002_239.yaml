body:
  text: 分斗之三是俱損折也今有禀粟五斛五人分之欲令三人得三二人得二問各幾何荅曰三人人得一斛一斗五升十三分升之五二人人得七斗六升十三分升之十二術曰置三人人三二人人二爲列衰副并爲法以五斛乘未并者各自爲實實如法得一斛草曰置三人人三二人人二爲列衰次置人三於上以三人乘之得九置人二於下以二人乘之得四并上下位得十三爲法置禀粟五斛展爲五百升先以列衰三乘之得一千五百升又以列衰二乘之得一千升各自爲實實如法得一百一十五升十三分升之五收作一斛一斗五升十三分升之五爲三人人得粟得七十六升十三分升之十二收作七斗六升十三分升之十二爲二人人得粟合問説曰置一百一十五升十三分升之五通分內子得一千五百升三之得四千五百升於上位置七十六升十三分升之十二通分內子得一
