body:
  text: 而餘徑亦漸小至於不可割則弧面逼近圓周而合體矣云弧面之外又有餘徑以面乘徑則幂出弧表者即下注所云以弦乘矢之凡幂也如圖甲辰為餘徑亦謂之矢乙巳為弧面亦謂之弦子丑寅卯四段為以弦乘矢之幂子丑二段出於弧表云以一面乘半徑觚而裁之每輒自倍者觚猶角也觀圖自知云此以周徑謂至然之數者以猶用也言此所用之周徑乃至密之率非周三徑一之率也周三者謂合六弧之六面非真圓周也云以推圓規多少之較乃弓之與弦也者圓規猶圓周也圓周為弓六弧之面為弦也割六弧以為十二弧草曰令半徑一尺為弦展為一十寸自乘得一百寸於上位半面五寸為句自乘得二十五寸於下位以下減上餘七十五寸開方除之得八寸六分六𨤲二秒五忽又退法開之議得四命為十分忽之四約為五分忽之二即股也云又以退法者方法一退也云微數無名者以為分子以下為分母者得在上
