body:
  text: 得上禾一秉實二十五分斗之九中禾一秉實二十五分斗之七下禾一秉實二十五分斗之四合問說曰正負者言相反也方程下實為差實者則有正負其差實為正多於負之數令與正物同名為正為負多於正之數令與負物同名為負正與正負與負為同名正與負則異名也云正無人負之負無人正之者此條同名相除為例正宜消正今減行無正則以正奪其位而為負負宜消負今減行無負則以負奪其位而為正云正無人正之負無人負之者此條異名相除為例正宜消負今行無負則以正奪其位而為正負宜消正今減行無正則以負奪其位而為負人謂相對也減行直空位為無對或減行之數不足減反減之亦為無對皆使消奪者居其位也注云算者算也赤黑邪正皆以分別正負令布算者望而知其同異也云赤黑相取者謂以正負相課而取其差實也云左右數相推求者謂以左右行各位相消奪也永樂大典作法實數相推求云其并減之勢不得交通者
