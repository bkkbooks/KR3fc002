body:
  text: 不可今以凡言幂者據廣從之一方其言積者舉衆步之都數經云相乘得積步即是都數之明文注云謂之為幂全乖積步之本意此注前云積謂田幂於理得通復云謂之為幂繁而不當今者注釋存善去非略為科簡遺諸後學以畝法二百四十步除之即畝數百畝為一頃臣淳風等謹按此為篇端故特舉頃畝二法餘術不復言者從此可知一畝之田廣十五步從而疏之令為十五行即每行廣一步而從十六步又橫而截之令為十六行即每行廣一步而從十五步此即從疏橫截之步各自為方凡有二百四十步為一畝之地步數正同以此言之即廣從相乘得積步驗矣二百四十步者畝法也百畝者頃法也故以除之即得草曰置廣十五步於上位又置從十六步於下位上位有十步至十以上一呼下一一一如一即下一百於中位以上一呼下六一六如六即於中位下六十退下位一等收上位一十以上位五呼下位一一五如五即於中位下五十以上五呼下六五六三十即於中位下三十上下位俱收中位得二百四十為積步乃以中位二百四十步為實以畝法二百四十步為法置下位以下除中得一置上位上下相呼除中位適盡收下位定上位所得為一畝合問草曰置廣十二步於上位又置從十四步於下位上位有十步至十以上一呼下一一一如一
