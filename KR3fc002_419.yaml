body:
  text: 作一人共得三萬三千五百八十二人即用徒人數也合問一千人先到問當受袤幾何答曰一百五十四丈三尺二寸八十一分寸之八術曰以一人功尺數乘先到人數為實以一千人一日功為實立幂為功并渠上下廣而半之以深乘之為法以渠廣深之立幂為法實如法得袤尺潢按注立幂為功四字衍觀下注以渠廣深之立幂為法可知草曰置先到一千人以一人功三百尺乘之得三十萬尺為實如前穿渠草并上下廣而半之以深乘之得一百九十四尺四寸為法實如法得一千五百四十三尺餘四十尺八寸復以法退除之得二寸一千九百四十四分寸之一百九十二子母各以二十四約之為八十一分寸之八共收作一百五十四丈三尺二寸八十一分寸之八即先到人所受袤也合問今有方堢壔堢者堢城也壔音丁老切又音纛謂以土擁木也方一丈六尺高一丈五尺問積幾何
