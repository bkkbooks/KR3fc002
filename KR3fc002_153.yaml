body:
  text: 稻多同草曰置粟五斗五升展為五十五升以飱率九乘之得四百九十五升為實以粟率五為法除之得九斗九升即飱也合問說曰飱率九十與粟率五十退位求之所求之率得九所有之率得五故以九乘五除也今有粟四斗欲為熟菽問得幾何答曰為熟菽八斗二升五分升之四術曰以粟求熟菽二百七之百而一臣淳風等謹按熟菽之率一百三半半者其母二故以母二通之所求之率既被二乘所有之率隨而俱長故以二百七之百而一草曰置粟四斗展為四十升以熟菽率二百七乘之得八千二百八十升為實以粟率一百為法除之得八斗二升一百分升之八十子母各以二十約之為五分升之四即熟菽合問說曰熟菽之率一百三半通分內子得二百七為所求率既以二乘所求率亦以二乘粟率三十得一百為所有率故注云所求之率既被二乘所有之率隨而俱長故以二百七之百而一也
