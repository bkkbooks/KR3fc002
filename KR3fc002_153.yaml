body:
  text: 稻多同草曰置粟五斗五升展爲五十五升以飱率九乘之得四百九十五升爲實以粟率五爲法除之得九斗九升卽飱也合問説曰飱率九十與粟率五十退位求之所求之率得九所有之率得五故以九乘五除也今有粟四斗欲爲熟菽問得幾何荅曰爲熟菽八斗二升五分升之四術曰以粟求熟菽二百七之百而一臣淳風等謹按熟菽之率一百三半半者其母二故以母二通之所求之率旣被二乘所有之率隨而俱長故以二百七之百而一草曰置粟四斗展爲四十升以熟菽率二百七乘之得八千二百八十升爲實以粟率一百爲法除之得八斗二升一百分升之八十子母各以二十約之爲五分升之四卽熟菽合問説曰熟菽之率一百三半通分內子得二百七爲所求率旣以二乘所求率亦以二乘粟率三十得一百爲所有率故注云所求之率旣被二乘所有之率隨而俱長故以二百七之百而一也
