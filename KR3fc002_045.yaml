body:
  text: 答曰一畝二百步十一分步之七大廣田臣淳風等謹按大廣田者初術直有全步而無餘分次術空有餘分而無全步此術先見全步復有餘分可以廣兼三術故曰大廣術曰分母各乘其全分子從之分母各乘其全分子從之者通全步內分子如此則母子皆為實矣相乘為實分母相乘為法猶乘分也實如法而一今為術廣從俱有分當各自通其分命母入者還須出之故令分母相乘為法而連除之草曰置廣三步以分母三乘之得九分子一從之得一十於上位置從五步以分母五乘之得二十五分子二從之得二十七於下位上下相乘得二百七十為實分母三分母五相乘得一十五為法實如法而一得十八步合問草曰置廣七步以分母四乘之得二十八分子三從之得三十一於上位置從十五步以分母九乘之得一百三十五分子五從之得一百四十於下位上下相乘得四千三百四十為實分母四分母九相乘得三十六為法實如法而一得一百二十步三十六分步之二十分母子各以等數四約之為九分步之五合問草曰置廣十八步以分母七乘之得一百二十
