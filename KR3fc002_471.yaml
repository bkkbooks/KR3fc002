body:
  text: 云末廣之兩旁各一小鱉臑皆與塹堵等者其深袤皆與塹堵等也如圖甲丁丙乙庚辛為塹堵子甲乙庚與丑丁丙辛為末廣兩旁之小鱉臑乙庚與丙辛為深甲乙與丁丙為袤皆與塹堵等令小鱉臑居裏大鱉臑居表則大鱉臑出橢皆方錐者并原所有末廣兩旁之小鱉臑末廣二尺無深袤七尺深三尺無上下廣今改作上廣二尺深三尺無下廣袤七尺無末廣仍令小鱉臑居裏大鱉臑居表則大鱉臑出橢皆方錐矣下廣三尺者即羡除之深也袤六尺者上下廣差四尺并末廣差二尺為六尺也高七尺者即羡除之袤也如圖甲卯寅庚為大鱉臑居表甲乙卯庚為小鱉臑居裏乙庚為下廣乙寅為袤甲乙為高是出橢皆方錐也
  hash: sha256:989207b9784ac1db5660c6680c6caa368a83b791fa2f0f156552ab890814665b
