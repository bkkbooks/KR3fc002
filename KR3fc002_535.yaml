body:
  text: 之立幂除垣積得中平之廣倍之知兩廣全也今有倉廣三丈袤四丈五尺容粟一萬斛問高幾何答曰二丈如圖庚癸為廣癸壬為袤丁癸為高術曰置粟一萬斛積尺為實廣袤相乘為法實如法而一得高尺以廣袤之幂除積故得高按此術本以廣袤相乘以高乘之得此積今還原置此廣袤相乘為法除之故得高也草曰置粟一萬斛以粟斛積二尺七寸乘之得二萬七千尺為實以廣三丈展為三十尺袤四丈五尺展為四十五尺相乘得一千三百五十尺為法實如法而一得二十尺收為二丈即高也合問今有圓囷圓囷廩也亦云圓囤也高一丈三尺三寸少半寸容米二千斛問周幾何答曰五丈四尺於𡽪術當周五丈五尺二寸二十分寸之九臣淳風等謹依密率為周五丈五尺一百分尺之二十七
