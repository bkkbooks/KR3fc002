body:
  text: 三十七萬一千二百九十三分錢之八萬四千八百七十六即初持之本置初返歸一萬四千次返歸一萬三千次返歸一萬二千次返歸一萬一千後返歸一萬并之得六萬錢以初持本減之餘二萬九千五百三十一錢三十七萬一千二百九十三分錢之二十八萬六千四百一十七即利也九章算術細草圖說卷七門下晚學生沈欽裴算校
