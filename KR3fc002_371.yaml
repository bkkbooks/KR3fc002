body:
  text: 乘𠔳加方也復除折下如前者三因次商加𠔳為𠔳法方一退𠔳再退隅三退步之如前也若積有分者至令如母而一帶分開立方法也開其母以報除者置分母於位開立方除之所得以除上議也注云言千之面十言百萬之面百者立方求積方再自乘方十再自乘之積千方百再自乘之積百萬就積開之故超二位言千之面十言百萬之面百也云再乘者亦求為方幂以上議命而除之則立方等也者以上議再乘所借一算為方幂又以上議乘之為立方積除之者於實內減去初商再自乘之立方積也云為當復除故豫張三面以定方幂為定法也者為實未盡當復更除故以上議自乘三之是豫張三面巳定方幂為定法也云復除者三面方幂以皆自乘之數須得折議定其厚薄爾者折議次商也三方皆巳有幂須得次商以定其厚薄也云設三𠔳之定長者三因上議為三𠔳之定長也云欲以為隅方立方等未有定數且置一算定其位者次商未有定數且置一算步之定次商之位也云上方法長自乘而一折者
