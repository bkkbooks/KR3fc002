body:
  text: 如圖句股之中成小句股弦者四句面之小股股面之小句皆小方之面皆圓徑之半云其數故可衰至則同歸矣者以今有差分之義釋術文法實之所由生也并句股弦得四十步為所有率股十五步為所求率以句八步作句面之小句股弦并為所有數而今有之得三步為句面之小股即圓徑之半并句股弦得四十步為所有率句八步為所求率以股十五步作股面之小句股弦并為所有數而今有之得三步為股面之小句亦即圓徑之半此今有之義也置句八步股十五步弦十七步為列衰副并得四十步為法以股十五步為所分數得句三步股五步四十分步之二十五弦六步四十分步之一十五并之得十五步故以股十五步為股面之小句股弦并股面之小句三步即圓徑之半以句八步為所分數則得句一步四十分步之二十四股三步弦三步四十分步之一十六并之得八步故以句八步為句面之小句
  hash: sha256:7e26dc3f9159ab3c5176d2fd4342c569d5ae2eeac7580afae2156464ceb7f501
