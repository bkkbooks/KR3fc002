body:
  text: 礫水石之功太半餘為法以塹積尺為實實如法而一即用徒人數按此術置本人功去其出土功五分之一者謂以四乘五除又去沙礫水石作太半者一乘三除存其少半取其定功乃通分內子以為法以分母乘塹積尺為實法裏有分實裏通之實如法而一即用徒人數不盡者等數約之而命分也草曰置程功八百七十一尺以出土功分子一減分母五餘四乘之得三千四百八十四尺又以沙礫水石之功分子二減分母三餘一乘之仍得三千四百八十四尺為實次以出土功分母五乘沙礫水石之功分母三得一十五為法除實得二百三十二尺一十五分尺之四為定功復置定功以分母一十五通分內子得三千四百八十四尺為法置塹積一萬九百四十三尺八寸亦以分母一十五乘之得一十六萬四千一百五十七尺為實實如法而一得四十七人三千四百八十四分人之四百九即用徒人數也合問今有穿渠上廣一丈八尺下廣三尺六寸深一丈八尺袤五萬一千八百二十四尺問積幾何答曰一千七萬四千五百八十五尺六寸
