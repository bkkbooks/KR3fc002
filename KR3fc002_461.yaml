body:
  text: 為方錐邪畫方錐之底亦令為中方就中方削而上合全為中方錐之半於是陽馬之棊悉中解矣中錐離而為四鱉臑焉故外錐之半亦為四鱉臑雖背正異形與常所謂鱉臑參不相似實則同也所云夾塹堵者中錐之鱉臑也凡塹堵上袤短者連陽馬也下袤短者與鱉臑連也下兩袤相等者亦與鱉臑連也并三廣以高袤乘六而一皆其積也今此羡除之廣即塹堵之袤也按此本是三廣不等即與鱉臑連者別而言之中央塹堵廣六尺高三尺袤七尺末廣之兩旁各一小鱉臑皆與塹堵等令小鱉臑居裏大鱉臑居表則大鱉臑出橢皆方錐下廣三尺袤六尺高七尺分取其半則為袤三尺以高廣乘之三而一即半錐之積也邪解半錐得此兩大鱉臑求其積亦當六而一合與常率矣按陽馬之棊兩邪棊底方當其方也不問旁角而割之相半可知也推此上連無成不方故方錐與陽馬同實角而割之者相半之勢此大小鱉臑可知更相表裏但體有背正也草曰置下廣六尺上廣一丈末廣八尺并之得二丈四尺展為二十四尺以深三尺乘之得七十二尺又以袤七尺乘之得五百四尺六而一得八十四尺即羡除積也合問說曰注云其所穿地上平下邪似兩鱉臑夾一塹堵即羡除之形具圖於后如圖甲丁丙乙庚辛為塹堵甲乙丙丁為上平幂甲庚辛丁為下邪幂丙乙庚辛為立幂甲乙庚與丁丙辛為兩旁句股幂
