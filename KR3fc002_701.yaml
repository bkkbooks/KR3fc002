body:
  text: 得牛價也減盈下脫增不足三字故以乘同之當作故以同乘之買物草曰置人出八於右行盈三居其下置人出七於左行不足四居其下人出盈右行人出不足左行令不足四維乘所出八得三十二令盈三維乘七得二十一人出盈右行人出不足左行并之得五十三為實即物價也并盈三不足四得七為法即人數也合問其一術草曰并盈三不足四得七為實以所出七減所出八餘一為法實如法得七即人數也副置人數七以人出八乘之得五十六減盈三
  hash: sha256:359bb458b099ee5f9479d7b74b5cf22106b4a0635e6e3e9378bb9f0edc38082f
