body:
  text: 得牛價也減盈下脫增不足三字故以乘同之當作故以同乘之買物草曰置人出八於右行盈三居其下置人出七於左行不足四居其下人出盈右行人出不足左行令不足四維乘所出八得三十二令盈三維乘七得二十一人出盈右行人出不足左行并之得五十三爲實卽物價也并盈三不足四得七爲法卽人數也合問其一術草曰并盈三不足四得七爲實以所出七減所出八餘一爲法實如法得七卽人數也副置人數七以人出八乘之得五十六減盈三
  hash: sha256:06ef78021223a317093ce5562170563ab33144553a38ad958c0cf0109219e82e
