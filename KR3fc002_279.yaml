body:
  text: 所求率今有田積步為所有數而今有之即得又以所求之率是一一乘不長以經分術入之尤為簡易也今有取保一歲價錢二千五百今先取一千二百問當作日幾何答曰一百六十九日二十五分日之二十三術曰以價錢為法以一歲三百五十四日乘先取錢數為實實如法得日數按此術亦今有之義以價為所有率一歲日數為所求率取錢為所有數而今有之即得草曰置一歲三百五十四日於位以今先取錢一千二百乘之得四十二萬四千八百日為實次置價錢二千五百以為法實如法得一百六十九日二千五百分日之二千三百子母各以一百約之為二十五分日之二十三即當作日也合問説曰李籍音義云保傭也如所謂酒家保此問所求數是日故所求率一歲通為三百五十四日所以齊其位也亦可先約所有率所有數以乘除置所有率價錢二千五百以等數一百約
