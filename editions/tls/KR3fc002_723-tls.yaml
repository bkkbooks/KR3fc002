body:
  text: 百爲實實如法而一得三十三卽人數也副置人數三十三以所出四百乘之得一萬三千二百減盈三千四百餘九千八百以所出三百乘之得九千九百減盈一百亦餘九千八百卽金價也合問買羊草曰置人出五於右行不足四十五居其下置人出七於左行不足三居其下人出不足右行人出不足右行令不足三維乘所出五得十五令不足四十五維乘所出七得三百一十五人出不足右行人出不足左行以十五減三百一十五餘三百爲實以不足三
  hash: sha256:f02e07b39df56d0ff75d7a9a82088ef83f0733eae884dd9a1468f97052fe5a32
