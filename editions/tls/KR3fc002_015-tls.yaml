body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門譔方田以御田疇界域今有田廣十五步從十六步問爲田幾何荅曰一畝又有田廣十二步從十四步問爲田幾何荅曰一百六十八步圖從十四廣十二潢按㨿注所云則舊有圖而今亡矣補之如后如圖廣十二步從十四步相乘得一百六十八步方田術曰廣從步數相乘得積步此積謂田幂凡廣從相乘謂之幂臣淳風等謹按經云廣從相乘得積步注云廣從相乘謂之幂觀斯注意積幂義同以理推之固當不爾何則幂是方面單布之名積乃衆數聚居之稱循名責實二者全殊雖欲同之竊恐
  hash: sha256:77af684eb3dac3237523ae6e42ac4caa07bb142bb75f01fde0b9798b0a36c809
