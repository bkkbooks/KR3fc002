body:
  text: 上方一尺下方三尺高一尺其用棊也中央立方一四面壍堵四四角陽馬四上下方相乘爲三尺以高乘之約積三尺是爲得中央立方一四面壍堵各一上方自乘亦得中央立方一下方自乘爲九以高乘之得積九尺是爲中央立方一四面壍堵各二四角陽馬各三也上方自乘以高乘之得積一尺又爲中央立方一凡三品棊皆一而爲三故三而一得積尺用棊之數立方三壍堵陽馬各十二凡二十七棊十二與三更差次之而成方亭者三驗矣爲術又可令方差自乘以高乘之三而一卽四陽馬也上下方相乘以高乘之卽中央立方及四面壍堵也并之以爲方亭積數也潢按注上方自乘亦得中央立方十一字衍觀下文上方自乘以高乘之得積一尺又爲中央立方一可知設問先下方而後上方故注亦先言下方自乘以高乘之後言上方自乘以高乘之也草曰置下方五丈展爲五十尺上方四丈展爲四十尺以相乘得二千尺於上位又置下方五十尺自乘得二千五百尺於中位又以上方四十尺自乘得一千六百尺於下位三位相并得六千一百尺以高五丈展爲五十尺乘之得三十萬五千尺三而一得一十萬一千六百六十六尺三分尺之二爲太半尺卽方亭積也合問注爲術草曰置下方五十尺以上方四十尺減
  hash: sha256:c3b9f0b8cbf2fdc5e1901c4841606230f0bdabda82d8eae9ae40b0673033e634
