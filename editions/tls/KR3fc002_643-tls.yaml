body:
  text: 四爲關取盈金置取盈分子四爲法以分母五乘償錢五千得二萬五千錢爲實實如法得六千二百五十錢卽金值也云今術旣以十二斤爲所稅則是以十爲母故十乘二斤及所償錢通其率者爲以十除十二斤不盡則是寄十爲分母故取金二斤及償錢五千皆以十乘之爲通其率也今有客馬日行三百里客去忘持衣日巳三分之一主人乃覺持衣追及與之而還至家視日四分之三問主人馬不休日行幾何荅曰七百八十里術曰置四分日之三除三分日之一按此術置四分日之三除三分日之一者除卽減也減之餘有十二分之五卽是主人追客還用日率也半其餘以爲法去其還存其往率之者子不可半故倍母二十四分之五是爲主人與客均行用日之率也副置法增三分日之一法二十四分之五者主人住追用日之分也三分之一者客去主人未覺之前獨行用日之分也并連此數得二十四分日之十三則主人追及前用日之分也是爲客用日率也然則主人用日率者客馬行率也客用日率者主人馬行率也母同則子齊是爲客馬行率五主人馬行率十三於今有術三百里爲所有數十三爲所求率五爲所有率而今有之卽得也以三百里乘之爲實實如法得主人馬一日行欲知主人追客所行里者以三百里
