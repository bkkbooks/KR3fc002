body:
  text: 除下禾之實餘如上禾秉數而一卽上禾之實實皆如法各得一斗是也云損之曰益者上禾七秉下禾二秉實十一斗損實一斗而餘十斗今欲全其實故益所損也云益之曰損者上禾二秉下禾八秉實九斗益實一斗乃滿十斗今欲知本實故損所益也云損實一斗其實過十斗者以十一斗爲下實也云益實一斗其實不滿十斗者以九斗爲下實也今有上禾二秉中禾三秉下禾四秉實皆不滿斗上取中中取下下取上各一秉而實滿斗問上中下禾實一秉各幾何荅曰上禾一秉實二十五分斗之九中禾一秉實二十五分斗之七下禾一秉實二十五分斗之四術曰如方程各置所取置上禾二秉爲右行之上中禾三秉爲中行之中下禾四秉爲左行之下所取一秉及實一斗各從其位諸行相借取之物皆依此例以正負術入之正負術曰今兩算得失相反要令正負以名之正算赤負算黑否則以邪正爲異方程自有赤黑相取左右數相推求之術而其并減之勢不得交通故使赤黑相消奪之於算或
