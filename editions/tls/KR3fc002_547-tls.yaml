body:
  text: 二百五十爲甲泛衰令乙縣九千五百戶如行道十日而一得九百五十爲乙泛衰令丙縣一萬二千三百五十戶如行道十三日而一得九百五十爲丙泛衰令丁縣一萬二千二百戶如行道二十日而一得六百一十爲丁泛衰置四縣泛衰求總等得一十以約之得甲衰一百二十五乙丙衰各九十五丁衰六十一副并得三百七十六以爲法乃置賦粟車一萬乘以甲衰一百二十五乘之得一百二十五萬爲甲實以乙丙衰各九十五乘之得九十五萬爲乙丙實以丁衰六十一乘之得六十一萬爲丁實實如法而一得甲縣車三千三百二十四乘三百七十六分乘之一百七十六以等數八約子母爲四十七分乘之二十二乙丙縣車各二千五百二十六乘三百七十六分乘之二百二十四以等數八約子母爲四十七分乘之二十八丁縣車一千六百二十二乘三百七十六分乘之一百二十八以等數八約子母爲四十七分乘之十六有分者上下軰之得甲縣車三千三百二十四乘乙丙縣車各二千五百二十七乘丁縣
