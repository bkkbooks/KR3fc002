body:
  text: 實求上禾以下禾實三升乘右行下禾十秉負得三十升負爲下禾列實以并右行差實一斗八升正得四斗八升正爲上禾列實如上禾六秉而一得八升爲上禾一秉之實合問説曰此問以異名相除同名相益爲例以右行徧乘左行而直除之上禾減盡下禾餘四十升異名相除也下實得一百二十升同名相益也以右行下禾列實益右行下位差實亦行中正負雜者異名益實也今有上禾三秉益實六斗當下禾十秉下禾五秉益實一斗當上禾二秉問上下禾實一秉各幾何荅曰上禾一秉實八斗下禾一秉實三斗術曰如方程置上禾三秉正下禾十秉負益實六斗正次置上禾二秉負下禾五秉正益實一斗正以正負術入之言上禾三秉之實少益其六斗然後於下禾十秉相當也故亦互其算而以六斗爲差實差實者下禾之餘實潢按術文益實六斗正益實一斗正正皆當作負注然後於下禾十秉相當也於當作與
