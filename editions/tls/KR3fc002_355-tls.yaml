body:
  text: 荅曰一百二十三尺今有積一千九百五十三尺八分尺之一問爲立方幾何荅曰一十二尺半今有積六萬三千四百一尺五百一十二分尺之四百四十七問爲立方幾何荅曰三十九尺八分尺之七又有積一百九十三萬七千五百四十一尺二十七分尺之一十七問爲立方幾何荅曰一百二十四尺太半尺開立方立方適等求其一面也術曰置積爲實借一算步之超二等言千之面十言百萬之面百議所得以再乘所借一算爲法而除之再乘者亦求爲方幂以上議命而除之則立方等也除巳三之爲定法爲當復除故豫張三面以定方幂爲定法也復除折而下復除者三面方幂以皆自乘之數須得折議定其厚薄爾開平幂者方百之面十開立幂者方千之面十據定法巳有成方之幂故復除當以千爲百折下一等也以三乘所得數置中行設三𠔳之定長復借一算置下行欲以爲隅方立方等未有定數且置一算定其位步之中超一下超二位上方法長自乘而一折中𠔳法但有長故降一等下隅法無面長故又降一等也復置議以一乘中爲三𠔳備幂也再
