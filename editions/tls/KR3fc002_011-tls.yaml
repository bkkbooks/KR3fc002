body:
  text: 表望遠及因木望山之術皆端帝互見無有超邈若斯之𩔖然則蒼等爲術猶未足以博盡羣數也徽尋九數有重差之名原其指趣乃所以施於此也凡望極高測絕深而兼知其遠者必用重差句股則必以重差爲率故曰重差也立兩表於洛陽之城令高八尺南北各盡平地同日度其正中之時以景差爲法表高乘表間爲實實如法而一所得加表高卽日去地也以南表之景乘表間爲實實如法而一卽爲從南表至南戴日下也以南戴日下及日去地爲句股爲之求弦卽日去人也以徑寸之筩南望日日滿筩空則定筩之長短以爲股率以筩徑爲句率日去人之數爲大股大股之句卽日徑也雖天圓穹之象猶曰可度又况泰山之高與江海之廣哉徽以爲今之史籍且畧舉天地之物考論厥數載之於志以闡世術之美輒造重差并爲注解以究古人之意綴於句股之下度高者重表測深者累矩孤離者三望離而又帝求者四望觸類而長之則雖幽遐詭伏靡所不入博物君子詳而覽焉
