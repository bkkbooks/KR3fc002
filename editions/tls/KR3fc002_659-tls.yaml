body:
  text: 人亦得十一又三之二并上下部得二十三又三之一通分內子得七十爲法亦以分母三通錐行定衰甲得十九乙得十六丙得十三丁得十戊得七巳得四庚得一爲列衰以所分七錢乘列衰甲得一百三十三乙得一百一十二丙得九十一丁得七十戊得四十九巳得二十八庚得七各自爲實實如法甲得一錢十分錢之九乙得一錢十分錢之六丙得一錢十分錢之三丁得一錢戊得十分錢之七巳得十分錢之四庚得十分錢之一卽合所問云此可倣下術者卽下竹九節術也云令上二人分二錢半爲上率令下三人分二錢半爲下率上下二率以少減多餘爲實者置上率二分錢之二五下率三分錢之二五齊而同之上率爲六分錢之七五下率爲六分錢之五以少減多上率餘六分之二五倍之得六分之五爲實云置二人三人各半之減五人餘爲法者置二人三人并而半之得二五以減五人餘二五倍之得五爲法實如法得三十分之五約爲六分之一卽衰相去也下衰率六分之五者丁所得錢數也以衰相
