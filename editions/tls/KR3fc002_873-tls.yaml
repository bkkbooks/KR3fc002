body:
  text: 一步實一斗於第三行次置黑禾五步白禾一步靑禾一步實一斗於左行令右行白禾二步徧乘第三行第三行得白禾二步黃禾八步黑禾二步實二斗而直除之第三行白禾空靑禾一步負黃禾七步正黑禾二步正實一斗正次令右行白禾二步徧乘左行左行得白禾二步靑禾二步黑禾十步實二斗而直除之左行白禾空靑禾一步正黃禾一步負黑禾十步正實一斗正次令第二行青禾三步徧乘第三行第三行得靑禾三步負黃禾二十一步正黑禾六步正實三斗正以異減同并第三行第三行靑禾空黃禾二十二步正黑禾七步正實四斗正次令第二行靑禾三步徧乘左行左行得靑禾三步正黃禾三步負黑禾三十步正實三斗正以同減異并左行左行靑禾空黃禾四步負黑禾二十九步正實二斗正次令第三行黃禾二十二步徧乘左行左行得黃禾八十八步負黑禾六百三十八步正實四十四斗正以異減同并左行左行黃禾空黑禾六百六十六步正實六十斗正上法下實以等數六約之得一百一
