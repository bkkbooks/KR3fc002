body:
  text: 假令不足右行日寸假令有餘左行日寸令有餘一尺二寸維乘五日得六十日令不足五寸維乘六日得三十日假令不足右行日寸假令有餘左行日寸并之得九十日爲實并有餘一尺二寸不足五寸得一十七寸爲法實如法得五日十七分日之五卽瓜瓠相逢日也合問求瓜瓠各長草曰置五日十七分日之五通分內子得九十以瓜長七寸乘之得六百三十寸以分母十七除之得三尺七寸十七分寸之一卽瓜長也副置九十以瓠長一尺乘之得九十尺以分母十七除之得五尺二寸十七分寸之
  hash: sha256:5b0679b23f4fbb2cf9fdd6c1cba32541061c81dfa4d919ff31355943beb83cd0
