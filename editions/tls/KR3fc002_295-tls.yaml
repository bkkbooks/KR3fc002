body:
  text: 得一百三十步一十一分步之一十卽從步也合問今有田廣一步半三分步之一四分步之一求田一畝問從幾何荅曰一百一十五步五分步之一術曰下有四分以一爲一十二半爲六三分之一爲四四分之一爲三并之得二十五以爲法置田二百四十步亦以一爲一十二乘之爲實實如法而一得從步草曰置一步二分步之一三分步之一四分步之一於位以最下分母四徧乘諸分子及全步皆爲四各以其母除之則一爲四半爲二三分之一爲三分之四四分之一爲一置之於左又以分母三乘分子及巳通者仍以其母除之則一爲一十二半爲六三分之一爲四四分之一爲三并之得二十五以爲法置田二百四十步亦以一爲一十二乘之得二千八百八十步爲實實如法得一百一十五步二十五分步之五子母各以五約之爲五分步之一卽從步也合問
