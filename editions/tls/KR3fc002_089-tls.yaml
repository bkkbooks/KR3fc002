body:
  text: 乘之方幂四百寸令與圓幂通相約圓幂三千九百二十七方幂得五千是爲率方幂五千中容圓幂三千九百二十七圓幂三千九百二十七中容方幂二千五百也者置方幂四百寸以分母二十五通之得一萬半之得五千爲方幂率置圓幂三百一十四寸二十五分寸之四通分內子得七千八百五十四半之得三千九百二十七爲圓幂率是爲率方幂五千中容圓幂三千九百二十七內方合外方之半故圓幂三千九百二十七中容方幂二千五百也云以半徑一尺除圓幂三百一十四寸二十五分寸之四倍之得六尺二寸八分二十五分寸之八卽周數也者置圓幂三百一十四寸二十五分寸之四通分內子得七千八百五十四寸爲實置半徑一尺展爲一十寸又以分母二十五乘之得二百五十爲法實如法得三十一寸四分二十五分寸之四倍之得六十二寸八分二十五分寸之八收爲六尺二寸八分二十五分寸之八卽周數也云全徑二尺與周數通相約徑得一千二百五十周得三千九百二十七卽共相
