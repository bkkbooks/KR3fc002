body:
  text: 一綆正七十六逮井正上爲法下爲實實不滿法以法命之是爲戊綆逮井七百二十一分之七十六故以七百二十一爲井深七十六爲戊綆之長乃置井深七丈二尺一寸於下位以戊綆長七尺六寸乘原列左行戊六綆得四丈五尺六寸以減下位餘二丈六尺五寸爲甲綆之長以甲綆長二丈六尺五寸乘右行甲二綆得五丈三尺以減下位餘一丈九尺一寸爲乙綆之長以乙綆長一丈九尺一寸乘第二行乙三綆得五丈七尺三寸以減下位餘一丈四尺八寸爲丙綆之長以丙綆長一丈四尺八寸乘第三行丙四綆得五丈九尺二寸以減下位餘一丈二尺九寸爲丁綆之長合問説曰注云此率初如方程爲之又云舉率以言之是明以法七百二十一爲井深率實七十六爲戊綆長率言率以該凡也荅以丈尺寸者取其易明卽方程注所云且爲有所據而言也云名各一逮井者甲二綆加乙一綆而一逮井乙三綆加丙一綆而一逮井丙四綆加丁一綆而一逮井丁五綆加戊一綆而一逮井戊六綆加
  hash: sha256:59c1a35b4849d53384078314e534b555aeacefb210ce7ec6be822616faaff5b1
