body:
  text: 戶數適盡得甲乙等衰若或除之不盡則有分當通分內子約之於算甚繁不如令母互乘子取衰爲簡易也云此一章皆相與通功共率者功當作公云以上二率下一率亦可放此者上二率第一問第二問也下一率第四問也云又以分言之使甲一戶出二十分斛之一乙一戶出十八分斛之一各以戶數乘之亦可得一縣凡所當輸俱爲衰也乘之者乘其子母當報除之以此觀之則以一斛之費約戶數者其意不異矣者以甲戶二萬五百二十乘甲分子一仍得二萬五百二十以甲分母二十報除之得一千二十六爲甲縣所當輸乙戶一萬二千三百一十二乘乙分子一仍得一萬二千三百一十二以乙分母十八報除之得六百八十四爲乙縣所當輸其所當輸之數卽衰也與以一斛之費約戶數所得不異也丙丁戊皆仿此云然則可置一斛之費而反衰之約戶以乘戶率爲衰也者約戶當作約子置甲二十分之一乙丙各出十八分之一丁出二十七分之一戍出十九分之一而反衰之得甲分子一十六萬六千
  hash: sha256:da97328148390f8453aefafa31b385becff45f8e2d5f7aae26ae876d32ff4e8f
