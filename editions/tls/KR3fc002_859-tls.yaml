body:
  text: 問術曰注云各以分母乘其全內子行定二甲一乙而錢一百二甲三乙而錢一百五十者半者二之一以二爲母太半者三之二以三爲母以母二通一甲半乙錢五十爲二甲一乙而錢一百以母三通太半甲一乙錢五十爲二甲三乙而錢一百五十云行定者左右行之定數也頭位數同故省乘而直除也今有二馬一牛價過一萬如半馬之價一馬二牛價不滿一萬如半牛之價問牛爲價各幾何荅曰馬價五千四百五十四錢十一分錢之六牛價一千八百一十八錢十一分錢之二術曰如方程損益之此一馬半與一牛價直一萬也二牛半與一馬亦直一萬也一馬半與一牛通分內子右行爲三馬二牛直錢二萬二牛半於一馬通分內子左行爲二馬五牛直錢二萬也潢按注二牛半於一馬於當作與草曰置三馬二牛直錢二萬於右行次置二馬五牛直錢二萬於左行令右行三馬徧乘左行左行得六馬十五牛直錢六萬以右行減之左
