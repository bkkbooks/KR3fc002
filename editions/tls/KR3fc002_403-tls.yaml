body:
  text: 爲壤草曰置穿地積一萬尺以壤率五乘之得五萬尺爲實以穿率四爲法除之得一萬二千五百尺卽壤也合問城垣隄溝壍渠皆同術術曰并上下廣而半之損廣補狹以高若深乘之又以袤乘之卽積尺按此術并上下廣而半之者以盈補虛得中平之廣以高若深乘之堅率三壤率五各爲所求率墟率四爲所有率而今有之得一頭之立幂又以袤乘之者得立實之積故爲積尺潢按注堅率三壤率五各爲所求率墟率四爲所有率而今有之二十二字衍立實當作立幂今有城下廣四丈上廣二丈高五丈袤一百二十六丈五尺問積幾何答曰一百八十九萬七千五百尺如圖辛壬庚癸皆下廣乙丙甲丁皆上廣戊至巳爲高甲乙丁丙庚辛癸壬皆爲袤
  hash: sha256:683c0d4ab6d799017164eb71ff7db1402bbc1e50f2f4f5c7fdfa489624747151
