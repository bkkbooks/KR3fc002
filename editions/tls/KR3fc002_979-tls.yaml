body:
  text: 句句弦差減股爲圓徑又弦減句股并餘爲圓徑并句弦差股弦差減弦餘爲圓徑以句弦差乘股弦差而倍之開方除之亦圓徑也草曰置句八步於上位自乘得六十四步爲句幂置股十五步於下位自乘得二百二十五步爲股幂并句股幂得二百八十九步爲弦幂開方除之得一十七步爲弦以并上下位得四十步爲句股弦并以爲法以句乘股得一百二十步倍之得二百四十步爲實實如法得六步卽容圓徑也合問説曰句股相乘爲朱靑黃幂各二者半徑自乘爲黃幂二半徑減句餘以半徑乘之爲朱幂二半徑減股餘以半徑乘之爲靑幂二也如圖句股相乘爲朱靑黃幂各二黃方之面卽圓徑之半云則倍之爲各四可用畫於小𥿄分裁邪正之會者句股相乘倍之爲朱靑黃幂各四於邪正會處分裁之以便顚倒相補也
