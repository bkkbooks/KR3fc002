body:
  text: 臣淳風等謹按周三徑一周一百八十一步徑六十步三分步之一依密率徑五十七步二十二分步之一十三問爲田幾何荅曰十一畝九十步十二分步之一此於徽術當爲田十畝二百八步三百一十四分步之一百一十三臣淳風等謹依密率當爲田十畝二百五步八十八分步之八十七如圖甲乙丙丁爲圓周甲丙乙丁皆圓徑術曰半周半徑相乘得積步按半周爲從半徑爲廣故廣從相乘爲積步也假令圓徑二尺圓中容六觚之一面與圓徑之半其數均等合徑率一而外周率三也又按爲圖以六觚之一面乘半徑二因而六之得十二觚之幂若又割之次以十二觚之一面乘一觚之半徑四因而六之則得二十四觚之幂割之彌細所失彌少割之又割以至於不可割則與圓周合體而無所失矣觚面之外又有餘徑以面乘徑則幂出觚表若夫觚之細者與圓合體則表無餘徑表無餘徑則幂不外出矣以一面乘半徑觚而裁之每輒自倍故以半周乘半徑而爲圓幂此以周徑謂至然之數非周三徑一之率也周三者從其六觚之環耳以推圓規多少之較乃弓之與弦也然世傳此法莫肯精覈學者踵古習其謬失不有明據辯之斯難凡物𩔖形象不圓則方方圓之率誠著於近則雖遠可知也由此言之其用博矣謹按圓驗更造密率恐空設法數昧而難譬故置諸撿括謹詳其記注焉割六觚以爲十二觚術曰置圓徑二尺半之爲一尺卽圓裏六觚之面也令半徑一尺爲弦半面五寸爲句爲之求股以句
