body:
  text: 以一矢簳爲所求率乘出錢爲實所買率爲法今乃反之以所買矢簳爲實錢數爲法是皆反其率也注云以錢數爲法物數爲實不滿法者實餘也當以餘物化爲錢者如買羽一問出錢六百二十爲法買羽二千一百翭爲實實如法得三翭其不滿法之二百四十翭化爲二百四十錢每錢可買四翭是實餘二百四十錢爲多者之錢也以實餘二百四十錢減法六百二十錢餘三百八十錢每錢可買三翭是法餘三百八十錢爲少者之錢也此以一錢買多物者爲賤一錢買少物者爲貴故三翭一錢爲貴四翭一錢爲賤也云法爲凡錢而今以化錢減之故以實減法者謂六百二十錢乃貴賤二物之共價故曰凡錢今以化錢二百四十減之卽是以實餘減之故云以實減法也云法少者經分之所得故曰法少實多者餘分之所益故曰實多者三翭爲少乃法除實所得故爲經分之所得經分卽除也四翭爲多乃餘實所化二百四十錢每錢所買之數故爲餘實之所益餘實卽化錢其云益者益一翭於三翭而爲四也云乘實
