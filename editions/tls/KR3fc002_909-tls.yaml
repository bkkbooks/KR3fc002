body:
  text: 九正左行餘菽五斗荅二斗黍二斗直錢三十七正次以左行減第四行菽二十斗正黍三斗負直錢四十二正第四行菽空荅八斗黍十一斗直錢一百六負又以左行減第二行菽三十斗荅八斗正黍九斗負直錢七十六正第二行菽空荅四斗黍二十一斗直錢一百四十六負次以第二行減第四行荅八斗黍十一斗直錢一百六負第四行荅空黍三十一斗正直錢一百八十六正上法下實實如法得六卽黍價求荅價以第二行黍二十一乘黍價六得錢一百二十六減直錢一百四十六餘錢二十如荅四而一得五卽荅價求菽價以左行荅二乘荅價五得錢十黍二乘黍價六得錢十二并之得錢二十二減直錢三十七餘錢十五如菽五而一得三卽菽價求麥價以右行菽九負乘菽價三得錢二十七負并直錢四正得錢三十一爲下實以荅三乘荅價五得錢十五黍二乘黍價六得錢十二并之得錢二十七減下實三十一餘錢四如麥一而一得四卽麥價求麻價以第三行荅三負乘荅價五得錢十五負并直錢四正
