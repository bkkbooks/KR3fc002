body:
  text: 餘以句股幂減當作其實以句股差幂減其實謂弦實也如前圖於弦幂內減去黃幂餘朱幂四爲句股相乘幂之倍半之得句股相乘幂以爲實句股差爲從法開方除之得句其云倍爲從法者以廣袤并爲方法也差爲從法者以廣袤差爲方法也今有戶不知高廣竿不知長短橫之不出四尺從之不出二尺邪之適出問戶高廣袤各幾何荅曰廣六尺高八尺袤一丈如圖戶廣爲句戶高爲股戶袤爲弦橫不出爲句弦差從不出爲股弦差術曰從橫不出相乘倍而開方除之所得加從不出卽戸廣此以戸廣爲句戸高爲股戸袤爲弦凡并句股之幂卽爲弦幂或矩於表或方於裏連之者舉表矩而方之又從句方裏令爲靑矩之表未滿黃方滿此方則兩端之廉重於隅中各以股弦差爲廣句弦差爲袤故兩端差相乘又倍之則成黃方之幂開方除
  hash: sha256:a3c7d604d7b4790fffe8f9391f5f85d5f45452ec42d22c190363455e5866690d
