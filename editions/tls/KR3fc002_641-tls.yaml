body:
  text: 步七十分步之一十以等數一十約子母爲七分步之一合問説曰注云先走率得七追及率得二十五者置先走率七十追及率二百五十以等數一十約之卽得今有人持金十二斤出關關稅之十分而取一今關取金二斤償錢五千問金一斤值錢幾何荅曰六千二百五十術曰以十乘二斤以十二斤減之餘爲法以十乘五千爲實實如法得一按此術置十二斤以一乘之十而一得一斤五分斤之一卽所當稅者也減二斤餘卽關取盈金以盈除所償錢卽金値也今術旣以十二斤爲所稅則是以十爲母故以十乘二斤及所償錢通其率於今有術五千錢爲所有數十爲所求率八爲所有率而今有之卽得也草曰置關取金二斤以十乘之得二十金以十二斤減之餘八斤爲法次置償錢五千亦以十乘之得五萬錢爲實實如法得六千二百五十錢合問説曰注云得一斤五分斤之一卽所當稅者也減二斤餘卽關取盈金以盈除所償錢卽金值也者以一斤五分斤之一減二斤餘五分斤之
