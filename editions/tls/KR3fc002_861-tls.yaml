body:
  text: 行馬空餘十一牛直錢二萬上法下實卽以實二萬錢爲牛價寄法十一爲分母求馬價以法十一乘右行錢二萬得錢二十二萬於下位以牛價二萬乘右行二牛得錢四萬以減下位餘錢十八萬如三馬而一得六萬爲馬價寄法十一爲分母乃置馬價六萬錢牛價二萬錢皆如法十一而一得五千四百五十四錢十一分錢之六爲馬價得一千八百一十八錢十一分錢之二爲牛價合問説曰注云一馬半與一牛通分內子右行爲三馬二牛直錢二萬二牛半與一馬通分內子左行爲二馬五牛直錢二萬者半以二爲母故馬牛與錢皆以二通之也今有武馬一匹中馬二匹下馬三匹皆載四十石至阪皆不能上武馬借中馬一匹中馬借下馬一匹下馬借武馬一匹乃皆上問武中下馬一匹各力引幾何荅曰武馬一匹力引二十二石七分石之六中馬一匹力引十七石七分石之一
