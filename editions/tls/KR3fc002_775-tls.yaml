body:
  text: 日里假令有餘左行日里并左右行得七千五百日爲實四百七十七里半爲法實如法而一得十五日四千七百七十五分日之三千三百七十五以等數二十五約分母子爲一百九十一分日之一百三十五卽相逢日也合問求良馬行草曰以十四日乘益疾里十三得一百八十二里加初日行一百九十三里得三百七十五里爲第十五日之行又以初日行一百九十三里加之得五百六十八里半之得二百八十四里以十五乘之得四千二百六十里卽良馬十五日之凡行也以十五乘益疾里十三得一百九十五里加初日行一百九十三里得三百八十八里以日分子一百三十五乘之得五萬二千三百八十里如日分母一百九十一而一得二百七十四里一百九十一分里之四
  hash: sha256:29b94425b7438191126cadb246948bf7691d78968dbe827cb7cc0abdc40356f4
