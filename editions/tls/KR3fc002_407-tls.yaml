body:
  text: 尺卽垣積也合問今有隄下廣二丈上廣八尺高四尺袤一十二丈七尺問積幾何答曰七千一百一十二尺如圖乙丁爲下廣甲丙爲上廣戊巳爲高庚丁爲袤草曰置下廣二丈上廣八尺并之得二丈八尺半之得一丈四尺展爲一十四尺以高四尺乘之得五十六尺又以袤一十二丈七尺展爲一百二十七尺乘之得七千一百一十二尺卽隄積也合問冬程人功四百四十四尺問用徒幾何答曰一十六人一百一十一分人之二術曰以積尺爲實程功尺數爲法實如法而一卽用徒人數草曰置隄積七千一百一十二尺爲實以程功
