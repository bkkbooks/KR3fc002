body:
  text: 糲米取粟二斗一百二十一分斗之一十粺米取粟二斗一百二十一分斗之三十八糳米取粟二斗一百二十一分斗之七十三爲米各一斗六百五分斗之一百五十一術曰列置糲米三十粺米二十七糳米二十四而反衰之此先約三率糲爲十粺爲九糳爲八欲令米等者其取粟糲率十分之一粺率九分之一糳率八分之一當齊其子故曰反衰也臣淳風等謹按米有精麤之異有多少之差據率粺糳少而糲多用粟則粺糳多而糲少米若依本率之分粟當倍率故今反衰之使精取多而麤得少副并爲法以七斗乘未并者各自爲取粟實實如法得一斗於今有術副并爲所有率未并者各爲所求率粟七斗爲所有數而今有之故各得取粟也若求米等者以本率各乘定所取粟爲實以粟率五十爲法實如法得一斗若徑求爲米等數者置糲米三用粟五粺米二十七用粟五十糳米十二用粟二十五齊其粟同其米并齊爲法以七斗乘同爲實所得卽爲米斗數潢按李注粟有多少之差原本脫粟字取粟草曰列置糲米三十粺米二十七糳米二十四以等數三約之得糲十粺九糳八欲令米等者其取粟糲率十分之一粺率九分之一糳
