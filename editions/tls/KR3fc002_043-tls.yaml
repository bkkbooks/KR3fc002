body:
  text: 草曰置分母七分五分在右方分子之四之三在左方分母相乘得三十五爲法分子相乘得十二爲實實不滿法以法命之爲三十五分步之十二合問草曰置分母九分十一分在右方分子之七之九在左方分母相乘得九十九爲法分子相乘得六十三爲實法實各以等數九約之爲十一分步之七合問草曰置分母五分九分在右方分子之四之五在左方分母相乘得四十五爲法分子相乘得二十爲實法實各以等數五約之爲九分步之四合問今有田廣三步三分步之一從五步五分步之二問爲田幾何荅曰十八步又有田廣七步四分步之三從十五步九分步之五問爲田幾何荅曰一百二十步九分步之五又有田廣十八步七分步之五從二十三步十一分步之六問爲田幾何
  hash: sha256:0ffbdd021c0925089b0d4acb99e843f92c597aa09952ce0121b9128b22fa72f7
