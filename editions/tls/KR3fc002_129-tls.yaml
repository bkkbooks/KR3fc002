body:
  text: 粺米粟率五十粺米率二十七約不得𥁞直以二十七之五十而一用其本率不破爲零分約之盖約分原欲其簡破整爲零則數反增益不如仍其本率之爲得矣云別術然者各術約分悉皆如此不獨粟米爲然也今有此都術也凡九數以爲篇名可以廣施諸率所謂吿往而知來舉一隅而三隅反者也誠能分詭數之紛雜通彼此之否塞因物成率審辨名分平其偏頗齊其參差則終無不歸於此術也術曰以所有數乘所求率爲實以所有率爲法少者多之始一者數之母故爲率者必等之於一據粟率五糲率三是粟五而爲一糲米三而爲一也欲化粟爲米者糲當先本是一一者謂以五約之令五而爲一也訖乃以三乘之令一而爲三如是則率等於一以五爲三矣然先除後乘或有餘分故術反之又究言之知粟五升爲糲米三升分言之知粟一斗爲糲米五分斗之三以五爲母三爲子以粟求糲米者以子乘其母報除也然則所求之率常爲母也臣淳風等謹按宜云所求之率常爲子所有之率常爲母今乃云所求之率常爲母知脫錯也實如法而一潢按糲當先本是一糲當作粟説曰今有者都術也九數總歸於此術也今謂之三率然率者數相與通所有率與所求率相通故可謂之率今所有之數須乘除後乃相與通不得卽謂之率故直名爲今有也凡此章所
