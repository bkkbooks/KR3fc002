body:
  text: 四百四十四尺爲法實如法而一得一十六人四百四十四分人之八子母各以四約之爲一百一十一分人之二卽用徒人數也合問今有溝上廣一丈五尺下廣一丈深五尺袤七丈問積幾何答曰四千三百七十五尺如圖乙丙爲上廣辛壬爲下廣戊至巳爲深丁丙爲袤草曰置上廣一丈五尺下廣一丈并之得二丈五尺半之得一丈二尺五寸展爲一十二尺五寸以深五尺乘之得六十二尺五寸又以袤七丈展爲七十尺乘之得四千三百七十五尺卽溝積也合問春程人功七百六十六尺并出土功五分之四定功六百一十二尺五分尺之四問用徒幾何答曰七人三千六十四分人之四百二十七術曰置本人功去其五分之一餘爲法去其五分之一
  hash: sha256:8dceb11c5ebe95a97a566f328c79864e44b6e603abd48f1b0fd7a29eb922ccc8
