body:
  text: 句矩內減靑矩之表餘兩端之廉則兩廉與黃方幂等明矣兩端之廉兩差相乘幂也各以股弦差爲廣句弦差爲袤黃方之幂弦并差自乘幂也開方除之得弦并差云其外之靑矩至則爲句也者明以弦并差加股弦差爲句之理也如圖句弦差股弦差相乘倍之爲兩𠔳其幂與黃方等故開方除之得黃方之面加股弦差卽句加句弦差卽股加兩差卽弦今有竹高一丈末折抵地去本三尺問折者高幾何荅曰四尺二十分尺之十一如圖去本爲句餘高爲股末折抵地爲弦竹高爲股弦并術曰以去本自乘此去本三尺爲句折之餘高爲股末折抵地爲弦以句及股弦并求股故先令句自乘見矩幂令如高而一竹高一丈爲股弦并以除此幂得差所得以減竹高而半其餘卽折者之高也此術與繫索者之𩔖更相反覆也亦可如上術令高自乘爲股弦并幂去本自乘爲矩幂減之餘爲
