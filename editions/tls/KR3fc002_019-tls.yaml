body:
  text: 卽下一百於中位以上一呼下四一四如四卽於中位下四十退下位一等收上位一十以上位二呼下位一一二如二卽於中位下二十以上二呼下四二四如八卽於中位下八上下位俱收中位得一百六十八爲積步合問説曰古算用籌漢書云其算法用竹徑一分長六寸二百七十一枚而成六觚爲一握孫子算經云凡算之法先識其位一從十横百立千僵千十相望萬百相當又云六不積五不隻謂算籌也其乘式則置實於上位置法於下位置乘得數於中位其除式則置實於中位置法於下位置除得數於上位孫子算經所謂乘得在中央除得在上方是也此爲篇端故詳書以存古式後不復言者從此可知今有田廣一里從一里問爲田幾何荅曰三頃七十五畝又有田廣二里從三里問爲旧幾何荅曰二十二頃五十畝里田術曰廣從里數相乘得積里以三百七十五乘
  hash: sha256:6b72064efaec7fe526427a51d9e2c297235912783b30e9bdaaaf2478c0199c33
