body:
  text: 九章算術細草圖説序莫若作四元玉鑑序謂河洛圖書泄其秘黃帝九章著之書其章有九其術則二百四十有六始方田終句股包括三才帝通萬有凡言數者莫得而逃焉唐立明算科九章海島共限習三年試九章三條海島一條不特陳其數且欲明其義也自時厥後算科旣廢書亦不彰近時以算名者如王寅旭梅定九諸君子咸未之見迨吾宗東原氏與修四庫全書從永樂大典中錄出一刻於曲阜孔氏再刻於常熟屈氏而古學復興然未及盡求其解也鍾祥李雲門先生博綜羣書尤精算學推步律呂俱臻微妙於古人立天元一大衍求一正負開方諸術多所發明九章海島更多心得嘗言陳其數者下學之言也知其義者上達之功也有數先有象有象皆可繪舊注所云解此要當以棊者一一顯之於圖於東原氏所謂舛誤不可通者一一疏而通之探𧷤索隠鈎深致遠臚名標目咸式古訓撰九章海島細草圖説共十卷亦猶劉𡽪析理以辭解體用圖之意也惜未寫定哲人其萎其甥程儀部晴峯謹守遺藁延吳門沈孝𠔳俠侯至其家算校編輯鳩工付梓以敦元粗聞撰述緣起屬
  hash: sha256:2d3670df5ece565c62529cae532fa4b7ae952dc3e030774644e7f315c9dbc38b
