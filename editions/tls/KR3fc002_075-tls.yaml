body:
  text: 爲五分忽之四卽股也以減半徑十寸餘三分四𨤲七秒四忽五分忽之一謂之小句自乘得一十一億六千一百五萬一千一百五忽餘分六四於上位又以十二弧之半面爲小股置其幂六百六十九億八千七百二十九萬八千三百六十一忽於下位并上下位得六百八十一億四千八百三十四萬九千四百六十六忽餘分六四棄之開方除之得二寸六分一𨤲五秒二忽十分忽之三謂之小弦餘實四萬六千一百三十忽有奇棄之卽二十四弧之一面也割二十四弧以爲四十八弧草曰亦令半徑爲弦二十四弧之半面爲句爲之求股置上小弦幂六百八十一億四千八百三十四萬九千四百六十六忽四而一得一百七十億三千七百八萬七千三百六十六忽餘分半忽棄之卽句幂也以减弦幂一萬億忽餘九千八百二十九億六千二百九十一萬二千六百三十四忽開方除之得九寸九分一𨤲四毫四秒四忽十分忽之八約爲五分忽之四卽股也以減半徑十寸餘八𨤲五毫五秒五忽五分忽之一謂之小
