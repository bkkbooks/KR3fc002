body:
  text: 錢四萬六千八十分錢之二萬六千九百八十八爲賤絲價又以貴絲六萬八千二百一銖乘八千五十二錢得五億四千九百一十五萬四千四百五十二爲實實如法得一萬一千九百一十七錢四萬六千八十分錢之一萬九千九十二爲貴絲價并貴賤絲價得一萬三千九百七十與出錢數合鈞率之者以鈞積銖一萬一千五百二十爲法以賤絲二千九百三十七銖乘二千一十二錢得五百九十萬九千二百四十四錢爲實實如法得五百一十二錢一萬一千五百二十分錢之一萬一千四爲賤絲價又以貴絲七萬七千一十二銖乘二千一十三錢得一億五千五百二萬五千一百五十六錢爲實實如法得一萬三千四百五十七錢一萬一千五百二十分錢之五百一十六爲貴絲價并貴賤絲價得一萬三千九百七十與出錢數合斤率之者以斤積銖三百八十四爲法以賤絲七萬二千五十二銖乘六十七錢得四百八十二萬七千四百八十四錢爲實實如法得一萬二千五百七十一錢三百八十四分錢之二百
