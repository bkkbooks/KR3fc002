body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉勅注釋鍾祥李潢雲門譔均輸以御遠近勞費今有均輸粟甲縣一萬戶行道八日乙縣九千五百戶行道十日丙縣一萬二千三百五十戶行道十三日丁縣一萬二千二百戶行道二十日各到輸所凡四縣賦當輸二十五萬斛用車一萬乘欲以道里遠近戶數多少衰出之問粟車各幾何荅曰甲縣粟八萬三千一百斛車三千三百二十四乘乙縣粟六萬三千一百七十五斛車二千五百二十七乘丙縣粟六萬三千一百七十五斛車二千五百二十七乘丁縣粟四萬五百五十斛車一千六百二十二乘均輸按此均輸猶均運也令戸率出車以行道日數爲均發粟爲輸
