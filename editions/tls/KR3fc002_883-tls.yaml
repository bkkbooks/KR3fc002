body:
  text: 吏一人食一百二十二分雞之四十一從者一人食一百二十二分雞之九十七術曰如方程以正負術入之草曰置令一人吏五人從者十人食雞十於右行次置令十人吏一人從者五人食雞八於中行次置令五人吏十人從者一人食雞六於左行令右行直除中行中行令空吏四十九從者九十五食雞九十二皆負次令右行直除左行左行令空吏十五從者四十九食雞四十四皆負次令中行吏四十九徧乘左行左行得吏七百三十五從者二千四百一食雞二千一百五十六皆負以中行減之左行吏空從者九百七十六負食雞七百七十六負上法下實皆以等數八約之得一百二十二爲法九十七爲實實九十七卽從者食寄法一百二十二爲分母求吏食以法一百二十二乘中行下位食雞九十二得一萬一千二百二十四於下位以從者食九十七乘中行從者九十五得九千二百一十五以減下位餘二千九如吏四十九而一得四十一爲吏食寄法一百二十二爲分母求令食以法一百二十二乘右行
