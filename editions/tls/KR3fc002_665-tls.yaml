body:
  text: 三分升之九減之餘十二分升之七爲中間五節半之凡差以爲實置四節三節并而半之得三節半以減九節餘五節半爲法實如法得六十六分升之七爲每節之差也今有鳬起南海七日至北海鴈起北海九日至南海今鳬鴈俱起問何日相逢荅曰三日十六分日之十五術曰并日數爲法日數相乘爲實實如法得一日按此術置鳬七日一至鴈九日一至齊其至同其日定六十三日鳬九至鴈七至令鳬鴈俱起而問相逢者是爲共至并齊以除同卽得相逢日故并日數爲法者并齊之意日數相乘爲實者猶以同爲實也一日鳬飛七分至之一鴈飛九分至之一齊而同之鳬飛定日行六十三分至之九鴈飛定日行六十三分至之七是爲南北海相去六十三分鳬日行九分鴈日行七分也并鳬鴈一日所行以除南北相去而得相逢日也草曰置鳬七日至鴈九日至并之得十六至爲法七日九日相乘得六十三日爲實實如法得三日十六分日之十五合問説曰注云置鳬七日一至鴈九日一至齊其至同其日定六十三日鳬九至鴈七至者以鳬一至乘九日得鳬九至以鴈一至乘七日得鴈七至母互乘子爲齊是齊其子以至爲子也以七
