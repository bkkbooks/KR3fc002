body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門譔衰分以御貴賤禀稅衰分衰分差也術曰各置列衰列衰相與率也重疊則可約副并爲法以所分乘未并者各自爲實法集而衰別數本一也今以所分乘上別以下集除之一乘一除適足相消故所分猶存且各應率而別也於今有術列衰各爲所求率副并爲所有率所分爲所有數又以經分言之假令甲家三人乙家二人丙家一人并六人共分十二爲人得二也欲復作逐家者則當列置人數以一人所得乘之今此術先乘而後除也實如法而一不滿法者以法命之説曰注云衰分差也李籍音義云以差而平分故曰衰分云列衰相與率也重疊則可約者列衰各爲所求率副并爲所有率故曰相與率也衰數有重疊則求總等以約之云法集而衰別數本一也者各置列衰故曰衰別副并爲法故曰法集列衰爲副并之分數副并爲列衰之合數故曰數本一也云今以所分乘上別以下集除之者上別各置列衰於上位也下集副并爲
