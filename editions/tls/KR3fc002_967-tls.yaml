body:
  text: 股自乘爲幂如并而一所得爲句弦差加差於并而半之爲弦以弦減差餘爲句如是或有分當通而約之乃定術以句弦并爲分母差爲分子故令句弦并自乘爲朱黃相連之方股自乘爲靑幂之矩令其矩引之直加損同之以句弦并爲袤差爲廣其圓大體以兩弦爲袤句弦并爲廣引黃斷其半爲弦率七自乘者句弦并之率故弦減之餘爲句率同立處是中停也列用率皆句弦并爲袤弦與句各爲之廣故亦以股率同其袤也置南行十步以甲邪行率乘之副置十步以乙東行率乘之各自爲實實如南行率而一各得行數南行十步者所有見句求見弦股故以弦股率如句率而一潢按永樂大典本無差爲分子句引黃之黃作橫故以弦股率下當有乘字草曰置甲行率七爲句弦并自乘得四十九爲句弦并幂卽爲帶分句弦并以句弦并爲母又置乙行率三爲股自乘得九爲股幂又爲句弦并與句弦差相乘幂卽爲帶分句弦差以句弦并爲母以帶分句弦并與帶分句弦差相并得五十八爲帶分兩弦并半之得二十九爲帶分弦以句弦并爲母爲甲邪行率以帶分弦二十九減帶分句弦并四十九餘二十爲帶分句以句弦并爲母爲甲南行率又置乙行率三爲股以句弦并七乘之得二十一爲帶分股以句弦并爲母爲乙東行率置南行十步爲見
