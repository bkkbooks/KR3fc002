body:
  text: 十三分之一爲一百四十四分之一爲一百五五分之一爲八十四六分之一爲七十七分之一爲六十并之得一千八十九以爲法置田二百四十步亦以一爲四百二十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一於位以最下分母七徧乘諸分子及全步皆爲七各以其母除之則一爲七半爲二分之七三分之一爲三分之七四分之一爲四分之七五分之一爲五分之七六分之一爲六分之七七分之一爲一置之於左又以分母六徧乘諸分子及巳通者各以其母除其子則一爲四十二半爲二十一三分之一爲一十四四分之一爲四分之四十二約爲二分之二十一五分之一爲五分之四十二六分之一爲七七分之一爲六置之於左又以分母五徧乘諸分子及巳通者各以其母除其子則一爲二百一十半爲一百五三分之一爲七十四分之一爲二分之一百五五分之一爲四十二六分之一爲三十五七
