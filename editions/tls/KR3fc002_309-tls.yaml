body:
  text: 各以其母除其子則一爲八百四十半爲四百二十三分之一爲二百八十四分之一爲二百一十五分之一爲一百六十八六分之一爲一百四十七分之一爲一百二十八分之一爲一百五并之得二千二百八十三以爲法置田二百四十步亦以一爲八百四十乘之得二十萬一千六百步爲實實如法得八十八步二千二百八十三分步之六百九十六子母各以三約之爲七百六十一分步之二百三十二卽從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一求田一畝問從幾何荅曰八十四步七千一百二十九分步之五千九百六十四術曰下有九分以一爲二千五百二十半爲一千二百六十三分之一爲八百四十四分之一爲六百三十五分之一爲五百四六分之一爲四百二十七分之一爲三百六十八分之一爲三百一十五九分之一爲二百八十并之得七
  hash: sha256:1c5c9599a3a0505aacdba4c0ca84098ee06e374fd166ae4bc898a6746fdd772a
