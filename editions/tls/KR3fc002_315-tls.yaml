body:
  text: 爲三百一十五九分之一爲二百八十十分之一爲二百五十二并之得七千三百八十一以爲法置田二百四十步亦以一爲二千五百二十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一於位以最下分母一十徧乘諸分子及全步皆爲一十各以其母除之則一爲一十半爲五三分之一爲三分之一十四分之一爲四分之一十約爲二分之五五分之一爲二六分之一爲六分之一十約爲三分之五七分之一爲七分之一十八分之一爲八分之一十約爲四分之五九分之一爲九分之一十十分之一爲一置之於左又以分母九徧乘諸分子及巳通者各以其母除其子則一爲九十半爲四十五三分之一爲三十四分之一爲二分之四十五五分之一爲一十八六分之一爲一十五七分之一爲七分之九十八分之一爲四分之四十五九分之一爲一十十分之一爲九置之於左又以分母四徧
