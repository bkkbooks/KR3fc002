body:
  text: 今有縑一丈價直一百二十八今有縑一匹九尺五寸問得錢幾何荅曰六百三十三錢五分錢之三術曰以一丈寸數爲法以價錢數乘今有縑寸數爲實實如法得錢數臣淳風等謹按此術亦今有之義以縑一丈寸數爲所有率價錢爲所求率今有縑寸數爲所有數而今有之卽得草曰置今有縑一匹九尺五寸於位通爲四百九十五寸以一丈價直一百二十八乘之得六萬三千三百六十錢爲實次置縑一丈通爲一百寸以爲法實如法得六百三十三錢一百分錢之六十子母各以二十約之爲五分錢之三合問説曰此問所有數止於寸故以一丈寸數爲法以一丈價錢乘今有縑寸數爲實實如法而一不滿法者以等數約之而命分通一匹九尺五寸爲四百九十五寸者説文匹四丈也故通一匹爲四丈又展四丈九尺五寸爲四百九十五寸也今有布一匹價直一百二十五今有布二丈七尺問得錢幾何
