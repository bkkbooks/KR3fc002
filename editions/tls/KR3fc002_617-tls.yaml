body:
  text: 爲法除之得一百五十返欽裴按此問荅術皆誤訂正於後今有負籠重一石一十七斤行七十六步五十返今負籠重一石行百步問返幾何荅曰四十三返六十分返之二十三術曰以今所行步數乘今籠重斤數爲法故籠重斤數乘故步又以返數乘之爲實實如法得一返欽裴按原本術文兩今字皆誤作故兩故字皆誤作今荅亦因之而誤草曰置今籠重一石展爲一百二十斤以今行百步乘之得一萬二千斤爲法置故籠重一石一十七斤展爲一百三十七斤以故行七十六步乘之得一萬四百一十二又以五十返乘之得五十二萬六百返爲實實如法得四十三返一萬二千分返之四千六百以等數二百約子母爲六十分返之二十三合問説曰李注云所行步多者得返少所行步少者得返多者行七十六步者五十返則行百步者當三十八返也云然則故所行者今返率也今所行者故返率也令故所得返乘今返之率爲實而以故返之率爲法者以今所行百步爲所
