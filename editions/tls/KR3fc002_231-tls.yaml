body:
  text: 一二四八十六爲列衰是遞加倍數成率設數加減雖異而各置列衰爲所求率副并爲所有率則無不同也今有北鄉算八千七百五十八西鄉算七千二百三十六南鄉算八千三百五十六凡三鄉發傜三百七十八人欲以算數多少衰出之問各幾何荅曰北鄉遣一百三十五人一萬二千一百七十五分人之一萬一千六百二十七西鄉遣一百一十二人一萬二千一百七十五分人之四千四南鄉遣一百二十九人一萬二千一百七十五分人之八千七百九術曰各置算數爲列衰臣淳風等謹按三鄕算數約可半者爲列衰副并爲法以所發傜人數乘未并者各自爲實實如法得一人按此術今有之義也草曰置北鄉算八千七百五十八西鄉算七千二百三十六南鄉算八千三百五十六求總等得二以徧約之北鄉得四千三百七十九西鄉得三千六百一十八南鄉得四千一百七十八
