body:
  text: 一爲犬價又以犬價一百二十一乘右行四犬得錢四百八十四以雞價二十三乘右行三雞得錢六十九以兔價二十九乘右行二兔得錢五十八并之得錢六百一十一以減右行直錢一千四百九十六餘錢八百八十五如五羊而一得一百七十七爲羊價合問今有麻九斗麥七斗菽三斗荅二斗黍五斗直錢一百四十麻七斗麥六斗菽四斗荅五斗黍三斗直錢一百二十八麻三斗麥五斗菽七斗荅六斗黍四斗直錢一百一十六麻二斗麥五斗菽三斗荅九斗黍四斗直錢一百一十二麻一斗麥三斗菽二斗荅八斗黍五斗直錢九十五問一斗直幾何荅曰麻一斗七錢麥一斗四錢菽一斗三錢荅一斗五錢黍一斗六錢術曰如方程以正負術入之此麻麥與均輸少廣章之重衰積分皆爲大事其拙於精理徒按本術者或用算而布氊方好煩而喜誤曾不知其非反欲以多爲
  hash: sha256:e009cd1e089f8a9816752cd6da465bba5c63d893ff773c9de0e56d58bd8f54bf
