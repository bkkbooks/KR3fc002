body:
  text: 爲行率也者如前求到六十萬三千七百八十尺爲實以五百步爲法除之得一千二百七尺五百分尺之二百八十爲一車所到是有分也以六人除一車所到爲一人所到當以五百通分內子爲實實裏有分法裏通之故亦以五百乘六人爲法此重今有之義也以載輸及徃來并得五百步爲所有行率車載三十四尺七寸爲所求到土率程行五十八里通之爲步爲所有數而今有之得一車所到尺復以六人爲所有人率一車所到爲所求到土率一人爲所有數而今有之得一人所到尺今雖有率不問中間以後實乘前實一乘不長卽以車尺數爲一人到土率後法乘前法以六人乘五百步爲行率也云又可以五百步爲行率令六人約車積尺數爲一人到土率者令六人約車積三十四尺七寸得五尺七寸六分寸之五爲一人徃來一返到土率云以負土術入之入之者亦可求返數也者負土術注云爲術又可令徃來一返所用之步約程行爲返數乘籠積爲一人所到今以一返五百步約程行一萬七千四百步得
