body:
  text: 丁縣一千七百一十九斛二千八百七十三分斛之一千三百一十三戊縣九百三十九斛二千八百七十三分斛之二千二百五十三術曰以一里僦價乘至輸所里此以出錢爲均也問者曰一車載二十五斛與僦一里一錢一錢卽一里僦價也以乘里數者欲知僦一車到輸所所用錢也甲自輸其縣則無取僦價也以一車二十五斛除之欲知僦一斛所用錢加一斛粟價則致一斛之費加一斛之價於一斛僦直卽凡餘粟取僦錢也甲一斛之費二十乙丙各十八丁二十七戊十九也各以約其戸數爲衰言使甲二十戸共出一斛乙丙十八戸共出一斛計其所費則皆戸一錢故可爲均賦之率也甲衰一千二十六乙衰六百八十四丙衰三百九十九丁衰四百九十四戊衰二百七十副并爲法所賦粟乘未并者各自爲實實如法而一各置所當出粟以其一斛之費乘之如巨數而一得率戸出三錢二千八百七十三分錢之一千三百八十一臣淳風等謹按此以出錢爲均問者曰一車載二十五斛與僦一里一錢一錢卽一里僦價也以乘里數者欲知僦一車到輸所用錢甲自出其縣則無取僦之價以一車二十五斛除之者欲知僦一斛所用錢加一斛之價於一斛僦直卽凡餘粟取僦錢甲一斛之費二十乙丙各十八丁二十七戊十九各以約其戸爲衰甲衰一千二十六乙衰六百八十四丙衰三百九十九丁衰四百九十四戊衰二百七十言使甲二十戸共出一斛乙丙十八户共出一斛計其所費則皆戸一錢故可爲均賦之率也於今有術副并爲所有率
