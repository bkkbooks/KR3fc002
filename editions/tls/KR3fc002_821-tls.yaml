body:
  text: 原本也草曰置上禾二秉中禾一秉實一斗於右行次置中禾三秉下禾一秉實一斗於中行次置上禾一秉下禾四秉實一斗於左行上禾中禾下禾實秉秉斗右行秉秉斗中行秉秉斗左行以右行上禾二秉徧乘左行左行得上禾二秉下禾八秉下實二斗以右行減之左行上禾空中禾一秉負下禾八秉正下實一斗正上禾中禾下禾實秉一秉一斗右行二秉三秉斗左行一負正一正左行又以中行中禾三秉徧秉左行左行得中禾三
