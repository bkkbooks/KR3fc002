body:
  text: 以今有乾絲一十二斤乘生絲四百八十兩得五千七百六十斤爲實云今斤兩錯互者今以兩數爲所有率斤數爲所求率也云而亦同歸者謂不以今有乾絲斤數乘生絲兩數而展乾絲十二斤爲一百九十二兩乘生絲三十斤亦同得五千七百六十斤爲實蓋以乾絲十二斤與生絲三十斤相約得二與五爲率以乾絲一百九十二兩與生絲四百八十兩相約亦得二與五爲率也云譬之異𩔖亦各有一定之勢者乾絲以兩爲率故今有乾絲斤數亦展爲兩生絲以斤爲率故所求生絲之數首位亦命爲斤有一定之勢也絲與絲同𩔖也譬之異𩔖有相與之率者其精麤亦各有一定之勢故不妨使乾絲以兩數爲率生絲以斤數爲率也今有田一畝收粟六升太半升今有田一頃二十六畝一百五十九步問收粟幾何荅曰八斛四斗四升一十二分升之五術曰以畝二百四十步爲法以六升太半升乘今有田積步爲實實如法得粟數按此術亦今有之義以一畝步數爲所有率六升大半升爲所求率今有田積步爲所有數而今有之卽得
