body:
  text: 靑禾實二十八斗黃禾實十七斗黑禾實十斗以法一百一十一命之白禾一步實一百一十一分斗之三十三靑禾一步實一百一十一分斗之二十八黃禾一步實一百一十一分斗之十七黑禾一步實一百一十一分斗之十合問今有甲禾二秉乙禾三秉丙禾四秉重皆過於石甲二重如乙一乙三重如丙一丙四重如甲一問甲乙丙禾一秉各重幾何荅曰甲禾一秉重二十三分石之十七乙禾一秉重二十三分石之十一丙禾一秉重二十三分石之十術曰如方程置重過於石之物爲負此問者言甲禾二秉之重過於一石也其過者幾何如乙一秉重矣互其算令相折除以石爲之差實差實者如甲禾餘實故置算相與同也以正負術入之此入頭位異名相除者正無入正之負無入負之也草曰置甲禾二秉正乙禾一秉負重一石正於右行次置乙禾三秉正丙禾一秉負重一石正於中行次置甲禾一秉負丙禾四秉正重一石正於左行令右行甲禾二秉徧乘左行左行得
  hash: sha256:051c513d442580a9c215747f362cfce67b8e71c96f7c82044f0ae2d96ad8ff00
