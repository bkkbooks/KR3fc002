body:
  text: 所得及其不盡而命分加於前良馬凡行里數卽得求駑馬行者以十四乘半里以減駑馬初日之行里數餘以并初日之行又半之乘十五日得駑馬十五日之凡行又以十五日乘半里以減駑馬初日之行餘以乘日分子如日分母而一所得加前里卽駑馬定行里數其奇半里者爲半法以半法增殘分卽得其不盡者而命分草曰假令十五日不足三百三十七里半於右行令之十六日多一百四十里於左行假令不足右行日里假令有餘左行日里以左行多一百四十里維乘假令得二千一百日不足三百三十七里半於右行以右行不足三百三十七里半維乘假令得五千四百日有餘一百四十里於左行假令不足右行
