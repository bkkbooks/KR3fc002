body:
  text: 置上議六萬以乘所借一算得六萬爲法以上議六萬乘之得三十六億以減實實餘三億七千二百一十五萬六百二十五步除巳倍法得一十二萬爲定法折而下復置借算步之超一等至千而止置上議三千以乘借算得三千副之以三千加定法得一十二萬三千爲定法以上議三千乘之得三億六千九百萬以減實實餘三百一十五萬六百二十五步除巳以所副三千從定法得一十二萬六千爲定法折而下復置借算步之再超一等至十而止置上議二十以乘借算得二十副之以二十加定法得一十二萬六千二十爲定法以上議二十乘之得二百五十二萬四百以減實實餘六十三萬二百二十五步除巳以所副二十從定法得一十二萬六千四十爲定法折而下復置借算步之超一等至步而止置上議五乘借算得五以加定法得一十二萬六千四十五爲定法以上議五乘之得六十三萬二百二十五以減實適盡上議得六萬三千二十五步卽方也合問説曰置積爲實借一算步之者平方有實方隅
  hash: sha256:f4b38aab23ad615d03c68c421542d008801e8f256defe69c7712d1199b80098b
