body:
  text: 一爲五置之於左又以分母四徧乘分子及已通者仍以分母除其子則一爲一百二十半爲六十三分之一爲四十四分之一爲三十五分之一爲二十四六分之一爲二十并之得二百九十四以爲法置田二百四十步亦以一爲一百二十乘之得二萬八千八百步爲實實如法得九十七步二百九十四分步之二百八十二子母各以六約之爲四十九分步之四十七卽從步也合問欽裴按依下李注凡爲術之意約省爲善宜云下有六分以一爲六十半爲三十三分之一爲二十四分之一爲一十五五分之一爲一十二六分之一爲一十并之得一百四十七以爲法置田二百四十步亦以一爲六十乘之爲實實如法得從步其術亦得知不繁也今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一求田一畝問從幾何荅曰九十二步一百二十一分步之六十八術曰下有七分以一爲四百二十半爲二百一
  hash: sha256:6a7964f6514e1b48e6f60420d0331ea7f3ac83ec666939e0994ea2b8242e68c5
