body:
  text: 人共分十二爲人得二也者并六人爲法以所分十二爲實實如法得二以人數分所分是經分也云欲復作逐家者則當列置人數以一人所得乘之者列置三人二人一人以一人所得二乘之甲家得六乙家得四丙家得二此以經分術入之先除而後乘也今有術注云先除後乘或有餘分故術反之今此術先乘後除與今有術同也今有大夫不更簪褭上造公士凡五人共獵得五鹿欲以爵次分之問各得幾何荅曰大夫得一鹿三分鹿之二不更得一鹿三分鹿之一簪褭得一鹿上造得三分鹿之二公士得三分鹿之一術曰列置爵數各自爲衰爵數者謂大夫五不更四簪褭三上造二公士一也墨子號令篇以爵級爲賜然則戰國之初有此名也今有術列衰各爲所求率副并爲所有率今有鹿數爲所有數而今有之卽得副并爲法以五鹿乘末并者各自爲實實如法得一鹿
