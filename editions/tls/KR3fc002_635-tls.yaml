body:
  text: 二十四斗又退位除之得六升八十一分升之七十四合問説曰註云此亦重今有之義者此問有粺米糲米相與之率糲米惡米相與之率而無粺米惡米相與之率依今有術當先求糲米後求惡米今不求糲米而徑求惡米并兩次乘除爲一次乘除亦重今有之義故云爲術之意猶絡絲也云雖各有率不問中間者雖有粺米糲米惡米各率而不用粺米求糲米是不問中間也云故令後實乘前實後法乘前法而并除之也者令惡粟乘糲率又乘粺米爲實糲米乘粺率爲法而并除之也今有善行者行一百步不善行者行六十步今不善行者先行一百步善行者追之問何步及之荅曰二百五十步術曰置善行者一百步減不善行者六十步餘四十步以爲法以善行者之一百步乘不善行者先行一百步爲實實如法得一步按此術以六十步減一百步餘四十步卽不善行者先行率也善行者行一百步追及率約之追及率得五先行率得二於今有術不善行者先行一百步爲所有數五爲所求率二爲所有率而今有之得追及
