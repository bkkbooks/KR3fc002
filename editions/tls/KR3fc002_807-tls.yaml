body:
  text: 秉下實二十四斗左行中禾四秉下禾八秉下實三十九斗以中行中禾徧秉左行而以直除左行中禾空餘下禾三十六秉下實九十九斗注當云列此中下禾之秉實乘左行以直除則下禾之位自決矣云各以其餘一位之秉除其下實卽斗數者注意以兩行互乘對減故云各以其餘除其下實若依術直除則但以左行所餘下禾三十六秉除下實九十九斗也云用算繁而不省者所以別爲法約也者後注所云爲作新術是也云然猶不如自用其舊者算少者不如用方程舊法也云廣異法者爲作新術所以廣異法故後注多稱異術焉云此謂中下兩禾實者謂中行下實爲中下兩禾共實也云下禾一秉實數先見者下禾一秉實三十六分斗之九十九也云將中秉求中禾者將中禾秉數求中禾之列實也云其列實以減下實者其列實下禾列實也以下禾列實減中行下實餘爲中禾之列實也云下禾實旣以法爲母則中行下實不以法爲母於率不通故先以法乘其實而同之者下禾實以法三十六爲母若中行下
