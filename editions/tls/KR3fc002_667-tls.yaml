body:
  text: 日九日相乘得六十三日母相乘爲同是同其日以日爲母也云并齊以除同者并九至七至爲法七日九日相乘爲實也今有甲發長安五日至齊乙發齊七日至長安今乙發巳先二日甲乃發長安問幾何日相逢荅曰二日十二分日之一術曰并五日七日以爲法按此術并五日七日爲法者猶并齊爲法置甲五日一至乙七日一至齊而同之定三十五日甲七至乙五至并之爲十二至者用三十五日也謂甲乙與發之率耳然則日化爲至當除日故以爲法也以乙先發二日減七日減七日者言甲乙俱發今以發爲始發之端於本道里則餘分也餘以乘甲日數爲實七者長安去齊之率也五者後發相去之率也今問後發故舍七用五以乘甲五日爲二十五日言甲七至乙五至更相去用此二十五日也實如法得一日一日甲行五分至之一乙行七分至之一齊而同之甲定日行三十五分至之七乙定日行三十五分至之五是爲齊去長安三十五分甲日行七分乙日行五分也今乙先行發二日巳行十分餘相去二十五分故減乙二日餘令相乘爲二十五分草曰置甲五日至乙七日至并之得十二至爲法以乙先發二日減七日餘五日以乘甲五日得二十五日爲實實如法得二日十二分日之一合問説曰注云日化爲至者置甲五日一至乙七日
