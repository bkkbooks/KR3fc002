body:
  text: 之費一十八乘之得一億二千三百一十二萬爲實以分母二千八百七十三乘乙戶一萬二千三百一十二得三千五百三十七萬二千三百七十六爲法實如法而一得三錢三千五百三十七萬二千三百七十六分錢之一千七百萬二千八百七十二以等數一萬二千三百一十二約子母爲二千八百七十三分錢之一千三百八十一置丙縣所當出粟一千三百八十八斛二千八百七十三分斛之二千二百七十六通分內子得三百九十九萬以其一斛之費一十八乘之得七千一百八十二萬爲實以分母二千八百七十三乘丙戶七千一百八十二得二千六十三萬三千八百八十六爲法實如法而一得三錢二千六十三萬三千八百八十六分錢之九百九十一萬八千三百四十二以等數七千一百八十二約子母爲二千八百七十三分錢之一千三百八十一置丁縣所當出粟一千七百一十九斛二千八百七十三分斛之一千三百一十三通分內子得四百九十四萬以其一斛之費二十七乘之得一億三千三
