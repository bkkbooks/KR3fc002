body:
  text: 説曰注云數同類者無遠數異𩔖者無近同𩔖異𩔖指分母言也云遠而通體者雖異位而相從也近而殊形者雖同列而相違也異位同列指分子言也謂分母同者分子雖異位而相從分母異者分子雖同列而相違也云其一術者可令母除爲率率乘子爲齊除者除同也羣母相乘謂之同以各分母除同爲率率乘各分子爲齊不言同者省文也今有九分之八減其五分之一問餘幾何荅曰四十五分之三十一又有四分之三減其三分之一問餘幾何荅曰十二分之五減分臣淳風等謹按諸分子母數各不同以少減多欲知餘幾減餘爲實故曰減分術曰母五乘子以少減多餘爲實母相乘爲法實如法而一母互乘子者知以齊其子也以少減多者齊故可相減也母相乘爲法者同其母也母同子齊故如母而一卽得草曰置九分五分在右方之八之一在左方母互乘子九分之八得四十五分之一得九以少減多餘三十一爲實母相乘得四十五爲法實不滿法以法命之爲四十五分之三十一合問
