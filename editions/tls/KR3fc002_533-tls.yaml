body:
  text: 先并而半之卽爲廣狹之中平今先得其中平故又倍之知兩廣全也減上廣餘卽下廣按此術穿地四爲堅三垣卽堅也今以堅求穿地當四乘之三而一深袤相乘者爲深袤立幂以深袤立幂除積卽阬廣又三之爲法與堅率并除所得倍之者爲阬有兩廣先并而半之爲中平之廣今此得中平之廣故倍之還爲兩廣并故減上廣餘卽下廣也潢按注實穿地四爲堅三實當作術卽上術曰穿地四爲壤五爲堅三爲墟四也爲深袤之立實也以深袤乘之立實立實皆當作立幂草曰置垣積五百七十六尺四之得二千二百四尺爲實以深一丈展爲一十尺袤一丈六尺展爲一十六尺相乘得一百六十尺又以三乘之得四百八十尺爲法除實得四尺四百八十分尺之三百八十四子母各以九十六約之爲五分尺之四倍之得九尺五分尺之三以上廣六尺減之餘三尺五分尺之三卽穿地下廣也合問説曰注云爲深袤之立幂也者廣袤相乘爲平幂深袤相乘爲立幂也云以深袤乘之立幂除垣積則阬廣又云阬有兩廣先并而半之卽爲廣狹之中平者上術云并上下廣而半之以高若深乘之又以袤乘之卽積尺故今以深袤乘
