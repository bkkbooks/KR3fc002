body:
  text: 草曰置假令故米二斗展爲二十升於右行不足二升居其下置令之三斗展爲三十升於左行有餘二升居其下故米不足右行故米有餘左行令有餘二升維乘二十升得四十升令不足二升維乘三十升得六十升故米不足右行故米有餘左行开之得一百升爲實并有餘二升不足二升得四升爲法實如法得二斗五升卽故米也合問説曰注云按桶受一斛若使故米二斗須添粟八斗以滿之八斗得糲米四斗八升課於七斗是爲不足二升者置粟八斗以米率三乘之得
  hash: sha256:624c94f9c5cf920094c707c029bd782add235509b26cb678f5cccfbd9a31a542
