body:
  text: 十三尺四寸六分爲法除實得二十斛五千三百四十六分斛之五千八十子母各半之爲二千六百七十三分斛之二千五百四十説曰注云粟率五米率三故米一斛於粟一斛三分斛之二者粟米之法粟率五十米三十菽荅麻麥各四十五先以米與粟求等得一十以約二率得粟率五米率三置米一斛以五乘之得五斛三而一得粟一斛三分斛之二次置米斛積一尺六寸二分以五乘之得八十一寸三而一得二尺七寸爲粟一斛積復以米與菽荅麻麥求等得一十五以約二率得米率二菽荅麻麥率各三置米一斛以三乘之得三斛二而一得菽荅麻麥各一斛二分斛之一次置米斛積一尺六寸二分以三乘之得四十八寸六分二而一得二十四寸三分卽二尺四寸十分寸之三爲菽荅麻麥一斛積是三斛程積各如其本率也云當今大司農斛圓徑一尺三寸五分五𨤲正深一尺於𡽪術爲積一千四百四十一寸排成餘分又有十分寸之三者置斛圓徑一尺三寸五分五𨤲展爲一十三寸五分五𨤲自
