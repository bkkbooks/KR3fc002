body:
  text: 行數也合問有木去人不知遠近立四表相去各一丈令左兩表與所望參相直從後右表望之入前右表三寸問木去人幾何荅曰三十三丈三尺三寸少半寸如圖入表爲句率右兩表相去爲股率左右後兩表相去爲見句木去人爲見股術曰令一丈自乘爲實以三寸爲法實如法而一此以入前右表三寸爲句率右兩表相去一丈爲股率左右兩表相去一丈爲見句所問木去人者見句之股股率當乘見句此二率俱一丈故曰自乘以三寸爲法實如法得一寸草曰置表相去一丈通作一百寸爲股率又以爲見句自乘得一萬寸爲實以入表三寸爲句率以爲法實如法得三千三百三十三寸三分寸之一卽三十三丈三尺三寸少半寸爲見股卽木去人也合問有山居木西不知其高山去木五十三里木高九丈五尺人立木東三里望木末適與山峯斜平人目高七尺問山高幾何
