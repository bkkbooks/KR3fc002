body:
  text: 術曰下有半是二分之一以一爲二半爲一并之得三爲法置田二百四十步亦以一爲二乘之爲實實如法得從步草曰置一步二分步之一於位以分母二乘分子及全步皆爲二又以其母除之則一爲二半爲一并之得三爲法置田二百四十步亦以一爲二乘之得四百八十步爲實實如法得一百六十步卽從步也合問今有田廣一步半三分步之一求田一畝問從幾何荅曰一百三十步一十一分步之一十術曰下有三分以一爲六半爲三三分之一爲二并之得一十一爲法置田二百四十步亦以一爲六乘之爲實實如法得從步草曰置一步二分步之一三分步之一於位以最下分母三徧乘諸分子及全步皆爲三各以其母除之則一爲三半爲二分之三三分之一爲一置之於左又以分母二乘分子及巳通者仍以其母除之則一爲六半爲三三分之一爲二并之得一十一爲法置田二百四十步亦以一爲六乘之得一千四百四十步爲實實如法
  hash: sha256:c924e907e5703d6d6b8841022736a5885e30390ff0b7952f9b39ac218a9dfd8d
