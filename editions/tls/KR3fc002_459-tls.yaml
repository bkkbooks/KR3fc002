body:
  text: 半陽馬其形有似鼈肘故以名云中破陽馬得兩鼈臑鼈臑之見數卽陽馬之半數數同而實據半故云六而一卽得草曰置下廣五尺以上袤四尺乘之得二十尺以高七尺乘之得一百四十尺六而一得二十三尺六分尺之二子母各半之得三分尺之一爲少半尺卽鼈臑積也合問説曰注云中破陽馬得兩鼈臑圖説見前云鼈臑之見數卽陽馬之半數者陽馬居立方三分之一鼈臑居立方六分之一也今有羡除下廣六尺上廣一丈深三尺末廣八尺無深袤七尺問積幾何答曰八十四尺如圖辛壬爲下廣乙丙爲上廣戊至巳爲深甲丁爲末廣戊至庚爲袤術曰并三廣以深乘之又以袤乘之六而一按此術羡除實隧道也其所穿地上平下邪似兩鼈臑夾一壍堵卽羡除之形假令用此棊上廣三尺深一尺下廣一尺末廣一尺無深袤一尺下廣皆壍堵之廣上廣者兩鼈臑與一壍堵相連之廣也以深袤乘得積五尺鼈臑居二壍堵居三其於本棊皆以爲六故六而一合四陽馬以
