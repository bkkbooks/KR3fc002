body:
  text: 分之二十二半之爲二十一分之十一卽立方立圓之率也置立方積尺以立圓率十一乘之如立方率二十一而一得立圓積若以立圓積求徑則置立圓積尺以立方率二十一乘之如立圓率十一而一得立方積開立方除之得立方面卽立圓徑九章算術細草圖説卷四門下晚學生沈欽裴算校
