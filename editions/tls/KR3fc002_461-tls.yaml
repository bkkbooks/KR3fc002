body:
  text: 爲方錐邪畫方錐之底亦令爲中方就中方削而上合全爲中方錐之半於是陽馬之棊悉中解矣中錐離而爲四鼈臑焉故外錐之半亦爲四鼈臑雖背正異形與常所謂鼈臑參不相似實則同也所云夾壍堵者中錐之鼈臑也凡壍堵上袤短者連陽馬也下袤短者與鼈臑連也下兩袤相等者亦與鼈臑連也并三廣以高袤乘六而一皆其積也今此羡除之廣卽壍堵之袤也按此本是三廣不等卽與鼈臑連者別而言之中央壍堵廣六尺高三尺袤七尺末廣之兩旁各一小鼈臑皆與壍堵等令小鼈臑居裏大鼈臑居表則大鼈臑出橢皆方錐下廣三尺袤六尺高七尺分取其半則爲袤三尺以高廣乘之三而一卽半錐之積也邪解半錐得此兩大鼈臑求其積亦當六而一合與常率矣按陽馬之棊兩邪棊底方當其方也不問旁角而割之相半可知也推此上連無成不方故方錐與陽馬同實角而割之者相半之勢此大小鼈臑可知更相表裏但體有背正也草曰置下廣六尺上廣一丈末廣八尺并之得二丈四尺展爲二十四尺以深三尺乘之得七十二尺又以袤七尺乘之得五百四尺六而一得八十四尺卽羡除積也合問説曰注云其所穿地上平下邪似兩鼈臑夾一壍堵卽羡除之形具圖於后如圖甲丁丙乙庚辛爲壍堵甲乙丙丁爲上平幂甲庚辛丁爲下邪幂丙乙庚辛爲立幂甲乙庚與丁丙辛爲兩旁句股幂
