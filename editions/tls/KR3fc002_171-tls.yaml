body:
  text: 説曰注云先以等數九約之者小䵂之率十三半以母二通之得二十七於上位亦以二通麥率四十五得九十於上位以上減下下位餘九轉以下餘減上上位亦餘九是九爲等數也以等數九約二十七得三爲所求率以等數九約九十得十爲所有率故三乘而十除今有麥一斗欲爲大䵂問得幾何荅曰爲大䵂一斗二升術曰以麥求大䵂六之五而一臣淳風等謹按大䵂之率五十有四合以大䵂數乘此率術欲從省先以等數九約之所求之率得六所有之率得五也潢按注合以大䵂數乘此率句誤當作以本麥數乘此率草曰置麥一斗展爲一十升以大䵂率六乘之得六十升爲實以麥率五爲法除之得一斗二升卽大䵂也合問説曰注云先以等數九約之者置大䵂率五十四於上位麥率四十五於下位以下減上上位餘九轉以上餘減下下位亦餘九是九爲等數也以等數九約大䵂率五十四得六爲所求率以等數九約麥率四十五得五爲所有率故六
