body:
  text: 密率草曰如前求到三百二十尺以七乘之得二千二百四十尺六十六而一得三十三尺六十六分尺之六十二子母各半之爲三十三分尺之三十一卽米積也爲米草曰置米積三十五尺九分尺之五通分內子得三百二十尺爲實次置米斛法一尺六寸二分亦以九乘之得一十四尺五寸八分爲法除實得二十一斛一千四百五十八分斛之一千三百八十二子母各半之爲七百二十九分斛之六百九十一合問𡽪術草曰置米積三十三尺四百七十一分尺之四百五十七通分內子得一萬六千尺爲實次置米斛法一尺六寸二分亦以四百七十一乘之得七百六十三尺二分爲法除實得二十斛七萬六千三百二分斛之七萬三千九百六十子母各半之爲三萬八千一百五十一分斛之三萬六千九百八十密率草曰置米積三十三尺三十三分尺之三十一通分內子得一千一百二十尺爲實次置米斛法一尺六寸二分亦以三十三乘之得五
  hash: sha256:85fa324eac0d3c38c3651c453306207133eb53ed55c825c054e3b739ea1e47d8
