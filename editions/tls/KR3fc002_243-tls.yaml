body:
  text: 分上造一人受二分公士一人受一分是也云人數爲母分數爲子母同則子齊齊卽衰也故上衰分直以五四爲列者人數爲母皆一也分數爲子則有五四三二一之別母同則子齊齊則可以爲衰可以徑并故直以五四三二一爲列衰副并得十五爲法云今此令高爵出少則當使大夫五人共出一人分不更四人共出一人分故謂之返衰人數不同則分數不齊當令母互乘子母互乘子則動者爲不動者衰也者今此令高爵出少則當使大夫五人出一分不更四人出一分簪褭三人出一分上造二人出一分公士一人出一分人數不同是母不同也子雖俱爲一分然大夫是五分之一不更是四分之一簪褭是三分之一上造是二分之一公士是一分之一母不同則子不齊故曰人數不同則分數不齊不齊則不可以爲衰不可以徑并當令母互乘子以齊之母互乘子者置大夫分子一以不更母四乘之得四又以簪褭母三乘四得十二又以上造母二乘十二得二十四又以公士母一乘二十四仍得二十四於上位
