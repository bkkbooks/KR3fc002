body:
  text: 云餘皆約之者術省故也者餘實足斤當以斤法十六兩通之而後以法除之得兩餘實是兩當以兩法二十四銖通之而後以法除之得銖今術不言通之但言約之故云術省故也今有良馬與駑馬發長安至齊齊去長安三千里良馬初日行一百九十三里日增十三里駑馬初日行九十七里日減半里良馬先至齊復還迎駑馬問幾何日相逢及各行幾何答曰十五日一百九十一分日之一百三十五而相逢良馬行四千五百三十四里一百九十一分里之四十六駑馬行一千四百六十五里一百九十一分里之一百四十五術曰假令十五日不足三百三十七里半令之十六日多一百四十里以盈不足維乘假令之數并而爲實并盈不足爲法實如法而一得日數不盡者以等數除之而命分求良馬行者十四乘益疾里數而半之加良馬初日之行里數以乘日分子如日分母而一所得及其不盡而命分加於前良馬凡行里數卽得求駑馬行者以十四乘半里以減駑馬初日之行里數餘以并初日之行又
