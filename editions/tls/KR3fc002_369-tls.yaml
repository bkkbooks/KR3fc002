body:
  text: 謂隅法也立方有實方𠔳隅四層實置於上方次之𠔳次之隅在下步之者以隅步實定初商之位也超二等者言千之面十言百萬之面百故以所借一算步之超至千而議十超至百萬而議百自千以上可類推也議所得者初商之數置於實上也以再乘所借一算爲法者以初商乘隅爲𠔳又以初商乘𠔳爲方方卽法也而除之者以初商乘方減實也除巳三之爲定法者又以初商乘隅加𠔳以初商乘𠔳加方是三因初商自乘爲定法注所謂方法也復除折而下者方一退也以三乘所得數置中行者所得數卽初商數也又以初商乘隅加𠔳是三因初商數爲𠔳注所謂𠔳法也復借一算置下行步之者以隅步實定次商之位也中超一下超二位者𠔳再退隅三退也不言退者超兼進退自一步十步百則超而進自百步十步一則超而退也復置議以一乘中再乘下皆副以加定法者以次商乘隅加𠔳又以次商乘𠔳加方爲定法也以定法除者以次商乘方減實也除巳倍下并中從定法者又以次商乘隅加𠔳以次商
