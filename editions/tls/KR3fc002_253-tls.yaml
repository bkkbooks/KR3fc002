body:
  text: 今有甲持粟三升乙持糲米三升丙持糲飯三升欲令合而分之問各幾何荅曰甲二升一十分升之七乙四升一十分升之五丙一升一十分升之八術曰以粟率五十糲米率三十糲飯率七十五爲衰而返衰之副并爲法以九升乘未并者各自爲實實如法得一升按此術三人所持升數雖等論其本率精麤不同米率雖少令最得多飯率雖多返使得少故令返之使精得多而麤得少於今有術副并爲所有率未并者各爲所求率九升爲所有數而今有之卽得草曰置粟率五十糲米率三十糲飯率七十五爲衰而返衰之甲五十分之一得二千二百五十乙三十分之一得三千七百五十丙七十五分之一得一千五百各爲泛衰求總等得七百五十以徧約之甲得三乙得五丙得二爲列衰副并得一十爲法以九升乘未并者甲得二十七升乙得四十五升丙得一十八升各自爲實實如法得二升一十分升之七爲甲所得得四升一十分升之五爲乙所得得一升一十分升
