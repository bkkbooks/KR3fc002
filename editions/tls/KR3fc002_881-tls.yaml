body:
  text: 重過於石之物乙禾三秉重過於石如丙一秉是丙禾一秉爲乙禾三秉重過於石之物丙禾四秉重過於石如甲一秉是甲禾一秉爲丙禾四秉重過於石之物注云互其算令相折除以石爲之差實者甲禾一秉重二十三分石之十七二之爲二十三分石之三十四以乙禾一秉重二十三分石之十一減之餘二十三適滿法爲一石故以一石爲之差實也云差實者如甲禾餘實故置算相與同也者以石爲差實是甲禾二秉多於乙禾一秉之數故令與甲禾二秉同名爲正算重過於石之乙禾一秉異名爲負算也乙丙倣此云此人頭位異名相除者正無人正之負無人負之也者右行甲禾減左行甲禾中行乙禾減左行乙禾皆異名相除也乙禾一秉在右爲負在左亦爲負負無人負之也今有令一人吏五人從者十人食雞十令十人吏一人從者五人食雞八令五人吏十人從者一人食雞六問令吏從者食雞各幾何荅曰令一人食一百二十二分雞之四十五
