body:
  text: 數與練絲十二兩約之絡得四練得三此其相與之率者展絡絲一斤爲十六兩與練絲十二兩求等得四約十六爲四約十二爲三是絡絲練絲相與之率也云又置練絲一斤銖數與靑絲一斤十二銖約之練得三十二靑得三十三亦其相與之率者展練絲一斤爲三百八十四銖靑絲一斤十二銖爲三百九十六銖求等得十二約三百八十四爲三十二約三百九十六爲三十三是練絲靑絲相與之率也云齊其靑絲絡絲同其二練絡得一百二十八靑得九十九練得九十六卽三率悉通矣者絡居練三分之四靑居練三十二分之三十三以練絲爲母靑絡爲子齊其靑絲絡絲者絡率四乘練率三十二絡得一百二十八靑率三十三乘練率三靑得九十九是齊其子也同其二練者練率三與三十二相乘練得九十六是同其母也母同子齊則三率悉通矣云今有靑絲一斤爲所有數絡絲一百二十八爲所求率靑絲九十九爲所有率者靑絲一斤乘絡率一百二十八得一百二十八斤爲實以靑率九十九爲法除之得
  hash: sha256:b2df1e2c5ffda28bc22243549e381a7f8b068d443481789ca6e732bd0b1f8a97
