body:
  text: 之卽亦居外方四分之三也是爲圓裏十二觚之幂耳取以爲圓失之於微少於𡽪新術當徑自乘又以一百五十七乘之二百而一臣淳風等謹按密率令徑自乘以十一乘之十四而一卽圓幂也草曰置徑十步自乘得一百步三之得三百步爲實四而一得七十五步合問草曰置徑六十步三分步之一通分內子得一百八十一自乘得三萬二千七百六十一本當以三乘之今省不乘卽以三萬二千七百六十一步爲實本當以分母相乘乘四爲法今但以分母三乘四得十二爲法實如法合問説曰按密率令徑自乘以十一乘之十四而一卽圓幂也者此亦約率也設圓徑一十四周四十四徑自乘得一百九十六爲方幂半周半徑相乘得一百五十四爲圓幂求等得十四以約方幂得十四爲方幂率以約圓幂得十一爲圓幂率今按依密率當令徑自乘以三百五十五乘之四百五十二而一卽圓幂也設圓徑二百二十六圓周七百一十徑自乘得五萬一千七十六爲方幂半周半徑相乘得四萬一百一十五爲圓幂求等得一百一十三以約方幂得四
