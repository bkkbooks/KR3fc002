body:
  text: 分也又以各分母除所通數置之於左以俟通而同之也命通分者以所通數爲實以各分母爲法而命之如十二爲所通數以十一除之不盡命爲十一分之十二是也又以分母徧乘諸分子及已通者皆通而同之并之爲法者諸分子者以各分母除所通數不盡者也巳通者以各分母除所通數適盡者也又以分母徧乘之所以通之也以各分母除之皆盡所以同之也母同則子齊故可并齊於同以爲法也置所求步數以全步積分乘之爲實者所求步數如下問求田一畝通爲二百四十步是也全步積分者卽巳通數爲同者也以同乘所求步數爲實并齊於同以爲法注所謂法實俱長者是也注云亦不宜用合分術列數尤多若用乘則算數至繁者如第十一問依合分術母相乘得四億七千九百萬一千六百爲全步積分并齊於同得一十四億八千六百四十四萬二千八百八十步以爲法則至繁矣故別制此術從省約也今有田廣一步半求田一畝問從幾何荅曰一百六十步
