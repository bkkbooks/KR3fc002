body:
  text: 一分錢之二卽一丈直也合問買布草曰匹率之者以一匹爲所求率也置布一匹通爲四十尺以出錢二千三百七十乘之得九萬四千八百錢爲實次置布九匹二丈七尺通之得三百八十七尺爲法實如法得二百四十四錢三百八十七分錢之三百七十二子母各以三約之爲一百二十九分錢之一百二十四卽一匹直也合問買絲草曰石率之者以一石爲所求率也置絲一石通爲一百二十斤以出錢一萬三千六百七十乘之得一百六十四萬四百錢爲實次置絲一石二鈞一十七斤通之得一百九十七斤爲法實如法得八千三百二十六錢一百九十七分錢之一百七十八卽一石直也合問説曰此四問是算家定位法也買𣾰率止於升故通一斗爲十升買縑率止於尺故通一丈爲十尺買布率亦止於尺故通一匹爲四十尺買絲率止於斤故通一石爲一百二十斤所以齊其位也乘除皆置實于上置法于下上下相觀以法步實上位有十步至十有百步至百有千
