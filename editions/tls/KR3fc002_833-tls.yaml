body:
  text: 正負正左行以右行上禾五秉徧乘左行左行得上禾三十五秉正下禾二十五秉負下實一百二十五升正以同減異并左行左行上禾空下禾二十四秉正下實四十八升正上禾下禾下實正負正右行正負正左行正正左行上爲法下爲實實如法得二升爲下禾一秉之實求上禾以下禾實二升乘右行下禾七秉負得一斗四升負以并下實一斗一升正得二斗五升正爲上禾列實如上禾五秉正而一得五升爲上禾一秉之實合問説曰此問以同名相除異名相益爲例以右行徧乘左行而直除之上禾減盡同名相除也下禾二十四秉本在右行爲負移入左行爲正負無人正之也下實四斗八升正同名相除餘在
