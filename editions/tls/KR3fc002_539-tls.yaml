body:
  text: 之得三千二百四十尺以十二乘之得三萬八千八百八十尺又以高分母三乘之得一十一萬六千六百四十尺爲實次置高一丈三尺三寸少半寸展爲一十三尺三寸三分寸之一通分內子得四十尺爲法除實得二千九百一十六尺開方除之得五十四尺收爲五丈四尺卽周也合問𡽪術草曰如前求到三千二百四十尺以三百一十四乘之得一百一萬七千三百六十尺又以三乘之得三百五萬二千八十尺爲實如前求到四十尺以二十五乘之得一千尺爲法除實得三千五十二尺零八寸開方除之得五十五尺二寸四分五釐餘實六寸九十九分七十五釐弃之其五十五尺二寸四分五釐收爲五丈五尺二寸二十分寸之九卽周也密率草曰如前求到三千二百四十尺以八十八乘之得二十八萬五千一百二十尺又三乘之得八十五萬五千三百六十尺爲實如前求到四十尺以七乘之得二百八十尺爲法除實得三千五十四尺二百八十分尺之二百四十
