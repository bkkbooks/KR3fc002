body:
  text: 術曰以去閫一尺自乘所得以不合二寸半之而一所得增不合之半卽得門廣此去閫一尺爲句門廣爲股不合二寸以半之得一寸爲股弦差求弦故當半之今卽以兩弦爲廣數故不復半之也潢按注門廣爲股當作半門廣爲弦草曰置去閫一尺展作一十寸爲句自乘得一百寸爲句幂又爲股弦差與股弦并相乘幂以不合二寸半之得一寸爲股弦差以除之得一百寸爲股弦并以股弦差一寸加之得一百一寸卽一丈一寸爲倍弦卽門廣也合問今有戶高多於廣六尺八寸兩隅相去適一丈問戶高廣各幾何荅曰廣二尺八寸高九尺六寸如圖戶廣爲句戶高爲股兩隅相去爲弦高多於廣爲句股差術曰令一丈自乘爲實半相多令自乘倍之減實半其餘以開方除之所得減相多之半卽戶
  hash: sha256:394624e2f4fc6f2ef590dc5d509b1638cc8d7d05183dcb92c2523521862f3476
