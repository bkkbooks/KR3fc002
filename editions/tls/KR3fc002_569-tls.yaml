body:
  text: 丙戶七千一百八十二得三百九十九爲丙衰丁縣至輸所二百五十里僦價二百五十錢以二十五斛除之得十錢加一斛粟價十七錢得二十七錢爲丁縣致一斛之費以約丁戶一萬三千三百三十八得四百九十四爲丁衰戊縣至輸所一百五十里僦價一百五十錢以二十五斛除之得六錢加一斛粟價十三錢得一十九錢爲戊縣致一斛之費以約戊戶五千一百三十得二百七十爲戊衰副并得二千八百七十三以爲法乃置所賦粟一萬斛以甲衰一千二十六乘之得一千二十六萬爲甲實以乙衰六百八十四乘之得六百八十四萬爲乙實以丙衰三百九十九乘之得三百九十九萬爲丙實以丁衰四百九十四乘之得四百九十四萬爲丁實以戊衰二百七十乘之得二百七十萬爲戊實實如法而一得甲縣三千五百七十一斛二千八百七十三分斛之五百一十七乙縣二千三百八十斛二千八百七十三分斛之二千二百六十丙縣一千三百八十八斛二千八百七十三分斛之二千二百七十六丁縣一千
  hash: sha256:20930f3d499de83125cb45dd5f075ce9719c3e7fe19509ac7216fe2471231821
