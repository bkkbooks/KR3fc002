body:
  text: 八依𡽪術當菽一百三十七斛一萬二千七百一十七分斛之七千七百七十一臣淳風等謹按依密率爲菽一百三十七斛八百九十一分斛之四百三十三如圖丙辛丁爲依垣下周甲乙爲高今有委米依垣內角下周八尺高五尺問積及爲米幾何答曰積三十五尺九分尺之五於𡽪術當積三十二尺四百七十一分尺之四百五十七臣淳風等謹按依密率當積三十三尺三十三分尺之三十一爲米二十一斛七百二十九分斛之六百九十一於𡽪術當米二十斛三萬八千一百五十一分斛之三萬六千九百八十臣淳風等謹按依密率爲米二十斛二千六百七十三分斛之二千五百四十如圖丁辛丙爲依垣內角下周甲乙爲高委粟
