body:
  text: 犬價一百二十一雞價二十三兔價二十九術曰如方程以正負術入之草曰置五羊四犬三雞二兔直錢一千四百九十六於右行次置四羊二犬六雞三兔直錢一千一百七十五於第二行次置三羊一犬七雞五兔直錢九百五十八於第三行次置二羊三犬五雞一兔直錢八百六十一於左行令右行五羊徧乘第二行第二行得二十羊十犬三十雞十五兔直錢五千八百七十五以右行減之第二行羊空餘六犬負十八雞正七兔正直錢一百九負次令右行五羊徧乘第三行第三行得十五羊五犬三十五雞二十五兔直錢四千七百九十以右行減之第三行羊空餘七犬負二十六雞正十九兔正直錢三百二正次令右行五羊徧乘左行左行得十羊十五犬二十五雞五兔直錢四千三百五以右行減之左行羊空餘七犬正十九雞正一兔正直錢一千三百一十三正又令第二行六犬徧乘第三行第三
