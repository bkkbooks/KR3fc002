body:
  text: 減也云故赤用黑對則除黑當作黑用黑對則除黑黑無對而有異𩔖之赤非所得減故易減爲并赤黑并於本數爲相益於列位爲相消故云皆所以爲消奪也云其當以列實減下實而行中正負雜者亦用此條者列實與下實同名則相減異名則相益也云正無人負之負無人正之亦指減行下實言也云言負者未必負於少言正者未必正於多者此釋正負之義甚明謂多可爲正少亦可爲正少可爲負多亦可爲負也云觀其每與上下互相取位則隨算而言耳猶一術也者上下之位可以互易如左右兩行上位二正同名中位正負異名下位亦正負異名則以同減異并爲術如上中互取其位以中位居上爲正負異名上位居中爲二正同名下位不動仍正負異名則以異減同并爲術所得各數俱同故云猶一術也云又本設諸行欲因減數以相去耳故其多少無限令上下相命而巳者此又以多行者言之故云諸行列行雖多亦是逐位相減至一法一實上下相命而止也云若以正負相減如數有舊增法者每行可
