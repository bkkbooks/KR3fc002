body:
  text: 四十步亦以一爲八百四十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一於位以最下分母八徧乘諸分子及全步皆爲八各以其母除之則一爲八半爲四三分之一爲三分之八四分之一爲二五分之一爲五分之八六分之一爲六分之八約爲三分之四七分之一爲七分之八八分之一爲一置之於左又以分母七徧乘諸分子及巳通者各以其母除其子則一爲五十六半爲二十八三分之一爲三分之五十六四分之一爲一十四五分之一爲五分之五十六六分之一爲三分之二十八七分之一爲八八分之一爲七置之於在又以分母三徧乘諸分子及巳通者各以其母除其子則一爲一百六十八半爲八十四三分之一爲五十六四分之一爲四十二五分之一爲五分之一百六十八六分之一爲二十八七分之一爲二十四八分之一爲二十一置之於左又以分母五徧乘諸分子及巳通者
