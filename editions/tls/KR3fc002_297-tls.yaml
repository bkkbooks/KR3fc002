body:
  text: 今有田廣一步半三分步之一四分步之一五分步之一求田一畝問從幾何荅曰一百五步一百三十七分步之一十五術曰下有五分以一爲六十半爲三十三分之一爲二十四分之一爲一十五五分之一爲一十二并之得一百三十七以爲法置田二百四十步亦以一爲六十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一於位以最下分母五徧乘諸分子及全步皆爲五各以其母除之則一爲五半爲二分之五三分之一爲三分之五四分之一爲四分之五五分之一爲一置之於左又以分母四徧乘諸分子及巳通者各以其母除其子則一爲二十半爲一十三分之一爲三分之二十四分之一爲五五分之一爲四置之於左又以分母三乘分子及巳通者仍以分母除其子則一爲六十半爲三十三分之一爲二十四分之一爲一十五五分之一爲一十二并之得一百三十七以爲法置田二百四十步亦以一
