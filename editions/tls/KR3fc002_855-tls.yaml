body:
  text: 得雀四燕二十重三十二兩以右行減之左行雀空燕十九重二十四兩中法下實實二十四兩卽燕一枚之重寄法十九爲分母求雀重以法十九乘右行重八兩得一百五十二兩於下位以燕重二十四兩乘右行燕一仍得二十四兩以減下位餘一百二十八兩如雀四而一得三十二兩爲雀一枚之重寄法十九爲分母乃置雀重三十二兩燕重二十四兩皆如法十九而一得雀重一兩十九分兩之十三燕重一兩十九分兩之五合問説曰注云列兩行程數左行頭位其數是一可省乘者亦以齊同言之若用直除本不須以左行乘右行但令右行徧乘左行而取其法實於左也云三雀四燕重相當雀率重四燕率重三也者四雀一燕與一雀五燕重相當左右各減去一雀一燕則三雀四燕重亦相當對易其數爲雀率重四燕率重三云諸再程之率皆可異術求之卽其數也者再程卽上注所云二物者再程也異術卽方程新術也異術以雀率重四燕率重三爲列衰更置一行燕雀數各以其率
