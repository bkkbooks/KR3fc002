body:
  text: 步除之得五畝三十步二十二分步之十五古率求徑草曰置中周六十二步於右上四分步之三居其下又置外周一百一十三步於左上二分步之一居其下母互乘子四分之三得六二分之一得四母相乘得八乃置中周六十二步八分步之六通全步內分子得五百二分爲實以分母八乘三得二十四爲法除之得二十步二十四分步之二十二於上位又置外周一百一十三步八分步之四通全步內分子得九百八分爲實以法二十四除之得三十七步二十四分步之二十於下位上下相減餘十六步二十四分步之二十二半之得八步二十四分步之一十一卽徑也今徑十二步三分步之二多四步二十四分步之五過周三徑一之率矣故知此田環而不通匝𡽪術求徑草曰如前求到中周五百二分以五十乘之得二萬五千一百分爲實以分母八乘一百五十七得一千二百五十六爲法除之得十九步一千二百五十六分步之一千二百三十六於上位如前求到外周九百八分以五十
