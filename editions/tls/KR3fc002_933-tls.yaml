body:
  text: 七十六寸爲股幂開方除之得二尺四寸爲股卽廣也合問説曰前注云句短其股股短其弦此問版厚短於版廣故以版厚爲句版廣爲股而圓徑其弦也今有木長二丈圍之三尺葛生其下纒木七周上與木齊問葛長幾何荅曰二丈九尺如第一圖葛纒木七周上與木齊第二圖解而觀之每周之間自相間成句股弦合七小句股弦爲一大句股弦故以七周乘圍爲股木長爲句而葛長其弦也術曰以七周乘三圍爲股木長爲句爲之求弦弦者葛之長據圍廣木長求葛之長其形葛卷裏袤以筆管靑線宛轉有似葛之纒木解而觀之則每周之間自有相間成句股弦則其間木長爲股圍之爲句葛長爲弦弦七
  hash: sha256:801cb5b3c95b6ad813fbadf395be154f65b9371e9cdf8c28cb7e658f258d30ce
