body:
  text: 得錢十九爲下實以菽四乘菽價三得錢十二減下實十九餘錢七如麻一而一得七爲麻價李校一術細草并附先以第四行減第三行次以第三行去右行及第二行第四行下位又以減左行下位不足減乃止次以左行減第三行下位次以第三行去左行下位訖廢去第三行次以第四行去左行下位又以減右行下位次以右行去第二行及第四行下位次以第二行減第四行及左行頭位次以第四行減左行菽位不足減乃止次以左行減二行頭位餘可再半次以第四行去左行及第二行頭位次以第二行去左行頭位餘約之上得五下得三是菽五當荅三次以左行去第二行菽位又以減第四行及右行菽位不足減乃止次以右行減第二行頭位不足減乃止次以第二行去右行頭位次以左行去右行頭位餘上得六下得五是爲荅六當黍五次以左行去右行荅位餘約之上爲二下爲一次以右行去第二行下位以第二行去第四行下位又以減左行下位次左行去第二行下位餘上
