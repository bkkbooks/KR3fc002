body:
  text: 四寸一分四𨤲二毫爲外方徑兩徑相課外方徑多三𨤲四毫半之得一𨤲七毫卽庣旁也云王莽銅斛與漢書律歴志所論斛同者李籍音義云王莽作銅斛名曰律嘉量方尺而圓其外旁有庣焉其上爲斛其下爲斗左耳爲升右耳爲合龠其狀似爵以縻爵祿上三下一參天兩地圓而函方左一右二陰陽之象也其圓象規其重二鈞備氣物之數合萬有一千五百二十也聲中黃鍾始於黃鍾而反覆焉是與漢書律歴志所論同也今有穿地袤一丈六尺深一丈上廣六尺爲垣積五百七十六尺問穿地下廣幾何答曰三尺五分尺之三如圖癸壬爲袤戊至巳爲深甲丁爲上廣庚癸爲下廣術曰置垣積尺四之爲實實穿地四爲堅三垣堅也以堅求穿地當四之三而一也以深袤相乘爲深袤之立實也又以三之爲法以深袤乘之立實除垣積則阬廣又三之者與堅率并除之所得倍之阬有兩廣
