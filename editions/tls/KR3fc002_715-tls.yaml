body:
  text: 百七十爲六十三分之一千八百九十也云令下維乘上訖以同約之不可約故以同乘之者同謂分母約之謂約上乘之謂乘下也如共買璡人出六之三盈四人出六之二不足三下維乘上訖并之上得十七以分母六約之不盡是爲不可約故卽以十七爲實以分母六乘下七得四十二爲法也云所出率以少減多者餘謂之設差以爲少設者如共買雞人出六減人出九餘三謂之設差因以爲少設也云則并盈朒是爲定實者求正數則并盈不足爲法術所云是也求人數則并盈不足爲實其一術所云是也云定實者以別乎泛實也如共買雞人出九盈十一人出六不足十六并盈不足得二十七爲泛實以設差三約之得九爲定實也云故以少設約法則爲人數約實則爲物價者如共買雞問令下維乘上并得二百一十爲實并盈不足得二十七爲法以少設三約法得九爲人數約實得七十爲雞價也云盈朒當與少設相通不可徧約亦當分母乘設差爲約法實者所出率旣寄有分母則少設亦寄有分母盈朒不以
