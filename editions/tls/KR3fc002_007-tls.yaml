body:
  text: 重差圖序圖九望海島舊有圖解餘八圖今所補也同式形兩兩相比所作四率二三率相乘與一四率相乘同積如欲作圖明之苐取一三率聯爲一邊又取二四率聯爲一邊作相乘長方圖之自然分爲四冪又以斜弦界爲同式句股形各二則形勢騐矣舊圖於形外別作同積二方至兩形相去遼遠者又必宛轉通之皆可不必也圖中以四邊形五邊形立説似與句股不𩔖然於本形外補作句股形則亦句股也四率比例法在九章粟米謂之今有一爲所有率二爲所求率三爲所有數四爲所求數在句股則統目之爲率劉氏注云句率股率見句見股者是也今祇云同式相比者取省易耳異乘同除則一也鍾祥李潢
  hash: sha256:d38132fe2fe5560d951205fb7c71bc4aee0f8fe5de0be58512886b8c25a37c43
