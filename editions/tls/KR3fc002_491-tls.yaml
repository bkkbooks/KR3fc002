body:
  text: 十尺乘之得八百尺於上位置下袤三十尺以上廣三十尺乘之得九百尺於下位上下相并得一千七百尺半之得八百五十尺以高三十尺乘之得二萬五千五百尺卽四面六壍堵與二立方與寄左一千尺相并得二萬六千五百尺爲芻童積又草曰如前求到八百五十尺於上位又置下袤三十尺以下廣二十尺乘之得六百尺於中位置上袤四十尺以上廣三十尺乘之得一千二百尺於下位并三位得二千六百五十尺以高三十尺乘之得七萬九千五百尺三而一得二萬六千五百尺卽芻童積也今有曲池上中周二丈外周四丈廣一丈下中周一丈四尺外周二丈四尺廣五尺深一丈問積幾何荅曰一千八百八十三尺三寸少半寸如圖丁丙上中周甲乙外周甲丁乙丙皆上廣癸壬下中周庚辛外周庚癸辛壬皆下廣戊至巳爲深此池環而不通匝
