body:
  text: 壬一全弧面幂是合四內棊爲合蓋上半得四弧面幂甲爲頂銳卽一角自此角引四甲壬稜面達於方周之四隅得四壬爲四半角壬辛壬爲方面亦爲四半稜面又并四內棊爲合蓋下半亦如上半有四弧面幂一角四半角四弧稜四半稜并上半下半爲合蓋全形其上下形相合處每以二半角合爲一角二半稜合爲一稜共得八弧幂六角十二稜爲合蓋形置三分之二以圓幂率十一乘之如方幂率十四而一約而定之以爲丸率故曰丸居立方二十一分之十一也潢按此釋左氏術自當依其方幂十四圓幂十一之率不得用方四圓三古率甚明且上下文皆以二十一與十一爲率可證也置合蓋率居立方三分之二以圓幂率十一乘分子二得二十二爲實以方幂率十四乘分母三得四十二爲法實不滿法命爲四十二
