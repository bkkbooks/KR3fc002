body:
  text: 三三者上部二人各以三加之則得二三下部三人各以三加之則得三三也云下部猶差一人差得一以通於本率卽上下部等也者上部二人下部三人是下部差多一人也差得一一疑當作三以差三加於本率則一爲四二爲五三爲六并之得十五爲下部四爲七五爲八并之亦得十五爲上部是上下部等也云假令七人分七錢欲令上二人與下五人等則上下部差三人并上部爲十三下部爲十五者上部二人甲七乙六并爲十三下部五人丙五丁四戊三巳二庚一并爲十五也云下多上少下不足減上當以上下部列差而後均減乃合所問者以上部十三減下部十五餘二爲差實以上下部差三人爲差法除實得三之二爲差均減錐行衰得錐行定衰如以三之二減甲七甲得六又三之一減乙六乙得五又三之一減丙五丙得四又三之一減丁四丁得三又三之一減戊三戊得二又三之一減已二已得一又三之一減庚一庚得三之一爲錐行定衰并上部甲乙二人得十一又三之二并下部丙丁戊已庚五
  hash: sha256:4c3c0c0ccbedbb4c94c671bb8ca8a65f2738699543bbc995614f534202e2db29
