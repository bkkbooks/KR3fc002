body:
  text: 爲見句自乘得一萬步爲實以出東門十五步爲句率以爲法實如法得六百六十六步十五分步之一十分母子各以五約之得三分步之二卽太半步爲見股卽出南門見木步數也合問説曰術以容方自乘爲實餘句爲法實如法得餘股今有邑東西七里南北九里各中開門出東門十五里有木問出南門幾何步而見木荅曰三百一十五步如圖出東門里數爲股率東門南至隅里數爲句率南門東至隅里數爲見股出南門爲見股之句術曰東門南至隅步數以乘南門東至隅步數爲實以木去門步數爲法實如法而一此以東門南至隅四里半爲句率出東門十五里爲股率南門東至隅三里半爲見股所問出南門卽見股之句爲術之意與上同也草曰置邑東西七里半之得三里半以里法三
  hash: sha256:4c381ea3d1cec4816f013c9e45c4eecac7505a1200ee7a8c55737b55be5d55f1
