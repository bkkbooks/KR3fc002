body:
  text: 周六十四尺四分之一圓周率一十之面亦爲圓周四十尺四分之一置周率一十之面開方除之得三一六有奇故云增周太多李注亦多衍誤去其前上之𠔳右前之𠔳宋本無右前之𠔳四字謂之外棊下衍規字餘卽內減棊斷上方之幂也減字亦衍列而立之列當作倒疊棊成立積棊當作幂形之誤也置三分之二以圓幂率三乘之如方幂率四而一於密率當以圓幂率十一乘之如方幂率十四而一丸居立方三分之一据術意當作丸居立方二十一分之十一草曰置積四千五百尺以十六乘之得七萬二千尺九而一得八千尺爲實開立方除之得二十尺卽立圓徑也合問密率草曰置立圓徑二十尺再自乘得八千尺以十一乘之得八萬八千尺爲實以二十一爲法除之得四千一百九十尺二十一分尺之一十卽立圓積也注衍八字草曰置積一萬六千四百四十八億六千六百四十三萬七千五百尺以十六乘之得二十六
