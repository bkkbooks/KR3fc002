body:
  text: 稅者以減所通餘爲法實如法得一斤此意猶上術也置一斤通所稅者謂令二三四五六相乘爲分母七百二十也通其所不稅者謂令所稅之餘一二三四五相乘爲分子一百二十也約而言之是爲餘金於本所持六分之一也以子減母凡五關所稅六分之五也於今有術所稅一斤爲所有數分母六爲所求率分子五爲所有率此亦重今有之義又雖各自率不問中間故令中率轉相乘而連除之卽得也置一以爲持金之本率以稅率乘之除之則其率亦成積分也草曰令所稅二三四五六相乘得七百二十以一斤乘之得七百二十斤爲實亦令所稅之餘一二三四五相乘得一百二十以減七百二十餘六百爲法實如法得一斤餘實一百二十斤以十六乘之得一千九百二十兩爲實實如法得三兩餘實一百二十兩以二十四乘之得二千八百八十銖爲實實如法得四銖六百分銖之四百八十以等數一百二十約子母爲五分銖之四并之得一斤三兩四銖五分銖之四合問説曰注云約而言之是爲餘金於本所持六分之一者置分母七百二十分子一百二十皆以等數一百二十約之得六分之一以子減母餘六分之五爲五關所稅
