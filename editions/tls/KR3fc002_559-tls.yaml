body:
  text: 日數乘之如縣人數而一得戶率人役五日七分日之五者此以縣人數爲所有率以其居所及行道日數爲所求率各縣所當出人爲所有數戶率人役日爲所求數與術文以副并爲所有率未并者各爲所求率賦卒人數爲所有數縣出人數爲所求數義可互通故淳風云此術似別考則意同也置甲縣所當出二百二十八人七分人之四通分內子得一千六百以其居所三十日乘之得四萬八千爲實以分母七乘甲縣一千二百人得八千四百爲法實如法而一得五日八千四百分日之六千以等數一千二百約子母爲七分日之五置乙縣所當出二百八十五人七分人之五通分內子得二千以其居所及行道三十一日乘之得六萬二千爲實以分母七乘乙縣一千五百五十人得一萬八百五十爲法實如法而一得五日一萬八百五十分日之七千七百五十以等數一千五百五十約子母爲七分日之五置丙縣所當出二百二十八人七分人之四通分內子得一千六百以其居所及行道三十二日乘之得五萬一
