body:
  text: 用七十分日之一重行一里用五十分日之一齊而同之得空行一里用三千五百分日之五十重行一里用三千五百分日之七十以等數一十約分子得五爲空行列衰七爲重行列衰副并得一十二爲法以五日乘列衰五得二十五爲空行實乘列衰七得三十五爲重行實實如法得二日十二分日之一爲空行日數得二日十二分日之十一爲重行日數云各以一日所行以乘爲凡日所行三返約之爲上林去太倉之數者置空行二日十二分日之一通分內子得二十五以空行七十乘之得一千七百五十爲空行實置重行二日十二分日之十一通分內子得三十五以重行五十乘之亦得一千七百五十爲重行實三返乘分母十二得三十六爲法實如法得四十八里三十六分里之二十二子母各半之爲十八分里之十一卽上林去太倉之里數也今有絡絲一斤爲練絲十二兩練絲一斤爲靑絲一斤十二銖今有青絲一斤問本絡絲幾何荅曰一斤四兩十六銖三十三分銖之十
