body:
  text: 一百二十爲菽二所求粟也云以米菽本率而今有之卽合所問者以粟本率五十乘分母一百五得五千二百五十爲法以米本率三十乘分子九十得二千七百斛爲米實菽本率四十五乘分子一百二十得五千四百斛爲菽實實如法得米五斗一升五千二百五十分升之二千二百五十以等數七百五十約子母爲七分升之三菽一斛二升五千二百五十分升之四千五百以等數七百五十約子母爲七分升之六此兩次用今有術也故先求米菽之粟數後求粟之米菽數若用重今有則米菽之粟數可省不求後注所謂不用中間也今有取傭負鹽二斛行一百里與錢四十今負鹽一斛七斗三升少半升行八十里問與錢幾何荅曰二十七錢十五分錢之十一術曰置鹽二斛升數以一百里乘之爲法按此術以負鹽二斛升數乘所行一百里得二萬里是爲負鹽一升行二萬里得錢四十於今有術爲所有率升數乘所行里爲法於今有術爲所有數也以四十錢乘今負鹽升數又以八十里乘之爲實實如法得一錢以今負鹽升數乘所行里今負鹽一升凡所行里也於今有術以所有四十錢爲所求率也衰分章
