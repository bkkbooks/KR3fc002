body:
  text: 法在下也以股八寸六分六𨤲二秒五忽五分忽之二減半徑十寸餘一寸三分三𨤲九毫七秒四忽五分忽之三謂之小句孔刻作九秒者誤也置小句一寸三分三𨤲九毫七秒四忽五分忽之三自乘得一百七十九億四千九百一十九萬三千四百四十五忽餘分一六於上位置半面五寸爲小股展爲五十萬忽自乘得二千五百億忽於下位并上下位得二千六百七十九億四千九百一十九萬三千四百四十五忽餘分一六棄之開方除之得五寸一分七𨤲六毫三秒八忽謂之小弦餘實九萬四千四百一忽棄之卽十二弧之一面也割十二弧以爲二十四弧草曰亦令半徑爲弦十二弧之半面爲句爲之求股置上小弦幂二千六百七十九億四千九百一十九萬三千四百四十五忽四而一得六百六十九億八千七百二十九萬八千三百六十一忽餘分二五棄之卽句幂也以減弦幂一萬億忽餘九千三百三十億一千二百七十萬一千六百三十九忽開方除之得九寸六分五𨤲九毫二秒五忽十分忽之八約
