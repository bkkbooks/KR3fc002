body:
  text: 禾下禾列爲二行上禾中禾下禾列爲三行又如羊犬雞兔列四行麻麥菽荅黍列五行是也謂之方程者無論行之多少總以左右分列二行相課也云行之左右無所同存者卽上云每行各自爲率無所同也云且爲有所據而言者旣繫之以物又列之爲行爲有所據而言也云又列中行如右行不言左行者文不具也云爲術之意令少行減多行反覆相減則頭位必先盡者如以右行上禾徧乘中行則右行少中行多以右減中不𥁞作兩度減之是反覆相減也減去中行上禾是頭位先𥁞也云舉率以相減不害餘數之課也者少行減多行頭位先盡次位以下減餘爲多少二物之差其下位減餘亦爲多少二實之差舉率者卽上注令每行爲率之率也餘數之課卽多少二物之差與下實之差也云若消去頭位則下去一物之實者如消去中行上禾則下實內亦消去上禾之列實也云如是疊令左右行相減審其正負則可得而知者此問下實始終總爲共實行中不分正負云審其正負者統下有差實者言也云先令右
