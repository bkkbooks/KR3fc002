body:
  text: 之立幂除垣積得中平之廣倍之知兩廣全也今有倉廣三丈袤四丈五尺容粟一萬斛問高幾何答曰二丈如圖庚癸爲廣癸壬爲袤丁癸爲高術曰置粟一萬斛積尺爲實廣袤相乘爲法實如法而一得高尺以廣袤之幂除積故得高按此術本以廣袤相乘以高乘之得此積今還原置此廣袤相乘爲法除之故得高也草曰置粟一萬斛以粟斛積二尺七寸乘之得二萬七千尺爲實以廣三丈展爲三十尺袤四丈五尺展爲四十五尺相乘得一千三百五十尺爲法實如法而一得二十尺收爲二丈卽高也合問今有圓囷圓囷廩也亦云圓囤也高一丈三尺三寸少半寸容米二千斛問周幾何答曰五丈四尺於𡽪術當周五丈五尺二寸二十分寸之九臣淳風等謹依密率爲周五丈五尺一百分尺之二十七
