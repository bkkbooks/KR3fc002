body:
  text: 草曰置糲米十五斗五升五分升之二通分內子得七十七斗七升展爲七百七十七升以粟率五乘之得三千八百八十五升爲實以分母五乘米率三得一十五爲法除之得二十五斗九升卽粟也合問説曰五粟率也三米率也上術以粟求米故粟爲所有數三爲所求率五爲所有率而今有之卽得所求米數今此以米求粟故米爲所有數五爲所求率三爲所有率而今有之卽得所求粟數注所謂准都術求之各合其數也以粺米求粟而下所有反求術皆准此今有粺米二斗欲爲粟問得幾何荅曰爲粟三斗七升二十七分升之一術曰以粺米求粟五十之二十七而一草曰置粺米二斗展爲二十升以粟率五十乘之得一千升爲實以粺米率二十七爲法除之得三斗七升二十七分升之一卽粟也合問今有糳米三斗少半升欲爲粟問得幾何荅曰爲粟六斗三升三十六分升之七術曰以糳米求粟二十五之十二而一
