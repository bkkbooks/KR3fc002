body:
  text: 分步之一百三密率草曰置周三十步自乘得九百步以圓幂率七乘之得六千三百步爲實如周幂率八十八而一得七十一步八十八分步之五十二子母各以四約之爲二十二分步之一十三密率求徑草曰置周一百八十一步以徑率七乘之得一千二百六十七步爲實如周率二十二而一得五十七步二十二分步之一十三卽田徑也草曰置周一百八十一步半之得九十步半於上位置六十步三分步之一通分內子得一百八十一分半之得九十分半於下位上下相乘得八千一百九十步四分步之一爲實內寄三爲分母通分內子得三萬二千七百六十一爲定實內又寄四爲分母以分母三四相乘得十二爲法實如法得二千七百三十步十二分步之一如畝法二百四十步而一得十一畝九十步十二分步之一合問𡽪術草曰置周一百八十一步自乘得三萬二千七百六十一以圓幂率二十五乘之得八十
