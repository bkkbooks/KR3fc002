body:
  text: 母除其子則一爲三千九百六十半爲一千九百八十三分之一爲一千三百二十四分之一爲九百九十五分之一爲七百九十二六分之一爲六百六十七分之一爲七分之三千九百六十八分之一爲四百九十五九分之一爲四百四十十分之一爲三百九十六十一分之一爲三百六十置之於左又以分母七徧乘諸分子及巳通者仍以分母除其子則一爲二萬七千七百二十半爲一萬三千八百六十三分之一爲九千二百四十四分之一爲六千九百三十五分之一爲五千五百四十四六分之一爲四千六百二十七分之一爲三千九百六十八分之一爲三千四百六十五九分之一爲三千八十十分之一爲二千七百七十二十一分之一爲二千五百二十并之得八萬三千七百一十一以爲法置田二百四十步亦以一爲二萬七千七百二十乘之得六百六十五萬二千八百步爲實實如法得七十九步八萬三千七百一十一分步之三萬九千六百三十一卽從步也合問
