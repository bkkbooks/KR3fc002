body:
  text: 第四行去右行及第二行頭位次以第二行去右行頭位餘約之上得五下得三是菽五當荅三次以左行去第三行菽位又以減第四行及右行菽位不足減乃止次以右行減第二行頭位不足減乃止次以第三行去左行頭位次以左行去右行頭位餘上得六下得五是爲荅六當黍五次以右行去左行荅位餘約之上爲二下爲三次以左行去第二行下位以第二行去第四行下位又以減左行下位次右行去第二行下位餘上得三下得四是爲麥三當菽四次以第二行減第四行下位次以第四行去第二行下位餘上得四下得七是爲麻四當麥七是爲相當之率舉矣據麻四當麥七卽爲麻價率七而麥價率四又麥三當菽四卽爲麥價率四而菽價率三又荅六當黍五卽爲荅價率五而黍價率六而率通矣更置第三行以第四行減之餘有麻一斗菽四斗荅三斗負下實四正求其同爲麻之數以菽率三荅率五各乘菽荅斗數如麻率七而一菽得一斗七分斗之五正荅得二斗七分斗之一負則菽荅化爲麻以并之令同名相從異名相消餘爲定麻七分斗之四以爲法置下實四爲實以分母乘之實得二十八而分子化爲法矣以法除得七卽麻一斗之價置麥率四菽率三荅率五黍率六皆以其斗數乘之各自爲實以麻率七爲法所得卽同爲麻之數亦可使置本行實與物同通之各以本率今有之求其本率所得并以爲法如此則無正負之異矣擇異同而巳又可以一術爲之置五行通率爲麻七麥四菽三荅五黍六以爲列衰減行麻一斗菽四斗正荅三斗負各以其率乘之訖令同名相從異名相消餘爲法又置下實乘列衰所得各爲實此可以實約法則不復乘列衰各以列衰如所約知其價如此則凡用一百二十四算也草曰置麻九斗麥七斗菽三斗荅二斗黍五斗直錢一百四十於右行次置麻七斗麥六斗菽四斗荅五斗黍三斗直錢一百二十八於第二
