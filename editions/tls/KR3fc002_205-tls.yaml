body:
  text: 餘也當以餘物化爲錢矣法爲凡錢而今以化錢減之故曰反以實減法也法少者知經分之所得故曰法少實多者知餘分之所益故曰實多宜以多乘法少乘實故曰各以所得多少數乘法實卽物數也潢按玩其率反其率注文義其率術法賤實貴下當有其求石鈞斤兩以積銖各除法實各得其積數餘各爲銖二十二字反其率術卽物數下當有其求石鈞斤兩以積銖各除法實各得其數餘各爲銖二十一字李注謂之石鈞斤兩積銖除實之當作以下注宜以多乘法少乘實當作宜以多乘實少乘法買絲草曰置所買絲一石二鈞二十八斤三兩五銖通之得七萬九千九百四十九銖爲實以出錢一萬三千九百七十爲法除之得五是貴絲五銖一錢也益一銖於五銖是賤絲六銖一錢也實餘一萬九十九錢爲多者之價以實餘一萬九十九減法一萬三千九百七十餘三千八百七十一錢爲少者之價乃置法餘三千八百七十一錢於上位以少數五乘之得一萬九千三百五十五銖以鈞積銖一萬一千五百二十除之得一鈞餘七千八百三十五銖以斤積
