body:
  text: 各以四約之爲一百五十三分人之六十二卽用徒人數也合問注爲術草曰如前求到程行步一萬七千八百五十爲實以一返一百四十步爲法除之得一百二十七返一百四十分返之七十約爲二分返之一置返數一百二十七二分之一通分內子得二百五十五返以籠積一尺六寸乘之得四百八尺以分母二除之得二百四尺爲一人所到説曰注云以此術與今有術相反覆則乘除之或先後意各有所在而同歸者今有術先乘後除徑求人到積尺此術先除後乘旣得返數乃求人到積尺是意各有所在而同歸也今有冥谷上廣二丈袤七丈下廣八尺袤四丈深六丈五尺問積幾何荅曰五萬二千尺如圖甲丁爲上廣丁丙爲上袤庚癸爲下廣癸壬爲下袤戊至巳爲高
  hash: sha256:4553c328db8ebabe41ada3d1463aeb31047a9fb0e69bad0393a2ecd57c399916
