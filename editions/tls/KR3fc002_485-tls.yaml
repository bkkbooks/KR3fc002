body:
  text: 乙丑與子卯爲中央立方二卽左視圖甲丑與子寅也甲乙酉戌庚未爲前面壍堵二乙丙寅亥巳酉爲右端壍堵一丙寅戊壬亥爲右後陽馬一乙酉巳辛戌爲右前陽馬一云倍下袤爲八上袤從之爲十以高廣乘之得積三十尺是爲得中央立方各三兩端壍堵各四兩旁壍堵各六四角陽馬亦各六者置下袤以下廣乘之又以高乘之得中央立方積各一兩端壍堵積各二兩旁壍堵積各二四角陽馬積各三倍之得中央立方積各二兩端壍堵積各四兩旁壍堵積各四四角陽馬積各六於上位置上袤以下廣乘之又以高乘之得中央立方積各一兩旁壍堵積各二於下位并上下位得中央立方各三兩端壍堵各四兩旁壍堵各六四角陽馬亦各六置於左方云復倍上袤下袤從之爲八以高廣乘之得積八尺是爲得中央立方亦各三兩端壍堵各二者置上袤以上
  hash: sha256:e30be529504a8a7948cbeca5b1aeb86420f341004c20efcd35d5230383541d58
