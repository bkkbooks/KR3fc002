body:
  text: 次置靑絲一斤展爲三百八十四銖又展練絲一斤爲十六兩乘之得六千一百四十四又以絡絲一斤乘之得六千一百四十四斤爲實實如法得一斤餘實一千三百九十二斤以十六乘之得二萬二千二百七十二兩爲實實如法得四兩餘實三千二百六十四兩以二十四乘之得七萬八千三百三十六銖爲實實如法得十六銖四千七百五十二分銖之二千三百四以等數一百四十四約子母爲三十三分銖之十六并之得絡絲一斤四兩十六銖三十三分銖之十六合問説曰注云是謂重今有也者此問有靑絲練絲相與之率練絲絡絲相與之率而無靑絲絡絲相與之率依今有術當先求練絲後求絡絲今不求練絲而徑求絡絲并二次乘除爲一次乘除是謂重今有也云雖各有率不用中間者雖有靑絲練絲絡絲各率不用靑絲求練絲也云故令後實乘前實後法乘前法而并除也者以前練率後絡率相乘又乘靑絲爲實前靑率後練率相乘爲法而并除也云又置絡絲一斤兩
