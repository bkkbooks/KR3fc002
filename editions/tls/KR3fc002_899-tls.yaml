body:
  text: 七十二斗黍四十五斗直錢八百五十五以右行減之左行麻空麥二十斗菽十五斗荅七十斗黍四十斗直錢七百一十五皆正乃令第二行麥五徧乘第三行第三行得麥一百二十斗菽二百七十斗荅二百四十斗黍一百五斗直錢三千一百二十皆正以同減異并第三行第三行麥空菽九十斗荅五百四斗負黍二百九十七斗正直錢一千八負又令第二行麥五徧乘第四行第四行得麥一百五十五斗菽一百五斗荅三百八十五斗黍一百三十斗直錢三千六百四十皆正以第二行減之麥空菽三百六十斗荅五百七十六斗負黍三百七十八斗正直錢一千六百九十二負又令第二行麥五徧乘左行左行得麥一百斗菽七十五斗荅三百五十斗黍二百斗直錢三千五百七十五皆正以第二行減之左行麥空菽二百二十五斗荅二百七十斗負黍三百六十斗直錢一百三十五正乃令第三行菽九十徧乘第四行第四行得菽三萬二千四百斗荅五萬一千八百四十斗負黍三萬四千二十斗正直錢一十五萬
