body:
  text: 如圖子午面卯酉面皆爲外方面亦皆爲內圓徑又皆爲內方斜徑內方合外方之半云又令徑二尺與周六尺二寸八分相約者置徑二尺展爲二百分置周六尺二寸八分展爲六百二十八分求等得四以約周得一百五十七約徑得五十則其相與之率也云周率猶爲微少者亦因棄其餘分故也按劉徽記注止此自晉武庫以下疑是祖冲之語淳風所謂顯之於𡽪術之下者也庣者當是內方斜徑與外圓徑之較漢書律歴志旁有庣焉鄭訓爲過顏訓爲不滿之貎義得相通隋書律歴志云祖冲之以圓率考之此斛當徑一尺四寸三分六𨤲一毫九秒二忽庣旁一分九毫有奇劉歆庣旁少一𨤲四毫有奇歆算術不精之所致也所謂以圓率考之者置斛幂一百六十二寸以方幂率四百五十二乘之得七萬三千二百二十四寸如圓幂率三百五十五而一得二百六寸二十六分四十七𨤲八十八毫七十三秒二十三忽
  hash: sha256:fffad669c7ae39d975670816c6fa891bfa8f0936fddb4273e916f0ee5111762c
