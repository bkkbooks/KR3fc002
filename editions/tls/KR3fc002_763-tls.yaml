body:
  text: 兩十一分兩之五通分內子言之是爲不足四十九又令之黃金九一枚重二斤九枚重十八斤白銀十一亦合重十八斤也乃以十一除之得一枚一斤十一分斤之七爲銀一枚之重數今就金重十八斤之中減一枚金以益銀復減一枚銀以益金則金重十七斤十一分斤之七銀重十八斤十一分斤之四以少減多卽金輕十一分斤之八課於十三兩少一兩十一分兩之四通分內子言之是爲多十五以盈不足術求之實如法得金重分母乘法以除者謂銀兩分母同須通法而後乃除得銀重餘皆約之者術省故也潢按注乃以十一除之得一枚一斤十一分斤之七一枚二字衍草曰假令黃金三斤白銀二斤十一分斤之五不足四十九於右行令之黃金二斤白銀一斤十一分斤之七有餘十五於左行黃金白銀不足右行斤斤黃金白銀有餘左行斤斤右行白銀通分內子得二十七斤左行白銀通分內子得一十八斤黃金白銀不足右行斤斤
