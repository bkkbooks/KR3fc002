body:
  text: 之左行上禾空下禾五十二秉下實四十一斗上禾下禾下實右行左行左行上爲法下爲實實四十一斗卽下禾之實寄法五十二爲分母求上禾以法五十二乘右行下實十一斗得五百七十二斗於下位以下禾實四十一斗乘右行下禾二秉得八十二斗爲下禾列實以減下位餘四百九十斗爲上禾一位之實如上禾七秉而一得七十斗爲上禾一秉之實寄法五十二爲分母乃置上禾實七十斗下禾實四十一斗各如法五十二而一得上禾一秉實一斗五十二分斗之十八下禾一秉實五十二分斗之四十一合問説曰云如方程者兩行列之以右行上禾徧乘左行而以直除左行下禾不盡者上爲法下爲實實卽下禾之實求上禾以法乘右行下實而
