body:
  text: 斛之六術曰以車程行空重相乘爲法并空重以乘道里各自爲實實如法得一日臣淳風等謹按此術重往空還一輸再行道也置空行一里用七十分日之一重行一里用五十分日之一齊而同之空重行一里之路往返用一百七十五分日之六定言之者一百七十五里之路往返用六日也故并空重者齊其子也空重相乘者同其母也於今有術至輸所里爲所有數六爲所求率齊一百七十五爲所有率而今有之卽各得輸所用日也加載輸各一日欲得幾日也而以六人乘之欲知致一車用人也又以傭價乘之欲知致車人傭直幾錢以二十五斛除之欲知致一斛之傭直也加一斛粟價卽致一斛之費加一斛之價於致一斛之傭直卽凡輸一斛餘粟取傭所用錢各以約其算數爲衰今按甲衰四十二乙衰二十四丙衰十六丁衰十五戊衰二十巳衰十六於今有術副并爲所有率未并者各自爲所求率所賦粟爲所有數此今有衰分之義也副并爲法以所賦粟乘未并者各自爲實實如法得一斛各置所當出粟以其一斛之費乘之如算數而一得率算出九錢一百三十三分錢之三又載輸之間各一日者卽二日也潢按甲自輸其縣卽不應有傭價經云傭價一日一錢者衍文也草曰以甲縣一斛粟價二十約甲算四萬二千得二千一百爲甲泛衰以空行七十里重行五十里相乘得三千五百里爲法置乙縣到輸所
