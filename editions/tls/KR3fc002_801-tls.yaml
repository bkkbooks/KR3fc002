body:
  text: 右課率總統羣物故曰方程術云以右行上禾徧乘中行而以直除又乘其次亦以直除者除卽減也以右行頭位徧乘中行左行而減之減不盡者作幾度減之古法不用左右行互乘對減故曰直除也云以中行中禾不盡者徧乘左行而以直除者去左行之中禾也云左方下禾不盡者上爲法下爲實實卽下禾之實者法除實不盡下禾實以法爲分母故不云實如法而一也中禾上禾之實亦以法爲分母故總云實皆如法各得一斗也注云程課程也者兩行相並爲方多少相課爲程以程爲課程者卽方田章課分術以少減多之謂云羣物總雜者所列非一物也云各列有數者二物則列二位三物則列三位是爲列數各以其實乘之則爲列實也云總言其實者其實卽下實方程有以共實爲下實者行中有正無負有以差實爲下實者行中有正有負有共實而𠮓爲差實者行中本無正負徧乘直除而後分正負也云令每行爲率者每行各自爲率無所同也云二物者再程三物者三程皆如物數程之並列爲行者如上
  hash: sha256:f19de48b68cc48f8138fdc8ea6f34525f031bf4955a8d2b4b725f859ff7fa031
