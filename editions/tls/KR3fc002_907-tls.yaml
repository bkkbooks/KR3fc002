body:
  text: 二斗荅八斗黍五斗直錢九十五皆以第三行麻一斗菽四斗正荅三斗負錢四正減之右行麻空麥七斗正菽三十三斗負荅二十九斗黍五斗直錢一百四正左行麻空麥三斗正菽二斗負荅十一斗黍五斗直錢九十一正次以第二行麥六斗正菽二十四斗負荅二十六斗黍三斗直錢一百正減右行麥七斗正菽三十三斗負荅二十九斗黍五斗直錢一百四正右行餘麥一斗正菽九斗負荅三斗黍二斗直錢四正次以右行減左行麥三斗正菽二斗負荅十一斗黍五斗直錢九十一正左行麥空菽二十五斗荅二斗正黍一斗負直錢七十九正又以右行減第二行麥六斗正菽二十四斗負荅二十六斗黍三斗直錢一百正第二行麥空菽三十斗荅八斗正黍九斗負直錢七十六正又以右行減第四行麥五斗正菽五斗負荅十五斗黍四斗直錢一百四正第四行麥空菽四十斗正黍六斗負直錢八十四正半之得菽二十斗正黍三斗負直錢四十二正又以第四行減左行菽二十五斗荅二斗正黍一斗負直錢七十
  hash: sha256:ce774a5c0ab0d0b6ee243efe3588f8d266275724cad09b1921095f6a3e31221e
