body:
  text: 又股自乘以減弦自乘其餘開方除之卽句臣淳風等謹按此術以句股幂合成弦幂句方於內則句短於股令股自乘以減弦自乘餘者卽句幂也故開方除之卽句也又句自乘以減弦自乘其餘開方除之卽股句股幂合以成弦幂令去其一則餘在者皆可得而知之求弦草曰置句三尺自乘得九尺爲句幂又置股四尺自乘得一十六尺爲股幂并句股幂得二十五尺爲弦幂開方除之得五尺卽弦也合問求股草曰置句三尺自乘得九尺爲句幂又置弦五尺自乘得二十五尺爲弦幂以句幂減弦幂餘一十六尺爲股幂開方除之得四尺卽股也合問求句草曰置股四尺自乘得一十六尺爲股幂又置弦五尺自乘得二十五尺爲弦幂以股幂減弦幂餘九尺爲句幂開方除之得三尺卽句也合問説曰據劉𡽪序解體用圖及此注句自乘爲朱方股自乘爲靑方云云知舊本有圖而今亡矣補之如后
