body:
  text: 草曰置上中周二丈外周四丈并之得六丈半之得三丈爲上袤又置下中周一丈四尺外周二丈四尺并之得三丈八尺半之得一丈九尺爲下袤次置上袤三丈倍之得六丈以下袤一丈九尺從之得七丈九尺展爲七十九尺以上廣一丈展爲一十尺乘之得七百九十尺於上位復置下袤一丈九尺倍之得三丈八尺以上袤三丈從之得六丈八尺展爲六十八尺以下廣五尺乘之得三百四十尺於下位并二位得一千一百三十尺以深一丈展爲一十尺乘之得一萬一千三百尺六而一得一千八百八十三尺三寸六分寸之二卽三分寸之一爲少半寸卽曲池積也合問今有盤池上廣六丈袤八丈下廣四丈袤六丈深二丈問積幾何荅曰七萬六百六十六尺太半尺如圖甲丁爲上廣丁丙爲上袤庚癸爲下廣癸壬爲下袤戊至巳爲深
  hash: sha256:0d92880d65a3f50f2bad174406131d2d9efa8a532a93baa46764be1f57cca0ae
