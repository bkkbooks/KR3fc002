body:
  text: 今有粟二斗欲爲糵問得幾何荅曰爲糵七斗術曰以粟求糵七之二而一臣淳風等謹按糵率一百七十有五合以此數乘其本粟術欲從省先以等數二十五約之所求之率得七所有之率得二故七乘二除草曰置粟二斗展爲二十升以糵率七乘之得一百四十升爲實以粟率二爲法除之得七斗卽糵也合問説曰注云先以等數二十五約之者置粟率五十於上位糵率一百七十五於下位以上減下下位餘二十五轉以下餘減上上位亦餘二十五是二十五爲等數也以等數二十五約糵率一百七十五得七爲所求率以等數二十五約粟率五十得二爲所有率故七乘二除今有糲米十五斗五升五分升之二欲爲粟問得幾何荅曰爲粟二十五斗九升術曰以糲米求粟五之三而一臣淳風等謹按上術以粟求米故粟爲所有數三爲所求率五爲所有率今此以米求粟故米爲所有數五爲所求率三爲所有率准都術求之各合其數以下所有反求多同皆准此
