body:
  text: 爲子譬如積一十步開方除之得三步爲面餘一步命爲三分步之一通分內子便還復其積分也若實有分者至令如母而一帶分開方法也注云言百之面十也言萬之面百也者自乘則以面求幂故下注云方十自乘其積有百方百自乘其積有萬開方則以幂求面故云言百之面十言萬之面百也云先得黃甲之面上下相命是自乘而除也者黃甲之幂初商自乘之幂也其面初商也上謂議下謂法上下相命謂以議與法相乘於實內減去初商自乘正方幂也云倍之者豫張兩面朱幂定袤以待復除故曰定法者兩面朱幂初商次商相乘之𠔳幂也𠔳有二故曰兩面倍初商爲兩𠔳之定袤待次商以爲之廣廣無定而袤有定故曰定法也云欲除朱幂者本當副置所得成方倍之爲定法以折議乘而以除者所得成方卽黃甲之面初商也初商爲巳有之數故曰成方折議者次商也倍初商爲兩𠔳之袤以次商爲兩𠔳之廣廣袤相乘而以除於實內減去兩𠔳幂也云欲除朱幂之角黃乙之幂其意如初之所得也者黃
