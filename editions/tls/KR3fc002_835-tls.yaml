body:
  text: 減行也法實皆正除得下禾一秉之實以乘右行下禾秉數得右行下禾列實負以益右行差實正爲右行上禾列實卽前注所云其以列實減下實而行中正負雜者異名益實也注云故互其算令相折除者以少減多餘爲差實以差損多則多數與少數相當以差益少則少數與多數相當兩數相當則無差矣互其算者卽以差損多令多數與少數相當也差實爲上禾之餘實令與上禾同名是爲折除損實益實同一術也折除者謂以少數凖折多數而減之今有上禾六秉損實一斗八升當下禾十秉下禾十五秉損實五升當上禾五秉問上下禾實一秉各幾何荅曰上禾一秉實八升下禾一秉實三升術曰如方程置上禾六秉正下禾十秉負損實一斗八升正次置上禾五秉負下禾十五秉正損實五升正以正負術入之言上禾六秉之實多減損其一斗八升餘是與下禾十秉相當之數故亦互其算而以一斗八升爲差實差實者下禾之餘實
