body:
  text: 乙辛戌丑亥爲右後角陽馬棊乙辛戌與乙辛亥爲二立句股幂乙戌丑與乙亥丑爲二邪倚句股幂戌丑亥辛爲底幂丙壬酉寅戊爲右前角陽馬棊丙壬戊與丙壬酉爲二立句股幂丙寅戊與丙寅酉爲二邪倚句股幂寅酉壬戊爲底幂今有圓亭下周三丈上周二丈高一丈問積幾何答曰五百二十七尺九分尺之七於𡽪術當積五百四尺四百七十一分尺之一百一十六也按密率爲積五百三尺三十三分尺之二十六如圖庚辛爲下周甲乙爲上周戊至巳爲高術曰上下周相乘又各自乘并之以高乘之三十六而一此術周三徑一之義合以三除上下周各爲上下徑以相乘又各自乘并
  hash: sha256:ae7c4bce17b705688ffec3e5031ad3f7f2866ca9dd8844fc0ed7541f1f47232d
