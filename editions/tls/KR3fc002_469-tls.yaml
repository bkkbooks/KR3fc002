body:
  text: 之半故曰實則同也所云夾壍堵者中錐之鼈臑也如圖甲乙壬庚與丁丙癸辛兩鼈臑立而視之以壬乙庚與癸丙辛爲句股底幂甲乙與丁丙爲高皆中錐之鼈臑也凡壍堵上袤短者連陽馬也下袤短者與鼈臑連也下兩袤相等亦與鼈臑連也者因此問三廣不等故云亦也甲乙爲壍堵上袤短於丁巳下袤乙甲庚辛壬癸爲壍堵甲丁丙辛庚爲一陽馬乙癸壬戊巳爲一陽馬是上袤短者連陽馬也癸庚爲壍堵下袤短於甲乙上袤丁丙庚辛壬癸爲壍堵丙甲庚辛爲一鼈臑丁乙癸壬爲一鼈臑是下袤短者與鼈臑連也
