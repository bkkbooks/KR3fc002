body:
  text: 實倍高爲法則得折之高數也草曰置去本三尺爲句自乘得九尺爲句幂又爲股弦差乘股弦并幂以竹高一丈展作一十尺爲股弦并除之得一十分尺之九爲股弦差以減股弦并一十尺餘九尺一十分尺之一爲兩股并半之得四尺二十分尺之十一爲股卽折者之高也合問注求折之高草曰置竹高一十尺爲股弦并自乘得一百尺爲股弦并幂去本三尺爲句自乘得九尺爲句矩幂以減股弦并幂餘九十一尺爲倍股弦并乘股幂以爲實置竹高一十尺倍之得二十尺爲倍股弦并以爲法實如法得四尺二十分尺之十一爲股卽折之高也説曰注云此術與繫索者之類更相反覆者繫索諸術句及股弦差求弦此術句及股弦并求股故云更相反覆也云亦可如上術者如上葭生術也上術於句矩幂內減去股弦差幂餘爲實倍差爲法得股此術於股弦并幂內減去句矩幂餘爲實倍并爲法得股具圖於後如圖股弦并幂內容股幂一
  hash: sha256:84bfbe126dc638511078d76a72e62efe8fa453dc6d919113ac1a4b6b09ab9c0b
