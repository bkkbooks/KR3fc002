body:
  text: 云末廣之兩旁各一小鼈臑皆與壍堵等者其深袤皆與壍堵等也如圖甲丁丙乙庚辛爲壍堵子甲乙庚與丑丁丙辛爲末廣兩旁之小鼈臑乙庚與丙辛爲深甲乙與丁丙爲袤皆與壍堵等令小鼈臑居裏大鼈臑居表則大鼈臑出橢皆方錐者并原所有末廣兩旁之小鼈臑末廣二尺無深袤七尺深三尺無上下廣今改作上廣二尺深三尺無下廣袤七尺無末廣仍令小鼈臑居裏大鼈臑居表則大鼈臑出橢皆方錐矣下廣三尺者卽羡除之深也袤六尺者上下廣差四尺并末廣差二尺爲六尺也高七尺者卽羡除之袤也如圖甲卯寅庚爲大鼈臑居表甲乙卯庚爲小鼈臑居裏乙庚爲下廣乙寅爲袤甲乙爲高是出橢皆方錐也
  hash: sha256:2b445136911ae3938c52a332bbe85664a0d88b507028d0ed4b030b28bd5976b9
