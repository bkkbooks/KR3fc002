body:
  text: 均之不但數物左右之也者卽卷未方程新術之第一術説詳本術今有上禾五秉損實一斗一升當下禾七秉上禾七秉損實二斗五升當下禾五秉問上下禾實一秉各幾何荅曰上禾一秉五升下禾一秉二升術曰如方程置上禾五秉正下禾七秉負損實一斗一升正言上禾五秉之實多減其一斗一升餘是與下禾七秉相當數也故互其算令相折除以一斗一升爲差爲差者上禾之餘實也次置上禾七秉正下禾五秉負損實二斗五升正以正負術入之按正負之術本設列行物程之數不限多少必令與實上下相次而以每行各自爲率然而或減或益同行異位殊爲二品并減之差見於下也草曰置上禾五秉正下禾七秉負損實一斗一升正於右行次置上禾七秉正下禾五秉負損實二斗五升正於左行上禾下禾損實正二負正右行
  hash: sha256:e7025bc0560d974785ed55457a3dc2ba8833cf3c79a236da88012cb304f08ea6
