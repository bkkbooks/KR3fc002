body:
  text: 云分取其半則爲袤三尺以高廣乘之三而一卽半錐之積也邪解半錐得此兩大鼈臑求其積亦當六而一合於常率矣原本作合與誤具圖於后如圖甲庚辛壬癸方錐也分取其半則爲甲丙辛壬丁邪解半錐得甲辛丁壬與甲辛丁丙兩大鼈臑合於常率者合於廣袤相乘以高乘之六而一之率也按陽馬之棊兩邪棊底方當其方也不問旁角而割之相半可知也者因底旣均分其高又等故也如圖甲庚辛壬癸爲陽馬甲辛庚與甲辛壬爲兩邪庚辛壬癸爲底方自旁割之分爲甲庚丙丁癸與甲丙辛壬丁二形自角割之分爲甲庚癸辛與甲壬癸辛二形皆居陽馬之半
  hash: sha256:52d05a1f5607e8fbeb05822f323e7c3ace42f527b682f38c158dd08fc5682c4f
