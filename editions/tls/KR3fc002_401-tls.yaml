body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門𧩿商功以御功程積實今有穿地積一萬尺問爲堅壤各幾何答曰爲堅七千五百尺爲壤一萬二千五百尺術曰穿地四爲壤五壤謂息土爲堅三堅爲築土爲墟四墟謂穿坑此皆其常率以穿地求壤五之求堅三之皆四而一今有術也以壤求穿四之求堅三之皆五而一以堅求穿四之求壤五之皆三而一臣淳風等謹按此術並今有之義也重張穿地積一萬尺爲所有數堅率三壤率五各爲所求率墟率四爲所有率而今有之卽得潢按爲築土之爲當作謂墟率四之墟當作穿此問以穿求堅壤也爲堅草曰置穿地積一萬尺以堅率三乘之得三萬尺爲實以穿率四爲法除之得七千五百尺卽堅也合問
