body:
  text: 二十爲賤絲價又以貴絲七千八百九十七銖乘六十八錢得五十三萬六千九百九十六錢爲實實如法得一千三百九十八錢三百八十四分錢之一百六十四爲貴絲價并貴賤絲價得一萬三千九百七十與出錢數合兩率之者以兩積銖二十四爲法以賤絲六萬四千四百六十五銖乘四錢得二十五萬七千八百六十錢爲實實如法得一萬七百四十四錢二十四分錢之四爲賤絲價又以貴絲一萬五千四百八十四銖乘五錢得七萬七千四百二十錢爲實實如法得三千二百二十五錢二十四分錢之二十爲貴絲價并貴賤絲價得一萬三千九百七十與出錢數合今有出錢一萬三千九百七十買絲一石二鈞二十八斤三兩五銖欲其貴賤銖率之問各幾何荅曰其一鈞二十斤六兩十一銖五銖一錢其一石一鈞七斤一十二兩一十八銖六銖一錢今有出錢六百二十買羽二千一百翭翭羽本也數羽稱其本猶
  hash: sha256:00d578f6cde6720d920532f35440a8982be280248a30c657611a71c149aac6d1
