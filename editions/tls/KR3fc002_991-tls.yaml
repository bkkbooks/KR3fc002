body:
  text: 方也草曰置出北門三十步爲小句以出西門七百五十步爲大股乘之得二萬二千五百步爲小句乘大股幂又爲小股乘大句幂又爲半邑方幂四之得九萬步爲邑方幂開方除之得三百步如里法三百步而一得一里卽邑方也合問説曰注引前術者前術以容方自乘餘句除之得餘股此術以餘句餘股相乘開方除之得容方邑方爲容方之倍故以相乘數四之而後開方除之也今有邑方不知大小各中開門出北門二十步有木出南門十四步折而西行一千七百七十五步見木問邑方幾何荅曰二百五十步如圖出北門步數爲句率北門至西隅爲股率自木至邑南十四步爲句折而西行爲股邑方爲廣自木至邑南十四步爲袤合南北步數爲廣袤差
