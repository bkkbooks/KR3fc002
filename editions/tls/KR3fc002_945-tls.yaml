body:
  text: 術曰以垣高十尺自乘如郤行尺數而一所得以加郤行尺數而半之卽木長數此以垣高一丈爲句所求倚木者爲弦引郤行一尺爲股弦差其爲術之意與繫索問同也草曰置垣高一丈展作一十尺爲句自乘得一百尺爲句幂亦爲股弦差與股弦并相乘幂以郤行一尺爲股弦差除之得一百尺爲股弦并加股弦差一尺得一百一尺爲兩弦并半之得五十尺半收作五丈五寸爲弦卽木長也合問説曰注云爲術之意與繫索問同者皆以句及股弦差求弦也今有圓材埋在壁中不知大小以鐻鐻之深一寸鐻道長一尺問徑幾何荅曰材徑二尺六寸如圖鐻道爲句材徑爲弦鐻深爲股弦差之一半術曰半鐻道自此術以鐻道一尺爲句材徑弦鐻深一寸爲股弦差之一半故鐻長亦半之也臣淳風等謹按下鐻深得一寸爲半股弦差注云爲股弦差者鐻道
  hash: sha256:2f7fd1e0b406683b1b4e68836c265fb47361db22e2f9ba8d48aab4adb1029027
