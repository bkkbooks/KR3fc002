body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉勅注釋鍾祥李潢雲門譔盈不足以御隱雜互見今有共買物人出八盈三人出七不足四問人數物價各幾何荅曰七人物價五十三今有共買雞人出九盈十一人出六不足十六問人數雞價各幾何荅曰九人雞價七十今有共買璡人出半盈四人出少半不足三問人數璡價各幾何荅曰四十二人璡價十七今有共買牛七家共出一百九十不足三百三十九家共出二百七十盈三十問家數牛價各幾何荅曰一百二十六家
  hash: sha256:79ae5cfc0f5bcc67825b9797b573ef30e1620af32f24fb95edd55162633abbcf
