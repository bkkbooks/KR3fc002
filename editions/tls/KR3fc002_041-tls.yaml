body:
  text: 法實如法得二錢一百二十分錢之十五以等數十五約分母子爲八分錢之一合問今有田廣七分步之四從五分步之三問爲田幾何荅曰三十五分步之十二又有田廣九分步之七從十一分步之九問爲田幾何荅曰十一分步之七又有田廣五分步之四從九分步之五問爲田幾何荅曰九分步之四乘分臣淳風等謹按乘分者分母相乘爲法子相乘爲實故曰乘分術曰母相乘爲法子相乘爲實實如法而一凡實不滿法者乃有母子之名若有分以乘其實而長之則亦滿法乃爲全耳又以子有所乘故母當報除報除者實如法而一也今子相乘則母各當報除因令分母相乘而連除也此田有廣從難以廣論設有問者曰馬二十匹直金十二斤今賣馬二十匹三十五人分之人得幾何荅曰三十五分斤之十二其爲之也當如經分術以十二斤金爲實三十五人爲法設更言馬五匹直金三斤今賣四匹七人分之人得幾何荅曰人得三十五分斤之十二其爲之也當齊其金人之數皆合初問入於經分矣然則分子相乘爲實者猶齊其金也母相乘爲法者猶齊其人也同其母爲二十馬無事於同但欲求齊而巳又馬五匹直金三斤完全之率分而言之則爲一匹直金五分斤之三七人賣四馬一人賣七分馬之四分子與人交互相生所從言之異而計數則三術同歸也
