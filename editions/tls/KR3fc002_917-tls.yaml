body:
  text: 左行菽位左行餘麻十七斗正麥四斗負菽四斗正荅二十三斗負次以左行減第二行頭位第二行餘麻八斗麥四斗菽三十六斗負荅三十六斗正各位可再半卽以四除之第二行得麻二斗麥一斗菽九斗負荅九斗正次以第四行去左行及第二行頭位左行麻空麥五十五斗負菽七百三十五斗正荅三百九十七斗負第二行麻空麥五斗正菽九十五斗負荅五十三斗正次以第二行去左行頭位左行麥空菽三百一十斗負荅一百八十六斗正上下求等得六十二以約之上得五下得三是爲菽五當荅三次以左行去第二行菽位第二行餘麥五斗正菽空荅四斗負又以減第四行及右行菽位第四行餘麻一斗負麥三斗負菽三斗正荅二斗正右行餘麥二斗正菽三斗負荅一斗負黍一斗正次以右行減第二行頭位第二行餘麥一斗負菽六斗負荅二斗黍二斗正次以第二行去右行頭位右行麥空菽十五斗負荅三斗正黍五斗正次以左行去右行頭位右行菽空荅六斗負黍五斗正是爲荅六當黍五次以
  hash: sha256:e3def4180fde64c3bf0ffe20a9dbc1a3c8f40b466202b45f5a658d71008933b0
