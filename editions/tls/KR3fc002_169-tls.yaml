body:
  text: 一百四十升爲實以菽率五爲法除之得二斗八升卽䜴也合問説曰先以等數九約之者置䜴率六十三於上位菽率四十五於下位以下減上上餘十八轉以上餘減下下位餘九又以下餘九減上餘十八上位亦餘九是九爲等數也以等數九約䜴率六十三得七爲所求率以等數九約菽率四十五得五爲所有率故七乘五除也今有麥八斗六升七分升之三欲爲小䵂問得幾何荅曰爲小䵂二斗五升一十四分升之一十三術曰以麥求小䵂三之十而一臣淳風等謹按小䵂之率十三半宜以母二通之以乘本麥之數術欲從省先以等數九約之所求之率得三所有之率得十也草曰置麥八斗六升七分升之三通分內子得六十斗五升展爲六百五升以小䵂率三乘之得一千八百一十五升爲實以分母七乘麥率十得七十爲法除之得二斗五升七十分升之六十五子母各以五約之爲一十四分升之一十三卽小䵂也合問
