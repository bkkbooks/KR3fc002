body:
  text: 今有三分之一五分之二問合之得幾何荅曰十五分之十一又有三分之二七分之四九分之五問合之得幾何荅曰得一六十三分之五十又有二分之一三分之二四分之三五分之四問合之得幾何荅曰得二六十分之四十三合分臣淳風等謹按合分者數非一端分無定凖諸分子雜互羣母參差麄細旣殊理難從一故齊其衆分同其羣母令可相并故曰合分術曰母互乘子并以爲實母相乘爲法母互乘子約而言之者其分麄繁而言之者其分細雖則麄細有殊然其實一也衆分錯雜非細不會乘而散之所以通之通之則可并也凡母互乘子謂之齊羣母相乘謂之同同者相與通同共一母也齊者子與母齊勢不可失本數也方以𩔖聚物以羣分數同𩔖者無遠數異𩔖者無近遠而通體者雖異位而相從也近而殊形者雖同列而相違也然則齊同之術要矣錯綜度數動之則諧其猶佩觿解結無往而不理焉乘以散之約以聚之齊同以通之此其算之綱紀乎其一術者可令母除爲率率乘子爲齊實如法而一不滿法者以法命之今欲求其實故齊其子又同其母令如母而一其餘以等數約之卽得所謂同法爲母實餘爲子皆從此例其母同者直相從之草曰置三分五分在右方之一之二在左方以右方分母五乘左方分子一三分之一得五以
