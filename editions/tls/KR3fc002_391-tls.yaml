body:
  text: 卽內外四棊之斷上幂然則餘高自乘卽外三棊之斷上幂矣不問高𤰞勢皆然也如圖合內外四棊仍爲一立方復自中半以子丑面橫斷之截甲辛弧於寅則丑庚餘高爲句丑寅內棊斷上方爲股庚寅本方之數爲弦以丑庚句自乘幂減庚寅弦自乘幂餘卽丑寅股自乘幂此以立幂之句股言之也更以平幂之句股觀之如圖截去立方子丑以上半段存子丑以下半段則并黃朱靑白幂爲本方弦幂黃幂爲內棊斷上幂以減本方幂餘朱靑白幂爲餘高幂亦卽外三棊之斷上幂朱幂正方卽右前外棊斷上幂白幂長方卽左前外棊斷上幂靑幂長方卽右後外棊斷上幂不拘在甲庚本方何處橫斷之以斷上方爲股皆得大小二正方與相等二長方爲本方之幂亦爲內外四棊之斷上幂但近上幂者內棊正方小外棊
