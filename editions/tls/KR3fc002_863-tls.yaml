body:
  text: 下馬一匹力引五石七分石之五術曰如方程各置所借以正負術入之草曰置武馬一匹中馬一匹載四十石於右行次置中馬二匹下馬一匹載四十石於中行次置武馬一匹下馬三匹載四十石於左行令右行直除左行左行武馬空中馬一匹負下馬三匹正載石空又令中行中馬二匹徧乘左行左行得中馬二匹負下馬六匹正以異減同并左行左行中馬空下馬七匹正載四十石正上爲法下爲實實四十石卽下馬力引寄法七爲分母求中馬力引以法七乘中行四十石得二百八十石於下位以下馬力引四十石乘中行下馬一匹仍得四十石以減下位餘二百四十石如中馬二匹而一得一百二十石爲中馬力引寄法七爲分母求武馬力引又以法七乘右行四十石得二百八十石於下位以中馬力引一百二十石乘右行中馬一匹仍得一百二十石以減下位餘一百六十石如武馬一匹而一仍得一百六十石爲武馬力引寄法七爲分母乃置武馬一百六十石中馬一百二十石下馬四十石皆如法七而一得
