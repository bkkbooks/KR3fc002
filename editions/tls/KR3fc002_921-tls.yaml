body:
  text: 菽價率三又菽五當荅三卽爲菽價率三而荅價率五孔刻脫此十七字又荅六當黍五卽爲荅價率五而黍價率六而率通矣者卽新術所云各據二物相當之率對易其數卽各當之率也云更置第三行以第四行減之餘有麻一斗菽四斗正孔刻脫正字荅三斗負下實四正者算詳前草云求其同爲麻之數以菽率三荅率五各乘菽荅斗數如麻率七而一菽得一斗七分斗之五正荅得二斗七分斗之一負則菽荅化爲麻以并之者菽率三乘菽四斗正得十二斗如麻率七而一得麻一斗七分斗之五正荅率五乘荅三斗負得十五斗如麻率七而一得麻二斗七分斗之一負則菽荅皆化爲麻矣云令同名相從異名相消餘爲定麻七分斗之四以爲法置下實四爲實以分母乘之得二十八而分子化爲法矣以法除得七卽麻一斗之價者麻菽同名麻荅異名以麻一斗并菽爲麻一斗七分斗之五得二斗七分斗之五以荅爲麻二斗七分斗之一減之餘麻七分斗之四以分子四爲法分母七乘下實四得二十八爲實實如法得七卽
  hash: sha256:a602dc7edd5b83daf70c83ba4207087a78a1cf257a1bcf1800b6e5a0d01b5fa5
