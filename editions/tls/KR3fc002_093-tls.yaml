body:
  text: 又術曰周徑相乘四而一此周與上觚同耳周徑相乘各當以半而今周徑兩全故兩母相乘爲四以報除之於𡽪術以五十乘周一百五十七而一卽徑也以一百五十七乘徑五十而一卽周也新術徑率猶當微少據周以求徑則失之長據徑以求周則失之短諸據見徑以求幂者皆失之於微少據周以求幂者皆失之於微多臣淳風等謹依密率以七乘周二十二而一卽徑以二十二乘徑七而一卽周依術求之卽得草曰置周三十步於上位徑十步於下位上下相乘得三百步爲實四而一得七十五步合問草曰置周一百八十一步於上位置徑六十步三分步之一通分內子得一百八十一於下位上下相乘得三萬二千七百六十一步爲實以分母三乘四得十二爲法實如法得二千七百三十步十二分步之一如畝法二百四十步而一得十一畝九十步十二分步之一合問説曰依密率以七乘周二十二而一卽徑以二十二乘徑七而一卽周者此約率也唐宋算家皆以徑七周二十二爲密率今按依密率當以一百一十三乘周三百五十五而一卽徑以三百五十五乘徑一百一十三而一卽周又術曰徑自相乘三之四而一按圓徑自乘爲外方三之四而一者是爲圓居外方四分之三也若令六觚之一面乘半徑其幂卽外方四分之一也因而三
