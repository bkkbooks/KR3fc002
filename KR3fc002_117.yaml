body:
  text: 以七乘之得八百五十四步二十二而一得三十八步二十二分步之十八於下位上下相減餘九步二十二分步之十二半之得四步二十二分步之十七即徑也為田草曰置中周九十二步外周一百二十二步并之得二百一十四步半之得一百七步以徑五步乘之得五百三十五步以畝法二百四十步除之得二畝五十五步合問𡽪術為田草曰如前求到一百七步於上位置徑四步一百五十七分步之一百二十二通分內子得七百五十步於下位上下相乘得八萬二百五十步為實以分母一百五十七為法除之得五百一十一步一百五十七分步之二十三又以畝法二百四十步除之得二畝三十一步一百五十七分步之二十三密率為田草曰如前求到一百七步於上位置徑四步二十二分步之十七通分內子得一百五步於下位上下相乘得一萬一千二百三十五步為實以分母二十二為法除之得五百一十步二十二分步之十五又以畝法二百四十
