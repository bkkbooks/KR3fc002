body:
  text: 草曰置下廣四丈上廣二丈并之得六丈半之得三丈展爲三十尺以高五丈展爲五十尺乘之得一千五百尺又以袤一百二十六丈五尺展爲一千二百六十五尺乘之得一百八十九萬七千五百尺卽城積也合問説曰并上下廣而半之者前注所云以盈補虛得中平之廣故以高乘之又以袤乘之得積今有垣下廣三尺上廣二尺高一丈二尺袤二十二丈五尺八寸問積幾何答曰六千七百七十四尺圖與城同草曰置下廣三尺上廣二尺并之得五尺半之得二尺五寸以高一丈二尺展爲一十二尺乘之得三十尺又以袤二十二丈五尺八寸展爲二百二十五尺八寸乘之得六千七百七十四
  hash: sha256:abac9938050c97c5e5a8e74c96476eaf3a2f789307348ce7f4f0bb96325ae155
