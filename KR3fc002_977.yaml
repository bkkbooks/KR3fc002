body:
  text: 荅曰六步術曰八步爲句十五步爲股爲之求弦三位并之爲法以句乘股倍之爲實實如法得徑一步句股相乘爲圖之本體朱靑黃幂各二則倍之爲各四可用畫於小𥿄分裁邪正之會令顚倒相補各以類合成修幂圓徑爲廣并句股弦爲袤故并句股弦以爲法又以圖之大體言之股中靑必令立規於橫廣句股又邪三徑均而復連規從橫量度句股必合而成小方矣又畫中弦以觀其會則句股之中成小句股弦者四句面之小股股面之小句皆小方之面皆圓徑之半其數故可衰以句股弦爲列衰副并爲法以小句乘未并者各自爲實實如法而一得句面之小股可知也以股乘列衰爲實則得股面之小句可知言雖異矣及其所以成法之實則同歸矣則圓徑又可以句乘之差并句弦差減股爲圓徑又弦減句股并餘爲圓徑以句弦差乘股弦差而倍之開方除之亦圓徑也潢按注股中靑必令立規於橫廣句疑有脫誤句股又邪又當作及以小句乘未并者小字衍及其所以成法之實則同歸矣之字亦衍則圓徑以下字句多脫誤當云則又可以股弦差減
  hash: sha256:89cf30c74c0e65dd5d6c74504c72692748ed8b8618e95eeb99ce15adbd911959
