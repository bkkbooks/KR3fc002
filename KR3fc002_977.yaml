body:
  text: 答曰六步術曰八步為句十五步為股為之求弦三位并之為法以句乘股倍之為實實如法得徑一步句股相乘為圖之本體朱靑黃幂各二則倍之為各四可用畫於小𥿄分裁邪正之會令顚倒相補各以類合成修幂圓徑為廣并句股弦為袤故并句股弦以為法又以圖之大體言之股中靑必令立規於橫廣句股又邪三徑均而復連規從橫量度句股必合而成小方矣又畫中弦以觀其會則句股之中成小句股弦者四句面之小股股面之小句皆小方之面皆圓徑之半其數故可衰以句股弦為列衰副并為法以小句乘未并者各自為實實如法而一得句面之小股可知也以股乘列衰為實則得股面之小句可知言雖異矣及其所以成法之實則同歸矣則圓徑又可以句乘之差并句弦差減股為圓徑又弦減句股并餘為圓徑以句弦差乘股弦差而倍之開方除之亦圓徑也潢按注股中靑必令立規於橫廣句疑有脫誤句股又邪又當作及以小句乘未并者小字衍及其所以成法之實則同歸矣之字亦衍則圓徑以下字句多脫誤當云則又可以股弦差減
