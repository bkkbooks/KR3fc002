body:
  text: 乙辛戌丑亥為右後角陽馬棊乙辛戌與乙辛亥為二立句股幂乙戌丑與乙亥丑為二邪倚句股幂戌丑亥辛為底幂丙壬酉寅戊為右前角陽馬棊丙壬戊與丙壬酉為二立句股幂丙寅戊與丙寅酉為二邪倚句股幂寅酉壬戊為底幂今有圓亭下周三丈上周二丈高一丈問積幾何答曰五百二十七尺九分尺之七於𡽪術當積五百四尺四百七十一分尺之一百一十六也按密率為積五百三尺三十三分尺之二十六如圖庚辛為下周甲乙為上周戊至巳為高術曰上下周相乘又各自乘并之以高乘之三十六而一此術周三徑一之義合以三除上下周各為上下徑以相乘又各自乘并
  hash: sha256:f0d4e8b84814a0352b96f27943142ddbbcd0b4e4ae66a41766526dcbd7e5239f
