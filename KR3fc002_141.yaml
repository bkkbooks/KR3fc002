body:
  text: 今有粟二斗三升欲為糲飯問得幾何答曰為糲飯三斗四升半術曰以粟求糲飯三之二而一臣淳風等謹按糲飯之率七十有五粟求糲飯合以此數乘之今以等數二十有五約其二率所求之率得三所有之率得二故以三乘二除草曰置粟二斗三升展為二十三升以糲飯率三乘之得六十九升為實以粟率二為法除之得三斗四升半即糲飯也合問説曰注云以等數二十有五約其二率者置粟率五十於上位糲飯率七十五於下位以上減下下位餘二十五轉以下餘減上位上位亦餘二十五是二十五為等數也以等數二十五約糲飯率七十五得三為所求率以等數二十五約粟率五十得二為所有率故以三乘二除也今有粟三斗六升欲為稗飯問得幾何答曰為稗飯三斗八升二十五分升之二十二術曰以粟求稗飯二十七之二十五而一臣淳風等謹按此術與大䵂多同草曰置粟三斗六升展為三十六升以稗飯率
  hash: sha256:c5898262454f6653aef909c763bcd1d7ac7a4df84643b3bab889ec3a8c52f977
