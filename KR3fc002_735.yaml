body:
  text: 十六卽瓠長也合問今有蒲生一日長三尺莞生一日長一尺蒲生日自半莞生日自倍問幾何日而長等荅曰二日十三分日之六各長四尺八寸十三分寸之六術曰假令二日不足一尺五寸令之三日有餘一尺七寸半按假令二日不足一尺五寸者蒲生二日長四尺五寸莞生二日長三尺是爲未相及一尺五寸故日不足令之三日有餘一尺七寸半者蒲增前七寸半莞增前四尺是爲過一尺七寸半故日有餘以盈不足乘除之又以後一日所長各乘日分子如日分母而一者各得日分子之長也故各增二長卽得其數潢按注故各增二長當作故各增二日定長下問垣厚五尺注故各增二日定穿是其例也草曰置假令二日於右行不足一尺五寸居其下置令之三日於右行有餘一尺七寸半居其下假令不足右行日寸假令有餘左行日寸
