body:
  text: 除之得小弦六分五𨤲四毫三秒八忽餘分棄之卽九十六觚之一面以半徑一尺乘之又以四十八乘之得幂三萬一千四百一十億二千四百萬忽以百億除之得幂三百一十四寸六百二十五分寸之六十四卽一百九十二觚之幂也以九十六觚之幂減之餘六百二十五分寸之一百五謂之差幂倍之爲分寸之二百一十卽九十六觚之外弧田九十六所謂以弦乘矢之凡幂也加此幂於九十六觚之幂得三百一十四寸六百二十五分寸之一百六十九則出於圓之表矣故還就一百九十二觚之全幂三百一十四寸以爲圓幂之定率而棄其餘分以半徑一尺除圓幂倍之得六尺二寸八分卽周數令徑自乘爲方幂四百寸與圓幂相折圓幂得一百五十七爲率方幂得二百爲率方幂二百其中容圓幂一百五十七也圓率猶爲微少按弧田圖令方中容圓圓中容方內方合外方之半然則圓幂一百五十七其中容方幂一百也又令徑二尺與周六尺二寸八分相約周得一百五十七徑得五十則其相與之率也周率猶爲微少也晉武庫中漢時王莽作銅斛其銘曰律嘉量斛內方尺而圓其外庣旁九𨤲五毫幂一百六十二寸深一尺積一千六百二十寸容十斗以此術求之得幂一百六十一寸有奇其數相近矣此術微少而斛差幂六百二十五分寸之一百五以十二觚之幂爲率消息當取此分寸之三十六以增於一百九十二觚之幂以爲圓幂三百一十四寸二十五分寸之四置徑自乘之方幂四百寸令與圓幂通相約圓幂三千九百二十七方幂得五千是爲率方幂五千中容圓幂三千九百二十七圓幂三千九百二十七中容方幂二千五百也以半徑一尺除圓幂三百一十四寸二十五分寸之四倍之得六尺二寸八分二十五分寸之八卽周數也全徑二尺與周數通相約徑得一千二百五十周得三千九百二十七卽其相與之率若此者葢盡其纎微矣舉而用之上法仍約耳當求一千五百三十六觚之一面得三千七十二觚之幂而裁其微分數亦宜然重其驗耳臣淳風等謹按舊術求圓皆以周三徑一爲率若用之
