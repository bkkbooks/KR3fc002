body:
  text: 如圖庚辛為下周甲至乙為高術曰下周自乘以高乘之三十六而一按此術圓錐下周以為方錐下方方錐下方令自乘以高乘之合三而一得大錐方之積大錐方之積合十二圓矣今求一圓復合十二除之故令三乘十二得三十六而連除於𡽪術當下周自乘以高乘之又以二十五乘之九百四十二而一圓錐比於方錐亦二百分之一百五十七令徑自乘者亦當以一百五十七乘之六百而一其説如圓亭也臣淳風等謹按依密率以七乘之二百六十四而一潢按注中兩大錐方皆大方錐之誤草曰置下周三丈五尺展為三十五尺自乘得一千二百二十五尺以高五丈一尺展為五十一尺乘之得六萬二千四百七十五尺三十六而一得一千七百三十五尺三十六分尺之一十五子母各以三約之為一十二分尺之五即圓錐積也合問𡽪術草曰如前求到六萬二千四百七十五尺又以二十五乘之得一百五十六萬一千八百七十五尺九百四十二而一得一千六百五十
