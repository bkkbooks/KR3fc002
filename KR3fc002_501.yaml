body:
  text: 草曰置上袤七丈倍之得十四丈下袤四丈從之得十八丈展為一百八十尺以上廣二丈展為二十尺乘之得三千六百尺於上位又置下袤四丈倍之得八丈上袤七丈從之得十五丈展為一百五十尺以下廣八尺乘之得一千二百尺於下位上下位相并得四千八百尺以深六丈五尺展為六十五尺乘之得三十一萬二千尺六而一得五萬二千尺即冥谷積也合問載土往來二百步載輸之間一里程行五十八里六人共車車載三十四尺七寸問人到積尺及用徒各幾何答曰人到二百一尺五十分尺之十三用徒二百五十八人一萬六十三分人之三千七百四十六術曰以一車積尺乘程行步數為實置今往來步數加載輸之間一里以車六人乘之為法除之所得即一人所到尺按此術今有之義以載輸及往來并得五百步為所有行率車載三十四尺七寸為所求到土率程行五十八里通之為步為所有數而今有之所得則一車所到欲得人到者當以六人除之即得術有分故亦更令乘法而并除者亦用
  hash: sha256:ef426997bf72c38399b4147a3f04795594417f77a3cf38ebb574f78629e8b6d2
