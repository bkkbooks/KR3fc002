body:
  text: 通外圓積成量容十斗四合一籥五分籥之三者置圓積一千五百七十寸以釜容六斗四升乘之得一萬四十八斗為實以釜積一千寸為法除之得十斗四合八勺收五勺為一籥餘三勺不滿籥命為五分籥之三漢書律歷志合籥為合是籥居合之半也云以數相乘之則斛之制方一尺而圓其外庣旁一𨤲七毫幂一百五十六寸四分寸之一深一尺積一千五百六十二寸半容十斗者以斛容十斗乘釜積一千寸得一十萬寸為實以釜容六斗四升為法除之得一千五百六十二寸半為斛積以深一尺展為一十寸除之得一百五十六寸一十分寸之二五即四分寸之一為斛幂置斛幂一百五十六寸四分寸之一通分內子得六百二十五寸以二百乘之得一十二萬五千寸為實以分母四乘一百五十七得六百二十八為法除實得一百九十九寸六百二十八分寸之二十八子母各以四約之得一百五十七分寸之七為徑幂以帶分開方法除之得一十四寸一分八毫為斛圓徑置外方幂二百寸開方除之得一十
