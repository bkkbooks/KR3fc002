body:
  text: 通外圓積成量容十斗四合一龠五分龠之三者置圓積一千五百七十寸以鬴容六斗四升乘之得一萬四十八斗爲實以鬴積一千寸爲法除之得十斗四合八勺收五勺爲一龠餘三勺不滿龠命爲五分龠之三漢書律歴志合龠爲合是龠居合之半也云以數相乘之則斛之制方一尺而圓其外庣旁一𨤲七毫幂一百五十六寸四分寸之一深一尺積一千五百六十二寸半容十斗者以斛容十斗乘鬴積一千寸得一十萬寸爲實以鬴容六斗四升爲法除之得一千五百六十二寸半爲斛積以深一尺展爲一十寸除之得一百五十六寸一十分寸之二五卽四分寸之一爲斛幂置斛幂一百五十六寸四分寸之一通分內子得六百二十五寸以二百乘之得一十二萬五千寸爲實以分母四乘一百五十七得六百二十八爲法除實得一百九十九寸六百二十八分寸之二十八子母各以四約之得一百五十七分寸之七爲徑幂以帶分開方法除之得一十四寸一分八毫爲斛圓徑置外方幂二百寸開方除之得一十
