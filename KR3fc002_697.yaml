body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門撰盈不足以御隱雜互見今有共買物人出八盈三人出七不足四問人數物價各幾何答曰七人物價五十三今有共買雞人出九盈十一人出六不足十六問人數雞價各幾何答曰九人雞價七十今有共買璡人出半盈四人出少半不足三問人數璡價各幾何答曰四十二人璡價十七今有共買牛七家共出一百九十不足三百三十九家共出二百七十盈三十問家數牛價各幾何答曰一百二十六家
  hash: sha256:1053522bc7266dd7a12b017594288582a5b6fa4a3f5b3c80a692a7f259e6347e
