body:
  text: 居所及行道三十五日而一得五十為戊泛衰置四縣泛衰求總等得一十以約之得甲衰四乙衰五丙衰四丁衰三戊衰五副并得二十一以為法乃置輸卒一千二百人以甲衰四乘之得四千八百為甲實以乙衰五乘之得六千為乙實以丙衰四乘之得四千八百為丙實以丁衰三乘之得三千六百為丁實以戊衰五乘之得六千為戊實實如法而一得甲縣二百二十八人二十一分人之一十二以等數三約子母為七分人之四乙縣二百八十五人二十一分人之一十五以等數三約子母為七分人之五丙縣二百二十八人二十一分人之一十二以等數三約子母為七分人之四丁縣一百七十一人二十一分人之九以等數約子母為七分人之三戊縣二百八十五人二十一分人之一十五以等數約子母為七分人之五有分者上下輩之得甲縣二百二十九人乙縣二百八十六人丙縣二百二十八人丁縣一百七十一人戊縣二百八十六人合問説曰注云各置所當出人數以其居所及行道
  hash: sha256:bdb53cbd2761af8429f1fded044b2c7617ce94bd6be31cd01ffe3c3db2697bb4
