body:
  text: 居所及行道三十五日而一得五十爲戊泛衰置四縣泛衰求總等得一十以約之得甲衰四乙衰五丙衰四丁衰三戊衰五副并得二十一以爲法乃置輸卒一千二百人以甲衰四乘之得四千八百爲甲實以乙衰五乘之得六千爲乙實以丙衰四乘之得四千八百爲丙實以丁衰三乘之得三千六百爲丁實以戊衰五乘之得六千爲戊實實如法而一得甲縣二百二十八人二十一分人之一十二以等數三約子母爲七分人之四乙縣二百八十五人二十一分人之一十五以等數三約子母爲七分人之五丙縣二百二十八人二十一分人之一十二以等數三約子母爲七分人之四丁縣一百七十一人二十一分人之九以等數約子母爲七分人之三戊縣二百八十五人二十一分人之一十五以等數約子母爲七分人之五有分者上下軰之得甲縣二百二十九人乙縣二百八十六人丙縣二百二十八人丁縣一百七十一人戊縣二百八十六人合問説曰注云各置所當出人數以其居所及行道
  hash: sha256:2b2735483954863b8a1d59b5d488d47780437e36279925853ef416e0a2544172
