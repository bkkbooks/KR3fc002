body:
  text: 二百一十二乙丙分子皆一十八萬四千六百八十丁分子一十二萬三千一百二十戊分子一十七萬四千九百六十置五縣分子求總等得三千二百四十以約各分子得甲五十一三乙丙皆五十七丁三十八戊五十四以戶率甲二十乙十二丙七丁十三戊五分乘之亦得各衰云合分注曰母除為率率乘子為齊者釋母互乘子為齊之法也云反衰注曰先同其母各以分母約其子為反衰者釋可置一斛之費而反衰之之法也云以施其率為算既約且不妨處下也者處下當作上下言合分反衰二率為算既約又可通於上下即前所云上二率下一率亦可放此從其簡易之意也欽裴新術置五縣賦輸粟一萬斛為實如并衰二千八百七十三而一得率戶出三錢二千八百七十三分錢之一千三百八十一今有均賦粟甲縣四萬二千算粟一斛二十傭價一日一錢自輸其縣乙縣三萬四千二百七十二算粟一斛十八傭價一日十錢到輸所七十里丙縣一萬九千三百二十八算粟一斛十六傭價一日五錢到
