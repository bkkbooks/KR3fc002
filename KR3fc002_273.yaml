body:
  text: 率五置今與人絲四十五斤八兩展爲七百二十八兩以縑率五乘之得三千六百四十兩爲實如絲率七而一得縑五百二十兩以十六除之得三十二斤八兩合問若以所有數爲四十五斤半以縑率五乘之得二百二十七斤半爲實如絲率七而一得三十二斤實餘三斤半以十六乘之得五十六兩爲實如絲率而一得八兩并之得三十二斤八兩亦合問是率數旣通可俱爲兩可俱爲斤無所歸滯也此術乾絲率四百二十兩生絲率四百八十兩約之得乾絲率七生絲率八置今有乾絲一十二斤以生絲率八乘之得九十六斤爲實以乾絲率七爲法實如法得一十三斤實餘五斤以十六乘之得八十兩爲實實如法得一十一兩實餘三兩以二十四乘之得七十二銖爲實實如法得十銖實餘二以法命之爲七分銖之二并之得一十三斤一十一兩十銖七分銖之二爲生絲數是其數相通可俱爲銖可俱爲兩可俱爲斤無所歸滯也云宜以所有乾絲斤數乘生絲兩數爲實者謂所有率是兩所求率亦宜通爲兩故宜
