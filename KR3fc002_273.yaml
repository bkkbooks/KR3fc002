body:
  text: 率五置今與人絲四十五斤八兩展為七百二十八兩以縑率五乘之得三千六百四十兩為實如絲率七而一得縑五百二十兩以十六除之得三十二斤八兩合問若以所有數為四十五斤半以縑率五乘之得二百二十七斤半為實如絲率七而一得三十二斤實餘三斤半以十六乘之得五十六兩為實如絲率而一得八兩并之得三十二斤八兩亦合問是率數既通可俱為兩可俱為斤無所歸滯也此術乾絲率四百二十兩生絲率四百八十兩約之得乾絲率七生絲率八置今有乾絲一十二斤以生絲率八乘之得九十六斤為實以乾絲率七為法實如法得一十三斤實餘五斤以十六乘之得八十兩為實實如法得一十一兩實餘三兩以二十四乘之得七十二銖為實實如法得十銖實餘二以法命之為七分銖之二并之得一十三斤一十一兩十銖七分銖之二為生絲數是其數相通可俱為銖可俱為兩可俱為斤無所歸滯也云宜以所有乾絲斤數乘生絲兩數為實者謂所有率是兩所求率亦宜通為兩故宜
