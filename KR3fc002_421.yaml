body:
  text: 答曰三千八百四十尺如圖甲乙丁丙庚辛癸壬皆為方丙壬乙辛丁癸甲庚皆為高術曰方自乘以高乘之即積尺草曰置方一丈六尺展為一十六尺自乘得二百五十六尺以高一丈五尺展為一十五尺乘之得三千八百四十尺即方堢壔積也合問今有圓堢壔周四丈八尺高一丈一尺問積幾何答曰二千一百一十二尺於𡽪術當積二千一十七尺一百五十七分尺之一百三十一臣淳風等謹按依密率積二千一十六尺如圖甲乙壬癸皆為周甲壬乙癸皆為高術曰周自相乘以高乘之十二而一此章諸術亦以周三徑一為率皆非也於𡽪術當以周自乘以高乘之又以二十五乘之三百一十四而一此之圓幂亦如圓田之幂也求幂亦如圓田而以高乘幂也臣淳風等謹按依密率以七乘之八十八而一
