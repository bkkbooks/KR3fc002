body:
  text: 五百得四十四萬六千五百爲法實如法而一得二日四十四萬六千五百分日之二十九萬四千五百以等數九千五百約子母爲四十七分日之三十一丙縣出車二千五百二十六乘四十七分乘之二十八通分內子得一十一萬八千七百五十以行道十三日乘之得一百五十四萬三千七百五十爲實以分母四十七乘丙戶一萬二千三百五十得五十八萬四百五十爲法實如法而一得二日五十八萬四百五十分日之三十八萬二千八百五十以等數一萬二千三百五十約子母爲四十七分日之三十一丁縣出車一千六百二十二乘四十七分乘之十六通分內子得七萬六千二百五十以行道二十日乘之得一百五十二萬五千爲實以分母四十七乘丁戶一萬二千二百得五十七萬三千四百爲法實如法而一得二日五十七萬三千四百分日之三十七萬八千二百以等數一萬二千二百約子母爲四十七分日之三十一云今按甲分旣少宜從於乙滿法除之有餘從丙丁分又少亦宜就丙除之適𥁞加乙
