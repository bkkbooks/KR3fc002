body:
  text: 萬六千三百七十一步為實餘三步棄之開方除之上議得二百七十六步一百分步之三十五餘實一步有奇棄之置上議半之得一百三十八步一百分步之一十七半其半收為一為一百分步之一十八子母各半之為五十分步之九并之得一百三十八步五十分步之九即圓周也草曰置積三百步以十二乘之得三千六百步為實開方除之得六十步即圓周也合問𡽪術草曰置積三百步以三百一十四乘之得九萬四千二百步如二十五而一得三千七百六十八步為實開方除之得六十一步一百分步之三十八子母各半之為五十分步之十九即圓周也餘實棄之密率草曰置積三百步以八十八乘之得二萬六千四百步七而一得三千七百七十一步四二八五為實餘分棄之開方除之得六十一步一百分步之四十一即圓周也餘實棄之今有積一百八十六萬八百六十七尺此尺謂立方之尺也凡物有高深而言積者曰立方問為立方幾何
