body:
  text: 左行麻一斗麥三斗菽二斗荅八斗黍五斗直錢九十五左行餘麻二十二斗負麥三斗正菽九十斗負荅七十七斗黍五斗下實錢三正次以左行減第三行下位第三行餘麻二十三斗正麥三斗負菽九十四斗正荅八十斗黍五斗負下實錢一正次以第三行去左行下位左行餘麻九十一斗負麥一十二斗正菽三百七十二斗負荅三百一十七斗黍二十斗正下空旣減訖廢去第三行不用次以第四行去左行下位左行餘麻三十九斗正麥十三斗負菽一百七十三斗正荅一百四十八斗負下空次以第四行減右行下位右行麻空麥二斗正菽二十八斗負荅十四斗黍一斗正次以右行去第二行及第四行下位第二行餘麻二十五斗負麥空菽四十斗負荅五十九斗正下空第四行餘麻二十六斗麥三斗負菽三斗荅三十七斗正下空次以第二行減第四行及左行頭位第四行餘麻一斗麥三斗負菽四十三斗正荅二十二斗負左行餘麻十四斗正麥十三斗負菽一百三十三斗正荅八十九斗負次以第四行減
