body:
  text: 十六加前凡行四千二百六十里得四千五百三十四里一百九十一分里之四十六即良馬行也合問求駑馬行草曰以十四乘半里得七里以減初日行九十七里餘九十里為第十五日之行以九十里并初日行九十七里得一百八十七里半之得九十三里半以十五乘之得一千四百二里半即駑馬十五日之凡行也又以十五日乘半里得七里半以減初日行九十七里餘八十九里半以日分子一百三十五乘之得一萬二千八十二里半如日分母一百九十一而一得六十三里不盡四十九里半以六十三里加前凡行一千四百二里得一千四百六十五里不盡四十九里半其奇半里乘法一百九十一得九十五里半為半法以增殘分四十九里半得一百四十五以法命之為一百九十一分里之一百四十五并之得一千四百六十五里一百九十一分里之一百四十五即駑馬行也合問説曰注云以二馬初日所行里乘十五日為十
  hash: sha256:6edc9ad315acc5a3f8291d62b4178f911592747bb9b61b123821571a62dbf14f
