body:
  text: 如是疊令左右行相減審其正負則可得而知先令右行上禾乘中行為齊同之意為齊同者謂中行上禾亦乘右行也從簡易雖不言齊同以齊同之意觀之其義然矣又乘其次亦以直除復去左行首然以中行中禾不盡者遍乘左行而以直除亦令兩行相乘去行之中禾也左方下禾不盡者上為法下為實實即下禾之實上中禾皆去故餘數是下禾實非但一秉欲約衆秉之實當以禾秉數為法列此下禾之秉實乘兩行以直除則下禾之位自決矣各以其餘一位之秉除其下實即斗數矣用算繁而不省所以別為法約也然猶不如自用其舊廣異法也求中禾以法乘中行下實而除下禾之實此謂中下兩禾實下禾一秉實數先見將中秉求中禾其列實以減下實而左方下禾不唯一秉下禾實既以法為母則中行下實不以法為母於率不通故先以法乘其實而同之俱令法為母而除下禾實以下禾先見之實令乘下禾秉數即得下禾一位之列實減於下實則其數是中禾之實也餘如中禾秉數而一即中禾之實餘中禾一位之實也故以一位秉數約之乃得一秉之實也求上禾亦以法乘右行下實而除下禾中禾之實此右行三禾共實合三位之實故以二位秉數約之乃得上禾一秉之實此右行三禾共實合中下禾之實其數並見以中下禾先見之實令乘右行中下禾秉數以減之故亦如前各求列實以減下實也餘如上禾秉數而一即上禾之實實皆如法各得一斗三實同用不滿法者以法命之母實皆當除之潢按術文遍秉左行四字宜作大字居中寫注乃得上禾一秉之實一秉當作一位
