body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門撰方程以御錯糅正負今有上禾三秉中禾二秉下禾一秉實三十九斗上禾二秉中禾三秉下禾一秉實三十四斗上禾一秉中禾二秉下禾三秉實二十六斗問上中下禾實一秉各幾何答曰上禾一秉九斗四分斗之一中禾一秉四斗四分斗之一下禾一秉二斗四分斗之三方程程課程也羣物總雜各列有數總言其實令每行為率二物者再程三物者三程皆如物數程之並列為行故謂之方程行之左右無所同存且為有所據而言耳此都術也以空言難曉故特繫之禾以決之又列中行如右行也術曰置上禾三秉中禾二秉下禾一秉實三十九斗於右方中左禾列如右方以左行上禾遍乘中行而以直除為術之意令少行減多行反覆相減則頭位必先盡上無一位則此行亦闕一物矣然而舉率以相減不害餘數之課也若消去頭位則下去一物之實
