body:
  text: 馬行率也云欲知主人追客所行里者以三百里乘主人均行日分子十三如母二十四而一得一百六十二里半者此以三百里爲所有數十三爲所求率二十四爲所有率而今有之得一百六十二里半爲主人追客所行也云以此乘主人均行日分母二十四如客馬與主人均行用日分子五而一亦得主人馬一日行七百八十里也者此以一百六十二里半爲所有數二十四爲所求率五爲所有率而今有之得七百八十里爲主人馬一日行也今有金箠長五尺斬本一尺重四斤斬末一尺重二斤問次一尺各重幾何荅曰末一尺重二斤次一尺重二斤八兩次一尺重三斤次一尺重三斤八兩次一尺重四斤術曰令末重減本重餘卽差率也又置本重以四間乘之爲下第一衰副置以差率減之每尺各自爲衰按此術五尺有四間者有四差也令本末相減餘卽四差之凡數也以四
