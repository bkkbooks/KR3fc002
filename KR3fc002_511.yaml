body:
  text: 術曰下周自乘以高乘之三十六而一此猶圓錐也於𡽪術亦當下周自乘以高乘之又以二十五乘之九百四十二而一也其依垣者居圓錐之半也十八而一於𡽪術當令此下周自乘以高乘之又以二十五乘之四百七十一而一依垣之周半於全周其自乘之幂居全周自乘之幂四分之一故半全周之法以為法也其依垣內角者角隅也居圓錐四分之一也九而一於𡽪術當令此下周自乘而倍之以高乘之又以二十五乘之四百七十一而一依隅之周半於依垣其自乘之幂居依垣自乘之幂四分之一當半依垣之法以為法法不可半故倍其實又此術亦用周三徑一之率假令以三除周得徑若不盡通分內子即為徑之積分令自乘以高乘之為三方錐之積分母自相乘得九為法又當三而一約方錐之積從方錐中求圓錐之積亦猶方幂求圓幂乃當三乘之四而一得圓幂之積前求方積乃合三而一今求圓錐之積復合三乘之二母既同故相凖折惟以四乘分母九得三十六而連除圓錐之積其圓錐之積與平地聚粟同故三十六而一臣淳風等謹依密率以七乘之其平地者二百六十四而一依垣者一百三十二而一依隅者六十六而一也程粟一斛積二尺七寸二尺七寸者謂方一尺深二尺七寸凡積二千七百寸其米一斛積一尺六寸五分寸之一謂積一千六百二十寸其菽答麻麥一斛皆二尺四寸十分寸之三謂積二千四百三十寸此為以精粗為率而不等其槩也粟率五米率三故米一斛於粟一斛五分斛之三菽答麻麥亦如本率云故謂此三量器為槩而皆不合於今斛當今大司農斛圓徑一尺三寸五分五𨤲正深一尺於𡽪術為積一千四百四十一寸排成餘分又有十分寸之三王莽銅斛於今尺為深九寸五分五𨤲徑一尺三寸六分八𨤲二毫以𡽪術計之
