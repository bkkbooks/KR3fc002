body:
  text: 超一下超二至十而止置上議七十一乘中九百得六萬三千爲𠔳幂再乘下一算得四千九百爲隅幂副之而後并之得六萬七千九百以加定法二十七萬得三十三萬七千九百爲定法以上議七十乘之得二千三百六十五萬三千以減實實餘一百六十六萬六百二十四尺除巳倍下四千九百得九千八百并中六萬三千得七萬二千八百從定法三十三萬七千九百得四十一萬七百爲定法復除折而下以三乘上議七十得二百一十從中行𠔳法九百得一千一百一十爲𠔳法復借一算置下行步之中超一下超二置上議四一乘中一千一百一十得四千四百四十爲𠔳幂再乘下一算得一十六爲隅幂并之得四千四百五十六以從定法四十一萬七百得四十一萬五千一百五十六爲定法以上議四乘之得一百六十六萬六百二十四減實適盡上議得三百七十四尺置分母二十七開立方除之得三以除三百七十四尺得一百二十四尺太半尺卽立方也合問説曰置積爲實借一算步之借一算者下注所
