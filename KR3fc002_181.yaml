body:
  text: 步至千所以定其位也注云此術猶經分者此術法有分而所求之率恒爲一旣以分通之又以分母乘之與經分術所謂有分者通之重有分者同而通之之義合也此經率與前經率異者前可省乘故術曰所出錢數爲實是不以所求率乘也此不可省乘故術曰以所求率乘錢數爲實是較前經率多一乘也今有出錢五百七十六買竹七十八箇欲其大小率之問各幾何荅曰其四十八箇箇七錢其三十箇箇八錢今有出錢一千一百二十買絲一石二鈞十八斤欲其貴賤斤率之問各幾何荅曰其二鈞八斤斤五錢其一石一十斤斤六錢今有出錢一萬三千九百七十買絲一石二鈞二十八斤三兩五銖欲其貴賤石率之問各幾何荅曰
  hash: sha256:cb405268ee52ae85a4bad75912cf2a50088ae4ad33f1da3ebf48c67a5b7d1f77
