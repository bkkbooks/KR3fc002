body:
  text: 分之一爲三十置之於左又以分母二徧乘諸分子及巳通者仍以分母除其子則一爲四百二十半爲二百一十三分之一爲一百四十四分之一爲一百五五分之一爲八十四六分之一爲七十七分之一爲六十并之得一千八十九以爲法置田二百四十步亦以一爲四百二十乘之得一十萬八百步爲實實如法得九十二步一千八十九分步之六百一十二子母各以九約之爲一百二十一分步之六十八卽從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一求田一畝問從幾何荅曰八十八步七百六十一分步之二百三十二術曰下有八分以一爲八百四十半爲四百二十三分之一爲二百八十四分之一爲二百一十五分之一爲一百六十八六分之一爲一百四十七分之一爲一百二十八分之一爲一百五并之得二千二百八十三以爲法置田二百
  hash: sha256:f7750d35c58c1d7766b1521f5631ac5957c2180c177618353bd06b67c5823d12
