body:
  text: 分之一為三十置之於左又以分母二遍乘諸分子及巳通者仍以分母除其子則一為四百二十半為二百一十三分之一為一百四十四分之一為一百五五分之一為八十四六分之一為七十七分之一為六十并之得一千八十九以為法置田二百四十步亦以一為四百二十乘之得一十萬八百步為實實如法得九十二步一千八十九分步之六百一十二子母各以九約之為一百二十一分步之六十八即從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一求田一畝問從幾何答曰八十八步七百六十一分步之二百三十二術曰下有八分以一為八百四十半為四百二十三分之一為二百八十四分之一為二百一十五分之一為一百六十八六分之一為一百四十七分之一為一百二十八分之一為一百五并之得二千二百八十三以為法置田二百
  hash: sha256:98b98fd6617e51355b661568e2910fb87a42dfa0482b46fdfde00ee3233a1240
