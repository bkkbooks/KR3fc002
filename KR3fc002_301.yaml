body:
  text: 一為五置之於左又以分母四遍乘分子及已通者仍以分母除其子則一為一百二十半為六十三分之一為四十四分之一為三十五分之一為二十四六分之一為二十并之得二百九十四以為法置田二百四十步亦以一為一百二十乘之得二萬八千八百步為實實如法得九十七步二百九十四分步之二百八十二子母各以六約之為四十九分步之四十七即從步也合問欽裴按依下李注凡為術之意約省為善宜云下有六分以一為六十半為三十三分之一為二十四分之一為一十五五分之一為一十二六分之一為一十并之得一百四十七以為法置田二百四十步亦以一為六十乘之為實實如法得從步其術亦得知不繁也今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一求田一畝問從幾何答曰九十二步一百二十一分步之六十八術曰下有七分以一為四百二十半為二百一
  hash: sha256:59a840428c6dd2b9b237fe670bc99e82d3f06f902d2056f233342179134e81b0
