body:
  text: 以高乘之三而一為方亭之積假令三約上下周俱不盡還通之即各為上下徑令上下徑分母相乘又各自乘并以高乘之為三方亭之積此合分母三相乘得九分母各自乘亦得九為法除之又三而一得方亭之積從方亭求圓亭之積亦猶方幂中求圓幂乃令圓率三乘之方率四而一得圓亭之積前求方亭之積乃以三而一今求圓亭之積亦各三乘之二母既同故相凖折惟以方幂四乘分母九得三十六而連除之於𡽪術當上下周相乘又各自乘并以高乘之又二十五乘之九百四十二而一此方亭四角圓殺比於方亭二百分之一百五十七為術之意先作方亭三而一則此據上下徑為之者當又以一百五十七乘之六百而一也今據周為之若於圓堢壔又以二十五乘之三百一十四而一則先得三圓亭矣故以三百一十四為九百四十二而一并除之臣淳風等謹按依密率以七乘之二百六十四而一潢按注令上下徑分母相乘分母二字衍又按大典及宋本為三方亭之積下有分字無分母各自乘亦得九八字亦各三乘之各當作令或作合亦通此方亭四角圓殺方亭當作圓亭草曰置下周三丈展為三十尺上周二丈展為二十尺以相乘得六百尺於上位又置下周三十尺自乘得九百尺於中位又置上周二十尺自乘得四百尺於下位三位相并得一千九百尺以高一丈展為一十尺乘之得一萬九千尺三十六而一得五百二十七尺三十六分尺之二十八子母各以四約之為九分尺之七即圓
