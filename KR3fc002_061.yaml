body:
  text: 求圓周之數則周少徑多用之求其六觚之田乃與此率合會耳何則假令六觚之田觚間各一尺爲面自然從角至角其徑二尺可知此則周六徑二與周三徑一巳合恐此猶以難曉今更引物爲喻設令刻物作圭形者六枚枚別三面皆長一尺攢此六物悉使銳頭向裏則成六觚之周角徑亦皆一尺更從觚角外畔圍繞爲規則六觚之徑盡達規矣當面徑短不至外規若以六觚言之則爲周六尺徑二尺面皆一尺面徑股不至外畔定無二尺可知故周三徑一之率於圓周乃是徑多周少徑一周三理非精密葢術從簡要舉大網畧而言之劉𡽪特以爲疎遂乃改張其率但周徑相乘數難契合𡽪雖出斯一法終不能究其纎毫也祖冲之以其不精就中更推其數今者修撰攈摭諸家考其是非冲之爲密故顯之於𡽪術之下冀學者之所裁焉密率求徑草曰置周三十步以徑率七乘之得二百一十步爲實如周率二十二而一得九步二十二分步之一十二子母各半之爲十一分步之六卽田徑也草曰置周三十步半之得十五步於上位置徑十步半之得五步於下位上下相乘得七十五步合問𡽪術草曰置周三十步自乘得九百步以圓幂率二十五乘之得二萬二千五百步爲實如周幂率三百一十四而一得七十一步三百一十四分步之二百六子母各半之爲一百五十七
