body:
  text: 人出盈右行人出不足左行并之得十七為實即璡價也并盈四不足三得七以分母六乘之得四十二為法即人數也合問其一術草曰并盈四不足三得七以分母六乘之得四十二為實以分子二減分子三餘一為法實如法得四十二即人數也副置人數四十二以人出半乘之得二十一減盈四得十七以人出少半乘之得十四增不足三亦得十七即璡價也合問買牛草曰置七家共出一百九十即七分之一百九十九家共出二百七十即九分之二百七十齊而同之得六十三分之一千七百一十於右行不足三百三十居其下得六十三分之一千八百九十於左行盈三十居其下人出不足右行
