body:
  text: 十五二十三十六十為定衰副并得一百三十七為法此返衰之義也今有大夫不更簪裊上造公士凡五人共出百錢欲令高爵出少以次漸多問各幾何答曰大夫出八錢一百三十七分錢之一百四不更出一十錢一百三十七分錢之一百三十簪裊出一十四錢一百三十七分錢之八十二上造出二十一錢一百三十七分錢之一百二十三公士出四十三錢一百三十七分錢之一百九術曰置爵數各自為衰而返衰之副并為法以百錢乘未并者各自為實實如法得一錢草曰置大夫五分之一不更四分之一簪裊三分之一上造二分之一公士一分之一於位母互乘子五分之一得二十四四分之一得三十三分之一得四十二分之一得六十一分之一
