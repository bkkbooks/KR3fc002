body:
  text: 三分升之九減之餘十二分升之七為中間五節半之凡差以為實置四節三節并而半之得三節半以減九節餘五節半為法實如法得六十六分升之七為每節之差也今有鳬起南海七日至北海鴈起北海九日至南海今鳬鴈俱起問何日相逢答曰三日十六分日之十五術曰并日數為法日數相乘為實實如法得一日按此術置鳬七日一至鴈九日一至齊其至同其日定六十三日鳬九至鴈七至令鳬鴈俱起而問相逢者是為共至并齊以除同即得相逢日故并日數為法者并齊之意日數相乘為實者猶以同為實也一日鳬飛七分至之一鴈飛九分至之一齊而同之鳬飛定日行六十三分至之九鴈飛定日行六十三分至之七是為南北海相去六十三分鳬日行九分鴈日行七分也并鳬鴈一日所行以除南北相去而得相逢日也草曰置鳬七日至鴈九日至并之得十六至為法七日九日相乘得六十三日為實實如法得三日十六分日之十五合問説曰注云置鳬七日一至鴈九日一至齊其至同其日定六十三日鳬九至鴈七至者以鳬一至乘九日得鳬九至以鴈一至乘七日得鴈七至母互乘子為齊是齊其子以至為子也以七
