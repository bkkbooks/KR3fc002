body:
  text: 草曰置一人發七畝一人耕三畝一人耰種五畝於位以畝為母人為子母互乘子七分之一為十五三分之一為三十五五分之一為二十一并之得七十一人以為法三母相乘得一百五畝為實實如法得一畝餘實三十四以畝法二百四十步乘之得八千一百六十步為實實如法得一百一十四步七十一分步之六十六并之得一畝一百一十四步七十一分步之六十六合問說曰注云此猶鳬鴈術也者一人日發七畝則一畝用七分人之一一人日耕三畝則一畝用三分人之一一人日種五畝則一畝用五分人之一故可以畝為母人為子云此術亦發耕耰種畝數互乘人者齊其人即齊其子也畝數相乘者同其畝即同其母也今有池五渠注之其一渠開之少半日一滿次一日一滿次二日半一滿次三日一滿次五日一滿今皆決之問幾何日滿池答曰七十四分日之十五術曰各置渠一日滿池之數并以為法按此術其一渠
  hash: sha256:31bf44b0f8c6b8af90a2b76830eeda8cdae3c02ed594d705f53ef2085bbe9915
