body:
  text: 草曰置一人發七畝一人耕三畝一人耰種五畝於位以畝爲母人爲子母互乘子七分之一爲十五三分之一爲三十五五分之一爲二十一并之得七十一人以爲法三母相乘得一百五畝爲實實如法得一畝餘實三十四以畝法二百四十步乘之得八千一百六十步爲實實如法得一百一十四步七十一分步之六十六并之得一畝一百一十四步七十一分步之六十六合問説曰注云此猶鳬鴈術也者一人日發七畝則一畝用七分人之一一人日耕三畝則一畝用三分人之一一人日種五畝則一畝用五分人之一故可以畝爲母人爲子云此術亦發耕耰種畝數互乘人者齊其人卽齊其子也畝數相乘者同其畝卽同其母也今有池五渠注之其一渠開之少半日一滿次一日一滿次二日半一滿次三日一滿次五日一滿今皆決之問幾何日滿池荅曰七十四分日之十五術曰各置渠一日滿池之數并以爲法按此術其一渠
  hash: sha256:7a9e579bc76d5c67932ed487c43b3bfc7af162d7d4bdcbabf027aa523ed76459
