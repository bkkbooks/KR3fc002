body:
  text: 一為犬價又以犬價一百二十一乘右行四犬得錢四百八十四以雞價二十三乘右行三雞得錢六十九以兔價二十九乘右行二兔得錢五十八并之得錢六百一十一以減右行直錢一千四百九十六餘錢八百八十五如五羊而一得一百七十七為羊價合問今有麻九斗麥七斗菽三斗答二斗黍五斗直錢一百四十麻七斗麥六斗菽四斗答五斗黍三斗直錢一百二十八麻三斗麥五斗菽七斗答六斗黍四斗直錢一百一十六麻二斗麥五斗菽三斗答九斗黍四斗直錢一百一十二麻一斗麥三斗菽二斗答八斗黍五斗直錢九十五問一斗直幾何答曰麻一斗七錢麥一斗四錢菽一斗三錢答一斗五錢黍一斗六錢術曰如方程以正負術入之此麻麥與均輸少廣章之重衰積分皆為大事其拙於精理徒按本術者或用算而布氊方好煩而喜誤曾不知其非反欲以多為
