body:
  text: 各以四約之為一百五十三分人之六十二即用徒人數也合問注為術草曰如前求到程行步一萬七千八百五十為實以一返一百四十步為法除之得一百二十七返一百四十分返之七十約為二分返之一置返數一百二十七二分之一通分內子得二百五十五返以籠積一尺六寸乘之得四百八尺以分母二除之得二百四尺為一人所到說曰注云以此術與今有術相反覆則乘除之或先後意各有所在而同歸者今有術先乘後除徑求人到積尺此術先除後乘既得返數乃求人到積尺是意各有所在而同歸也今有冥谷上廣二丈袤七丈下廣八尺袤四丈深六丈五尺問積幾何答曰五萬二千尺如圖甲丁為上廣丁丙為上袤庚癸為下廣癸壬為下袤戊至巳為高
  hash: sha256:0fe0763284d693b1ef08e7e1b8b320f6a76138e0f801804432ecbc2216412224
