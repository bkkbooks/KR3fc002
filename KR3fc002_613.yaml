body:
  text: 次置一百里為所有率三十四錢六百分錢之四百為所求率八十里為所有數而今有之亦得二十七錢十五分錢之十一但先以六百除之後以六百通之是徒費乘除也故用重今有并兩次乘除為一次乘除也今有負籠重一石一十七斤行七十六步五十返今負籠重一石行百步問返幾何答曰五十七返二千六百三分返之一千六百二十九術曰以故所行步數乘故籠重斤數為法此法謂負一斤一返所行之積步也今籠重斤數乘今步又以返數乘之為實實如法得一返按此法負一斤一返所行之積步此實者一斤一日所行之積步故以一返之課除終日之程即是返數也臣淳風等謹按此術所行步多者得返少所行步少者得返多然則所行者今返率也故令所得返乘今返之率為實而以故返之率為法今有術也按此負籠又有輕重於是為術者因令重者得返少輕者得返多故又因其率以乘法實者重今有之義也然此意非也按此籠雖輕而行有限籠過重則人力遺力有遺而術無窮人行有限而籠輕重不等使其有限之力隨彼無窮之𠮓故知此術率乖理也若故所行有空行返數設以問者當曰其所負以為返率則今返之數可得而知也假令空行一日六十里負重一斛行四十里減重一斗進二里半負重三斗以下與空行同今負籠重六斗往還行一百步問返幾何答曰一百五十返術曰重行率加十里以里法通之為實以一
