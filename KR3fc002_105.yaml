body:
  text: 答曰二畝一百五十五步八十一分步之五十六如圖甲乙丙為弧田弦丁乙為矢術曰以弦乘矢矢又自乘并之二而一方中之圓圓裏十二觚之幂合外方之幂四分之三也方中合外方之半則朱實合外方四分之一也弧田半圓之幂也故依半圓之體而為之術以弦乘矢而半之則為黃幂矢自乘而半之為二靑幂靑黃相連為弧體弧體法當應規今弧面不至外畔失之於少矣圓田舊術以周三徑一為率俱得十二觚之幂亦失之於少也與此相似指驗半圓之弧耳若不滿牛圓者益復疏濶宜依句股鋸圓材之術以弧弦為鋸道長以矢為句深而求其徑既知圓徑則弧可割分也割之者半弧田之弦以為股其矢為句為之求弦即小弧之弦也以半小弧之弦為句半圓徑為弧為之求股以減半徑其餘即小弦之矢也割之又割使至極細但舉弦矢相乘之數則必近密率矣然於算數差繁必欲有所尋究也若但度田取其大數舊術為約耳潢按方中合外方之半方中當作中方以矢為句深句當作鋸半圓徑為弧弧當作弦即小弦之矢也弦當作弧草曰置弦三十步於上位矢十五步於下位上下相乘得四百五十步於中位矢又自乘得二
  hash: sha256:9f942af2aa86c2b46ad249f675f58949e36823b40a4146931e1eaf58b2e760ca
