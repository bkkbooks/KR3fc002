body:
  text: 草曰置四分三分在右方之三之一在左方母互乘子四分之三得九三分之一得四以少減多餘五為實母相乘得十二為法實不滿法以法命之為十二分之五合問今有八分之五二十五分之十六問孰多多幾何答曰二十五分之十六多多二百分之三又有九分之八七分之六問孰多多幾何答曰九分之八多多六十三分之二又有二十一分之八五十分之十七問孰多多幾何答曰二十一分之八多多一千五十分之四十三課分臣淳風等謹按分各異名理不齊一校其相多之數故曰課分也術曰母互乘子以少減多餘為實母相乘為法實如法而一即相多也臣淳風等謹按此術母互乘子以少分減多分多與減分義同唯相多之數意共減分有異減分知求其餘數有幾課分知以其餘數相多也草曰置八分二十五分在右方之五之十六在左方母互乘子八分之五得一百二十五二十五分之十六得一百二十八以少減多餘三為實母相乘得二百為法以法命實為二百分之三即相多也合問
