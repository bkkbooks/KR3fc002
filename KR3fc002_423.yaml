body:
  text: 草曰置周四丈八尺展為四十八尺自乘得二千三百四尺以高一丈一尺展為一十一尺乘之得二萬五千三百四十四尺十二而一得二千一百一十二尺即圓堢壔積也合問徽術草曰如前求到二萬五千三百四十四尺又以二十五乘之得六十三萬三千六百尺三百一十四而一得二千一十七尺三百一十四分尺之二百六十二子母各半之為一百五十七分尺之一百三十一即圓堢壔積也密率草曰亦如前求到二萬五千三百四十四尺又以七乘之得一十七萬七千四百八尺八十八而一得二千一十六尺即圓堢壔積也今有方亭下方五丈上方四丈高五丈問積幾何答曰一十萬一千六百六十六尺太半尺如圖丙丁為上方壬癸為下方戊至巳為高術曰上下方相乘又各自乘并之以高乘之三而一此章有塹堵陽馬皆合而成立方蓋設算者乃立棊三品以高深之積假令方亭
  hash: sha256:94def6df568adaea974895631f7b6653b65b2fe1f93895fd906001f04e569a2a
