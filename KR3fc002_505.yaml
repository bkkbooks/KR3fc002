body:
  text: 為行率也者如前求到六十萬三千七百八十尺為實以五百步為法除之得一千二百七尺五百分尺之二百八十為一車所到是有分也以六人除一車所到為一人所到當以五百通分內子為實實裏有分法裏通之故亦以五百乘六人為法此重今有之義也以載輸及往來并得五百步為所有行率車載三十四尺七寸為所求到土率程行五十八里通之為步為所有數而今有之得一車所到尺復以六人為所有人率一車所到為所求到土率一人為所有數而今有之得一人所到尺今雖有率不問中間以後實乘前實一乘不長即以車尺數為一人到土率後法乘前法以六人乘五百步為行率也云又可以五百步為行率令六人約車積尺數為一人到土率者令六人約車積三十四尺七寸得五尺七寸六分寸之五為一人往來一返到土率云以負土術入之入之者亦可求返數也者負土術注云為術又可令往來一返所用之步約程行為返數乘籠積為一人所到今以一返五百步約程行一萬七千四百步得
  hash: sha256:189489c3d7e858888e5278de8878758278cede90266a9a77440519deccc7616b
