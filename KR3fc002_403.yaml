body:
  text: 為壤草曰置穿地積一萬尺以壤率五乘之得五萬尺為實以穿率四為法除之得一萬二千五百尺即壤也合問城垣隄溝塹渠皆同術術曰并上下廣而半之損廣補狹以高若深乘之又以袤乘之即積尺按此術并上下廣而半之者以盈補虛得中平之廣以高若深乘之堅率三壤率五各為所求率墟率四為所有率而今有之得一頭之立幂又以袤乘之者得立實之積故為積尺潢按注堅率三壤率五各為所求率墟率四為所有率而今有之二十二字衍立實當作立幂今有城下廣四丈上廣二丈高五丈袤一百二十六丈五尺問積幾何答曰一百八十九萬七千五百尺如圖辛壬庚癸皆下廣乙丙甲丁皆上廣戊至巳為高甲乙丁丙庚辛癸壬皆為袤
  hash: sha256:4024ed63103661134ff2affc7d810c0f8c9746008984878aa314e9a01533275f
