body:
  text: 今有田廣一步半三分步之一四分步之一五分步之一求田一畝問從幾何答曰一百五步一百三十七分步之一十五術曰下有五分以一為六十半為三十三分之一為二十四分之一為一十五五分之一為一十二并之得一百三十七以為法置田二百四十步亦以一為六十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一於位以最下分母五遍乘諸分子及全步皆為五各以其母除之則一為五半為二分之五三分之一為三分之五四分之一為四分之五五分之一為一置之於左又以分母四遍乘諸分子及巳通者各以其母除其子則一為二十半為一十三分之一為三分之二十四分之一為五五分之一為四置之於左又以分母三乘分子及巳通者仍以分母除其子則一為六十半為三十三分之一為二十四分之一為一十五五分之一為一十二并之得一百三十七以為法置田二百四十步亦以一
