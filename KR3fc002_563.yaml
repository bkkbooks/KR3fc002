body:
  text: 甲乙戊各一也欽裴新術置五縣賦輸卒一千二百人爲實如并衰本數二百一十而一得五日二百一十分日之一百五十以等數三十約子母爲七分日之五今有均賦粟甲縣二萬五百二十戶粟一斛二十錢自輸其縣乙縣一萬二千三百一十二戶粟一斛十錢至輸所二百里丙縣七千一百八十二戶粟一斛十二錢至輸所一百五十里丁縣一萬三千三百三十八戶粟一斛十七錢至輸所二百五十里戊縣五千一百三十戶粟一斛十三錢至輸所一百五十里凡五縣賦輸粟一萬斛一車載二十五斛與僦一里一錢欲以縣戶賦粟令費勞等問縣各粟幾何荅曰甲縣三千五百七十一斛二千八百七十三分斛之五百一十七乙縣二千三百八十斛二千八百七十三分斛之二千二百六十丙縣一千三百八十八斛二千八百七十三分斛之二千二百七十六
