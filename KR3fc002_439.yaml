body:
  text: 七百二十九尺以高二丈九尺展為二十九尺乘之得二萬一千一百四十一尺三而一得七千四十七尺即方錐積也合問說曰陽馬頂鋭出於一隅方錐頂鋭出自中心故合四陽馬為一方錐也如圖四陽馬下方等皆以甲乙為高甲頂鋭各出於一隅如圖合四陽馬成一方錐亦以甲乙為高甲頂鋭出自中心今有圓錐下周三丈五尺高五丈一尺問積幾何答曰一千七百三十五尺一十二分尺之五於𡽪術當積一千六百五十八尺三百一十四分尺之十三依密率為積一千六百五十六尺八十八分尺之四十七
  hash: sha256:18ff229aa4e2864416271b796725a56499e31b53fa4f095f7d0122108defd66b
