body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門譔少廣以御積幂方圓少廣臣淳風等謹按一畝之田廣一步長二百四十步今欲截取其從少以益其廣故曰少廣術曰置全步及分母子以最下分母徧乘諸分子及全步臣淳風等謹按以分母乘全步者通其分也以母乘子者齊其子也各以其母除其子置之於左命通分者又以分母徧乘諸分子及已通者皆通而同之并之爲法臣淳風等謹按諸子悉通故可并之爲法亦不宜用合分術列數尤多若用乘則算數至繁故別制此術從省約置所求步數以全步積分乘之爲實此以田廣爲法以畝積步爲實法有分者當同其母齊其子以同乘法實而并齊於法今以分母乘全步及子子如母而一竝以并全法則法實俱長意亦等也故如法而一得從步數實如法而一得從步説曰置全步及分母子以最下分母徧乘諸分子及全步各以其母除其子置之於左者如第十一問最下分母一十二以分母一十二徧乘諸分子齊其子也以分母一十二乘全步通其
