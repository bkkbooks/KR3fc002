body:
  text: 半陽馬其形有似鱉肘故以名云中破陽馬得兩鱉臑鱉臑之見數即陽馬之半數數同而實據半故云六而一即得草曰置下廣五尺以上袤四尺乘之得二十尺以高七尺乘之得一百四十尺六而一得二十三尺六分尺之二子母各半之得三分尺之一為少半尺即鱉臑積也合問說曰注云中破陽馬得兩鱉臑圖說見前云鱉臑之見數即陽馬之半數者陽馬居立方三分之一鱉臑居立方六分之一也今有羡除下廣六尺上廣一丈深三尺末廣八尺無深袤七尺問積幾何答曰八十四尺如圖辛壬為下廣乙丙為上廣戊至巳為深甲丁為末廣戊至庚為袤術曰并三廣以深乘之又以袤乘之六而一按此術羡除實隧道也其所穿地上平下邪似兩鱉臑夾一塹堵即羡除之形假令用此棊上廣三尺深一尺下廣一尺末廣一尺無深袤一尺下廣皆塹堵之廣上廣者兩鱉臑與一塹堵相連之廣也以深袤乘得積五尺鱉臑居二塹堵居三其於本棊皆以為六故六而一合四陽馬以
