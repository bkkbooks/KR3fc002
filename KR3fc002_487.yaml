body:
  text: 廣乘之又以高乘之得中央立方積各一倍之得中央立方積各二於上位置下袤以上廣乘之又以高乘之得中央立方積各一兩端塹堵積各二於下位并上下位得中央立方亦各三兩端塹堵各二置於右方云并兩方三品棊皆一而為六故六而一即得者以左方中央立方各三兩端塹堵各四兩旁塹者各六四角陽馬各六右方中央立方各三兩端塹堵各二并之得中央立方各六兩端塹堵各六兩旁塹堵名六四角陽馬各六是於本棊皆一而為六故六而一得芻童積也云此池環而不通匝者據下曲池問以周求徑徑失之多如方田章環田注云過周三徑一之率故知環而不通匝也云引而伸之周為袤求袤之意環田也者按環田術并中外周而半之以徑乘之為積步注云此田截齊中外之周周則為長并而半之者亦以盈補虛也今曲池之意猶是也今有芻童下廣二丈袤三丈上廣三丈袤四丈高三丈問積幾何答曰二萬六千五百尺
