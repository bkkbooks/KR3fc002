body:
  text: 廣乘之又以高乘之得中央立方積各一倍之得中央立方積各二於上位置下袤以上廣乘之又以高乘之得中央立方積各一兩端壍堵積各二於下位并上下位得中央立方亦各三兩端壍堵各二置於右方云并兩方三品棊皆一而爲六故六而一卽得者以左方中央立方各三兩端壍堵各四兩旁壍者各六四角陽馬各六右方中央立方各三兩端壍堵各二并之得中央立方各六兩端壍堵各六兩旁壍堵名六四角陽馬各六是於本棊皆一而爲六故六而一得芻童積也云此池環而不通匝者據下曲池問以周求徑徑失之多如方田章環田注云過周三徑一之率故知環而不通匝也云引而伸之周爲袤求袤之意環田也者按環田術并中外周而半之以徑乘之爲積步注云此田截齊中外之周周則爲長并而半之者亦以盈補虛也今曲池之意猶是也今有芻童下廣二丈袤三丈上廣三丈袤四丈高三丈問積幾何答曰二萬六千五百尺
  hash: sha256:fa7e4ab96de9a69fbf4e3aaafa7fb0ca1ff18e5d91b6d4dc3dd269869727a590
