body:
  text: 萬億忽餘九千九百五十七億二千二百四十三萬二百九十七忽開方除之得九寸九分七𨤲八毫五秒八忽十分忽之九卽股也以減半徑十寸餘二𨤲一毫四秒一忽十分忽之一謂之小句自乘得四百五十八萬四千三百九忽餘分二一於上位又以四十八弧之半面爲小股置其幂四十二億七千七百五十六萬九千七百三忽於下位并上下位得四十二億八千二百一十五萬四千一十二忽餘分二一棄之開方除之得六分五𨤲四毫三秒八忽謂之小弦餘實二萬二千一百六十八忽棄之卽九十六弧之一面也置半徑一尺展爲一百萬忽乘之得六百五十四億三千八百萬忽又以四十八乘之得幂三萬一千四百一十億二千四百萬忽以百億除之得幂三百一十四寸一百億分寸之一十億二千四百萬分母子各以一千六百萬約之爲六百二十五分寸之六十四卽一百九十二弧之幂也置一百九十二弧之幂三百一十四寸六百二十五分寸之六十四以九十六弧之幂三百一十三寸六百二十五分
  hash: sha256:c568b8becd5e9d07a0c288f74b99cab9d6aef10806a1b7a1beaf7739453c3fda
