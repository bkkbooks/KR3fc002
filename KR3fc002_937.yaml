body:
  text: 裏者則成方幂其居表者則成矩幂云句幂之矩靑卷白表又云股幂之矩靑卷白表亦疑有誤據上注云句自乘爲朱方股自乘爲靑方又云其居表者則成矩幂則此注當云句幂之矩朱卷居表是其幂以股弦差爲廣股弦并爲袤而股幂方其裏股幂之矩靑卷居表是其幂以句弦差爲廣句弦并爲袤而句幂方其裏云是故差之與并用除之短長互相乘也者變句股方幂爲句股矩幂也置句自乘方幂用股弦差除之得股弦并用股弦并除之得股弦差差并互相乘卽句幂之矩也置股自乘方幂用句弦差除之得句弦并用句弦并除之得句弦差差并互相乘卽股幂之矩也如圖弦幂內減去股幂餘甲乙丙三段爲句幂之矩移丙補丁成一直積以股弦差爲廣股弦并爲袤股幂之矩義與前圖同
