body:
  text: 裏者則成方幂其居表者則成矩幂云句幂之矩靑卷白表又云股幂之矩靑卷白表亦疑有誤據上注云句自乘為朱方股自乘為靑方又云其居表者則成矩幂則此注當云句幂之矩朱卷居表是其幂以股弦差為廣股弦并為袤而股幂方其裏股幂之矩靑卷居表是其幂以句弦差為廣句弦并為袤而句幂方其裏云是故差之與并用除之短長互相乘也者變句股方幂為句股矩幂也置句自乘方幂用股弦差除之得股弦并用股弦并除之得股弦差差并互相乘即句幂之矩也置股自乘方幂用句弦差除之得句弦并用句弦并除之得句弦差差并互相乘即股幂之矩也如圖弦幂內減去股幂餘甲乙丙三段為句幂之矩移丙補丁成一直積以股弦差為廣股弦并為袤股幂之矩義與前圖同
  hash: sha256:466ad86628b4179dbb2c8126b56f044e1b2df226d089fba51dd81468818f5c72
