body:
  text: 稗米粟率五十稗米率二十七約不得𥁞直以二十七之五十而一用其本率不破為零分約之蓋約分原欲其簡破整為零則數反增益不如仍其本率之為得矣云別術然者各術約分悉皆如此不獨粟米為然也今有此都術也凡九數以為篇名可以廣施諸率所謂告往而知來舉一隅而三隅反者也誠能分詭數之紛雜通彼此之否塞因物成率審辨名分平其偏頗齊其參差則終無不歸於此術也術曰以所有數乘所求率為實以所有率為法少者多之始一者數之母故為率者必等之於一據粟率五糲率三是粟五而為一糲米三而為一也欲化粟為米者糲當先本是一一者謂以五約之令五而為一也訖乃以三乘之令一而為三如是則率等於一以五為三矣然先除後乘或有餘分故術反之又究言之知粟五升為糲米三升分言之知粟一斗為糲米五分斗之三以五為母三為子以粟求糲米者以子乘其母報除也然則所求之率常為母也臣淳風等謹按宜云所求之率常為子所有之率常為母今乃云所求之率常為母知脫錯也實如法而一潢按糲當先本是一糲當作粟說曰今有者都術也九數總歸於此術也今謂之三率然率者數相與通所有率與所求率相通故可謂之率今所有之數須乘除後乃相與通不得即謂之率故直名為今有也凡此章所
