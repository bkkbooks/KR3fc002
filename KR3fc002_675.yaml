body:
  text: 七日而一至七分至之二并之得二至七分至之二者置九日以鴈飛九日除之得一至以鳬飛七日除之得一至七分至之二并之得二至七分至之二也云以為法以九日為實實如法而一者置二至七分至之二通分內子得十六至以為法以分母七乘九日得六十三日為實實如法得三日十六分日之十五與并日數為法日數相乘為實所得者同也今有假田初假之歲三畝一錢明年四畝一錢後年五畝一錢凡三歲得一百問田幾何答曰一頃二十七畝四十七分畝之三十一術曰置畝數及錢數令畝數互乘錢數并以為法畝數相乘又以百錢乘之為實實如法得一畝按此術令畝互乘錢者齊其錢畝數相乘者同其畝同於六十則初假之歲得錢二十明年得錢十五後年得錢十二也凡三歲得錢一百為所有數同畝為所求率四十七錢為所有率今有之即得也齊其錢同其畝亦如鳬鴈術於今有術百錢為所有數同畝為所求率并齊為所有率臣淳風等謹按假田六十畝初歲得錢二十明年得錢十五後年得錢十二并之得錢四十七是為得田六十畝三歲所治於今有術百錢為所有數六十畝為所求率四十七為所有率而今有之即合問也
