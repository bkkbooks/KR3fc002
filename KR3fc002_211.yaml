body:
  text: 以一矢簳為所求率乘出錢為實所買率為法今乃反之以所買矢簳為實錢數為法是皆反其率也注云以錢數為法物數為實不滿法者實餘也當以餘物化為錢者如買羽一問出錢六百二十為法買羽二千一百翭為實實如法得三翭其不滿法之二百四十翭化為二百四十錢每錢可買四翭是實餘二百四十錢為多者之錢也以實餘二百四十錢減法六百二十錢餘三百八十錢每錢可買三翭是法餘三百八十錢為少者之錢也此以一錢買多物者為賤一錢買少物者為貴故三翭一錢為貴四翭一錢為賤也云法為凡錢而今以化錢減之故以實減法者謂六百二十錢乃貴賤二物之共價故曰凡錢今以化錢二百四十減之即是以實餘減之故云以實減法也云法少者經分之所得故曰法少實多者餘分之所益故曰實多者三翭為少乃法除實所得故為經分之所得經分即除也四翭為多乃餘實所化二百四十錢每錢所買之數故為餘實之所益餘實即化錢其云益者益一翭於三翭而為四也云乘實
