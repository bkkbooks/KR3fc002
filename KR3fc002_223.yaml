body:
  text: 有率今有鹿數爲所有數而今有之卽得今有牛馬羊食人苖苖主責之粟五斗羊主曰我羊食半馬馬主曰我馬食半牛今欲衰償之問各出幾何荅曰牛主出二斗八升七分升之四馬主出一斗四升七分升之二羊主出七升七分升之一術曰置牛四馬二羊一各自爲列衰副并爲法以五斗乘未并者各自爲實實如法得一斗臣淳風等謹按此術問意羊食半馬馬食半牛是謂四羊當一牛二羊當一馬合術置羊一馬二牛四者通其率以爲列衰草曰置牛四馬二羊一爲列衰副并得七爲法以五斗乘列衰四二一之未并者牛得二十斗馬得一十斗羊得五斗各自爲實實如法得二斗八升七分升之四爲牛主所出粟得一斗四升七分升之二爲馬主所出粟得七升七分升之一爲羊主所出粟合問説曰注云此術問意羊食半馬馬食半牛是謂四羊當一牛二羊當一馬者羊食半馬是二羊
