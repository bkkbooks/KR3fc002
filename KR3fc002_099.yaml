body:
  text: 九方九方凡爲十二觚者十有二者古率徑一周三周自乘爲徑自乘之九倍徑幂居周幂九分之一圓幂居方幂四分之三以乘分術入之圓幂居周幂三十六分之三子母各以三約之爲十二分之一是周幂爲圓幂之十二倍故周自相乘十二而一得圓幂也云其率二十五者圓幂也三百一十四者周自乘之幂也者置周數六尺二寸八分展爲六百二十八分自乘得三十九萬四千三百八十四分爲周幂置半周三百一十四分又置半徑一尺展爲一百分以乘之得三萬一千四百分爲圓幂各以等數一千二百五十六約之得三百一十四爲周幂率得二十五爲圓幂率云依密率以七乘之八十八而一者此亦約率也設圓徑一十四圓周四十四半周半徑相乘得一百五十四爲圓幂周自乘得一千九百三十六爲周幂各以等數二十二約之得七爲圓幂率得八十八爲周幂率今按依密率置周自乘以一百一十三乘之一千四百二十而一卽圓幂也設圓徑二百二十六圓周七百一十半周半徑相乘得四萬一百
