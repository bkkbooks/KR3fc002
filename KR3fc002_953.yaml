body:
  text: 一千一百五十六寸爲半句股差幂倍之得二千三百一十二寸爲句股差幂之半以減弦實一萬寸餘七千六百八十八寸半之得三千八百四十四寸爲半句股并幂開方除之得六十二寸爲半句股并副置上下二位以半句股差三十四寸減上位加下位上得二十八寸收作二尺八寸爲句卽戶廣也下得九十六寸收作九尺六寸爲股卽戶高也合問説曰此問以弦與句股差求句股也注云按圖爲位至卽戶高也者謂於兩弦幂內減去句股差幂餘爲句股并之幂也兩隅相去爲弦自乘倍之爲兩弦幂高多於廣爲句股差自乘以減兩弦幂餘爲句股并幂開方除之得句股并以差減并而半之爲句卽戶廣以差加并而半之爲股卽戶高也具圖於后如圖大方爲句股并幂容朱幂八黃幂一中方爲弦幂容朱幂四黃幂一倍之得朱幂八黃幂減黃幂一餘并幂黃幂者句股差幂也
  hash: sha256:0f6e4bec2c215bc1c1e32d4ab190ef838e54cf12d0ac0289b6c9d0ed6aab1d77
