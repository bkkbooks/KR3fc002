body:
  text: 一千一百五十六寸為半句股差幂倍之得二千三百一十二寸為句股差幂之半以減弦實一萬寸餘七千六百八十八寸半之得三千八百四十四寸為半句股并幂開方除之得六十二寸為半句股并副置上下二位以半句股差三十四寸減上位加下位上得二十八寸收作二尺八寸為句即戶廣也下得九十六寸收作九尺六寸為股即戶高也合問説曰此問以弦與句股差求句股也注云按圖為位至即戶高也者謂於兩弦幂內減去句股差幂餘為句股并之幂也兩隅相去為弦自乘倍之為兩弦幂高多於廣為句股差自乘以減兩弦幂餘為句股并幂開方除之得句股并以差減并而半之為句即戶廣以差加并而半之為股即戶高也具圖於后如圖大方為句股并幂容朱幂八黃幂一中方為弦幂容朱幂四黃幂一倍之得朱幂八黃幂減黃幂一餘并幂黃幂者句股差幂也
  hash: sha256:d86a6835a82497e962bd7b70a3d256464a3cf5aeb31abff89e91cd9e38be3462
