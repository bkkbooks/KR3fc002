body:
  text: 倍股弦差與股長相乘之幂以出水一尺倍之得二尺為倍股弦差除之得一十二尺為股即水深加股弦差出水一尺得一十三尺為弦即葭長也合問注先求葭長草曰如前求到半池方自乘二十五尺以出水一尺自乘加之得二十六尺為倍股弦差與弦長相乘之幂以倍出水二尺為倍股弦差除之得一十三尺為弦即葭長減股弦差出水一尺得一十二尺為股即水深今有立木繫索其末委地三尺引索郤行去本八尺而索盡問索長幾何答曰一丈二尺二十一分尺之一潢按當作一丈二尺六分尺之一如圖立木為股郤行去本為句索長為弦委地為股弦差術曰以去本自乘此以去本八尺為句所求索者弦也引而索盡與開門去閫者句及股弦差求股弦同一術去本自乘者先張矩幂令如委數而一委地者股弦差也以除矩幂即是股弦并也所得加委地數而半之即
