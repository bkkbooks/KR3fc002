body:
  text: 行牛空羊二十一直金二十兩上爲法下爲實實二十兩卽羊直金寄法二十一爲分母求牛直金以法二十一乘右行直金十兩得二百一十兩爲下實以羊直金二十兩乘右行羊二得四十兩以減下實餘一百七十兩如牛五而一得三十四兩爲牛直金寄法二十一爲分母乃置牛直金三十四兩羊直金二十兩皆如法二十一而一得牛一直金一兩二十一分兩之十三羊一直金二十一分兩之二十合問説曰注云假令爲同齊左右行相乘定者此卽後人互乘對減之法其法以左行牛二偏乘右行右行得牛十羊四直金二十兩亦以右行牛五偏乘左行左行得牛十羊二十五直金四十兩以少行減多行左行牛數減盡餘羊二十一直金二十兩與徧乘直除者得數皆同然非術意不可不辨算式同前不贅今有賣牛二羊五以買十三豕有餘錢一千賣牛三豕三以買九羊錢適足賣羊六豕八以買五牛錢不足六百問牛羊豕價各幾何荅曰
