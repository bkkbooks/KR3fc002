body:
  text: 三十四返五百分返之四百以一人往來一返到土率乘之亦即一人所到尺也今有委粟平地下周一十二丈高二丈問積及為粟幾何答曰積八千尺於𡽪術當積七千六百四十三尺一百五十七分尺之四十九臣淳風等謹按依密率為積七千六百三十六尺十一分尺之四為粟二千九百六十二斛二十七分斛之二十六於𡽪術當粟二千八百三十斛一千四百一十三分斛之一千二百一十臣淳風等謹按依密率為粟二千八百二十八斛九十九分斛之二十八如圖丙庚丁辛為下周甲乙為高今有委菽依垣下周三丈高七尺問積及為菽各幾何答曰積三百五十尺依𡽪術當積三百三十四尺四百七十一分尺之一百八十六也臣淳風等謹按依密率為積三百三十四尺十一分尺之一為菽一百四十四斛二百四十三分斛之
  hash: sha256:6cecd650fc41890294c12c385528b63602a57f8e75e591f9ef61904df2d723c8
