body:
  text: 千升二之得二千升於下位并上下位得六千五百升以分母十三除之得五百升收為五斛與原數合於今有術列衰三二各為所求率副并十三為所有率五斛為所有數而今有之即得又以經分言之以十三除五斛得二斗八升十三分升之六為一分之數二之得七斗六升十三分升之十二三之得一斛一斗五升十三分升之五如是則先除而後乘今此術先乘而後除也返衰以爵次言之大夫五不更四欲令高爵得多者當使大夫一人受五分不更一人受四分人數為母分數為子母同則子齊齊即衰也故上衰分宜以五四為列焉今此令高爵出少則當使大夫五人共出一人分不更四人共出一人分故謂之返衰人數不同則分數不齊當令母互乘子母互乘子則動者為不動者衰也亦可先同其母各以分母約其子為返衰副并為法以所分乘未并者各自為實實如法而一術曰列置衰而令相乘動者為不動者衰潢按注宜以五四為列焉宜當作直各以分母約其子為返衰其子字疑有誤詳見説中説曰注云以爵次言之大夫五不更四欲令高爵得多者如上衰分大夫等五人分五鹿大夫一人受五分不更一人受四分簪裊一人受三
