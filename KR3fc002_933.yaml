body:
  text: 七十六寸為股幂開方除之得二尺四寸為股即廣也合問說曰前注云句短其股股短其弦此問版厚短於版廣故以版厚為句版廣為股而圓徑其弦也今有木長二丈圍之三尺葛生其下纒木七周上與木齊問葛長幾何答曰二丈九尺如第一圖葛纒木七周上與木齊第二圖解而觀之每周之間自相間成句股弦合七小句股弦為一大句股弦故以七周乘圍為股木長為句而葛長其弦也術曰以七周乘三圍為股木長為句為之求弦弦者葛之長據圍廣木長求葛之長其形葛卷裏袤以筆管靑線宛轉有似葛之纒木解而觀之則每周之間自有相間成句股弦則其間木長為股圍之為句葛長為弦弦七
  hash: sha256:a77a820e6e52579a11526cb0114176940287d5d941945be3c3e7517a456a7f7c
