body:
  text: 寸三分爲法除實得一百三十七斛一十一萬四千四百五十三分斛之六萬九千九百三十九子母各以九約之爲一萬二千七百一十七分斛之七千七百七十一密率草曰置菽積三百三十四尺十一分尺之一通分內子得三千六百七十五尺爲實次置菽斛法二尺四寸三分亦以十一通之得二十六尺七寸三分爲法除實得一百三十七斛二千六百七十三分斛之一千二百九十九子母各以三約之爲八百九十一分斛之四百三十三委米草曰置下周八尺自乘得六十四尺以高五尺乘之得三百二十尺九而一得三十五尺九分尺之五卽米積也合問𡽪術草曰如前求到六十四尺倍之得一百二十八尺以高五尺乘之得六百四十尺又以二十五乘之得一萬六千尺四百七十一而一得三十三尺四百七十一分尺之四百五十七卽米積也按原本誤三十三尺爲三十二尺今依算攺正
  hash: sha256:22cd085d3c1107a70bc3ad63ae42b0d214731179816d12e889a5b31ac0ed7850
