body:
  text: 五日平行數者置良馬初日行一百九十三里以十五乘之得二千八百九十五里為良馬十五日平行數置駑馬初日行九十七里以十五乘之得一千四百五十五里為駑馬十五日平行數云求初末益疾減遲之數者并一與十四以十四乘而半之為中平之積者并一與十四得十五以十四乘之得二百一十半之得一百五為中平之積云又令益疾減遲里數乘之各為減益之中平里故令減益平行數得十五日定行里者置中平積一百五以日增十三里乘之得一千三百六十五里為益疾之中平里以益良馬平行二千八百九十五里得四千二百六十里為良馬十五日定行里又置中平積一百五以日減半里乘之得五十二里半為減遲之中平里以減駑馬平行一千四百五十五里餘一千四百二里半為駑馬十五日定行里求後一日如草所云云法為全里之分故破半里為半法者滿法一百九十一分為一里則破半里得九十五分半為半法也今有人持錢之蜀賈利十三初返歸一萬四千次返
