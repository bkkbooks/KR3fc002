body:
  text: 一十五為圓幂周自乘得五十萬四千一百為周幂各以等數三百五十五約之得一百一十三為圓幂率得一千四百二十為周幂率以密率徑一百一十三周三百五十五與約率徑七周二十二相課約周强七百九十一分之一與𡽪術徑五十周一百五十七相課𡽪周弱五千六百五十分之九强弱相課弱多三萬九千五百五十分之一十三或謂𡽪率密於約率非確論也今有宛田下周三十步徑十六步問為田幾何答曰一百二十步又有宛田下周九十九步徑五十一步問為田幾何答曰五畝六十二步四分步之一如圖甲乙丙丁為宛田下周甲戊丙為宛田徑術曰以徑乘周四而一此術不驗故推方錐以見其形假令方錐下方六尺高四尺四尺為股下方之半三尺為句正面邪為弦弦五尺也令句弦相乘四因之得六十尺即方錐四面見者之幂若令其中容圓錐圓錐見幂與方錐見幂其率猶方幂之與圓幂
