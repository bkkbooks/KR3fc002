body:
  text: 八十二正以并下實一千八負得錢二千七百九十負爲下實以荅價五乘第三行荅五百四斗負得錢二千五百二十負以減下實二千七百九十負餘錢二百七十負如菽九十斗負而一得三錢爲菽一斗之價又以黍價六乘第二行黍八斗負得錢四十八負以并下實一百七十二錢正得錢二百二十正爲下實以荅價五乘荅三十一斗正得錢一百五十五正以菽價三乘菽十五斗正得錢四十五正并之得錢二百正以減下實二百二十正餘錢二十正如麥五斗正而一得四錢爲麥一斗之價以麥價四乘右行麥七得錢二十八菽價三乘菽三得錢九荅價五乘荅二得錢十黍價六乘黍五得錢三十并之得錢七十七以減下實一百四十餘錢六十三如麻九斗而一得七錢爲麻一斗之價合問潢按注載方程新術二文多脫誤友人戴金溪李尙之各校正一術今備錄之戴校一術細草并附先置第四行以減第三行反減第四行去其頭
  hash: sha256:c36925ad366e40c84b120fbf7263f7cc621cc994dadc0d6b04f571550d018475
