body:
  text: 八十二正以并下實一千八負得錢二千七百九十負為下實以答價五乘第三行答五百四斗負得錢二千五百二十負以減下實二千七百九十負餘錢二百七十負如菽九十斗負而一得三錢為菽一斗之價又以黍價六乘第二行黍八斗負得錢四十八負以并下實一百七十二錢正得錢二百二十正為下實以答價五乘答三十一斗正得錢一百五十五正以菽價三乘菽十五斗正得錢四十五正并之得錢二百正以減下實二百二十正餘錢二十正如麥五斗正而一得四錢為麥一斗之價以麥價四乘右行麥七得錢二十八菽價三乘菽三得錢九答價五乘答二得錢十黍價六乘黍五得錢三十并之得錢七十七以減下實一百四十餘錢六十三如麻九斗而一得七錢為麻一斗之價合問潢按注載方程新術二文多脫誤友人戴金溪李尚之各校正一術今備録之戴校一術細草并附先置第四行以減第三行反減第四行去其頭
  hash: sha256:567dd4b13e3b480ca59d42a1e4166827188ac18697e9f2c0da1ab52d4369739b
