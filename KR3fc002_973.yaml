body:
  text: 之也潢按注而法實有法由生矣有字下衍法字不容圓率不字當作下草曰置句五步股十二步相乘得六十步為實并句股得十七步為法實如法得三步十七分步之九即容方也合問説曰句股相乘為朱靑黃幂各二者句股相乘幂以弦剖之為二句股各作中方為黃幂餘句乘方半之為朱幂餘股乘方半之為靑幂合二句股為朱靑黃幂者各二具圖於后如圖句股相乘為朱靑黃幂各二云令黃幂連於下隅至并句股為法者移句股相乘幂為修幂以容方為廣句股并為袤故句股相乘為實并句股為法而得方也如圖移句股相乘幂為修幂
  hash: sha256:d20ad9bb4e4436a504b688af52d4425ca44516922364a6b88f0bcb89fef8e22d
