body:
  text: 之也潢按注而法實有法由生矣有字下衍法字不容圓率不字當作下草曰置句五步股十二步相乘得六十步爲實并句股得十七步爲法實如法得三步十七分步之九卽容方也合問説曰句股相乘爲朱靑黃幂各二者句股相乘幂以弦剖之爲二句股各作中方爲黃幂餘句乘方半之爲朱幂餘股乘方半之爲靑幂合二句股爲朱靑黃幂者各二具圖於后如圖句股相乘爲朱靑黃幂各二云令黃幂連於下隅至并句股爲法者移句股相乘幂爲修幂以容方爲廣句股并爲袤故句股相乘爲實并句股爲法而得方也如圖移句股相乘幂爲修幂
