body:
  text: 同故并齊以除同即得也者此古算式也式具於後日右行三一二一一滿左行如圖列置一日一日五日三日五日於右行三滿一滿二滿一滿一滿於左行以日互乘滿得二百二十五滿七十五滿三十滿二十五滿一十五滿於左行日數相乘得七十五日於右行式具於後日右行滿左行滿齊而日同故并齊得三百七十為法以同七十五為實實不滿法以法命之又以等數五約之即合所問也今有人持米出三關外關三而取一中關五而取一
