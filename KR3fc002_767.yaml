body:
  text: 除銀實一千二百八十七斤得一斤餘實五百八十三斤以十六乘之得九千三百二十八兩爲實實如法得十三兩餘實一百七十六兩以二十四乘之得四千二百二十四銖爲實實如法得六銖并之得一斤十三兩六銖卽銀重也合問説曰術云約之得分也者分謂兩銖也注云以少減多則金輕十七兩十一分兩之五者以金重二十六斤十一分斤之五與銀重二十七斤十一分斤之六相課金輕一斤十一分斤之一置一斤十一分斤之一通分內子得十二以十六兩乘之得一百九十二兩以十一除之得十七兩十一分兩之五課於十三兩多四兩十一分兩之五云以少減多卽金輕十一分斤之八課於十三兩少一兩十一分兩之四者置金分子八以十六乘之得一百二十八兩以分母十一除之得十一兩十一分兩之七課於十三兩少一兩十一分兩之四云謂銀兩分母同須通法而後乃除者左右行白銀各帶有分母十一故以十一通法六十四爲七百四而後乃除也
