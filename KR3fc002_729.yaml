body:
  text: 草曰置假令故米二斗展為二十升於右行不足二升居其下置令之三斗展為三十升於左行有餘二升居其下故米不足右行故米有餘左行令有餘二升維乘二十升得四十升令不足二升維乘三十升得六十升故米不足右行故米有餘左行开之得一百升為實并有餘二升不足二升得四升為法實如法得二斗五升即故米也合問説曰注云按桶受一斛若使故米二斗須添粟八斗以滿之八斗得糲米四斗八升課於七斗是為不足二升者置粟八斗以米率三乘之得
  hash: sha256:f09f8cf6eda3c5ab5c9c69606995f26787d9c1efd933e37053559ad315aae17e
