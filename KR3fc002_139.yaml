body:
  text: 率十三二分之一通分內子得二十七爲所求率旣以母二乘所求率亦以母二乘粟率五十得一百爲所有率而以除故曰凡本率有分者須卽乘除也今有粟九斗八升欲爲大䵂問得幾何荅曰爲大䵂一十斗五升二十五分升之二十一術曰以粟求大䵂二十七之二十五而一臣淳風等謹按大䵂之率五十有四因其可半故二十七之亦如粟求糳米半其二率草曰置粟九斗八升展爲九十八升以大䵂率二十七乘之得二千六百四十六升爲實以粟率二十五爲法除之得一十斗五升二十五分升之二十一卽大䵂也合問説曰因其可半者亦以等數二約之也置粟率五十於上位大䵂率五十四於下位以上減下下位餘四轉以下餘減上位上位餘二又以上餘二減下餘四下位亦餘二是二爲等數也以等數二約大䵂率五十四得二十七爲所求率以等數二約粟率五十得二十五爲所有率故二十七之二十五而一也
