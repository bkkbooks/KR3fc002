body:
  text: 以半尺數以為一人到土率六人乘五百步為行率也又可以五百步為行率令六人約半積尺數為一人到土率以載土術入之入之者亦可求返數也要取其會通而巳術恐有分故令乘法而并除以所到約積尺即用徒人數者以一人所積尺除其衆積故得用徒人數也以所到約積尺即用徒人數潢按注半尺數半積尺數兩半字皆車字之誤以載土術入之載當作負草曰置程行五十八里以里法三百步通之得一萬七千四百步以車載三十四尺七寸乘之得六十萬三千七百八十尺為實次置往來二百步以載輸之間一里通為三百步加之共得五百步以車六人乘之得三千步為法除實得二百一尺三千分尺之七百八十子母各以六十約之為五十分尺之十三即人到積尺次置人到積尺以五十通分內子得一萬六十三尺為法置冥谷積五萬二千尺亦以五十通之得二百六十萬為實實如法而一得二百五十八人一萬六十三分人之三千七百四十六即用徒人數也合問説曰注云術有分故亦更令乘法而并除者亦用以車尺數以為一人到土率六人乘五百步
