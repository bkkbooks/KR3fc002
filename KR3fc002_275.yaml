body:
  text: 以今有乾絲一十二斤乘生絲四百八十兩得五千七百六十斤為實云今斤兩錯互者今以兩數為所有率斤數為所求率也云而亦同歸者謂不以今有乾絲斤數乘生絲兩數而展乾絲十二斤為一百九十二兩乘生絲三十斤亦同得五千七百六十斤為實蓋以乾絲十二斤與生絲三十斤相約得二與五為率以乾絲一百九十二兩與生絲四百八十兩相約亦得二與五為率也云譬之異類亦各有一定之勢者乾絲以兩為率故今有乾絲斤數亦展為兩生絲以斤為率故所求生絲之數首位亦命為斤有一定之勢也絲與絲同類也譬之異類有相與之率者其精粗亦各有一定之勢故不妨使乾絲以兩數為率生絲以斤數為率也今有田一畝收粟六升太半升今有田一頃二十六畝一百五十九步問收粟幾何答曰八斛四斗四升一十二分升之五術曰以畝二百四十步為法以六升太半升乘今有田積步為實實如法得粟數按此術亦今有之義以一畝步數為所有率六升大半升為所求率今有田積步為所有數而今有之即得
  hash: sha256:f65f42d13c2fbfd0d64b0129db0ed2ae101818717f3d7a64ec5dfb90c83cab23
