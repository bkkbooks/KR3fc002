  text: 又以右行上禾三秉徧乘左行左行得上禾三秉中禾六秉下禾九秉下實七十八斗以右行減之左行上禾空中禾四秉下禾八秉實三十九斗上禾中禾下禾實秉秉秉斗右行秉秉秉斗左行秉秉斗左行然以中行中禾五秉徧乘左行左行得中禾二十秉下禾四十秉下實一百九十五斗以中行減之左行中禾空下禾三十六秉下實九十九斗上禾中禾下禾實秉秉斗中行秉秉斗左行秉斗左行
