body:
  text: 麻一斗之價也云置麥率四菽率三答率五黍率六皆以其斗數乘之各自為實以麻率七為法所得即同為麻之數者如第三行麥五斗乘麥率四得二十斗菽七斗乘菽率三得二十一斗答六斗乘答率五得三十斗黍四斗乘黍率六得二十四斗各自為實以麻率七為法實如法麥得麻二斗七分斗之六菽得麻三斗答得麻四斗七分斗之二黍得麻三斗七分斗之三則麥菽答黍皆化為麻并之得十三斗七分斗之四即同為麻之數也又并麻三斗得十六斗七分斗之四以為法置下實一百一十六為實實如法得七即麻一斗之價也云亦可使置本行實與物同通之各以本率今有之求其本率所得并以為法如此則無正負之異矣擇異同而巳云置本行者置原列之行非減餘之行也置本行實與物同通之者各以其率乘其斗數為各實而以本率為法除之同而通之也本率者所求物之率也各以本率今有之者以所求物之率除各實也求其本率所得并以為法者以本率除各實則各物皆化為所求物故可并
