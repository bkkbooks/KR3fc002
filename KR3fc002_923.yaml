body:
  text: 麻一斗之價也云置麥率四菽率三荅率五黍率六皆以其斗數乘之各自爲實以麻率七爲法所得卽同爲麻之數者如第三行麥五斗乘麥率四得二十斗菽七斗乘菽率三得二十一斗荅六斗乘荅率五得三十斗黍四斗乘黍率六得二十四斗各自爲實以麻率七爲法實如法麥得麻二斗七分斗之六菽得麻三斗荅得麻四斗七分斗之二黍得麻三斗七分斗之三則麥菽荅黍皆化爲麻并之得十三斗七分斗之四卽同爲麻之數也又并麻三斗得十六斗七分斗之四以爲法置下實一百一十六爲實實如法得七卽麻一斗之價也云亦可使置本行實與物同通之各以本率今有之求其本率所得并以爲法如此則無正負之異矣擇異同而巳云置本行者置原列之行非減餘之行也置本行實與物同通之者各以其率乘其斗數爲各實而以本率爲法除之同而通之也本率者所求物之率也各以本率今有之者以所求物之率除各實也求其本率所得并以爲法者以本率除各實則各物皆化爲所求物故可并
