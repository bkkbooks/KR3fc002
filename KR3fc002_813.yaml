body:
  text: 今有上禾七秉損實一斗益之下禾二秉而實十斗下禾八秉益實一斗與上禾二秉而實十斗問上下禾實一秉各幾何答曰上禾一秉實一斗五十二分斗之十八下禾一秉實五十二分斗之四十一術曰如方程損之曰益益之日損問者之辭雖以損益為説今按實云上禾七秉下禾二秉實十一斗上禾二秉下禾八秉實九斗也損之曰益言損一斗餘當十斗今欲全其實當加所損也益之日損言益實一斗乃滿十斗今欲加本實當減所加即得也損實一斗者其實過十斗也益實一斗者其實不滿十斗也重論損益數者各以損益之數損益之也潢按注今欲加本實加當作知草曰置上禾七秉下禾二秉下實十一斗於右行次置上禾二秉下禾八秉下實九斗於左行上禾下禾下實秉秉斗右行秉秉斗左行以右行上禾七秉遍乘左行左行得上禾一十四秉下禾五十六秉下實六十三斗以右行減
  hash: sha256:943dd13019ec9787f3bc03a1d18a08f35acb9839fac0e7df97521aa4c9b8d500
