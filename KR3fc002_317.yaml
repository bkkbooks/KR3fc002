body:
  text: 乘諸分子及巳通者各以其母除其子則一爲三百六十半爲一百八十三分之一爲一百二十四分之一爲九十五分之一爲七十二六分之一爲六十七分之一爲七分之三百六十八分之一爲四十五九分之一爲四十十分之一爲三十六置之於左又以分母七徧乘諸分子及巳通者仍以分母除其子則一爲二千五百二十半爲一千二百六十三分之一爲八百四十四分之一爲六百三十五分之一爲五百四六分之一爲四百二十七分之一爲三百六八分之一爲三百一十五九分之一爲二百八十十分之一爲二百五十二并之得七千三百八十一以爲法置田二百四十步亦以一爲二千五百二十乘之得六十萬四千八百步爲實實如法得八十一步七千三百八十一分步之六千九百三十九卽從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一十一分步之一求田一畝問從幾何
  hash: sha256:f6b49675a963327047675b7fb6ce76bae3e0131d792f58f40773d3b7de969a73
