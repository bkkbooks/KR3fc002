body:
  text: 乘諸分子及巳通者各以其母除其子則一為三百六十半為一百八十三分之一為一百二十四分之一為九十五分之一為七十二六分之一為六十七分之一為七分之三百六十八分之一為四十五九分之一為四十十分之一為三十六置之於左又以分母七遍乘諸分子及巳通者仍以分母除其子則一為二千五百二十半為一千二百六十三分之一為八百四十四分之一為六百三十五分之一為五百四六分之一為四百二十七分之一為三百六八分之一為三百一十五九分之一為二百八十十分之一為二百五十二并之得七千三百八十一以為法置田二百四十步亦以一為二千五百二十乘之得六十萬四千八百步為實實如法得八十一步七千三百八十一分步之六千九百三十九即從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一十一分步之一求田一畝問從幾何
  hash: sha256:93728bc043c1778a0c57b1859a619aeb1204e21846687bbf2ed69fa5e966b1a7
