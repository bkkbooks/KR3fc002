body:
  text: 率八分之一母互乘子十分之一得七十二九分之一得八十八分之一得九十半之得糲衰三十六稗衰四十糳衰四十五副并得一百二十一為法乃置粟七斗以三十六乘之得二百五十二為糲米取粟實以四十乘之得二百八十為稗米取粟實以四十五乘之得三百一十五為糳米取粟實實如法得糲米取粟二斗一百二十一分斗之一十稗米取粟二斗一百二十一分斗之三十八糳米取粟二斗一百二十一分斗之七十三合問為米草曰置糲米取粟二斗一百二十一分斗之一十通分內子得二百五十二以糲本率三十乘之得七千五百六十為糲實置稗米取粟二斗一百二十一分斗之三十八通分內子得二百八十以稗本率二十七乘之得七千五百六十為稗實置糳米取粟二斗一百二十一分斗之七十三通分內子得三百一十五以糳本率二十四乘之得七千五百六十為糳實以分母一百二十一乘粟率五十得六千五十為法實如法得一斗六千五十分斗之一千五百一
  hash: sha256:ebf8c010ba83ebd09158c7cd2fc793154b45ae48d3a4eb6f7fc16eb26d177840
