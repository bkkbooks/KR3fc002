body:
  text: 率八分之一母互乘子十分之一得七十二九分之一得八十八分之一得九十半之得糲衰三十六粺衰四十糳衰四十五副并得一百二十一爲法乃置粟七斗以三十六乘之得二百五十二爲糲米取粟實以四十乘之得二百八十爲粺米取粟實以四十五乘之得三百一十五爲糳米取粟實實如法得糲米取粟二斗一百二十一分斗之一十粺米取粟二斗一百二十一分斗之三十八糳米取粟二斗一百二十一分斗之七十三合問爲米草曰置糲米取粟二斗一百二十一分斗之一十通分內子得二百五十二以糲本率三十乘之得七千五百六十爲糲實置粺米取粟二斗一百二十一分斗之三十八通分內子得二百八十以粺本率二十七乘之得七千五百六十爲粺實置糳米取粟二斗一百二十一分斗之七十三通分內子得三百一十五以糳本率二十四乘之得七千五百六十爲糳實以分母一百二十一乘粟率五十得六千五十爲法實如法得一斗六千五十分斗之一千五百一
  hash: sha256:f847a0a520a16e42e10fc0cd2f7267cb6852177c1f0d704ae7b09c4baea64eaa
