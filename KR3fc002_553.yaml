body:
  text: 丙各一上下軰益以少從多也者分分子也法分母也以甲分二十二從乙分二十八得五十滿法四十七除之餘三以從丙分二十八得三十一又以丁分十六從之得四十七以法除之適𥁞故加乙丙各一是上下軰益以少從多也欽裴新術置車一萬乘爲實如并衰本數三千七百六十而一得二日三千七百六十分日之二千四百八十以等數八十約子母爲四十七分日之三十一於算較省今有均輸卒甲縣一千二百人薄塞乙縣一千五百五十人行道一日丙縣一千二百八十人行道二日丁縣九百九十人行道三日戊縣一千七百五十人行道五日凡五縣賦輸卒一月一千二百人欲以遠近戶率多少衰出之問縣各幾何荅曰甲縣二百二十九人乙縣二百八十六人丙縣二百二十八人丁縣一百七十一人戊縣二百八十六人
