body:
  text: 減實異名益實之下故作人此注承終於下實虛缺而言故作實云方爲𩔖也實在此方爲正移入彼方爲負實在此方爲負移入彼方爲正是各爲𩔖也云方將以別實加適足之數與實物作實者別實別行之下實也實物今實有之物也中行本無下實以別行下實加適足之位作中行實物之下實也今有五雀六燕集稱之衡雀俱重燕俱輕一雀一燕交而處衡適平并燕雀重一斤問燕雀一枚各重幾何荅曰雀重一兩十九分兩之十三燕重一兩十九分兩之五術曰如方程交易質之各重八兩此四雀一燕與一雀五燕衡適平并重一斤故各八兩列兩行程數左行頭位其數是一可省乘令右行徧乘左行而取其法實於左左行數多以右行取其數左頭位減盡中法下實卽每枚當重宜可知也按此四雀一燕與一雀五燕其重等是三雀四燕重相當雀率重四燕率重三也諸再程之率皆可異術求之卽其數也草曰置雀四燕一重八兩於右行次置雀一燕五重八兩於左行令右行雀四徧乘左行左行
