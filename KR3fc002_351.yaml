body:
  text: 一所得開方除之即周也開方除之即徑是為據見幂以求周猶失之於微少其以二百乘積一百五十七而一開方除之即徑猶失之於微多臣淳風等謹按此注於𡽪術求周之法其中不用開方除之即徑六字今本有者衍賸也依密率八十八乘之七而一按周三徑一之率假令周六徑二半周半徑相乘得幂三周六自乘得三十六俱以等數除幂得一周之數十二也其積本周自乘合以一乘之十二而一得積三也術為一乘不長故以十二而一得此積今還原置此積三以十二乘之復其本周自乘之數凡物自乘開方除之復其本數故開方除之即周草曰置積一千五百一十八步四分步之三通分內子得六千七十五步以十二乘之得七萬二千九百步為實開方除之得二百七十步置分母四開之得二以除二百七十步得一百三十五步即圓周也合問𡽪術草曰如前草求到六千七十五步以三百一十四乘之得一百九十萬七千五百五十步如二十五而一得七萬六千三百二步為實開方除之得二百七十六步一十分步之二半之得一百三十八步一十分步之一即圓周也餘實一十五步奇棄之密率草曰如前草求到六千七十五步以八十八乘之得五十三萬四千六百步七而一得七
