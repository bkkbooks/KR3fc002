body:
  text: 一步得一百二十六步合問草曰置廣五步以分母二乘之得十分子一從之得十一於上位置從八步以分母三乘之得二十四分子二從之得二十六半之得十三於下位上下相乘得一百四十三為實分母二分母三相乘得六為法實如法得二十三步六分步之五合問說曰次問廣不可半故半從以乘廣得積步又以廣從俱有分當各自通其分令分母相乘為法而連除之如前大廣田術也今有邪田一頭廣三十步一頭廣四十二步正從六十四步問為田幾何答曰九畝一百四十四步如圖子丑為一頭廣寅卯為一頭廣丑寅為正從移甲段補乙段注所謂以盈補虛也又有邪田正廣六十五步一畔從一百步一畔從七十二步問為田幾何答曰二十三畝七十步
  hash: sha256:fdec4675ab66e1a5c5f739dfe7bca1bdbb65566afb6cb721371bee8415bcd035
