body:
  text: 經分臣淳風等謹按經分者自合分已下皆與諸分相齊此乃直求一人之分以人數分所分故曰經分也術曰以人數為法錢數為實實如法而一有分者通之母互乘子者齊其子母相乘者同其母以母通之者分母乘全內子乘散全則為積分積分則與分子相通故可令相從凡數相與者謂之率率者自相與通有分則可散分重疊則約也等除法實相與率也故散分者必令兩分母相乘法實也重有分者同而通之又以法分母乘實實分母乘法此謂法實俱有分故令分母各乘全分內子又令分母互乘上下潢按注故令分母各乘全分內子全分之分字疑衍草曰置八錢三分錢之一於上位通分內子得二十五為實置七人於下位亦以分母三乘之得二十一為法實如法得一錢二十一分錢之四合問草曰置六錢三分錢之一四分錢之三於上位母互乘子三分之一得四四分之三得九并之得十三為分子母相乘得十二為分母通分內子得八十五又以法分母三乘之得二百五十五為實置三人三分人之一於下位通分內子得一十又以實分母十二乘之得一百二十為
