body:
  text: 乘實餘則兩化爲銖實如法得銖數不滿法者以法命之爲幾分銖之幾此下十一問皆粟米術與差分無涉疑永樂大典誤收纂九章者承其誤耳今有絲一斤價直三百四十五今有絲七兩一十二銖問得錢幾何荅曰一百六十一錢三十二分錢之二十三術曰以一斤銖數爲法以一斤價數乘七兩一十二銖爲實實如法得錢數按此術亦今有之義以絲一斤銖數爲所有率價錢爲所求率今有絲爲所有數而今有之卽得草曰置今有絲七兩一十二銖於位通爲一百八十銖以一斤價直三百四十五乘之得六萬二千一百錢爲實次置絲一斤通爲三百八十四銖以爲法實如法得一百六十一錢三百八十四分錢之二百七十六子母各以十二約之爲三十二分錢之二十三合問説曰此問所有數止於銖故以一斤銖數爲法以一斤價數乘今有絲銖數爲實實如法而一不滿法者以等數約之而命分也
