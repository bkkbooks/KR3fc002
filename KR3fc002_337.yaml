body:
  text: 算置於下步之超一等至百而止議得二百置於實上以乘所借一算得二百為法置於實之下借算之上以議與法相乘得四萬以減實實餘一萬五千二百二十五除巳倍法得四百為定法折而下復置借算步之超一等至十而止議得三十置於實上次前議以乘借算得三十副之以三十加定法得四百三十為定法與議三十相乘得一萬二千九百以減實實餘二千三百二十五除巳以所副三十從定法四百三十得四百六十為定法折而下復置借算步之超一等至步而止議得五置於實上次前議以乘借算得五加定法得四百六十五為定法以議五乘之得二千三百二十五減實適盡上議得二百三十五步即方也合問草曰置積二萬五千二百八十一步為實借一算步之超一等至百而止置上議一百以乘所借一算得一百為法以上議一百乘之得一萬以減實實餘一萬五千二百八十一步除巳倍法得二百為定法折而下復置借算步之超一等至十而止置上議五十以乘借算得五十副
