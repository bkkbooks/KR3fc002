body:
  text: 千一百二十九以爲法置田二百四十步亦以一爲二千五百二十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一於位以最下分母九徧乘諸分子及全步皆爲九各以其母除之則一爲九半爲二分之九三分之一爲三四分之一爲四分之九五分之一爲五分之九六分之一爲六分之九約爲二分之三七分之一爲七分之九八分之一爲八分之九九分之一爲一置之於左又以分母八徧乘諸分子及巳通者各以其母除其子則一爲七十二半爲三十六三分之一爲二十四四分之一爲一十八五分之一爲五分之七十二六分之一爲一十二七分之一爲七分之七十二八分之一爲九九分之一爲八置之於左又以分母七徧乘諸分子及巳通者各以其母除其子則一爲五百四半爲二百五十二三分之一爲一百六十八四分之一爲一百二十六五分之一爲五分之五百四六分之一爲八十四七分之一爲七十二八分
