body:
  text: 千一百二十九以為法置田二百四十步亦以一為二千五百二十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一於位以最下分母九遍乘諸分子及全步皆為九各以其母除之則一為九半為二分之九三分之一為三四分之一為四分之九五分之一為五分之九六分之一為六分之九約為二分之三七分之一為七分之九八分之一為八分之九九分之一為一置之於左又以分母八遍乘諸分子及巳通者各以其母除其子則一為七十二半為三十六三分之一為二十四四分之一為一十八五分之一為五分之七十二六分之一為一十二七分之一為七分之七十二八分之一為九九分之一為八置之於左又以分母七遍乘諸分子及巳通者各以其母除其子則一為五百四半為二百五十二三分之一為一百六十八四分之一為一百二十六五分之一為五分之五百四六分之一為八十四七分之一為七十二八分
