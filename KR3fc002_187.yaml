body:
  text: 斤一百二十除之得一石一十斤是為二鈞八斤斤五錢一石一十斤斤六錢合問買絲石率之草曰置絲一石以石積銖通之得四萬六千八十以出錢一萬三千九百七十乘之得六億四千三百七十三萬七千六百錢為實次置所買絲一石二鈞二十八斤三兩五銖通之得七萬九千九百四十九銖為法實如法得八千五十一錢為賤絲一石之價每石增一錢得八千五十二錢為貴絲一石之價實餘六萬八千二百一銖為貴絲以實餘六萬八千二百一銖減所買絲七萬九千九百四十九銖餘一萬一千七百四十八銖為賤絲乃置賤絲一萬一千七百四十八銖於上位以鈞積銖一萬一千五百二十除之得一鈞餘二百二十八銖以兩積銖二十四除之得九兩餘一十二銖又置貴絲六萬八千二百一銖於下位以石積銖四萬六千八十除之得一石餘二萬二千一百二十一銖以鈞積銖一萬一千五百二十除之得一鈞餘一萬六百一銖以斤積銖三百八十四除之得二十七斤餘二百三十三銖以兩積
