body:
  text: 草曰置糳米三斗少半升通分內子得九斗一升展為九十一升以粟率二十五乘之得二千二百七十五升為實以分母三乘糳米率十二得三十六為法除之得六斗三升三十六分升之七即粟也合問今有御米十四斗欲為粟問得幾何答曰為粟三十三斗三升少半升術曰以御米求粟五十之二十一而一草曰置御米十四斗展為一百四十升以粟率五十乘之得七千升為實以御米率二十一為法除之得三十三斗三升三分升之一即少半升即粟也合問今有稻一十二斗六升一十五分升之一十四欲為粟問得幾何答曰為粟一十斗五升九分升之七術曰以稻求粟五之六而一草曰置稻一十二斗六升一十五分升之一十四通分內子得一百九十斗四升展為一千九百四升以粟率五乘之得九千五百二十升為實以分母一十五乘稻率六得九十為法除之
  hash: sha256:cdf9a95d46b5fc70de85f7dec443136effcb7eedd04b3f3a8647596f93751f33
