body:
  text: 草曰置糳米三斗少半升通分內子得九斗一升展爲九十一升以粟率二十五乘之得二千二百七十五升爲實以分母三乘糳米率十二得三十六爲法除之得六斗三升三十六分升之七卽粟也合問今有御米十四斗欲爲粟問得幾何荅曰爲粟三十三斗三升少半升術曰以御米求粟五十之二十一而一草曰置御米十四斗展爲一百四十升以粟率五十乘之得七千升爲實以御米率二十一爲法除之得三十三斗三升三分升之一卽少半升卽粟也合問今有稻一十二斗六升一十五分升之一十四欲爲粟問得幾何荅曰爲粟一十斗五升九分升之七術曰以稻求粟五之六而一草曰置稻一十二斗六升一十五分升之一十四通分內子得一百九十斗四升展爲一千九百四升以粟率五乘之得九千五百二十升爲實以分母一十五乘稻率六得九十爲法除之
  hash: sha256:3f68e6469c75249a812ce1780f9e36c6bd345a4808c852703b20f7c083885ff0
