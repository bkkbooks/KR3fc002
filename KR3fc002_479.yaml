body:
  text: 高一十尺乘之得六千尺三而一得二千尺卽四陽馬置上袤二十尺以下廣三十尺乘之得六百尺半之得三百尺以高一十尺乘之得三千尺卽二壍堵并之得五千尺以爲甍積也説曰注云甍之下廣袤與童之上廣袤等者謂積芻者以甍加童上如屋葢之茨也如圖甲乙辛壬癸庚爲甍積庚辛壬癸巳丙丁戊爲童積庚辛壬癸爲甍之下廣袤卽爲童之上廣袤云正斬方亭兩邊合之卽芻甍之形也者方亭兩邊各有壍堵一陽馬二故斬而合之爲芻甍之形也云假令下廣二尺袤三尺上袤一尺無廣高一尺其用棊也中央壍堵二兩端陽馬各二者申明正斬方亭兩邊合而爲芻甍之形也甲乙亥申丑未爲後壍堵甲乙寅申丑辰爲前壍堵甲未酉戌丑爲左後陽馬甲辰子戌丑爲左前陽馬乙亥卯巳申爲右後陽馬
  hash: sha256:6b3f90ba53c6fa305d40ee5b7842c77e5327647397a858ff43c5e6ce4c7f304d
