body:
  text: 高一十尺乘之得六千尺三而一得二千尺即四陽馬置上袤二十尺以下廣三十尺乘之得六百尺半之得三百尺以高一十尺乘之得三千尺即二塹堵并之得五千尺以為甍積也說曰注云甍之下廣袤與童之上廣袤等者謂積芻者以甍加童上如屋蓋之茨也如圖甲乙辛壬癸庚為甍積庚辛壬癸巳丙丁戊為童積庚辛壬癸為甍之下廣袤即為童之上廣袤云正斬方亭兩邊合之即芻甍之形也者方亭兩邊各有塹堵一陽馬二故斬而合之為芻甍之形也云假令下廣二尺袤三尺上袤一尺無廣高一尺其用棊也中央塹堵二兩端陽馬各二者申明正斬方亭兩邊合而為芻甍之形也甲乙亥申丑未為後塹堵甲乙寅申丑辰為前塹堵甲未酉戌丑為左後陽馬甲辰子戌丑為左前陽馬乙亥卯巳申為右後陽馬
