body:
  text: 之所得即一人所到尺按此術棚閣除邪道有上下之難故使二當五置定往來步數十加一及載輸之間三十步是為往來求一返凡用一百四十步於今有術為所有行率籠積一尺六寸為所求到土率程行五十九里半為所有數而今有之即人到尺數以所到約積尺即用徒人數者此一人之積除其衆積尺故得用徒人數為術又可令往來一返所用之步約程行為返數乘籠積為一人所到以此術與今有術相反覆則乘除之或先後意各有所在而同歸耳以所到約積尺即用徒人數潢按注是為往來求一返求字衍草曰置程行五十九里半以里法三百步乘之得一萬七千八百五十步以土籠積一尺六寸乘之得二萬八千五百六十尺為實次置往來七十步內減二十步餘五十步列上位以五乘上下棚除二十步得一百步以二除之得五十步加上位共得一百步為定往來步又以十一乘之得一千一百步十除之得一百一十步又加載輸之間三十步共得一百四十步以為法除實得二百四尺為人到積尺次置盤池積七萬六百六十六尺太半尺以分母三通分內子得二十一萬二千尺為實又置人到二百四尺以三通之得六百一十二為法除實得三百四十六人六百一十二分人之二百四十八子母
