body:
  text: 百二十四以減實適盡上議得二百六十八步卽方也合問草曰置積五十六萬四千七百五十二步四分步之一通分內子得二百二十五萬九千九步爲定實借一算步之超一等至千而止置上議一千以乘借算得一千爲法以上議一千乘之得一百萬以減實實餘一百二十五萬九千九步除巳倍法得二千爲定法折而下復置借算步之超一等至百而止置上議五百以乘借算得五百副之以五百加定法得二千五百爲定法以上議五百乘之得一百二十五萬以減實實餘九千九步除巳以所副五百從定法得三千爲定法折而下復置借算步之超一等至步而止置上議三乘借算得三以加定法三千得三千三爲定法以上議三乘之得九千九以減實適盡上議得一千五百三步置分母四開之得二以除一千五百三步得七百五十一步半卽方也合問草曰置積三十九億七千二百一十五萬六百二十五步爲實借一算步之超一等至萬而止
