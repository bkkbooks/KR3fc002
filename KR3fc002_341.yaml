body:
  text: 百二十四以減實適盡上議得二百六十八步即方也合問草曰置積五十六萬四千七百五十二步四分步之一通分內子得二百二十五萬九千九步為定實借一算步之超一等至千而止置上議一千以乘借算得一千為法以上議一千乘之得一百萬以減實實餘一百二十五萬九千九步除巳倍法得二千為定法折而下復置借算步之超一等至百而止置上議五百以乘借算得五百副之以五百加定法得二千五百為定法以上議五百乘之得一百二十五萬以減實實餘九千九步除巳以所副五百從定法得三千為定法折而下復置借算步之超一等至步而止置上議三乘借算得三以加定法三千得三千三為定法以上議三乘之得九千九以減實適盡上議得一千五百三步置分母四開之得二以除一千五百三步得七百五十一步半即方也合問草曰置積三十九億七千二百一十五萬六百二十五步為實借一算步之超一等至萬而止
