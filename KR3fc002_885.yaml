body:
  text: 下位食雞十得一千二百二十於下位以從者食九十七乘右行從者十得九百七十以吏食四十一乘右行吏五得二百五并之得一千一百七十五以減下位餘四十五如令一而一仍得四十五為令食寄法一百二十二為分母乃置令食四十五吏食四十一從者食九十七皆以法一百二十二命之得令一人食一百二十二分雞之四十五吏一人食一百二十二分雞之四十一從者一人食一百二十二分雞之九十七合問說曰術云如方程以正負術入之者此問原列各行不分正負以右行直除中行而中行減餘皆負以右行直除左行而左行減餘皆負負乘負仍為負不欲變其名也減至法實同名與互乘所得無異而為法簡易多矣今有五羊四犬三雞二兔直錢一千四百九十六四羊二犬六雞三兔直錢一千一百七十五三羊一犬七雞五兔直錢九百五十八二羊三犬五雞一兔直錢八百六十一問羊犬雞兔價各幾何答曰羊價一百七十七
  hash: sha256:dd2c36accf5f3d88dbddde016ccb7d5c6173b5d8a5d59e465791722636f8709f
