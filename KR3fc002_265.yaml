body:
  text: 二十五為法實如法得四十尺收為四丈又收四丈為一匹合問說曰此問所求率止於丈當以一匹一丈丈數乘今有錢數為實以價錢為法實如法而一得丈數收為匹數術文及注並云尺數者疑誤細草亦通匹丈為尺數者從術文也今有與人絲一十四斤約得縑一十斤今與人絲四十五斤八兩問得縑幾何答曰三十二斤八兩術曰以一十四斤兩數為法以一十斤乘今有絲兩數為實實如法得縑數此術亦今有之義以一十四斤兩數為所有率一十斤為所求率今有絲為所有數今有之即得草曰置今與人絲四十五斤八兩於位通為七百二十八兩以約得縑一十斤乘之得七千二百八十斤為實次置與人絲一十四斤通為二百二十四兩以為法實如法得三十二斤實餘一百一十二斤以十六乘之得一千七百九十二兩為實實如法得八兩并之得三十二斤八兩合問說曰此問所有數止於兩故以一十四斤兩數
