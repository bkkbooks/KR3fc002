body:
  text: 二十五爲法實如法得四十尺收爲四丈又收四丈爲一匹合問説曰此問所求率止於丈當以一匹一丈丈數乘今有錢數爲實以價錢爲法實如法而一得丈數收爲匹數術文及注並云尺數者疑誤細草亦通匹丈爲尺數者從術文也今有與人絲一十四斤約得縑一十斤今與人絲四十五斤八兩問得縑幾何荅曰三十二斤八兩術曰以一十四斤兩數爲法以一十斤乘今有絲兩數爲實實如法得縑數此術亦今有之義以一十四斤兩數爲所有率一十斤爲所求率今有絲爲所有數今有之卽得草曰置今與人絲四十五斤八兩於位通爲七百二十八兩以約得縑一十斤乘之得七千二百八十斤爲實次置與人絲一十四斤通爲二百二十四兩以爲法實如法得三十二斤實餘一百一十二斤以十六乘之得一千七百九十二兩爲實實如法得八兩并之得三十二斤八兩合問説曰此問所有數止於兩故以一十四斤兩數
