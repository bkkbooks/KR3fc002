body:
  text: 之二即八兩為每尺之差以八兩減本重四斤餘三斤八兩又以八兩減之餘三斤又以八兩減之餘二斤八兩又以八兩減之餘二斤為每尺之重今術不以四約差率是以四為母也故令母乘本重以通其率云亦可置末重以四閒乘之為上第一衰以差重率加之為次下衰也者差重率之重字疑衍置末重二斤以四乘之得八以差率二遞加之亦得十十二十四十六為次下各衰云以下第一衰為法以本重乘其分母之數而又取此率乘本重為實一乘一除勢無損益故惟本存焉者以下第一衰十六為法是以本重四斤乘分母四之數也又取此率乘本重為實先以十六乘後以十六除是一乘一除勢無損益仍存本重四斤也云衆衰相推為率則其餘可知也者以列衰八十十二十四乘本重四兩為實如法十六而一則每尺之重可知也云亦可副置末衰為法而以末重二斤乘列衰為實者置末衰八為法以末重二斤乘列衰十得二十乘列衰十二得二十四乘列衰十四得二十八乘列衰十六得三十二各自為
