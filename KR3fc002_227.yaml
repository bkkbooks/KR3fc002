body:
  text: 持錢一百八十求總等得一十以徧約之甲得五十六乙得三十五丙得一十八爲列衰副并得一百九爲法以百錢乘未并者甲得五千六百乙得三千五百丙得一千八百各自爲實實如法得五十一錢一百九分錢之四十一爲甲出錢得三十二錢一百九分錢之一十二爲乙出錢得一十六錢一百九分錢之五十六爲丙出錢合問説曰關稅百錢爲甲乙丙三人共出之數今欲以錢數多少衰出之當以甲五百六十乙三百五十丙一百八十爲列衰術爲其太繁故以總等一十徧約之甲得五十六乙得三十五丙得一十八爲列衰副并得一百九爲法注云此術甲乙丙持錢數以爲列衰副并爲所有率未并者各爲所求率百錢爲所有數而今有之卽得潢按依下發傜術注例當云甲乙丙持錢數退位求之以爲列衰注不言者畧也今有女子善織日自倍五日織五尺問日織幾何荅曰初日織一寸三十一分寸之十九
