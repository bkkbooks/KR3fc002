body:
  text: 持錢一百八十求總等得一十以遍約之甲得五十六乙得三十五丙得一十八為列衰副并得一百九為法以百錢乘未并者甲得五千六百乙得三千五百丙得一千八百各自為實實如法得五十一錢一百九分錢之四十一為甲出錢得三十二錢一百九分錢之一十二為乙出錢得一十六錢一百九分錢之五十六為丙出錢合問說曰關稅百錢為甲乙丙三人共出之數今欲以錢數多少衰出之當以甲五百六十乙三百五十丙一百八十為列衰術為其太繁故以總等一十遍約之甲得五十六乙得三十五丙得一十八為列衰副并得一百九為法注云此術甲乙丙持錢數以為列衰副并為所有率未并者各為所求率百錢為所有數而今有之即得潢按依下發徭術注例當云甲乙丙持錢數退位求之以為列衰注不言者略也今有女子善織日自倍五日織五尺問日織幾何答曰初日織一寸三十一分寸之十九
