body:
  text: 草曰置糲米十五斗五升五分升之二通分內子得七十七斗七升展為七百七十七升以粟率五乘之得三千八百八十五升為實以分母五乘米率三得一十五為法除之得二十五斗九升即粟也合問說曰五粟率也三米率也上術以粟求米故粟為所有數三為所求率五為所有率而今有之即得所求米數今此以米求粟故米為所有數五為所求率三為所有率而今有之即得所求粟數注所謂准都術求之各合其數也以稗米求粟而下所有反求術皆准此今有稗米二斗欲為粟問得幾何答曰為粟三斗七升二十七分升之一術曰以稗米求粟五十之二十七而一草曰置稗米二斗展為二十升以粟率五十乘之得一千升為實以稗米率二十七為法除之得三斗七升二十七分升之一即粟也合問今有糳米三斗少半升欲為粟問得幾何答曰為粟六斗三升三十六分升之七術曰以糳米求粟二十五之十二而一
