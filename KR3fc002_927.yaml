body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門撰句股以御高深廣遠今有句三尺股四尺問為弦幾何答曰五尺今有弦五尺句三尺問為股幾何答曰四尺今有股四尺弦五尺問為句幾何答曰三尺如圖短面曰句長面曰股相與結角曰弦句股短面曰句長而曰股相與結角曰弦句短其股股短其弦將以施於諸率故先具此術以見其源也術曰句股各自乘并而開方除之即弦句自乘為朱方股自乘為靑方令出入相補各從其類因就其餘不移動也合成弦方之幂開方除之即弦也
