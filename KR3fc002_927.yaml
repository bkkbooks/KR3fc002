body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門譔句股以御高深廣遠今有句三尺股四尺問爲弦幾何荅曰五尺今有弦五尺句三尺問爲股幾何荅曰四尺今有股四尺弦五尺問爲句幾何荅曰三尺如圖短面曰句長面曰股相與結角曰弦句股短面曰句長而曰股相與結角曰弦句短其股股短其弦將以施於諸率故先具此術以見其源也術曰句股各自乘并而開方除之卽弦句自乘爲朱方股自乘爲靑方令出入相補各從其類因就其餘不移動也合成弦方之幂開方除之卽弦也
  hash: sha256:2a8fac903c6b8e10d7458bad18e0825bf17ee610491ed8cc2976f7501f6c27a6
