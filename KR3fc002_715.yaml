body:
  text: 百七十為六十三分之一千八百九十也云令下維乘上訖以同約之不可約故以同乘之者同謂分母約之謂約上乘之謂乘下也如共買璡人出六之三盈四人出六之二不足三下維乘上訖并之上得十七以分母六約之不盡是為不可約故即以十七為實以分母六乘下七得四十二為法也云所出率以少減多者餘謂之設差以為少設者如共買雞人出六減人出九餘三謂之設差因以為少設也云則并盈朒是為定實者求正數則并盈不足為法術所云是也求人數則并盈不足為實其一術所云是也云定實者以別乎泛實也如共買雞人出九盈十一人出六不足十六并盈不足得二十七為泛實以設差三約之得九為定實也云故以少設約法則為人數約實則為物價者如共買雞問令下維乘上并得二百一十為實并盈不足得二十七為法以少設三約法得九為人數約實得七十為雞價也云盈朒當與少設相通不可遍約亦當分母乘設差為約法實者所出率既寄有分母則少設亦寄有分母盈朒不以
