body:
  text: 為上袤亦并下中外周而半之以為下袤此池環而不通匝形如盤蛇而曲之亦云周者謂如委穀依垣之周耳引而伸之周為袤求袤之意環田也潢按注以下廣乘之下當作高觀下文以高廣乘之可證兩邊塹堵各四邊當作端觀下文兩端塹堵各二可證并兩旁三品棊兩旁當作兩方説曰注云假令芻童上廣一尺袤二尺下廣三尺袤四尺高一尺其用棊也中央立方二四面塹堵六四角陽馬四者凡用棊十二以顯芻童之形也芻童左視如圖甲丑與子寅為中央立方二丁丙寅壬辰卯為後面塹堵二甲丁卯巳午未為左端塹堵一甲未午庚申為左前陽馬一丁卯辰癸巳為左後陽馬一芻童右視
  hash: sha256:d154cf86650144538c720ec34e8a8c3842033a1e4787cdedf4f4168bfcbe8e18
