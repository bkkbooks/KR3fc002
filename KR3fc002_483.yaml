body:
  text: 爲上袤亦并下中外周而半之以爲下袤此池環而不通匝形如盤虵而曲之亦云周者謂如委穀依垣之周耳引而伸之周爲袤求袤之意環田也潢按注以下廣乘之下當作高觀下文以高廣乘之可証兩邊壍堵各四邊當作端觀下文兩端壍堵各二可証并兩旁三品棊兩旁當作兩方説曰注云假令芻童上廣一尺袤二尺下廣三尺袤四尺高一尺其用棊也中央立方二四面壍堵六四角陽馬四者凡用棊十二以顯芻童之形也芻童左視如圖甲丑與子寅爲中央立方二丁丙寅壬辰卯爲後面壍堵二甲丁卯巳午未爲左端壍堵一甲未午庚申爲左前陽馬一丁卯辰癸巳爲左後陽馬一芻童右視
  hash: sha256:21a27cf2f63b0590acd796b43ba66b4217324d51eb3a9e9753bc10c9b0de651d
