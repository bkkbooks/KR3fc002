body:
  text: 草曰置上袤八丈倍之得十六丈下袤六丈從之得二十二丈展為二百二十尺以上廣六丈展為六十尺乘之得一萬三千二百尺於上位又置下袤六丈倍之得十二丈上袤八丈從之得二十丈展為二百尺以下廣四丈展為四十尺乘之得八千尺加上位得二萬一千二百尺以深二丈展為二十尺乘之得四十二萬四千尺六而一得七萬六百六十六尺六分尺之四即三分尺之二為太半尺即盤池積也合問負土往來七十步其二十步上下棚除棚除二當平道五踟蹰之間十加一載輸之間三十步定一返一百四十步土籠積一尺六寸秋程人功行五十九里半問人到積尺及用徒各幾何答曰人到二百四尺用徒三百四十六人一百五十三分人之六十二術曰以一籠積尺乘程行步數為實往來上下棚除二當平道五棚閣除邪道有上下之難故使二當五也置定往來步數十加一及載輸之間三十步以為法除
  hash: sha256:a08fc8a35de0b0214b17b79d431590b53da5fcf40eb89429fcf9d4272e77e7df
