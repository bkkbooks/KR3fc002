body:
  text: 重差圖序圖九望海島舊有圖解餘八圖今所補也同式形兩兩相比所作四率二三率相乘與一四率相乘同積如欲作圖明之苐取一三率聯為一邊又取二四率聯為一邊作相乘長方圖之自然分為四冪又以斜弦界為同式句股形各二則形勢驗矣舊圖於形外別作同積二方至兩形相去遼遠者又必宛轉通之皆可不必也圖中以四邊形五邊形立説似與句股不類然於本形外補作句股形則亦句股也四率比例法在九章粟米謂之今有一為所有率二為所求率三為所有數四為所求數在句股則統目之為率劉氏注云句率股率見句見股者是也今祇云同式相比者取省易耳異乘同除則一也鍾祥李潢
  hash: sha256:28799ee15fc63da7fbf4bb39d8b7824a5a261124b1de809cf41dc9a2d17302e1
