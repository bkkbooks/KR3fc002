body:
  text: 一術曰以糲飯求飱六之五而一臣淳風等謹按飱率九十為糲飯所求宜以糲飯乘此率術欲從省先以等數十五約之所求之率得六所有之率得五以此故六乘五除也草曰置糲飯七斗六升七分升之四通分內子得五十三斗六升展為五百三十六升以飱率六乘之得三千二百一十六升為實以分母七乘糲飯率五得三十五為法除之得九斗一升三十五分升之三十一即飱也合問説曰注云先以等數十五約之者置糲飯率七十五於上位飱率九十於下位以上減下下餘十五轉以下餘減上上亦餘十五是十五為等數也以等數十五約飱率九十得六為所求率以等數十五約糲飯率七十五得五為所有率故六乘五除也今有菽一斗欲為熟菽問得幾何答曰為熟菽二斗三升術曰以菽求熟菽二十三之十而一臣淳風等謹按熟菽之率一百三半因其有半各以母二通之宜以熟菽數乘此率術欲從省先以等數九約之所求之率得一十一半所有之率得五也
