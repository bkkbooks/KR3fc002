body:
  text: 七百一十九斛二千八百七十三分斛一千三百一十三戊縣九百三十九斛二千八百七十三分斛之二千一百五十三合問說曰注云各置所當出粟以其一斛之費乘之如戶數而一得率戶出三錢二千八百七十三分錢之一千三百八十一者此以戶數為所有率致一斛之費為所求率各縣所當出粟為所有數而今有之得戶出錢求此率以戶當各計粟之衰分也置甲縣所當出粟三千五百七十一斛二千八百七十三分斛之五百一十七通分內子得一千二十六萬以其一斛之費二十乘之得二億五百二十萬為實以分母二千八百七十三乘甲戶二萬五百二十得五千八百九十五萬三千九百六十為法實如法而一得三錢五千八百九十五萬三千九百六十分錢之二千八百三十三萬八千一百二十以等數二萬五百二十約子母為二千八百七十三分錢之一千三百八十一置乙縣所當出粟二十三百八十斛二千八百七十三分斛之二千二百六十通分內子得六百八十四萬以其一斛
  hash: sha256:0fd1e7b6bbf5e88e51c6cab825bbe199be35a2c5da5fe9bdbdb17582d971e533
