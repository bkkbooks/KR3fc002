body:
  text: 約之即得每尺之差以差數減本重餘即次尺之重也為術所置如是而巳今此率以四為母故令母乘本為衰通其率也亦可置末重以四間乘之為上第一衰以差重率加之為次下衰也副置下第一衰以為法以本重四斤遍乘列衰各自為實實如法得一斤以下第一衰為法以本重乘其分母之數而又反此率乘本重為實一乘一除勢無損益故推本存焉衆衰相推為率則其餘可知也亦可副置末衰為法而以末重二斤乘列衰為實此雖迂回然是其舊故就新而言之也潢按注而又反此率乘本重為實反當作取草曰置本重四斤於位以末重二斤減之餘二斤為差率當以四間除之為每尺之差今不除是寄四為分母故又置本重四斤以四間乘之得十六斤為下第一衰以為法副置下第一衰十六斤以差率遞減之得十四十二十八為次上各衰以本重四斤乘列衰八得三十二乘列衰十得四十乘列衰十二得四十八乘列衰十四得五十六乘列衰十六得六十四各自為實實如法得末一尺重二斤次一尺重二斤半即二斤八兩次一尺重三斤次一尺重三斤半即三斤八兩次一尺重四斤合問説曰注云令本末相減餘即四差之凡數也者即術所云差率也以四約差率二斤得四分斤
