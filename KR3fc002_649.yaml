body:
  text: 約之卽得每尺之差以差數減本重餘卽次尺之重也爲術所置如是而巳今此率以四爲母故令母乘本爲衰通其率也亦可置末重以四間乘之爲上第一衰以差重率加之爲次下衰也副置下第一衰以爲法以本重四斤徧乘列衰各自爲實實如法得一斤以下第一衰爲法以本重乘其分母之數而又反此率乘本重爲實一乘一除勢無損益故推本存焉衆衰相推爲率則其餘可知也亦可副置末衰爲法而以末重二斤乘列衰爲實此雖迂迴然是其舊故就新而言之也潢按注而又反此率乘本重爲實反當作取草曰置本重四斤於位以末重二斤減之餘二斤爲差率當以四間除之爲每尺之差今不除是寄四爲分母故又置本重四斤以四間乘之得十六斤爲下第一衰以爲法副置下第一衰十六斤以差率遞減之得十四十二十八爲次上各衰以本重四斤乘列衰八得三十二乘列衰十得四十乘列衰十二得四十八乘列衰十四得五十六乘列衰十六得六十四各自爲實實如法得末一尺重二斤次一尺重二斤半卽二斤八兩次一尺重三斤次一尺重三斤半卽三斤八兩次一尺重四斤合問説曰注云令本末相減餘卽四差之凡數也者卽術所云差率也以四約差率二斤得四分斤
