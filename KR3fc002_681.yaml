body:
  text: 少半日滿者是一日三滿也次一日一滿次二日半滿者是一日五分滿之二也次三日滿者是一日三分滿之一也次五日滿者是一日五分滿之一也并之得四滿十五分滿之十四也以一日為實實如法得一日此猶矯矢之術也先令同於一日日同則滿齊自鳬鴈至此其為同齊有二術焉可隨率宜也其一術列置日數及滿數其一渠少半日滿者是一日三滿也次一日一滿次二日半滿者是五日二滿次三日一滿次五日一滿此謂之列置日數及滿數也令日互相乘滿并以為法日數相乘為實實如法得一日亦如鳬鴈術也臣淳風等謹按此其一渠少半日滿池者是一日三滿池也次一日一滿次二日半滿者是五日再滿次三日一滿次五日一滿此謂列置日數於右行及滿數於左行以日互乘滿者齊其滿日數相乘者同其日滿齊而日同故并齊以除同即得也潢按李注此其一渠少半日滿池者此字下脫術字草曰列置五渠一日滿池之數如注所云三滿一滿五分滿之二三分滿之一五分滿之一於位乃以合分術入之化五分之二為十五分之六三分之一為十五分之五五分之一為十五分之三并之得四滿十五分滿之十四通分內子得七十四為法以分母十五乘一日得十五日為實實如法得七十四分日之十五合問其一術草曰列置一日三滿一日一滿五日二
