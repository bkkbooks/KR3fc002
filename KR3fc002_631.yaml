body:
  text: 一斤餘實二十九以十六乘之得四百六十四兩為實以法除之得四兩餘實六十八以二十四乘之得一千六百三十二銖為實以法除之得十六銖九十九分銖之四十八以等數三約子母為三十三分銖之十六并之得一斤四兩十六銖三十三分銖之十六為靑絲一斤用絡絲之數也亦合所問云又一術今有靑絲一斤銖數乘練絲一斤兩數為實以靑絲一斤十二銖為法所得即用練絲兩數者此依今有術先求練絲兩數也置靑絲一斤展為三百八十四銖又置練絲一斤展為十六兩乘之得六千一百四十四兩為實次置靑絲一斤十二銖展作三百九十六銖為法除之得一十五兩三百九十六分兩之二百四以等數十二約子母為三十三分兩之十七即練絲數也云以絡絲一斤乘所得為實以練絲十二兩為法所得即用絡絲斤數也者此依今有術再求絡絲斤數也置所得練絲十五兩三十三分兩之十七通分內子得五百一十二以絡絲一斤乘之得五百一十二斤為實以分母三十三乘練絲十二兩得
  hash: sha256:c35a7a747bd20686ef766c78cfc76f5200ac75817aacbede71317d3133dc82ff
