body:
  text: 人出盈左行令左行盈三十維乘右行所出一千七百一十得六十三分之五萬一千三百不足三百三十於右行令右行不足三百三十維乘左行所出一千八百九十得六十三分之六十二萬三千七百盈三十於左行人出不足右行人出盈左行并之得六十七萬五千為實以不足三百三十并盈三十得三百六十復以分母六十三乘之得二萬二千六百八十為法乃置所出分子一千七百一十減一千八百九十餘一百八十以
