body:
  text: 尺即垣積也合問今有隄下廣二丈上廣八尺高四尺袤一十二丈七尺問積幾何答曰七千一百一十二尺如圖乙丁為下廣甲丙為上廣戊巳為高庚丁為袤草曰置下廣二丈上廣八尺并之得二丈八尺半之得一丈四尺展為一十四尺以高四尺乘之得五十六尺又以袤一十二丈七尺展為一百二十七尺乘之得七千一百一十二尺即隄積也合問冬程人功四百四十四尺問用徒幾何答曰一十六人一百一十一分人之二術曰以積尺為實程功尺數為法實如法而一即用徒人數草曰置隄積七千一百一十二尺為實以程功
