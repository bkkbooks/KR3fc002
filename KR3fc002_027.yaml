body:
  text: 右方分母三乘左方分子二五分之二得六并之得十一為實右方分母三五相乘得十五為法實不滿法以法命之為十五分之十一合問草曰置三分七分九分在右方之二之四之五在左方以右方分母七乘左方分子二又以右方分母九乘之三分之二得一百二十六以右方分母三乘左方分子四又以右方分母九乘之七分之四得一百八以右方分母三乘左方分子五又以右方分母七乘之九分之五得一百五并之得三百三十九為實右方分母三七相乘又以分母九乘之得一百八十九為法實如法得一又一百八十九分之一百五十子母各以等數三約之為六十三分之五十合問草曰置二分三分四分五分在右方之一之二之三之四在左方母互乘子二分之一得六十三分之二得八十四分之三得九十五分之四得九十六并之得三百二十六為實右方四分母相乘得一百二十為法實如法得二又一百二十分之八十六子母各半之為六十分之四十三合問
