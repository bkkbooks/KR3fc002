body:
  text: 減或益同行異位殊爲二品各有并減之差見於下焉著此二條特繫之禾以成此二條之意故赤黑相雜足以定上下之程減益雖殊足以通左右之數差實雖分足以應同異之率然則其正無入負之負無入正之其率不妄也同名相除此爲以赤除赤以黑除黑行求相減者爲去頭位也然則頭位同名者當用此條頭位異名者當用下條異名相益益行減行當各以其類矣其異名者非其類也非其類者猶無對也非所得減也故赤用黑對則除黑無對則除赤赤黑并於本數此爲相益之皆所以爲消奪消奪之與減益成一實也術本取要必除行首至於他位不嫌多少故或令相減或令相并理無同異一也正無入負之負無入正之無入爲無對也無所得減則使消奪者居位也其當以列實或減下實而行中正負雜者亦用此條此條者同名減實異名益實正無入負之負無入正之也其異名相除同名相益正無入正之負無入負之此條異名相除爲例故亦與上條互取凡正負所以記其同異使二品互相取而巳矣言負者未必負於少言正者未必正於多故每一行之中雖復赤黑異算無傷然則可得使頭位常相與異名此條之實兼通矣遂以二條反覆一率觀其每與上下互相取位則隨算而言耳猶一術也又本設諸行欲因減數以相去耳故其多少無限令上下相命而巳若以正負相減如數有舊增法者每行可均之不但數物左右之也潢按正負二字依方田章約分粟米章今有衰分章返衰及此章方程例當自爲一行今兩算得失相反注在其下術曰同名相除當另自起行正無人負無人之人字原本作人孔刻攺爲入非是今於經注作入仍孔刻也説中作人遵
