body:
  text: 潢按原本誤作一萬今攺正如圖庚癸爲下廣癸壬爲下袤甲丁爲上廣丁丙爲上袤戊至巳爲高草曰置上袤四丈倍之得八丈以下袤三丈從之得一十一丈展爲一百一十尺以上廣三丈展爲三十尺乘之得三千三百尺於上位又置下袤三丈倍之得六丈以上袤四丈從之得一十丈展爲一百尺以下廣二丈展爲二十尺乘之得二千尺於下位上下二位相并得五千三百尺以高三丈展爲三十尺乘之得一十五萬九千尺六而一得二萬六千五百尺卽芻童積也合問注爲術草曰置上廣三丈展爲三十尺以下廣二丈展爲二十尺減之餘一十尺爲廣差置上袤四丈展爲四十尺以下袤三丈展爲三十尺減之餘一十尺爲袤差以相乘得一百尺以高三丈展爲三十尺乘之得三千尺三而一得一千尺爲四陽馬寄左又置上袤四十尺以下廣
  hash: sha256:c84b792fadd0e99d1d9cc69c736564d5c97488085b145ff4b4de3b65efd56c09
