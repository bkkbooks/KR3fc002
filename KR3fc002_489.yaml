body:
  text: 潢按原本誤作一萬今攺正如圖庚癸為下廣癸壬為下袤甲丁為上廣丁丙為上袤戊至巳為高草曰置上袤四丈倍之得八丈以下袤三丈從之得一十一丈展為一百一十尺以上廣三丈展為三十尺乘之得三千三百尺於上位又置下袤三丈倍之得六丈以上袤四丈從之得一十丈展為一百尺以下廣二丈展為二十尺乘之得二千尺於下位上下二位相并得五千三百尺以高三丈展為三十尺乘之得一十五萬九千尺六而一得二萬六千五百尺即芻童積也合問注為術草曰置上廣三丈展為三十尺以下廣二丈展為二十尺減之餘一十尺為廣差置上袤四丈展為四十尺以下袤三丈展為三十尺減之餘一十尺為袤差以相乘得一百尺以高三丈展為三十尺乘之得三千尺三而一得一千尺為四陽馬寄左又置上袤四十尺以下廣
  hash: sha256:f3e38a9a7380ac074febd09990383fa30333b7b3dd8d5e98b4834b73ce63baf6
