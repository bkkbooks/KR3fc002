body:
  text: 分母乘與少設不相通少設可以約實不可以約法故曰不可遍約亦當分母乘為句亦當以分母乘盈朒也乘則與少設相通可約故曰設差為約法實如買牛問少設一百八十寄有分母六十三并盈不足得三百六十為法若不以分母乘是盈朒不與少設相通不可遍約也故以分母六十三乘法三百六十得二萬二千六百八十以少設一百八十約之得一百二十六為家數亦以少設一百八十約實六十七萬五千得三千七百五十為牛價也今有共買金人出四百盈三千四百人出三百盈一百問人數金價各幾何答曰三十三人金價九千八百今有共買羊人出五不足四十五人出七不足三問人數羊價各幾何答曰二十一人羊價一百五十兩盈兩不足術曰兩盈兩不足相與同共買物者置所出率
