body:
  text: 餘以句股幂減當作其實以句股差幂減其實謂弦實也如前圖於弦幂內減去黃幂餘朱幂四為句股相乘幂之倍半之得句股相乘幂以為實句股差為從法開方除之得句其云倍為從法者以廣袤并為方法也差為從法者以廣袤差為方法也今有戶不知高廣竿不知長短橫之不出四尺從之不出二尺邪之適出問戶高廣袤各幾何答曰廣六尺高八尺袤一丈如圖戶廣為句戶高為股戶袤為弦橫不出為句弦差從不出為股弦差術曰從橫不出相乘倍而開方除之所得加從不出即戶廣此以戶廣為句戶高為股戶袤為弦凡并句股之幂即為弦幂或矩於表或方於裏連之者舉表矩而方之又從句方裏令為靑矩之表未滿黃方滿此方則兩端之廉重於隅中各以股弦差為廣句弦差為袤故兩端差相乘又倍之則成黃方之幂開方除
