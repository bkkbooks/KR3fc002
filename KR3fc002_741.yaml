body:
  text: 鼠所穿合尺五寸尺上脫四字草曰置假令二日於右行不足五寸居其下置令之三日於左行有餘三尺七寸半居其下假令不足右行日寸假令有餘左行日寸令有餘三尺七寸半維乘二日得七十五日令不足五寸維乘三日得一十五日假令不足右行日寸假令有餘左行日寸并之得九十日爲實并有餘三尺七寸半不足五寸得四尺二寸半爲法實如法得二日四百二十五分日之五十以等數二十五約分母子爲十七分日之二合問大鼠穿草曰大鼠日自倍一日穿一尺次日倍
  hash: sha256:9f8b89781817c975c59df883f214bfb96f0772d95856005129194357befa86e6
