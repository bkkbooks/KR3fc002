body:
  text: 荅曰一百六十四丈九尺六寸太半寸如圖木高減人目高餘爲句率人去木爲股率山去木爲見股山高減木高餘爲見句以見句加木高爲山高術曰置木高減人目高七尺餘以乘五十三里爲實以人去木三里爲法實如法而一所得加木高卽山高此術句股之義以木高減人目高七尺餘有八丈八尺爲句率去人目三里爲股率山去木五十三里爲見股以句率乘見股如股率而一得句加木之高故爲山高也潢按注去人目三里爲股率當作人去木三里爲股率草曰置木高九丈五尺以人目高七尺減之餘八丈八尺通作八百八十寸爲句率以山去木五十三里爲見股以句率乘之得四萬六千六百四十寸爲實以人去木三里爲股率以爲法實如法得一萬五千五百四十六寸三分寸之二卽一百五十五丈四尺六寸太半寸爲見句以木高九丈五尺加之得一百六十四丈九尺
  hash: sha256:0d9d21034c17d2b076ace2b2f93cb9d1ec220ad8911ffdce510d0a132297c2b7
