body:
  text: 乙之幂卽次商幂連朱幂之角除之者實內減去次商自乘幂也云再以黃乙之面加定法是則張兩靑幂之袤者黃乙之面次商也定法倍初商也靑幂者三商兩𠔳幂也以次商加初商倍之爲三商兩𠔳之袤待三商爲之廣廣袤相乘實內減去靑幂三商自乘實內減去隅幂也如圖黃甲爲初商所除方幂黃乙兩朱爲次商所除隅幂及兩𠔳幂隅兩靑爲三商所除隅幂及兩𠔳幂今有積一千五百一十八步四分步之三問爲圓周幾何荅曰一百三十五步於𡽪術當周一百三十八步一十分步之一臣淳風等謹按此依密率爲周一百三十八步五十分步之九又有積三百步問爲圓周幾何荅曰六十步於𡽪術當周六十一步五十分步之十九臣淳風等謹按依密率爲周六十一步一百分步之四十一開圓術曰置積步數以十二乘之以開方除之卽得周此術以周三徑一爲率與舊圓田術相返覆也於𡽪術以三百一十四乘積如二十五而
  hash: sha256:781c7e17eacfae437919fd93923c902c2bd8c608524c0ffa29136a496bc9932b
