body:
  text: 乙之幂即次商幂連朱幂之角除之者實內減去次商自乘幂也云再以黃乙之面加定法是則張兩靑幂之袤者黃乙之面次商也定法倍初商也靑幂者三商兩𠔳幂也以次商加初商倍之為三商兩𠔳之袤待三商為之廣廣袤相乘實內減去靑幂三商自乘實內減去隅幂也如圖黃甲為初商所除方幂黃乙兩朱為次商所除隅幂及兩𠔳幂隅兩靑為三商所除隅幂及兩𠔳幂今有積一千五百一十八步四分步之三問為圓周幾何答曰一百三十五步於𡽪術當周一百三十八步一十分步之一臣淳風等謹按此依密率為周一百三十八步五十分步之九又有積三百步問為圓周幾何答曰六十步於𡽪術當周六十一步五十分步之十九臣淳風等謹按依密率為周六十一步一百分步之四十一開圓術曰置積步數以十二乘之以開方除之即得周此術以周三徑一為率與舊圓田術相返覆也於𡽪術以三百一十四乘積如二十五而
  hash: sha256:d515bd7c3c63c97c9009158ac302cfe8f0fe141eb1f6207a426c7182d7be11d7
