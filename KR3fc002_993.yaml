body:
  text: 術曰以出北門步數乘西行步數倍之爲實此以折而西行爲股自木至邑南十四步爲句以出北門二十步爲句率北門至西隅爲股率卽半廣數故以出北門句率乘西行股得半廣股率乘句之幂然此幂居半以西故又倍之合半以東也并出南門步數爲從法開方除之卽邑方此術之幂東西廣如邑方南北自木盡邑南十四步爲袤合南北步數爲廣袤差故連并兩步數爲從法以爲隅外之幂也草曰置出北門二十步爲小句西行一千七百七十五步爲大股相乘得三萬五千五百步爲小句乘大股幂又爲小股乘大句幂又爲自木至邑南十四步與半邑方相乘幂倍之得七萬一千步爲自木至邑南十四步與邑方相乘幂以爲實并出北門二十步出南門十四步得三十四步爲從法開方除之得二百五十步卽邑方也合問説曰此帶從開方法也邑方爲廣自木至邑南十四步爲袤廣袤相乘爲實合南北步數爲廣袤差以爲從法開方除之得邑方今有邑方十里各中開門甲乙俱從邑中央而出乙東出甲南出出門不知步數邪向東門磨邑適與乙會率甲行五乙行三問甲乙行各幾何
