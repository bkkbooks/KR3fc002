body:
  text: 術曰以出北門步數乘西行步數倍之為實此以折而西行為股自木至邑南十四步為句以出北門二十步為句率北門至西隅為股率即半廣數故以出北門句率乘西行股得半廣股率乘句之幂然此幂居半以西故又倍之合半以東也并出南門步數為從法開方除之即邑方此術之幂東西廣如邑方南北自木盡邑南十四步為袤合南北步數為廣袤差故連并兩步數為從法以為隅外之幂也草曰置出北門二十步為小句西行一千七百七十五步為大股相乘得三萬五千五百步為小句乘大股幂又為小股乘大句幂又為自木至邑南十四步與半邑方相乘幂倍之得七萬一千步為自木至邑南十四步與邑方相乘幂以為實并出北門二十步出南門十四步得三十四步為從法開方除之得二百五十步即邑方也合問説曰此帶從開方法也邑方為廣自木至邑南十四步為袤廣袤相乘為實合南北步數為廣袤差以為從法開方除之得邑方今有邑方十里各中開門甲乙俱從邑中央而出乙東出甲南出出門不知步數邪向東門磨邑適與乙會率甲行五乙行三問甲乙行各幾何
  hash: sha256:275d7dc9066de6cd209cec8346d4a4e58014486b4a60bf809975a598605b71a5
