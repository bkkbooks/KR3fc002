body:
  text: 周乘三圍是并合衆句以為一句則句長而股短故術以木長謂之句圍之謂之股言之倒互句與股求弦亦如前圖句三自乘為朱幂股四自乘為靑幂合朱靑二十五為弦五自乘幂出上第一圖句股幂合為弦幂明矣然二幂之數謂倒在於弦幂之中而巳可更相裏者則成方幂其居表者則成矩幂二表裏形訛而數均又按此圖句幂之矩靑卷白表是其幂以股弦差為廣股弦并為袤而股幂方其裏股幂之矩靑卷白表是其幂以句弦差為廣句弦并為袤而句幂方其裏是故差之與并用除之短長互相乘也潢按術文以七周乘三圍為股疑有衍誤當作以七周乘圍為股或作以七周乘三尺為股注弦七周乘三圍亦誤餘詳説中草曰以七周乘圍三尺得二十一尺為股自乘得四百四十一尺為股幂又置木長二十尺為句自乘得四百尺為句幂并之得八百四十一尺為弦幂開方除之得二十九尺為弦即葛之長也合問説曰云句與股求弦亦如前圖至謂倒在於弦幂之中而巳者謂合句股幂倒互成弦幂倒在之在當作互倒互云者即前注所云句自乘為朱方股自乘為靑方令出入相補各從其類因就其餘不移動也合成弦方之幂是也圖見前云可更相裏者文有脫誤當作可更相表裏居
