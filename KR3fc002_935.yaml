body:
  text: 周乘三圍是并合衆句以爲一句則句長而股短故術以木長謂之句圍之謂之股言之倒互句與股求弦亦如前圖句三自乘爲朱幂股四自乘爲靑幂合朱靑二十五爲弦五自乘幂出上第一圖句股幂合爲弦幂明矣然二幂之數謂倒在於弦幂之中而巳可更相裏者則成方幂其居表者則成矩幂二表裏形訛而數均又按此圖句幂之矩靑卷白表是其幂以股弦差爲廣股弦并爲袤而股幂方其裏股幂之矩靑卷白表是其幂以句弦差爲廣句弦并爲袤而句幂方其裏是故差之與并用除之短長互相乘也潢按術文以七周乘三圍爲股疑有衍誤當作以七周乘圍爲股或作以七周乘三尺爲股注弦七周乘三圍亦誤餘詳説中草曰以七周乘圍三尺得二十一尺爲股自乘得四百四十一尺爲股幂又置木長二十尺爲句自乘得四百尺爲句幂并之得八百四十一尺爲弦幂開方除之得二十九尺爲弦卽葛之長也合問説曰云句與股求弦亦如前圖至謂倒在於弦幂之中而巳者謂合句股幂倒互成弦幂倒在之在當作互倒互云者卽前注所云句自乘爲朱方股自乘爲靑方令出入相補各從其𩔖因就其餘不移動也合成弦方之幂是也圖見前云可更相裏者文有脫誤當作可更相表裏居
