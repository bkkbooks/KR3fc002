body:
  text: 三下部猶差一人差得一以通於本率即上下部等也於今有術副并為所有率未并者各為所求率五錢為所有數而今有之即得等耳假令七人分錢欲令上二人與下五人等則上下部差三人并上部為十三下部為十五下多上少下不減上當以上下部列差而後均減乃合所問此可倣下術令上二人分二錢半為上率令三人分二錢半為下率上下二率以少減多餘為實置二人三人各半之減五人餘為法實如法得一錢即衰相去也下衰率六分之五者所得錢數潢按注各均為一例者也例當作列列衰也草曰置錢錐行衰戊一丁二丙三乙四甲五於位并甲五乙四二人得九為上部并丙三丁二戊一三人得六為下部上下部差一人差數三以三均加焉得戊四丁五丙六并之得十五為下部乙七甲八并之得十五為上部并上下部得三十為法以所分五錢乘甲八得四十乘乙七得三十五乘丙六得三十乘丁五得二十五乘戊四得二十各自為實實如法甲得一錢三十分錢之一十即六分錢之二乙得一錢三十分錢之五即六分錢之一丙得一錢丁得三十分錢之二十五即六分錢之五戊得三十分錢之二十即六分錢之四合問説曰注云均加上部則得二三均加下部則得
  hash: sha256:07afe0860129df895a6b20ee0b3bf817da8a99c100019f212ad3b3f00f8bd20d
