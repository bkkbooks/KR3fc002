body:
  text: 三下部猶差一人差得一以通於本率卽上下部等也於今有術副并爲所有率未并者各爲所求率五錢爲所有數而今有之卽得等耳假令七人分錢欲令上二人與下五人等則上下部差三人并上部爲十三下部爲十五下多上少下不減上當以上下部列差而後均減乃合所問此可倣下術令上二人分二錢半爲上率令三人分二錢半爲下率上下二率以少減多餘爲實置二人三人各半之減五人餘爲法實如法得一錢卽衰相去也下衰率六分之五者所得錢數潢按注各均爲一例者也例當作列列衰也草曰置錢錐行衰戊一丁二丙三乙四甲五於位并甲五乙四二人得九爲上部并丙三丁二戊一三人得六爲下部上下部差一人差數三以三均加焉得戊四丁五丙六并之得十五爲下部乙七甲八并之得十五爲上部并上下部得三十爲法以所分五錢乘甲八得四十乘乙七得三十五乘丙六得三十乘丁五得二十五乘戊四得二十各自爲實實如法甲得一錢三十分錢之一十卽六分錢之二乙得一錢三十分錢之五卽六分錢之一丙得一錢丁得三十分錢之二十五卽六分錢之五戊得三十分錢之二十卽六分錢之四合問説曰注云均加上部則得二三均加下部則得
  hash: sha256:6b172c6f25db5d321a5626019a9acd21c37868bc8615449a495b5e63e8439964
