body:
  text: 多餘爲法實如法得一人其求物價者以適足乘人數得物價盈不足數爲實者數單見卽衆人差故以爲實所出率以少減多者餘卽一人差故以爲法以除衆人差得人數以適足乘人數卽得物價也此術意謂所出率以少減多者餘是一人不足之差不足數爲衆人之差以一人差約之故得人之數也買豕草曰以盈一百爲實置人出一百以人出九十減之餘一十爲法實如法得一十卽人數也置人數一十以適足九十乘之得九百卽豕價也合問買犬草曰以不足九十爲實置人出五十以人出五減之餘四十五爲法實如法得二卽人數也置人數二以適足五十乘之得一百卽犬價也合問今有米在十斗桶中不知其數滿中添粟而舂之得米七斗問故米幾何荅曰二斗五升術曰以盈不足術求之假令故米二斗不足二升令之三斗有餘二升按桶受一斛若使故米二斗須添粟八斗以滿之八斗得糲米四斗八升課於七斗是爲不足二升若使故米三斗須添粟七斗以滿之七斗得糲米四斗二升課於七斗是爲有餘二升以盈不足維乘假令之數者欲爲齊同之意實如法卽得故米斗數乃不盈不朒之正數也
