body:
  text: 多餘為法實如法得一人其求物價者以適足乘人數得物價盈不足數為實者數單見即衆人差故以為實所出率以少減多者餘即一人差故以為法以除衆人差得人數以適足乘人數即得物價也此術意謂所出率以少減多者餘是一人不足之差不足數為衆人之差以一人差約之故得人之數也買豕草曰以盈一百為實置人出一百以人出九十減之餘一十為法實如法得一十即人數也置人數一十以適足九十乘之得九百即豕價也合問買犬草曰以不足九十為實置人出五十以人出五減之餘四十五為法實如法得二即人數也置人數二以適足五十乘之得一百即犬價也合問今有米在十斗桶中不知其數滿中添粟而舂之得米七斗問故米幾何答曰二斗五升術曰以盈不足術求之假令故米二斗不足二升令之三斗有餘二升按桶受一斛若使故米二斗須添粟八斗以滿之八斗得糲米四斗八升課於七斗是為不足二升若使故米三斗須添粟七斗以滿之七斗得糲米四斗二升課於七斗是為有餘二升以盈不足維乘假令之數者欲為齊同之意實如法即得故米斗數乃不盈不朒之正數也
