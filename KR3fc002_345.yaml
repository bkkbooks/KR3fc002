body:
  text: 三層實置於上方置於中隅置於下借一算者隅也除有實有法開方有實無法故借一算以為隅孫子所謂下法也步之者以隅步實定初商之位也超一等者言百之面十言萬之面百故以借算步之超一等至實百位下商十至實萬位下商百自千以上可類推也議即商也議所得者初商之數也置於實之上以一乘所借一算為法者以初商乘隅為方孫子所謂方法也一乘者對立方再乘而言也而以除者以初商乘方減實也除巳倍法為定法者又以初商乘隅加方也其復除折法而下者方一退也復置借算步之如初者以隅步實定次商之位即隅再退也超退一等步之猶超進一等步之也以復議一乘之者復議次商也一乘之者以次商乘隅也所得副以加定法者以次商乘隅加方也以除者以次商乘方減實也以所得副從定法者又以次商乘隅加方也復除折下如前者方一退隅再退求得三商以三商乘隅加方又以三商乘方減實如初商次商也若開之不盡者為不可開當以而命之者以面為母實餘
