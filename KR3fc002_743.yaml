body:
  text: 之穿二尺後日倍之穿四尺以日分子二乘四尺得八尺如日分母十七而一得四寸十七分寸之十二增二日定穿三尺得三尺四寸十七分寸之十二即大鼠穿也合問小鼠穿草曰小鼠日自半一日穿一尺次日半之穿五寸後日半之穿二寸半以日分子二乘二寸半得五寸如日分母十七而一為十七分寸之五增二日定穿一尺五寸得一尺五寸十七分寸之五即小鼠穿也合問今有醇酒一斗直錢五十行酒一斗直錢一十今將錢三十得酒二斗問醇行酒各得幾何答曰醇酒二升半行酒一斗七升半術曰假令醇酒五升行酒一斗五升有餘一十令之醇酒二升行酒一斗八升不足二據醇酒五升直錢二十五行酒一斗五升直錢十五課於三十是為有餘十據醇酒二升直錢一十行酒一斗八升直錢一十八課於三十是為不足二以盈不足術求之此問己有重説及其齊同之意也潢按注重説當作重設草曰置醇酒五升行酒一斗五升有餘一十於右行置醇酒二升行酒一斗八升不足二於左
