body:
  text: 之半故曰實則同也所云夾塹堵者中錐之鱉臑也如圖甲乙壬庚與丁丙癸辛兩鱉臑立而視之以壬乙庚與癸丙辛為句股底幂甲乙與丁丙為高皆中錐之鱉臑也凡塹堵上袤短者連陽馬也下袤短者與鱉臑連也下兩袤相等亦與鱉臑連也者因此問三廣不等故云亦也甲乙為塹堵上袤短於丁巳下袤乙甲庚辛壬癸為塹堵甲丁丙辛庚為一陽馬乙癸壬戊巳為一陽馬是上袤短者連陽馬也癸庚為塹堵下袤短於甲乙上袤丁丙庚辛壬癸為塹堵丙甲庚辛為一鱉臑丁乙癸壬為一鱉臑是下袤短者與鱉臑連也
  hash: sha256:f5b6d56d736b7628e228904155d6e51c29af1a8528eb4011a820c5f9683a627a
