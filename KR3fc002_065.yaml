body:
  text: 一萬九千二十五步如周幂率三百一十四而一得二千六百八步三百一十四分步之一百一十三如畝法二百四十步而一得十畝二百八步三百一十四分步之一百一十三密率草曰置周一百八十一步自乘得三萬二千七百六十一步以圓幂率七乘之得二十二萬九千三百二十七步為實如周幂率八十八而一得二千六百五步八十八分步之八十七又如畝法二百四十步而一得十畝二百五步八十八分步之八十七説曰注云圓中容六弧之一面東原戴氏云六觚原本訛作六弧考六角形其平面亦有六八角形其平面亦有八古人謂之六觚八觚若截圓形為六古人謂之弧背其弧即圓周不得云圓中容六弧之一面按此説非也六弧者割全圓為六弧也圓中容六弧之一面即弧弦也在弧田則謂之弦在割圓則謂之面義各有屬弧田術有弦有矢不言弧背其弧背直謂之弧沈存中筆談會圓之術云割田之弧云所割之弧云求弧數是南宋時尚不云弧背授時術始有
  hash: sha256:8f0920807a15528b5f94c3c56478fd2f738bbb13188d96ce0149e78b030bfa71
