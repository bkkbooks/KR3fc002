body:
  text: 為一千八十十二分之一為九百九十置之於左又以分母七遍乘諸分子及巳通者仍以分母除其子則一為八萬三千一百六十半為四萬一千五百八十三分之一為二萬七千七百二十四分之一為二萬七百九十五分之一為一萬六千六百三十二六分之一為一萬三千八百六十七分之一為一萬一千八百八十八分之一為一萬三百九十五九分之一為九千二百四十十分之一為八千三百一十六十一分之一為七千五百六十十二分之一為六千九百三十并之得二十五萬八千六十三以為法置田二百四十步亦以一為八萬三千一百六十乘之得一千九百九十五萬八千四百步為實實如法得七十七步二十五萬八千六十三分步之八萬七千五百四十九子母各以三約之為八萬六千二十一分步之二萬九千一百八十三即從步也合問今有積五萬五千二百二十五步問為方幾何答曰二百三十五步又有積二萬五千二百八十一步問為方幾何
