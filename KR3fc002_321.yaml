body:
  text: 分之一為七分之一十一八分之一為八分之一十一九分之一為九分之一十一十分之一為十分之一十一十一分之一為一置之於左又以分母一十遍乘諸分子及巳通者各以其母除其子則一為一百一十半為五十五三分之一為三分之一百一十四分之一為四分之一百一十約為二分之五十五五分之一為二十二六分之一為六分之一百一十約為三分之五十五七分之一為七分之一百一十八分之一為八分之一百一十約為四分之五十五九分之一為九分之一百一十十分之一為一十一十一分之一為一十置之於左又以分母九遍乘諸分子及已通者各以其母除其子則一為九百九十半為四百九十五三分之一為三百三十四分之一為二分之四百九十五五分之一為一百九十八六分之一為一百六十五七分之一為七分之九百九十八分之一為四分之四百九十五九分之一為一百一十十分之一為九十九十一分之一為九十置之於左又以分母四遍乘諸分子及巳通者各以其
