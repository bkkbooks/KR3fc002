body:
  text: 斛之六術曰以車程行空重相乘為法并空重以乘道里各自為實實如法得一日臣淳風等謹按此術重往空還一輸再行道也置空行一里用七十分日之一重行一里用五十分日之一齊而同之空重行一里之路往返用一百七十五分日之六定言之者一百七十五里之路往返用六日也故并空重者齊其子也空重相乘者同其母也於今有術至輸所里為所有數六為所求率齊一百七十五為所有率而今有之即各得輸所用日也加載輸各一日欲得幾日也而以六人乘之欲知致一車用人也又以傭價乘之欲知致車人傭直幾錢以二十五斛除之欲知致一斛之傭直也加一斛粟價即致一斛之費加一斛之價於致一斛之傭直即凡輸一斛餘粟取傭所用錢各以約其算數為衰今按甲衰四十二乙衰二十四丙衰十六丁衰十五戊衰二十巳衰十六於今有術副并為所有率未并者各自為所求率所賦粟為所有數此今有衰分之義也副并為法以所賦粟乘未并者各自為實實如法得一斛各置所當出粟以其一斛之費乘之如算數而一得率算出九錢一百三十三分錢之三又載輸之間各一日者即二日也潢按甲自輸其縣即不應有傭價經云傭價一日一錢者衍文也草曰以甲縣一斛粟價二十約甲算四萬二千得二千一百為甲泛衰以空行七十里重行五十里相乘得三千五百里為法置乙縣到輸所
