body:
  text: 説曰此問所有數止於兩故以一斤展十六兩爲法以七兩乘今有絲兩數爲實實如法得耗數李籍音義云耗減也潢按原有絲一斤減去七兩今有絲二十三斤五兩減去十斤三兩四銖半此今有之義也今有生絲三十斤乾之耗三斤十二兩今有乾絲一十二斤問生絲幾何荅曰一十三斤一十一兩十銖七分銖之二術曰置生絲兩數除耗數餘以爲法餘四百二十兩卽乾絲率三十斤乘乾絲兩數爲實實如法得生絲數凡所謂率者細則俱細麤則俱麤兩數相推而巳故品物不同如上縑絲之比得相與乘焉三十斤凡四百八十兩今生絲率四百八十兩乾絲率四百二十兩則其數相通可俱爲銖可俱爲兩可俱爲斤無所歸滯也若然宜以所有乾絲斤數乘生絲兩數爲實今斤兩錯互而亦同歸者使乾絲以兩數爲率生絲以斤數爲率譬之異𩔖亦各有一定之勢臣淳風等謹按此術置生絲兩數除耗數餘卽乾絲之率於今有術爲所有率三十斤爲所求率乾絲兩數爲所有數凡所謂率者細則俱細麤則俱麤今以斤乘兩者乾絲卽以兩數爲率生絲卽以斤數爲率譬之異物各有一定之率也潢按注得相與乘焉相與乘當作相與率傳寫之誤也
