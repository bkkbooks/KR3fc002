body:
  text: 說曰此問所有數止於兩故以一斤展十六兩為法以七兩乘今有絲兩數為實實如法得耗數李籍音義云耗減也潢按原有絲一斤減去七兩今有絲二十三斤五兩減去十斤三兩四銖半此今有之義也今有生絲三十斤乾之耗三斤十二兩今有乾絲一十二斤問生絲幾何答曰一十三斤一十一兩十銖七分銖之二術曰置生絲兩數除耗數餘以為法餘四百二十兩即乾絲率三十斤乘乾絲兩數為實實如法得生絲數凡所謂率者細則俱細粗則俱粗兩數相推而巳故品物不同如上縑絲之比得相與乘焉三十斤凡四百八十兩今生絲率四百八十兩乾絲率四百二十兩則其數相通可俱為銖可俱為兩可俱為斤無所歸滯也若然宜以所有乾絲斤數乘生絲兩數為實今斤兩錯互而亦同歸者使乾絲以兩數為率生絲以斤數為率譬之異類亦各有一定之勢臣淳風等謹按此術置生絲兩數除耗數餘即乾絲之率於今有術為所有率三十斤為所求率乾絲兩數為所有數凡所謂率者細則俱細粗則俱粗今以斤乘兩者乾絲即以兩數為率生絲即以斤數為率譬之異物各有一定之率也潢按注得相與乘焉相與乘當作相與率傳寫之誤也
