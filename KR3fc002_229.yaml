body:
  text: 次日織三寸三十一分寸之七次日織六寸三十一分寸之十四次日織一尺二寸三十一分寸之二十八次日織二尺五寸三十一分寸之二十五術曰置一二四八十六為列衰副并為法以五尺乘未并者各自為實實如法得一尺草曰置一二四八十六為列衰副并得三十一為法以五尺展為五十寸乘列衰一二四八十六之未并者初日得五十寸次日得一百寸次日得二百寸次日得四百寸次日得八百寸各自為實實如法得一寸三十一分寸之十九為初日織得三寸三十一分寸之七為次日織得六寸三十一分寸之十四為次日織得一尺二寸三十一分寸之二十八為次日織得二尺五寸三十一分寸之二十五為次日織合問說曰置一二四八十六為列衰者設數一為初日織次日倍之為二次日倍之為四次日倍之為八次日倍之為十六故置一二四八十六為列衰副并得三十一為法也大夫五人分五鹿以五四三二一為列衰是遞減一數成率此以
  hash: sha256:79ed5c6c0049b0e593568283bad8c1649f448c4d98eeb9127d36eb5e70753ab0
