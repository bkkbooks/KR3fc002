body:
  text: 次日織三寸三十一分寸之七次日織六寸三十一分寸之十四次日織一尺二寸三十一分寸之二十八次日織二尺五寸三十一分寸之二十五術曰置一二四八十六爲列衰副并爲法以五尺乘未并者各自爲實實如法得一尺草曰置一二四八十六爲列衰副并得三十一爲法以五尺展爲五十寸乘列衰一二四八十六之未并者初日得五十寸次日得一百寸次日得二百寸次日得四百寸次日得八百寸各自爲實實如法得一寸三十一分寸之十九爲初日織得三寸三十一分寸之七爲次日織得六寸三十一分寸之十四爲次日織得一尺二寸三十一分寸之二十八爲次日織得二尺五寸三十一分寸之二十五爲次日織合問説曰置一二四八十六爲列衰者設數一爲初日織次日倍之爲二次日倍之爲四次日倍之爲八次日倍之爲十六故置一二四八十六爲列衰副并得三十一爲法也大夫五人分五鹿以五四三二一爲列衰是遞減一數成率此以
  hash: sha256:a8fbfb464107d6576a3106a007f8fbea6d1a3c51a1f2759bf1a403b1afb714bc
