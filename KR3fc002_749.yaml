body:
  text: 大器小器不足左行升升升令不足二斗維乘右行大器五斗小器五斗皆得十斗令盈十斗維乘左行五斗五升得五十五斗維乘左行二斗五升得二十五斗大器小器有餘右行斗斗斗大器小器不足左行斗斗斗并之得大器六十五斗小器三十五斗各為實并盈十斗不足二斗得十二為法實如法得大器容五斗十二分斗之五即二十四分斛之十三也小器容二斗十二分斗之十一即二十四分斛之七也合問説曰答不云大器容五斗十二分斗之五小器容二斗十二分斗之十一而云大器容二十四分斛之十三小器容二十四分斛之七者是省除法也如草求到大器六十五小器三十五以一斛乘之各為實以十斗乘十二得一百二十
