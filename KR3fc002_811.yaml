body:
  text: 分斗之九十九並數之先見者也云以中下禾先見之實令乘右行中下禾秉數以減之故亦如前各求列實以減下實也者如前以法三十六乘右行下實三十九斗得一千四百四斗乃以中禾先見之實一百五十三斗令乘右行中禾二秉得三百六斗為中禾列實又以下禾先見之實九十九斗令乘右行下禾一秉仍得九十九斗為下禾列實并之得四百五斗以減下實一千四百四斗餘九百九十九斗為上禾一位之實以上禾五秉除之得三百三十三斗為上禾一秉之實亦寄法為分母也云三實同用不滿法者以法命之母實皆當除之者上中下三禾實同用法三十六為分母置上禾實三百三十三斗中禾實一百五十三斗下禾實九十九斗皆如法而一得上禾一秉九斗三十六分斗之九約為四分斗之一中禾一秉四斗三十六分斗之九約為四分斗之一下禾一秉二斗三十六分斗之二十七約為四分斗之三母實即法實上注云以法為母故云母實猶言母子云皆當除之者母子皆當以等數九除之也
