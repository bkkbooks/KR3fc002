body:
  text: 畝二十五步六十四分步之二十五密率為田草曰如前置七百五分於上位置徑八步一百七十六分步之一十三通分內子得一千四百二十一分於下位上下相乘得一百萬一千八百五分為實以分母八乘一百七十六得一千四百八為法除之得七百一十一步一千四百八分步之七百一十七又以畝法二百四十步除之得二畝二百三十一步一千四百八分步之七百一十七説曰此可令中外周各自為圓田以中圓減外圓餘則環實也者如第一問置中周九十二步自乘得八千四百六十四步十二而一得七百五步十二分步之四為中圓於上位又置外周一百二十二步自乘得一萬四千八百八十四步十二而一得一千二百四十步十二分步之四為外圓於下位以上減下餘五百三十五步以畝法二百四十步除之得二畝五十五步即環實也餘皆倣此九章算術細草圖説卷一門下晚學生沈欽裴算校
  hash: sha256:7ef22e64d05d4fed8d097bd68dc4c203a87bea541e543ecba0ac737bc5327bb0
