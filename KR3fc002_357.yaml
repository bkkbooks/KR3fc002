body:
  text: 乘下令隅自乘為方幂也皆副以加定法以定法除三面三𠔳一隅皆巳有幂以上議命之而除去三袤之厚也除巳倍下并中從定法凡再以中三以下加定法者三𠔳各當以兩面之幂連於兩方之面一隅連於三𠔳之端以待復除也言不盡意解此要當以棊乃得明耳復除折下如前開之不盡者亦為不可開術亦有以定法命分者不如故幂開方以微數為分也若積有分者通分內子為定實定實乃開之訖開其母以報除臣淳風等按分母可開者竝通之積先合三母既開之後一母尚存故開分母求一母為法以報除也若母不可開者又以母再乘定實乃開之訖令如母而一臣淳風等謹按分母不可開者本一母也又以母再乘之今合三母既開之後一母猶存故令如母而一得全面也按開立方者立方適等求其一面之數也借一算步之超二等者立方求積方再自乘就積開之故超二位言千之面十言百萬之面百也議所得以再乘所借一算為法而以除者求為方幂以議命之而除則立方等也除巳三之為定法者為積未盡當復更除故豫張三面巳定方幂為定法也復除折而下者三面方幂皆巳有自乘之數須得折議定其厚薄據開平方百之面十其開立方即千之面十而定法巳有成方之幂故復除之當以千為百折下一等也以三乘所得數置中行者設三𠔳之定長也復借一算置下行者欲以為隅方立方等未有數且置一算定其位也步之中超一下超二者上方法長自乘而一折中𠔳法但有長故降一等下隅法無面長故又降一等也復置議以一乘中者為三𠔳借幂也再乘下者當令隅自乘為方幂也皆副以加定法以定法除者三面三𠔳一隅皆巳有幂以上議命之而除去三袤之厚也除巳倍下并中從定法者三𠔳各當以兩面之幂連於兩方之面一隅連於三𠔳之端以待復除也其
