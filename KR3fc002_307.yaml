body:
  text: 四十步亦以一為八百四十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一於位以最下分母八遍乘諸分子及全步皆為八各以其母除之則一為八半為四三分之一為三分之八四分之一為二五分之一為五分之八六分之一為六分之八約為三分之四七分之一為七分之八八分之一為一置之於左又以分母七遍乘諸分子及巳通者各以其母除其子則一為五十六半為二十八三分之一為三分之五十六四分之一為一十四五分之一為五分之五十六六分之一為三分之二十八七分之一為八八分之一為七置之於在又以分母三遍乘諸分子及巳通者各以其母除其子則一為一百六十八半為八十四三分之一為五十六四分之一為四十二五分之一為五分之一百六十八六分之一為二十八七分之一為二十四八分之一為二十一置之於左又以分母五遍乘諸分子及巳通者
  hash: sha256:58457989a14a55f28364f9005ddf562ff54277f9e568721387be2d6119e75a5d
