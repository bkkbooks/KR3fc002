body:
  text: 方一退也中𠔳法但有長故降一等者𠔳再退也下隅法無面長故又降一等者隅三退也云爲三𠔳備幂也者三𠔳以初商爲長有面無幂今以次商乘之是爲三𠔳備幂也云令隅自乘爲方幂也者次商自乘爲隅幂也云三面三𠔳一隅皆巳有幂者三方皆以初商爲廣袤自乘而成三方幂三𠔳皆以初商爲袤次商爲廣相乘而成三𠔳幂一隅以次商爲廣袤自乘而成一隅幂也云以上議命之而除去三幂之厚者上議次商也以次商乘三面三𠔳一隅之幂於實內減去次商之立積也云凡再以中三以下加定法者并初商次商自乘三之爲三商之方法也如圖三𠔳各以兩面之幂連於兩方之面一隅連於三𠔳之端今有積四千五百尺亦謂立方之尺也問爲立圓徑幾何荅曰二十尺依密率立圓徑二十八尺計積四千一百九十尺二十一
