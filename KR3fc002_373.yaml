body:
  text: 方一退也中𠔳法但有長故降一等者𠔳再退也下隅法無面長故又降一等者隅三退也云為三𠔳備幂也者三𠔳以初商為長有面無幂今以次商乘之是為三𠔳備幂也云令隅自乘為方幂也者次商自乘為隅幂也云三面三𠔳一隅皆巳有幂者三方皆以初商為廣袤自乘而成三方幂三𠔳皆以初商為袤次商為廣相乘而成三𠔳幂一隅以次商為廣袤自乘而成一隅幂也云以上議命之而除去三幂之厚者上議次商也以次商乘三面三𠔳一隅之幂於實內減去次商之立積也云凡再以中三以下加定法者并初商次商自乘三之為三商之方法也如圖三𠔳各以兩面之幂連於兩方之面一隅連於三𠔳之端今有積四千五百尺亦謂立方之尺也問為立圓徑幾何答曰二十尺依密率立圓徑二十八尺計積四千一百九十尺二十一
