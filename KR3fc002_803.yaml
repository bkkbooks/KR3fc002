body:
  text: 禾下禾列為二行上禾中禾下禾列為三行又如羊犬雞兔列四行麻麥菽答黍列五行是也謂之方程者無論行之多少總以左右分列二行相課也云行之左右無所同存者即上云每行各自為率無所同也云且為有所據而言者既繫之以物又列之為行為有所據而言也云又列中行如右行不言左行者文不具也云為術之意令少行減多行反覆相減則頭位必先盡者如以右行上禾遍乘中行則右行少中行多以右減中不𥁞作兩度減之是反覆相減也減去中行上禾是頭位先𥁞也云舉率以相減不害餘數之課也者少行減多行頭位先盡次位以下減餘為多少二物之差其下位減餘亦為多少二實之差舉率者即上注令每行為率之率也餘數之課即多少二物之差與下實之差也云若消去頭位則下去一物之實者如消去中行上禾則下實內亦消去上禾之列實也云如是疊令左右行相減審其正負則可得而知者此問下實始終總為共實行中不分正負云審其正負者統下有差實者言也云先令右
