body:
  text: 餘一銖又置一萬五千四百八十四銖於下位以鈞積銖一萬一千五百二十除之得一鈞餘三千九百六十四銖以斤積銖三百八十四除之得一十斤餘一百二十四銖以兩積銖二十四除之得五兩餘四銖上位得一石一鈞一十七斤一十四兩一銖兩四錢下位得一鈞一十斤五兩四銖兩五錢合問説曰其率者錢多物少錢數為實物數為法以法除實餘為貴物之數以實餘減法餘為賤物之數如買竹一問以出錢五百七十六為實買竹七十八箇為法實如法得七錢為賤價增一錢於七錢得八錢為貴價實餘三十即貴物數以實餘三十減法七十八餘四十八即賤物數法餘為賤故曰法賤實餘為貴故曰實貴注云如欲令差分者以其貴賤多少參差不齊有似差分故云然也其求石鈞斤兩以積銖各除法實各得其積數餘各為銖者所買率止於銖故所求率亦先以石鈞斤兩積銖通之既乘除訖以石鈞斤兩積銖除實餘為貴物數又以石鈞斤兩積銖除法餘為賤物數也積銖者兩積二
