body:
  text: 今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一十一分步之一十二分步之一求田一畝問從幾何荅曰七十七步八萬六千二十一分步之二萬九千一百八十三術曰下有一十二分以一爲八萬三千一百六十半爲四萬一千五百八十三分之一爲二萬七千七百二十四分之一爲二萬七百九十五分之一爲一萬六千六百三十二六分之一爲一萬三千八百六十七分之一爲一萬一千八百八十八分之一爲一萬三百九十五九分之一爲九千二百四十一十分之一爲八千三百一十六十一分之一爲七千五百六十十二分之一爲六千九百三十并之得二十五萬八千六十三以爲法置田二百四十步亦以一爲八萬三千一百六十乘之爲實實如法得從步臣淳風等謹按凡爲術之意約省爲善宜云下有一十二分以一爲二萬七千七百二十半爲一萬三千八百六十三分之一爲九千二百四十四分之一爲六千九百三十五分之一爲五千五百四十四六分之一爲四千六百二十七分之一爲三千九百六十八分之一爲三千四百六
  hash: sha256:02c20012a1470386472f29fa21e5e4f2a84520fac7343d1d52ac800036f4a196
