body:
  text: 百五十二為方幂率以約圓幂得三百五十五為圓幂率又術曰周自相乘十二而一六觚之周其於圓徑三與一也故六觚之周自相乘為幂若圓徑自乘者九方九方凡為十二觚者十有二故曰十二而一即十二觚之幂也今此令周自乘非但若為圓徑自乘者九方而已然則十二而一所得又非十二觚之類也若欲以為圓幂失之於多矣以六觚之周十二而一可也於𡽪新術直令圓周自乘又以二十五乘之三百一十四而一得圓幂其率三百一十四者周自乘之幂也置周數六尺二寸八分令自乘得幂三十九萬四千三百八十四分又置圓幂三萬一千四百分皆以一千二百五十六約之得此率臣淳風等謹按方面自乘即得其積圓周求其幂假率乃通但此術所求用三一為率圓田正法半周及半徑以相乘今乃用全周自乘故須以十二為母何者據全周而求半周則須以二為法就全周而求半徑復假六以除之是二六相乘除周自乘之數依密率以七乘之八十八而一潢按劉注其率下脫二十五者圓幂也七字草曰置周三十步自乘得九百步為實十二而一得七十五步合問草曰置周一百八十一步自乘得三萬二千七百六十一步為實十二而一得二千七百三十步如畝法二百四十步而一得十一畝九十步十二分步之一合問說曰云六觚之周自相乘為幂若圓徑自乘者
