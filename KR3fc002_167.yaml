body:
  text: 草曰置菽一斗展爲一十升以熟菽率二十二乘之得二百三十升爲實以菽率十爲法除之得二斗三升卽熟菽也合問説曰此亦約二率而乘除先以通分術入之後以約分術人之也熟菽之率一百三半因其有半以母二通之得二百七於上位亦以母二通菽率四十五得九十於下位以下減上上餘二十七轉以上餘減下下位餘九又以下餘九減上餘二十七上位亦餘九是九爲等數也以等數九約二百七得二十三爲所求率以等數九約九十得十爲所有率故二十三之十而一也注云先以等數九約之所求之率得一十一半所有之率得五者以等數九約熟菽率一百三半得一十一半以等數九約菽率四十五得五也今有菽二斗欲爲䜴問得幾何荅曰爲䜴二斗八升術曰以菽求豉七之五而一臣淳風等謹按䜴率六十三爲菽所求宜以菽乘此率術欲從省先以等數九約之所求之率得七而所有之率得五也草曰置菽二斗展爲二十升以豉率七乘之得
  hash: sha256:f94cd6ea6dd1cf3e3d5608b6490605952dc35f5bb4619d54699c5a3109fd033b
