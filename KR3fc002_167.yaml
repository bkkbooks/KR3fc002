body:
  text: 草曰置菽一斗展為一十升以熟菽率二十二乘之得二百三十升為實以菽率十為法除之得二斗三升即熟菽也合問說曰此亦約二率而乘除先以通分術入之後以約分術人之也熟菽之率一百三半因其有半以母二通之得二百七於上位亦以母二通菽率四十五得九十於下位以下減上上餘二十七轉以上餘減下下位餘九又以下餘九減上餘二十七上位亦餘九是九為等數也以等數九約二百七得二十三為所求率以等數九約九十得十為所有率故二十三之十而一也注云先以等數九約之所求之率得一十一半所有之率得五者以等數九約熟菽率一百三半得一十一半以等數九約菽率四十五得五也今有菽二斗欲為䜴問得幾何答曰為䜴二斗八升術曰以菽求豉七之五而一臣淳風等謹按䜴率六十三為菽所求宜以菽乘此率術欲從省先以等數九約之所求之率得七而所有之率得五也草曰置菽二斗展為二十升以豉率七乘之得
  hash: sha256:595e1606190887fd21ce976193ae5fbecd6c5eccec02c956039a43bea594e3c1
