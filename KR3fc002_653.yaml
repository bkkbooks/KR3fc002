body:
  text: 實實如法卽得云此雖迂迴然是其舊故就新而言之也者謂舊術迂迴故上注以差數減本重餘卽次尺之重蓋就新而言之也欽裴按舊術以四爲母令母乘本爲衰通其率者慮除或不𥁞則有通分內子之繁故爲此以乘代除之通率持金出關之術亦猶是也注斥爲迂迴眛其旨矣今有五人分五錢令上二人所得與下三人等問各得幾何荅曰甲得一錢六分錢之二乙得一錢六分錢之一丙得一錢丁得六分錢之五戊得六分錢之四術曰置錢錐行衰按此術錐行者謂如立錐初一次二次三次四次五各均爲一例者也并上二人爲九并下三人爲六六少於九三數不得等但以五四三二一爲率也以三均加焉副并爲法以所分錢乘未并者各自爲實實如法得一錢此問者令上二人與下三人等上下部差一人其差三均加上部則得二三均加下部則得三
  hash: sha256:ff5368d1f3dee2188642d60e72f174b7f196d2a13f4672244e1b862b14df080d
