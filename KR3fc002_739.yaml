body:
  text: 寸之六亦即莞長也合問説曰注云蒲增前七寸半莞增前四尺是為過一尺七寸半者蒲以七寸半增前四尺五寸長五尺二寸半莞以四尺增前三尺長七尺二長相課莞過一尺七寸半今有垣厚五尺兩鼠對穿大鼠日一尺小鼠亦日一尺大鼠日自倍小鼠日自半問幾何日相逢各穿幾何答曰二日十七分日之二大鼠穿三尺四寸十七分寸之十二小鼠穿一尺五寸十七分寸之五術曰假令二日不足五寸令之三日有餘三尺七寸半大鼠日倍二日合穿三尺小鼠日自半合穿一尺五寸并大鼠所穿合尺五寸課於垣厚五尺是為不足五寸令之三日大鼠穿得七尺小鼠穿得一尺七寸半并之以減垣厚五尺有餘三尺七寸半以盈不足術求之即得以後一日所穿乘日分子如日分母而一即各得日分子之中所穿故各增二日定穿即合所問也潢按大鼠日倍以下乃是注文混入術中并大
  hash: sha256:241646233c56b375c89a03f978d4974619c6fe3f0761de8fb4361719bc0118e8
