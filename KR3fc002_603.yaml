body:
  text: 十以等數一十約子母為六百五分斗之一百五十一合問説曰注云若徑求為米等數者置糲米三用粟五稗米二十七用粟五十糳米十二用粟二十五者置粟率五十糲率三十求等得一十約為糲米三用粟五粟率五十稗率二十七無等可約即為稗米二十七用粟五十粟率五十糳率二十四求等得二約為糳米十二用粟二十五以米率為分母粟率為分子也云齊其粟同其米者化糲三分之五為九百七十二分之一千六百二十稗二十七分之五十為九百七十二分之一千八百糳一十二分之二十五為九百七十二分之二千二十五云并齊為法者并分子得五千四百四十五為法也云以七斗乘同為實者以七斗乘分母九百七十二得六千八百四為實也實如法得米一斗五千四百四十五分斗之一千三百五十九以等數九約子母為六百五分斗之一百五十一今有人當稟粟二斛倉無粟欲與米一菽二以當所稟粟問各幾何
