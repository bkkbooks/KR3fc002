body:
  text: 十以等數一十約子母爲六百五分斗之一百五十一合問説曰注云若徑求爲米等數者置糲米三用粟五粺米二十七用粟五十糳米十二用粟二十五者置粟率五十糲率三十求等得一十約爲糲米三用粟五粟率五十粺率二十七無等可約卽爲粺米二十七用粟五十粟率五十糳率二十四求等得二約爲糳米十二用粟二十五以米率爲分母粟率爲分子也云齊其粟同其米者化糲三分之五爲九百七十二分之一千六百二十粺二十七分之五十爲九百七十二分之一千八百糳一十二分之二十五爲九百七十二分之二千二十五云并齊爲法者并分子得五千四百四十五爲法也云以七斗乘同爲實者以七斗乘分母九百七十二得六千八百四爲實也實如法得米一斗五千四百四十五分斗之一千三百五十九以等數九約子母爲六百五分斗之一百五十一今有人當稟粟二斛倉無粟欲與米一菽二以當所稟粟問各幾何
