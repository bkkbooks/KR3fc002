body:
  text: 返之步為法實如法而一即得也潢按注然則所行者今返率也數句疑有脫誤攺正於後然則故所行者今返率也今所行者故返率也令故所得返乘今返之率為實而以故返之率為法今有術也草曰置故籠重一石一十七斤展為一百三十七斤以故所行七十六步乘之得一萬四百一十二斤為法次置今籠重一石展為一百二十斤以今步一百乘之得一萬二千又以返數五十乘之得六十萬返為實實如法得五十七返一萬四百一十二分返之六千五百一十六以等數四約子母為二千六百三分返之一千六百二十九合問說曰注云負重一斛行四十里減重一斗進二里半者減一斗於一斛為負九斗日行四十二里半也云負重三斗以下與空行同者負三斗以下仍行六十里也云今負籠重六斗至即行也者置重行率四十里加十里為五十里以里法三百步通之得一萬五千步為實以一百步
