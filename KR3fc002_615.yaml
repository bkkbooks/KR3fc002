body:
  text: 返之步爲法實如法而一卽得也潢按注然則所行者今返率也數句疑有脫誤攺正於後然則故所行者今返率也今所行者故返率也令故所得返乘今返之率爲實而以故返之率爲法今有術也草曰置故籠重一石一十七斤展爲一百三十七斤以故所行七十六步乘之得一萬四百一十二斤爲法次置今籠重一石展爲一百二十斤以今步一百乘之得一萬二千又以返數五十乘之得六十萬返爲實實如法得五十七返一萬四百一十二分返之六千五百一十六以等數四約子母爲二千六百三分返之一千六百二十九合問説曰注云負重一斛行四十里減重一斗進二里半者減一斗於一斛爲負九斗日行四十二里半也云負重三斗以下與空行同者負三斗以下仍行六十里也云今負籠重六斗至卽行也者置重行率四十里加十里爲五十里以里法三百步通之得一萬五千步爲實以一百步
  hash: sha256:e64dd1ce1b83552b6d0ffab5207de62efa41f906f9a2fab326ea3f9cb9042263
