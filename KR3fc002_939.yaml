body:
  text: 今有池方一丈葭生其中央出水一尺引葭赴岸適與岸齊問水深葭長各幾何答曰水深一丈二尺葭長一丈三尺如圖半池方為句水深為股葭長為弦葭出水為股弦差術曰半池方自乘此以池方半之得五尺為句水深為股葭長為弦以句及股弦差求股弦故令句自乘先見矩幂也以出水一尺自乘減之出水者股弦差減此差幂於矩幂餘為倍股弦差乘股長之矩幂餘倍出水除之即得水深倍差為矩幂之廣水深是股欲先見葭長者出水一尺自乘以加於半池方自乘倍出水除之即得令此幂得出水一尺為袤故為矩而得葭長也加出水數得葭長臣淳風等謹按此葭本出水一尺既見水深故加出水尺數而得葭長也草曰置池方一丈展為一十尺半之得五尺為句自乘得二十五尺為句幂亦為股弦差乘股弦并幂以出水一尺為股弦差自乘得一尺為股弦差幂以減句幂二十五尺餘二十四尺為
