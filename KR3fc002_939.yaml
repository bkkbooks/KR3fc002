body:
  text: 今有池方一丈葭生其中央出水一尺引葭赴岸適與岸齊問水深葭長各幾何荅曰水深一丈二尺葭長一丈三尺如圖半池方爲句水深爲股葭長爲弦葭出水爲股弦差術曰半池方自乘此以池方半之得五尺爲句水深爲股葭長爲弦以句及股弦差求股弦故令句自乘先見矩幂也以出水一尺自乘減之出水者股弦差減此差幂於矩幂餘爲倍股弦差乘股長之矩幂餘倍出水除之卽得水深倍差爲矩幂之廣水深是股欲先見葭長者出水一尺自乘以加於半池方自乘倍出水除之卽得令此幂得出水一尺爲袤故爲矩而得葭長也加出水數得葭長臣淳風等謹按此葭本出水一尺旣見水深故加出水尺數而得葭長也草曰置池方一丈展爲一十尺半之得五尺爲句自乘得二十五尺爲句幂亦爲股弦差乘股弦并幂以出水一尺爲股弦差自乘得一尺爲股弦差幂以減句幂二十五尺餘二十四尺爲
