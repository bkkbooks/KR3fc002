body:
  text: 後凸形有後幂下幂皆正方其仰幂為甲乙壬癸長方兩側幂則左為甲庚癸右為乙辛壬皆外弧形共五幂於是立方之棊分而為四規內棊一謂之內棊規外棊三謂之外棊如圖左凸形甲丁壬辛仰幂依甲壬面切至下幂分為二形一得甲壬辛庚癸形為內棊一得甲壬癸丁形為左前外棊右凹形甲丁壬辛俯幂亦依甲壬面切至上幂分為二形一得甲乙丙丁壬形為右前外棊一得甲壬辛乙形為右後外棊內棊以甲庚立面聯左甲癸後甲辛為二弧幂并甲壬面所分之甲壬癸與甲壬辛二斜幂及下幂得五幂
