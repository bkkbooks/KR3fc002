body:
  text: 置不更分子一以大夫母五乘之得五又以簪裊母三乘五得十五又以上造母二乘十五得三十又以公士母一乘三十仍得三十於副位置簪裊分子一以大夫母五乘之得五又以不更母四乘五得二十又以上造母二乘二十得四十又以公士母一乘四十仍得四十於中位置上造分子一以大夫母五乘之得五又以不更母四乘五得二十又以簪裊母三乘二十得六十又以公士母一乘六十仍得六十於次位置公士分子一以大夫母五乘之得五又以不更母四乘五得二十又以簪裊母三乘二十得六十又以上造母二乘六十得一百二十於下位乃以羣母五四三二一相乘得一百二十為共母於是大夫五分之一化為一百二十分之二十四不更四分之一化為一百二十分之三十簪裊三分之一化為一百二十分之四十上造二分之一化為一百二十分之六十公士一分之一化為一百二十分之一百二十同其母為一百二十則子齊齊則可以各置為衰可以副并為法云動者為不動者衰也者各異母連
