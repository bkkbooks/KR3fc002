body:
  text: 之四十九卽粟積也密率草曰如前求到二十八萬八千尺以七乘之得二百一萬六千尺二百六十四而一得七千六百三十六尺二百六十四分尺之九十六子母各以二十四約之爲十一分尺之四卽粟積也爲粟草曰置粟積八千尺以粟斛法二尺七寸除之得二千九百六十二斛二十七分斛之二十六合問𡽪術草曰置粟積七千六百四十三尺一百五十七分尺之四十九通分內子得一百二十萬尺爲實次置粟斛法二尺七寸亦以一百五十七通之得四千二百三十九爲法除實得二千八百三十斛四千二百三十九分斛之三千六百三十子母各以三約之爲一千四百一十三分斛之一千二百一十密率草曰置粟積七千六百三十六尺十一分尺之四通分內子得八萬四千尺次置粟斛法二尺七寸亦以十一通之得二十九尺七寸爲法除實得二千八百二十八斛二百九十七分
