body:
  text: 黃金白銀有餘左行斤斤以左行有餘十五維乘右行金三銀二十七得黃金四十五斤白銀四百五斤以右行不足四十九維乘左行金二銀十八得黃金九十八斤白銀八百八十二斤黃金白銀不足右行斤斤黃金白銀有餘左行斤斤乃并黃金得一百四十三斤并白銀得一千二百八十七斤各自為實并有餘一十五不足四十九得六十四為法以除金實一百四十三斤得二斤餘實一十五斤以十六乘之得二百四十兩為實實如法得三兩餘實四十八兩以二十四乘之得一千一百五十二銖為實實如法得十八銖并之得二斤三兩十八銖即金重也以分母一十一乘法六十四得七百四為法以
  hash: sha256:db87e64cb7136daa561521d2d9b86919a0bb7bd23740ec2a5ff42fcc05e54b99
