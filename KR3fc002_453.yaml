body:
  text: 如圖庚壬辛丙爲一鼈臑庚壬癸丙爲一鼈臑合兩鼈臑成一陽馬如圖庚辛壬癸丙爲一陽馬甲丁癸庚丙爲一陽馬甲乙辛庚丙爲一陽馬合三陽馬而成一立方云悉割陽馬凡爲六鼈臑者謂以三陽馬悉割之爲六鼈臑也云觀其割分則體勢互通葢易了也者謂立方廣袤高參等者也云其棊或脩短或廣狹立方不等者壍堵術注所謂橢方者是也云亦割分以爲六鼈臑其形不悉相似然見數同積實均也者置此立方不等之棊或就廣袤相乘幂邪解之或就廣高相乘幂與袤高相乘幂邪解之則壍堵之形不等更置此壍堵悉割之爲六鼈臑其形亦不相似然其積則同爲立方六分之一故曰見數同積實均也云鼈臑殊形然陽馬異體則不純合然字衍則字疑誤云按邪解方棊以爲壍堵者必當以半爲分
  hash: sha256:33387b4271d37abd9fa97d4158e96e6006456531a15ec48b57ab087bf1cd1f7d
