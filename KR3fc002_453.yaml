body:
  text: 如圖庚壬辛丙為一鱉臑庚壬癸丙為一鱉臑合兩鱉臑成一陽馬如圖庚辛壬癸丙為一陽馬甲丁癸庚丙為一陽馬甲乙辛庚丙為一陽馬合三陽馬而成一立方云悉割陽馬凡為六鱉臑者謂以三陽馬悉割之為六鱉臑也云觀其割分則體勢互通蓋易了也者謂立方廣袤高參等者也云其棊或修短或廣狹立方不等者塹堵術注所謂橢方者是也云亦割分以為六鱉臑其形不悉相似然見數同積實均也者置此立方不等之棊或就廣袤相乘幂邪解之或就廣高相乘幂與袤高相乘幂邪解之則塹堵之形不等更置此塹堵悉割之為六鱉臑其形亦不相似然其積則同為立方六分之一故曰見數同積實均也云鱉臑殊形然陽馬異體則不純合然字衍則字疑誤云按邪解方棊以為塹堵者必當以半為分
  hash: sha256:9889560d35e03faf394742e9464f8e3ae6659478aea89dfc6a404364a851b3cd
