body:
  text: 一百四十升為實以菽率五為法除之得二斗八升即䜴也合問說曰先以等數九約之者置䜴率六十三於上位菽率四十五於下位以下減上上餘十八轉以上餘減下下位餘九又以下餘九減上餘十八上位亦餘九是九為等數也以等數九約䜴率六十三得七為所求率以等數九約菽率四十五得五為所有率故七乘五除也今有麥八斗六升七分升之三欲為小䵂問得幾何答曰為小䵂二斗五升一十四分升之一十三術曰以麥求小䵂三之十而一臣淳風等謹按小䵂之率十三半宜以母二通之以乘本麥之數術欲從省先以等數九約之所求之率得三所有之率得十也草曰置麥八斗六升七分升之三通分內子得六十斗五升展為六百五升以小䵂率三乘之得一千八百一十五升為實以分母七乘麥率十得七十為法除之得二斗五升七十分升之六十五子母各以五約之為一十四分升之一十三即小䵂也合問
