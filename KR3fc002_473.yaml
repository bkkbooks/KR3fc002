body:
  text: 云分取其半則為袤三尺以高廣乘之三而一即半錐之積也邪解半錐得此兩大鱉臑求其積亦當六而一合於常率矣原本作合與誤具圖於后如圖甲庚辛壬癸方錐也分取其半則為甲丙辛壬丁邪解半錐得甲辛丁壬與甲辛丁丙兩大鱉臑合於常率者合於廣袤相乘以高乘之六而一之率也按陽馬之棊兩邪棊底方當其方也不問旁角而割之相半可知也者因底既均分其高又等故也如圖甲庚辛壬癸為陽馬甲辛庚與甲辛壬為兩邪庚辛壬癸為底方自旁割之分為甲庚丙丁癸與甲丙辛壬丁二形自角割之分為甲庚癸辛與甲壬癸辛二形皆居陽馬之半
  hash: sha256:5707ce605ca2f95e60d7f30e9c709573b7c3d38556a139de7635ed5e798395d1
