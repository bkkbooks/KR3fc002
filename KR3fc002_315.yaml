body:
  text: 為三百一十五九分之一為二百八十十分之一為二百五十二并之得七千三百八十一以為法置田二百四十步亦以一為二千五百二十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一於位以最下分母一十遍乘諸分子及全步皆為一十各以其母除之則一為一十半為五三分之一為三分之一十四分之一為四分之一十約為二分之五五分之一為二六分之一為六分之一十約為三分之五七分之一為七分之一十八分之一為八分之一十約為四分之五九分之一為九分之一十十分之一為一置之於左又以分母九遍乘諸分子及巳通者各以其母除其子則一為九十半為四十五三分之一為三十四分之一為二分之四十五五分之一為一十八六分之一為一十五七分之一為七分之九十八分之一為四分之四十五九分之一為一十十分之一為九置之於左又以分母四遍
  hash: sha256:735542fe9a0e393b8ecc036f011180783e5d49e0599af5832c1d588450e2229b
