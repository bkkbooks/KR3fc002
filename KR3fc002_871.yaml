body:
  text: 甲一綆而一逮井故下實皆為一也云是為七百二十一綆而七十六逮井者戊綆長居七百二十一分之一井深居七十六分之一同其母齊其子綆長五萬四千七百九十六分之七十六井深五萬四千七百九十六分之七百二十一故以七百二十一為井深率七十六為戊綆長率也此問亦本無正負自各行遍乘直除而後分正負亦為諸物借取之例今有白禾二步靑禾三步黃禾四步黑禾五步實各不滿斗白取靑黃靑取黃黑黃取黑白黑取白靑各一步而實滿斗問白靑黃黑禾實一步各幾何答曰白禾一步實一百一十一分斗之三十三靑禾一步實一百一十一分斗之二十八黃禾一步實一百一十一分斗之十七黑禾一步實一百一十一分斗之十術曰如方程各置所取以正負術入之草曰置白禾二步靑禾一步黃禾一步實一斗於右行次置靑禾三步黃禾一步黑禾一步實一斗於第二行次置黃禾四步黑禾一步白禾
