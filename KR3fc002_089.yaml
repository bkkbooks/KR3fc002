body:
  text: 乘之方幂四百寸令與圓幂通相約圓幂三千九百二十七方幂得五千是為率方幂五千中容圓幂三千九百二十七圓幂三千九百二十七中容方幂二千五百也者置方幂四百寸以分母二十五通之得一萬半之得五千為方幂率置圓幂三百一十四寸二十五分寸之四通分內子得七千八百五十四半之得三千九百二十七為圓幂率是為率方幂五千中容圓幂三千九百二十七內方合外方之半故圓幂三千九百二十七中容方幂二千五百也云以半徑一尺除圓幂三百一十四寸二十五分寸之四倍之得六尺二寸八分二十五分寸之八即周數也者置圓幂三百一十四寸二十五分寸之四通分內子得七千八百五十四寸為實置半徑一尺展為一十寸又以分母二十五乘之得二百五十為法實如法得三十一寸四分二十五分寸之四倍之得六十二寸八分二十五分寸之八收為六尺二寸八分二十五分寸之八即周數也云全徑二尺與周數通相約徑得一千二百五十周得三千九百二十七即共相
