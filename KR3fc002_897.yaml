body:
  text: 行次置麻三斗麥五斗菽七斗答六斗黍四斗直錢一百一十六於第三行次置麻二斗麥五斗菽三斗答九斗黍四斗直錢一百一十二於第四行次置麻一斗麥三斗菽二斗答八斗黍五斗直錢九十五於左行令右行麻九遍乘第二行第二行得麻六十三斗麥五十四斗菽三十六斗答四十五斗黍二十七斗直錢一千一百五十二以右行減之第二行麻空麥五斗菽十五斗答三十一斗正黍八斗負直錢一百七十二正又令右行麻九遍乘第三行第三行得麻二十七斗麥四十五斗菽六十三斗答五十四斗黍三十六斗直錢一千四十四以右行減之第三行麻空麥二十四斗菽五十四斗答四十八斗黍二十一斗直錢六百二十四皆正又令右行麻九遍乘第四行第四行得麻十八斗麥四十五斗菽二十七斗答八十一斗黍三十六斗直錢一千八以右行減之第四行麻空麥三十一斗菽二十一斗答七十七斗黍一十六斗直錢七百二十八皆正又令右行麻九遍乘左行左行得麻九斗麥二十七斗菽十八斗答
