body:
  text: 也如深寸而一以深寸增之卽材徑亦以半增之如上術去本當半之今此皆同半差不復半也潢按注下鐻深得一寸爲半股弦差深下疑脫亦字云爲股弦差者鐻道也句有舛誤文旣不屬且鐻道爲句鐻深爲股弦差之半何得云爲股弦差者鐻道也草曰置鐻道長一尺半之得五寸爲半句自乘得二十五寸爲半句幂又爲半股弦差與半股弦并相乘幂以深一寸爲半股弦差除之得二十五寸爲半股弦并以半股弦差一寸增之得二十六寸爲弦卽材徑也合問説曰注云今此皆同半差不復半也者謂句與股弦并同用半以半股弦差增半股弦并得弦故不復半之也今有開門去閫一尺不合二寸問門廣幾何荅曰一丈一寸如圖去閫爲句半門廣爲弦半閫減半不合爲股半不合爲股弦差閫與門廣等爲倍弦
