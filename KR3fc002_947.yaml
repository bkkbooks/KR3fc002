body:
  text: 也如深寸而一以深寸增之即材徑亦以半增之如上術去本當半之今此皆同半差不復半也潢按注下鐻深得一寸為半股弦差深下疑脫亦字云為股弦差者鐻道也句有舛誤文既不屬且鐻道為句鐻深為股弦差之半何得云為股弦差者鐻道也草曰置鐻道長一尺半之得五寸為半句自乘得二十五寸為半句幂又為半股弦差與半股弦并相乘幂以深一寸為半股弦差除之得二十五寸為半股弦并以半股弦差一寸增之得二十六寸為弦即材徑也合問說曰注云今此皆同半差不復半也者謂句與股弦并同用半以半股弦差增半股弦并得弦故不復半之也今有開門去閫一尺不合二寸問門廣幾何答曰一丈一寸如圖去閫為句半門廣為弦半閫減半不合為股半不合為股弦差閫與門廣等為倍弦
  hash: sha256:10f8ee77accfb924fb9949f2295505cbcce3ed5d96f0ab9e370eafb787e4cf21
