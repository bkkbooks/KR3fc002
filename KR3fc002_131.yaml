body:
  text: 云今有者皆所有數也粟欲為糲米以下諸問皆以所有數乘所求率為實以所有率為法故曰經率曰其率若買絲銖率之以下諸問以所有數為法所率為實則曰反其率也注云少者多之始一者數之母至以五為三矣言為率者等之於一本當先除後乘也云然先除後乘或有餘分故術反之者釋所以先乘後除之故也云又究言之至然則所求之率常為母也者釋所求之率常為子所有之率常為母而文多脫錯李注巳議之矣今有粟一斗欲為糲米問得幾何答曰為糲米六升術曰以粟求糲米二之五而一臣淳風等謹按都術以所求率乘有所數以所有率為法此術以粟求米故粟為所有數三是米率故三為所求率五是粟率故五為所有率粟率五十米率三十退位求之故唯云三五也潢按注以所求率乘有所數有所當作所有草曰置粟一斗展作一十升以米率三乘之得三十升為實以粟率五為法除之得六升即糲米也合問説曰退位求之者以等數一十約之也置粟率
