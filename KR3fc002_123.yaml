body:
  text: 為法除之得一千一百一十六步二十四分步之六子母各以六約之為四分步之一又以畝法二百四十步除之得四畝一百五十六步四分步之一合問𡽪術為田草曰如前求到中外周分并而半之得七百五分於上位置徑八步六百二十八分步之五十一通分內子得五千七十五於下位上下相乘得三百五十七萬七千八百七十五分為實以分母八乘六百二十八得五千二十四為法除之得七百一十二步五千二十四分步之七百八十七又以畝法二百四十步除之得二畝二百三十二步五千二十四分步之七百八十七古率為田草曰如前置七百五分於上位置徑八步二十四分步之一十一通分內子得二百三分於下位上下相乘得一十四萬三千一百一十五分為實以分母八乘二十四得一百九十二為法除之得七百四十五步一百九十二分步之七十五子母各以三約之為六十四分步之二十五又以畝法二百四十步除之得三
