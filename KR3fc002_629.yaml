body:
  text: 數與練絲十二兩約之絡得四練得三此其相與之率者展絡絲一斤為十六兩與練絲十二兩求等得四約十六為四約十二為三是絡絲練絲相與之率也云又置練絲一斤銖數與靑絲一斤十二銖約之練得三十二靑得三十三亦其相與之率者展練絲一斤為三百八十四銖靑絲一斤十二銖為三百九十六銖求等得十二約三百八十四為三十二約三百九十六為三十三是練絲靑絲相與之率也云齊其靑絲絡絲同其二練絡得一百二十八靑得九十九練得九十六即三率悉通矣者絡居練三分之四靑居練三十二分之三十三以練絲為母靑絡為子齊其靑絲絡絲者絡率四乘練率三十二絡得一百二十八靑率三十三乘練率三靑得九十九是齊其子也同其二練者練率三與三十二相乘練得九十六是同其母也母同子齊則三率悉通矣云今有靑絲一斤為所有數絡絲一百二十八為所求率靑絲九十九為所有率者靑絲一斤乘絡率一百二十八得一百二十八斤為實以靑率九十九為法除之得
  hash: sha256:d13fdef3bfa2b1b622986681bc432f4be81b8a51295b40835b0bfadc31dc362e
