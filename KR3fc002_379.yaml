body:
  text: 前之𠔳於是立方之棊分而為四規內棊一謂之內棊規外棊三謂之外棊規更合四棊復橫斷之以句股言之令餘高為句內棊斷上方為股本方之數其弦也句股之法以句幂減弦幂則餘為股幂若令餘高自乘減本方之幂餘即內減棊斷上方之幂也本方之幂即外四棊之斷上幂然則餘高自乘即外三棊之斷上幂矣不問高卑勢皆然也然固有所歸同而塗殊者爾而乃控遠以演類借況以析微按陽馬方高數參等者列而立之橫截去上則高自乘與斷上幂數亦等焉夫疊棊成立積緣幂勢既同則積不容異由此觀之規之外三棊旁蹙為一即一陽馬也三分立方則陽馬居一內棊居二可知矣合八小方成一大方合八內棊成一合蓋內棊居小方三分之二則合蓋居立方亦三分之二較然驗矣置三分之二以圓幂率三乘之如方幂率四而一約而定之以為丸率故曰丸居立方三分之一也等數既密心亦昭晰張衡放舊貽哂於後劉𡽪循故未暇校新夫豈難哉抑未之思也依密率立此圓積本以圓徑再自乘十一乘之二十一而一約此積今欲求其本積故以二十一乘之十一而一凡物再自乘開立方除之復其本數故立方除之即丸徑也潢按張衡算一節文多舛錯如謂外質積二十六也外質二字疑衍上言外之渾六百七十五尺之面下言內渾二十五之面是推二渾相與之率不言外質也又云方八之面圓六之面六當作五玩下文方周率八之面圓周率五之面可知丸半徑以乘圓周之半丸當作圓聲之誤也是為圓周率十二之面當作是為圓周率一十之面蓋方周四尺自乘得十六尺之面為方
