body:
  text: 糲米取粟二斗一百二十一分斗之一十稗米取粟二斗一百二十一分斗之三十八糳米取粟二斗一百二十一分斗之七十三為米各一斗六百五分斗之一百五十一術曰列置糲米三十稗米二十七糳米二十四而反衰之此先約三率糲為十稗為九糳為八欲令米等者其取粟糲率十分之一稗率九分之一糳率八分之一當齊其子故曰反衰也臣淳風等謹按米有精粗之異有多少之差據率稗糳少而糲多用粟則稗糳多而糲少米若依本率之分粟當倍率故今反衰之使精取多而粗得少副并為法以七斗乘未并者各自為取粟實實如法得一斗於今有術副并為所有率未并者各為所求率粟七斗為所有數而今有之故各得取粟也若求米等者以本率各乘定所取粟為實以粟率五十為法實如法得一斗若徑求為米等數者置糲米三用粟五稗米二十七用粟五十糳米十二用粟二十五齊其粟同其米并齊為法以七斗乘同為實所得即為米斗數潢按李注粟有多少之差原本脫粟字取粟草曰列置糲米三十稗米二十七糳米二十四以等數三約之得糲十稗九糳八欲令米等者其取粟糲率十分之一稗率九分之一糳
