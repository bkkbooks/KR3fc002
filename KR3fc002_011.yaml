body:
  text: 表望遠及因木望山之術皆端帝互見無有超邈若斯之類然則蒼等為術猶未足以博盡羣數也徽尋九數有重差之名原其指趣乃所以施於此也凡望極高測絶深而兼知其遠者必用重差句股則必以重差為率故曰重差也立兩表於洛陽之城令高八尺南北各盡平地同日度其正中之時以景差為法表高乘表間為實實如法而一所得加表高即日去地也以南表之景乘表間為實實如法而一即為從南表至南戴日下也以南戴日下及日去地為句股為之求弦即日去人也以徑寸之筒南望日日滿筒空則定筒之長短以為股率以筒徑為句率日去人之數為大股大股之句即日徑也雖天圓穹之象猶曰可度又况泰山之高與江海之廣哉徽以為今之史籍且略舉天地之物考論厥數載之於志以闡世術之美輒造重差并為注解以究古人之意綴於句股之下度高者重表測深者纍矩孤離者三望離而又帝求者四望觸類而長之則雖幽遐詭伏靡所不入博物君子詳而覽焉
