body:
  text: 答曰米五斗一升七分升之三菽一斛二升七分升之六術曰置米一菽二求為粟之數并之得三九分之八以為法亦置米一菽二而以粟二斛乘之各自為實實如法得一斛臣淳風等謹按置粟率五乘米一米率三除之得一三分之二即是米一之粟也粟率十以乘菽二菽率九除之得二九分之二即是菽二之粟也并全得三齊子并之得二十四同母得二十七約之得九分之八故云并之得三九分之八米一菽二當粟三九分之八此其粟率也於今有術米一菽二皆為所求率當粟三九分之八為所有率粟二斛為所有數凡言率者當相與通之則為米九菽十八當粟三十五也亦有置米一菽二求其為粟之率以為列衰副并為法以粟乘列衰為實所得即米一菽二所求粟也以米菽本率而今有之即合所問草曰置粟率五乘米一米率三除之得一三分之二即九分之六是米一之粟置粟率十乘菽二菽率九除之得二九分之二是菽二之粟并之得三九分之八通分內子得三十五以為法亦置米一以分母九乘之得九以粟二斛乘之得一十八斛為米實亦置菽二以分母九乘之得一十八以粟二斛乘之得三十六斛為菽實實如法得米五斗一升三十五分升之一十五
