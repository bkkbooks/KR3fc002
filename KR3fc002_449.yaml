body:
  text: 術曰廣袤相乘以高乘之三而一按此術陽馬之形方錐一隅也今謂四柱屋隅爲陽馬假令廣袤各一尺高一尺相乘之得立方積一尺邪解立方得兩壍堵邪解壍堵其一爲陽馬一爲鼈臑陽馬居二鼈臑居一不易之率也合兩鼈臑成一陽馬合三陽馬而成一立方故三而一驗之以棊其形露矣悉割陽馬凡爲六鼈臑觀其割分則體勢互通葢易了也其棊或脩短或廣狹立方不等者亦割分以爲六鼈臑其形不悉相似然見數同積實均也鼈臑殊形然陽馬異體則不純合不純合則難爲之矣何則按邪解方棊以爲壍堵者必當以半爲分邪解壍堵以爲陽馬者亦必當以半爲分一從一橫耳設陽馬爲分內鼈臑爲分外棊雖或隨脩短廣狹猶有此分常率如殊形異體亦同也者以此而巳其使鼈臑廣袤各高二尺用壍堵鼈臑之棊各二皆用赤棊又使陽馬之廣袤高各二尺用立方之棊一壍堵陽馬之棊各二皆用黑棊棊之赤黑接爲壍堵廣袤高各二尺於是中效其廣又中分其高令赤黑壍堵各自適當一方高二尺方二尺每二分鼈臑則一陽馬也其餘兩端各積本體合成一方焉是爲別種而方者率居三通其體而方者率居一雖方隨棊攺而固有常然之勢也按餘數具而可知者有一二分之別卽一二之爲率定矣其於理也豈虛矣若爲數而窮之置餘廣袤高之數各半之則四分之三又可知也半之彌少其餘彌細至細曰微微則無形由是言之安取餘哉數而求窮之者謂以情推不用籌算鼈臑之物不同器用陽馬之形或隨脩短廣狹然不有鼈臑無以審陽馬之數不有陽馬無以知方亭之數功實之主也草曰置廣五尺以袤七尺乘之得三十五尺以高八尺乘之得二百八十尺三而一得九十三尺三分尺之一爲少半尺卽陽馬積也合問説曰注云陽馬之形方錐一隅也者合四陽馬
