body:
  text: 滿三日一滿五日一滿于位以日為母滿為子令日互相乘滿化三滿為二百二十五一滿為七十五五分滿之二為三十三分滿之一為二十五五分滿之一為十五并之得三百七十以為法日數相乘得七十五日為實實如法得三百七十分日之七十五以等數五約子母為七十四分日之十五合問說曰注云此猶矯矢之術也者矯矢術先令同於五十矢矢同則徒齊此術先令同於一日日同則滿齊也先令同於一日者先置一日於位乘一滿仍得一滿為實以三分日之一除之得一日三滿以一日除之得一滿以二日二分日之一除之得五分滿之二以三日除之得三分滿之一以五日除之得五分滿之一是五渠一日滿池之數也故并以為法以一日為實云自鳬鴈至此其為同齊有二術焉者一鳬鴈術母互乘子并以為法母相乘為實一矯矢術先令同其母母同則子齊故亦可并齊以除同也云此謂列置日數於右行及滿數於左行以日互乘滿者齊其滿日數相乘者同其日滿齊而日
