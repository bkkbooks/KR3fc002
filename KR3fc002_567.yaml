body:
  text: 未并者各爲所求率賦粟一萬斛爲所有數此今有衰分之義也計經賦之率旣有戸算之率亦有遠近貴賤之率此二率者各自相與通通則甲二十乙十二丙七丁十三戊五一斛之費爲之錢率錢率約戸率者則錢爲母戸爲子子不齊令母互乘爲齊卽衰也若其不然以一斛之費約戸數取衰竝有分當通分內子約之於算甚繁此一章皆相與通功共率畧相依似以上二率下一率亦可放此從其簡易而巳又以分言之使甲一戸出二十分斛之一乙一戸出十八分斛之一各以戸數乘之亦可得一縣凡所當輸俱爲衰也乘之者乘其子母報除之以此觀之則以一斛之費約戸數者其意不異矣然則可置一斛之費而反衰之約戸以乘戸率爲衰也合分注曰母除爲率率乘子爲齊反衰注曰先同其母各以分母約其子爲反衰以施其率爲算旣約且不妨處下也潢按注卽凡餘粟取僦錢餘皆當作輸聲之誤也李注欲知僦一車到輸所用錢用上脫一所字甲自出其縣出當作輸草曰以甲縣一斛之費二十約甲戶二萬五百二十得一千二十六爲甲衰乙縣至輸所二百里僦價二百錢以二十五斛除之得八錢加一斛粟價十錢得一十八錢爲乙縣致一斛之費以約乙戶一萬二千三百一十二得六百八十四爲乙衰丙縣至輸所一百五十里僦價一百五十錢以二十五斛除之得六錢加一斛粟價十二錢得一十八錢爲丙縣致一斛之費以約
