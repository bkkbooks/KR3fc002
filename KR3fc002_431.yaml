body:
  text: 丁癸未卯午為左前角陽馬棊丁癸未與丁癸午為二立句股幂丁未卯與丁午卯為二邪倚句股幂未癸午卯為底幂丙庚為中央立方棊共有六幂說見前乙丙酉壬辛戌為右面塹堵棊丙乙辛壬為立幂丙乙戌酉為邪幂丙壬酉與乙辛戌為兩旁句股幂酉戌辛壬為底幂丁丙戊壬癸巳為前面塹堵棊丁丙壬癸為立幂丁丙戊巳為邪幂丙壬戊與丁癸巳為兩旁句股幂戊壬癸巳為底幂
