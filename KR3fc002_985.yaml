body:
  text: 股弦并句面之小股三步卽圓徑之半此衰分之義也上容方術注云下容圓率以今有衰分言之此注但言衰分而不言今有者言今有則衰分之義不顯言衰分而今有之義可知云又可以股弦差減句至亦圓徑也者釋句中容圓徑卽弦并差也弦并差之義前戶不知高廣圖説詳之矣今有邑方二百步各中開門出東門十五步有木問出南門幾何步而見木荅曰六百六十六步太半步如圖出東門步數爲句率東門南至隅步數爲股率南門東至隅步數爲見句出南門步數爲見股術曰出東門步數爲法以句率爲法也半邑方自乘爲實實如法得一步此以出東門十五步爲句率東門南至隅一百步爲股率南門東至隅一百步爲見句步欲以見句求股以爲出南門數正合半邑方自乘者股率當乘見句此二者數同也草曰置邑方二百步半之得一百步爲股率又
  hash: sha256:ab5f62e47ef4b9abaf941c1f051a85b1ae8b33a663ae44fe17e21e4305f676ff
