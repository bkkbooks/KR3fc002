body:
  text: 股弦并句面之小股三步即圓徑之半此衰分之義也上容方術注云下容圓率以今有衰分言之此注但言衰分而不言今有者言今有則衰分之義不顯言衰分而今有之義可知云又可以股弦差減句至亦圓徑也者釋句中容圓徑即弦并差也弦并差之義前戶不知高廣圖説詳之矣今有邑方二百步各中開門出東門十五步有木問出南門幾何步而見木答曰六百六十六步太半步如圖出東門步數為句率東門南至隅步數為股率南門東至隅步數為見句出南門步數為見股術曰出東門步數為法以句率為法也半邑方自乘為實實如法得一步此以出東門十五步為句率東門南至隅一百步為股率南門東至隅一百步為見句步欲以見句求股以為出南門數正合半邑方自乘者股率當乘見句此二者數同也草曰置邑方二百步半之得一百步為股率又
  hash: sha256:5f335a48e3d5a7e9a721c073e1f8a29e0c9a588fdcf16a97391c2d521c703cb8
