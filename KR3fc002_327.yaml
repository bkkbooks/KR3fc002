body:
  text: 十五九分之一爲三千八十十分之一爲二千七百七十二十一分之一爲二千五百二十十二分之一爲二千三百一十并之得八萬六千二十一以爲法置田二百四十步亦以一爲二萬七千七百二十乘之以爲實實如法得從步其術亦得知不繁也草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一十一分步之一十二分步之一於位以最下分母一十二徧乘諸分子及全步皆爲一十二各以其母除之則一爲一十二半爲六三分之一爲四四分之一爲三五分之一爲五分之一十二六分之一爲二七分之一爲七分之一十二八分之一爲八分之一十二約爲二分之三九分之一爲九分之一十二欽裴按九分之一十二約爲三分之四則省如李注十分之一爲十分之一十二欽裴按不約十分之一十二爲五分之六者爲以分母一十通之以分母二五除之皆盡可省一通分故也十一分之一爲十一分之一十二十二分之一爲一置之於左又以分母一十一徧乘諸分子及巳通者各以其母除其子則一爲一百三十二半爲六十六三分之一爲四十四四分之一爲三十三五分之一爲五分之一百三十二六分之一爲二十
