body:
  text: 十五九分之一為三千八十十分之一為二千七百七十二十一分之一為二千五百二十十二分之一為二千三百一十并之得八萬六千二十一以為法置田二百四十步亦以一為二萬七千七百二十乘之以為實實如法得從步其術亦得知不繁也草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一十一分步之一十二分步之一於位以最下分母一十二遍乘諸分子及全步皆為一十二各以其母除之則一為一十二半為六三分之一為四四分之一為三五分之一為五分之一十二六分之一為二七分之一為七分之一十二八分之一為八分之一十二約為二分之三九分之一為九分之一十二欽裴按九分之一十二約為三分之四則省如李注十分之一為十分之一十二欽裴按不約十分之一十二為五分之六者為以分母一十通之以分母二五除之皆盡可省一通分故也十一分之一為十一分之一十二十二分之一為一置之於左又以分母一十一遍乘諸分子及巳通者各以其母除其子則一為一百三十二半為六十六三分之一為四十四四分之一為三十三五分之一為五分之一百三十二六分之一為二十
