body:
  text: 為六十乘之得一萬四千四百步為實實如法得一百五步一百三十七分步之一十五即從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一求田一畝問從幾何答曰九十七步四十九分步之四十七術曰下有六分以一為一百二十半為六十三分之一為四十四分之一為三十五分之一為二十四六分之一為二十并之得二百九十四以為法置田二百四十步亦以一為一百二十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一於位以最下分母六遍乘諸分子及全步皆為六各以其母除之則一為六半為三三分之一為二四分之一為四分之六欽裴按約四分之六為二分之三則從省矣五分之一為五分之六六分之一為一置之於左又以分母五遍乘諸分子及已通者各以其母除其子則一為三十半為一十五三分之一為一十四分之一為四分之三十五分之一為六六分之
  hash: sha256:6abe9b06f1066092fcfe5f4888d9a040fcdee7f43e3bf23b92b4956eb645d683
