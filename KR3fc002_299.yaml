body:
  text: 爲六十乘之得一萬四千四百步爲實實如法得一百五步一百三十七分步之一十五卽從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一求田一畝問從幾何荅曰九十七步四十九分步之四十七術曰下有六分以一爲一百二十半爲六十三分之一爲四十四分之一爲三十五分之一爲二十四六分之一爲二十并之得二百九十四以爲法置田二百四十步亦以一爲一百二十乘之爲實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一於位以最下分母六徧乘諸分子及全步皆爲六各以其母除之則一爲六半爲三三分之一爲二四分之一爲四分之六欽裴按約四分之六爲二分之三則從省矣五分之一爲五分之六六分之一爲一置之於左又以分母五徧乘諸分子及已通者各以其母除其子則一爲三十半爲一十五三分之一爲一十四分之一爲四分之三十五分之一爲六六分之
  hash: sha256:d590d5f6cb7540f83c8dc46249305f25e88af2bc5a8cc6ba7d169efffaa7e4d5
