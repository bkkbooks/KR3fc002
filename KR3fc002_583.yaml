body:
  text: 輸所一百四十里丁縣一萬七千七百算粟一斛十四傭價一日五錢到輸所一百七十五里戊縣二萬三千四十算粟一斛十二傭價一日五錢到輸所二百一十里巳縣一萬九千一百三十六算粟一斛一十傭價一日五錢到輸所二百八十里凡六縣賦粟六萬斛皆輸甲縣六人共車車載二十五斛重車日行五十里空車日行七十里載輸之間各一日粟有貴賤傭各別價以算出錢令費勞等問縣各粟幾何答曰甲縣一萬八千九百四十七斛一百三十三分斛之四十九乙縣一萬八百二十七斛一百三十三分斛之九丙縣七千二百一十八斛一百三十三分斛之六丁縣六千七百六十六斛一百三十三分斛之一百二十二戊縣九千二十二斛一百三十三分斛之七十四巳縣七千二百一十八斛一百三十三分
