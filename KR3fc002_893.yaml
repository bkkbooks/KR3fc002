body:
  text: 貴故其算也莫不闇於設通而專於一端至於此𩔖苟務其成然或失之不可謂要約更有異術者庖丁解牛游刅理間故能歴久其刅如新夫數猶刅也易簡用之則動中庖丁之理故能和神愛刅速而寡尤凡九章爲大事按法皆不盡一百算也雖布算不多然足以算多世人多以方程爲難或盡布算之象在綴正負而巳未暇以論其設動無方斯膠柱調瑟之𩔖聊復恢演爲作新術著之於此將亦啓導疑意綱羅道精豈傳之空言記其施用之例著䇿之數每舉一隅焉方程新術曰以正負術入之令左右相減先去下實又轉去物位求其一行二物正負相借者易其相當之率又令二物與他行互相去取轉其二物相借之數卽皆相當之率也各據二物相當之率對易其數卽各當之率也更置減行及其下實各以其物本率今有之求其所同并以爲法其當相并而行中正負雜者同名相從異名相消餘以爲法以下實爲實實如法卽合所問也一物各以本率今有之卽皆合所問也率不通者齊之其一術曰置羣物通率爲列衰更置減行羣物之數各以其率乘之并以爲法其當相并而行中正負雜者同名相從異名相消餘爲法以減行下實乘列衰各自爲實實如法而一卽得以舊術爲之凡應置五行今欲要約先置第三行以減第四行及減第三行次置第二行以第二行減第三行去其頭位次置右行去其頭位次以第四行減左行頭位次以左行去第四行及第二行頭位次以第五行減第二行頭位餘可半次以第二行去第四行頭位餘約之爲法實如法而一得空卽有黍價以法減第二行得荅價左行得麥價第三行麻價右行得菽價如此凡用七十七算以新術爲此先以第四行減第三行次以第三行去右行及第二行第四行下位又以減右行下位不足減乃止次以左行減第三行下位次以第三行去左行下位訖廢去第三行次以第四行去左行下位右行當左行下位次以右行去第二行及第四行下位次以第二行減第四行及左行頭位次以第四行減右行菽位不足減乃止次以左行減第二行頭位餘可再半次以
