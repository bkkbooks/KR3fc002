body:
  text: 錢以減之即利也潢按術文下有脫文當云以盈不足維乘假令之數并而為實并盈不足為法實如法而一得本持錢以減五返歸錢餘即利草曰假令本錢三萬不足一千七百三十八錢半於右行令之四萬多三萬五千三百九十錢八分於左行假令不足右行錢錢假令有餘左行錢錢以左行有餘維乘右行假令得一十億六千一百七十二萬四千錢以右行不足維乘左行假令得六千九百五十四萬錢假令不足右行錢錢
