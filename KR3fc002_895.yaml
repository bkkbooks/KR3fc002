body:
  text: 第四行去右行及第二行頭位次以第二行去右行頭位餘約之上得五下得三是菽五當答三次以左行去第三行菽位又以減第四行及右行菽位不足減乃止次以右行減第二行頭位不足減乃止次以第三行去左行頭位次以左行去右行頭位餘上得六下得五是為答六當黍五次以右行去左行答位餘約之上為二下為三次以左行去第二行下位以第二行去第四行下位又以減左行下位次右行去第二行下位餘上得三下得四是為麥三當菽四次以第二行減第四行下位次以第四行去第二行下位餘上得四下得七是為麻四當麥七是為相當之率舉矣據麻四當麥七即為麻價率七而麥價率四又麥三當菽四即為麥價率四而菽價率三又答六當黍五即為答價率五而黍價率六而率通矣更置第三行以第四行減之餘有麻一斗菽四斗答三斗負下實四正求其同為麻之數以菽率三答率五各乘菽答斗數如麻率七而一菽得一斗七分斗之五正答得二斗七分斗之一負則菽答化為麻以并之令同名相從異名相消餘為定麻七分斗之四以為法置下實四為實以分母乘之實得二十八而分子化為法矣以法除得七即麻一斗之價置麥率四菽率三答率五黍率六皆以其斗數乘之各自為實以麻率七為法所得即同為麻之數亦可使置本行實與物同通之各以本率今有之求其本率所得并以為法如此則無正負之異矣擇異同而巳又可以一術為之置五行通率為麻七麥四菽三答五黍六以為列衰減行麻一斗菽四斗正答三斗負各以其率乘之訖令同名相從異名相消餘為法又置下實乘列衰所得各為實此可以實約法則不復乘列衰各以列衰如所約知其價如此則凡用一百二十四算也草曰置麻九斗麥七斗菽三斗答二斗黍五斗直錢一百四十於右行次置麻七斗麥六斗菽四斗答五斗黍三斗直錢一百二十八於第二
