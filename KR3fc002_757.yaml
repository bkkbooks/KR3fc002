body:
  text: 兩不足爲玉卽玉十四寸也以七兩乘之得九十八兩以十六兩除之得六斤二兩爲玉重合問今有善田一畝價三百惡田七畝價五百今并買一頃價錢一萬問善惡田各幾何荅曰善田十二畝半惡田八十七畝半術曰假令善田二十畝惡田八十畝多一千七百一十四錢七分錢之二令之善田十畝惡田九十畝不足五百七十一錢七分錢之三按善田二十畝直錢六千惡田八十畝直錢五千七百一十四七分錢之二課於一萬是多一千七百一十四錢七分錢之二令之善田十畝直錢三千惡田九十畝直錢六千四百二十八七分錢之四課於一萬是爲不足五百七十一錢七分錢之三以盈不足術求之也草曰置假令善田二十畝惡田八十畝多一千七百一十四錢七分錢之二於右行令之善田十畝惡田九十畝不足五百七十一錢七分錢之三於左行善田惡田有餘右行畝畝錢
