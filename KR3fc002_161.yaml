body:
  text: 得一十斗五升九十分升之七十子母各退之為九分升之七即粟也合問今有糲米一十九斗二升七分升之一欲為稗米問得幾何答曰為稗米一十七斗二升一十四分升之一十三術曰以糲米求稗米九之十而一臣淳風等謹按稗率二十七合以此數乘糲米術欲從省先以等數三約之所求之率得九所有之率得十故九乘而十除草曰置糲米一十九斗二升七分升之一通分內子得一百三十四斗五升展為一千三百四十五升以稗率九乘之得一萬二千一百五升為實以分母七乘糲米率十得七十為法除之得一十七斗二升七十分升之六十五子母各以五約之為一十四分升之一十三即稗米也合問説曰注云先以等數三約之者置稗率二十七於上位糲率三十於下位以上減下下位餘三轉以下減上上位亦餘三是三為等數也以等數三約稗率二十七得九為所求率以等數三
