body:
  text: 荅曰八十四錢八分錢之三術曰以一匹尺數爲法今有布尺數乘價錢爲實實如法得錢數按此術亦今有之義以一匹尺數爲所有率價錢爲所求率今有布爲所有數今有之卽得草曰置今有布二丈七尺於位展爲二十七尺以一匹價直一百二十五乘之得三千三百七十五錢爲實次置布一匹通爲四十尺以爲法實如法得八十四錢四十分錢之一十五子母各以五約之爲八分錢之三合問説曰此問所有數止於尺故以一匹尺數爲法以一匹價錢乘今有布尺數爲實實如法而一不滿法者以等數約之而命分今有素一匹一丈價直六百二十五今有錢五百問得素幾何荅曰得素一匹術曰以價直爲法以一匹一丈尺數乘今有錢數爲實實如法得素數按此術亦今有之義以價錢爲所有率五丈尺數爲所求率今有錢爲所有數今有之卽得草曰置素一匹一丈於位通爲五十尺以今有錢五百乘之得二萬五千尺爲實以價直六百
