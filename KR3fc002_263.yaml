body:
  text: 答曰八十四錢八分錢之三術曰以一匹尺數為法今有布尺數乘價錢為實實如法得錢數按此術亦今有之義以一匹尺數為所有率價錢為所求率今有布為所有數今有之即得草曰置今有布二丈七尺於位展為二十七尺以一匹價直一百二十五乘之得三千三百七十五錢為實次置布一匹通為四十尺以為法實如法得八十四錢四十分錢之一十五子母各以五約之為八分錢之三合問説曰此問所有數止於尺故以一匹尺數為法以一匹價錢乘今有布尺數為實實如法而一不滿法者以等數約之而命分今有素一匹一丈價直六百二十五今有錢五百問得素幾何答曰得素一匹術曰以價直為法以一匹一丈尺數乘今有錢數為實實如法得素數按此術亦今有之義以價錢為所有率五丈尺數為所求率今有錢為所有數今有之即得草曰置素一匹一丈於位通為五十尺以今有錢五百乘之得二萬五千尺為實以價直六百
