body:
  text: 開之不盡者折下如前開方即合所問有分者通分內子開之訖開其母以報除可開者竝通之積先合三母既開之後一母尚存故開分母者求一母為法以報除若母不可開者又以母再乘定實乃開之訖令如母而一分母不可開者本一母又以母再乘今合三母既開之後亦一母尚存故令如母而一得全面也潢按注而除去三袤之厚也袤當作幂下注同為三𠔳借幂也借當如上注作備草曰置積一百八十六萬八百六十七尺為實借一算步之超二等至百而止議得一百置於實上以再乘所借一算得一萬為方法置於實下議與法相乘得一百萬以減實實餘八十六萬八百六十七尺除巳置方法一萬三之得三萬為定法復除折而下以三乘上議一百得三百為𠔳法置中行復借一算置下行步之中超一下超二至十而止議得二十置於實上次前議以議二十一乘中三百得六千為三𠔳幂再乘下一算得四百為隅幂皆副之以加定法三萬得三萬六千四百為定法與議二十相乘得七十二萬八千以減實實餘一十三萬二千八百六十七尺除巳倍下四百為八百并中六千得六千八百從定法三萬六千四百得四萬三
