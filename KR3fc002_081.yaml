body:
  text: 寸之五百八十四減之餘六百二十五分寸之一百五謂之差幂倍之得六百二十五分寸之二百一十卽九十六弧之外弧田九十六所謂以弦乘矢之凡幂也置九十六弧之幂三百一十三寸六百二十五分寸之五百八十四以凡幂六百二十五分寸之二百一十加之得三百一十四寸六百二十五分寸之一百六十九則出於圓之表矣故還就一百九十二弧之全幂三百一十四寸以爲圓幂之定率而棄其餘分置圓幂三百一十四寸展半徑一尺爲十寸除之得三十一寸四分爲半周倍之得六十二寸八分收爲六尺二寸八分卽周數也復置圓徑二尺展爲二十寸自乘得四百寸爲方幂與圓幂三百一十四寸求等得二以約圓幂得一百五十七爲率以約方幂得二百爲率方幂二百其中容圓幂一百五十七也圓率猶爲微少者因棄其餘分故也按弧田圖令方中容圓圓中容方內方合外方之半然則圓幂一百五十七其中容方幂一百也者外方二百內方一百是其相與之率也
