body:
  text: 歸一萬三千次返歸一萬二千次返歸一萬一千後返歸一萬凡五返歸錢本利俱盡問本持錢及利各幾何荅曰本三萬四百六十八錢三十七萬一千二百九十三分錢之八萬四千八百七十六利二萬九千五百三十一錢三十七萬一千二百九十三分錢之二十八萬六千四百一十七術曰假令本錢三萬不足一千七百三十八錢半令之四萬多三萬五千三百九十錢八分按假令本錢三萬并利爲三萬九千除初返歸留餘加利爲三萬二千五百除二返歸留餘又加利爲二萬五千三百五十除第三返歸留餘又加利爲一萬七千三百五十五除第四返歸留餘又加利爲八千二百六十一錢半除第五返歸留合一萬錢不足一千七百三十八錢半若使本錢四萬并利爲五萬二千除初返歸留餘加利爲四萬九千四百除第二返歸留餘又加利爲四萬七千三百二十除第三返歸留餘又加利爲四萬五千九百一十六除第四返歸留餘又加利爲四萬五千三百九十錢八分除第五返歸留合一萬餘三萬五千三百九十錢八分故曰多又術置後返歸一萬以十乘之十三而一卽後所持之本加一萬一千又以十乘之十三而一卽第四返之本加一萬二千又以十乘之十三而一卽第三返之本加一萬三千又以十乘之十三而一卽第二返之本加一萬四千又以十乘之十三而一卽初持之本并五返之
