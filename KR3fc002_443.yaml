body:
  text: 八尺九百四十二分尺之三十九子母各以三約之爲三百一十四分尺之十三卽圓錐積也密率草曰如前求到六萬二千四百七十五尺又以七乘之得四十三萬七千三百二十五尺二百六十四而一得一千六百五十六尺二百六十四分尺之一百四十一子母各以三約之爲八十八分尺之四十七卽圓錐積也今有壍堵下廣二丈袤一十八丈六尺高二丈五尺問積幾何答曰四萬六千五百尺如圖癸庚爲下廣庚辛爲袤乙辛爲高術曰廣袤相乘以高乘之二而一邪解立方得兩壍堵雖復橢方亦爲壍堵故二而一此則合所規幂推其物體葢爲壍上疊也其形如城而無上廣與所規棊形異而同實未聞所以名之爲壍堵之說也草曰置下廣二丈展爲二十尺袤一十八丈六尺展爲一百八十六尺以相乘得三千七百二十尺以高二丈五尺展爲二十五尺乘之得九
