body:
  text: 上方一尺下方三尺高一尺其用棊也中央立方一四面塹堵四四角陽馬四上下方相乘為三尺以高乘之約積三尺是為得中央立方一四面塹堵各一上方自乘亦得中央立方一下方自乘為九以高乘之得積九尺是為中央立方一四面塹堵各二四角陽馬各三也上方自乘以高乘之得積一尺又為中央立方一凡三品棊皆一而為三故三而一得積尺用棊之數立方三塹堵陽馬各十二凡二十七棊十二與三更差次之而成方亭者三驗矣為術又可令方差自乘以高乘之三而一即四陽馬也上下方相乘以高乘之即中央立方及四面塹堵也并之以為方亭積數也潢按注上方自乘亦得中央立方十一字衍觀下文上方自乘以高乘之得積一尺又為中央立方一可知設問先下方而後上方故注亦先言下方自乘以高乘之後言上方自乘以高乘之也草曰置下方五丈展為五十尺上方四丈展為四十尺以相乘得二千尺於上位又置下方五十尺自乘得二千五百尺於中位又以上方四十尺自乘得一千六百尺於下位三位相并得六千一百尺以高五丈展為五十尺乘之得三十萬五千尺三而一得一十萬一千六百六十六尺三分尺之二為太半尺即方亭積也合問注為術草曰置下方五十尺以上方四十尺減
