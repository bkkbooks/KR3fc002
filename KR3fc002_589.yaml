body:
  text: 丁算一萬七千七百得七百五十為丁泛衰置戊縣到輸所二百一十里以一百二十乘之得二萬五千二百日為實實如法得七日二分加載輸各一日為九日二分以六人乘之得五十五人二分以傭價五錢乘之得二百七十六錢以二十五斛除之得一十一錢四釐加一斛粟價十二得二十三錢四釐為戊縣致一斛之費以約戊算二萬三千四十得一千為戊泛衰置巳縣到輸所二百八十里以一百二十乘之得三萬三千六百日為實實如法得九日六分加載輸各一日為十一日六分以六人乘之得六十九人六分以傭價五錢乘之得三百四十八錢以二十五斛除之得一十三錢九分二釐加一斛粟價一十得二十三錢九分二釐為巳縣致一斛之費以約已算一萬九千一百三十六得八百為巳泛衰乃置六縣泛衰求總等得五十以約之得甲衰四十二乙衰二十四丙衰十六丁衰十五戊衰二十巳衰十六副并得一百三十三為法次置所賦粟六萬斛以甲衰四十二乘之得二百五十二萬為甲實以乙衰二十
  hash: sha256:4eb05eb92d9afcb7dcfc2efb39e05f9c5fabcd23986508fc651956ac4cd685da
