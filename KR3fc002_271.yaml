body:
  text: 草曰置今有乾絲一十二斤於位展爲一百九十二兩以生絲三十斤乘之得五千七百六十斤爲實次置生絲三十斤展爲四百八十兩以耗三斤十二兩展爲六十兩減之餘四百二十兩爲法實如法得一十三斤實餘三百斤以十六乘之得四千八百兩爲實實如法得一十一兩實餘一百八十兩以二十四乘之得四千三百二十銖爲實實如法得十銖實餘一百二十銖以法命之爲四百二十分銖之一百二十子母各以六十約之爲七分銖之二并之得生絲一十三斤一十一兩十銖七分銖之二合問説曰此問所有率止於兩故今有乾絲斤數亦通之爲兩於今有術乾絲兩數爲所有率生絲斤數爲所求率今有乾絲斤數展爲兩數爲所有數而今有之卽得注云凡所謂率者細則俱細麤則俱麤者如所有率與所求率同用兩爲率是細則俱細也同用斤爲率是麤則俱麤也兩數相推而巳者謂所有數與所求數可以相推也云如上縑絲之比得相與率焉者如上與人絲一十四斤得縑一十斤約之得絲率七縑
