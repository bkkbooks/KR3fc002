body:
  text: 草曰置今有乾絲一十二斤於位展為一百九十二兩以生絲三十斤乘之得五千七百六十斤為實次置生絲三十斤展為四百八十兩以耗三斤十二兩展為六十兩減之餘四百二十兩為法實如法得一十三斤實餘三百斤以十六乘之得四千八百兩為實實如法得一十一兩實餘一百八十兩以二十四乘之得四千三百二十銖為實實如法得十銖實餘一百二十銖以法命之為四百二十分銖之一百二十子母各以六十約之為七分銖之二并之得生絲一十三斤一十一兩十銖七分銖之二合問説曰此問所有率止於兩故今有乾絲斤數亦通之為兩於今有術乾絲兩數為所有率生絲斤數為所求率今有乾絲斤數展為兩數為所有數而今有之即得注云凡所謂率者細則俱細粗則俱粗者如所有率與所求率同用兩為率是細則俱細也同用斤為率是粗則俱粗也兩數相推而巳者謂所有數與所求數可以相推也云如上縑絲之比得相與率焉者如上與人絲一十四斤得縑一十斤約之得絲率七縑
