body:
  text: 日九日相乘得六十三日母相乘為同是同其日以日為母也云并齊以除同者并九至七至為法七日九日相乘為實也今有甲發長安五日至齊乙發齊七日至長安今乙發巳先二日甲乃發長安問幾何日相逢答曰二日十二分日之一術曰并五日七日以為法按此術并五日七日為法者猶并齊為法置甲五日一至乙七日一至齊而同之定三十五日甲七至乙五至并之為十二至者用三十五日也謂甲乙與發之率耳然則日化為至當除日故以為法也以乙先發二日減七日減七日者言甲乙俱發今以發為始發之端於本道里則餘分也餘以乘甲日數為實七者長安去齊之率也五者後發相去之率也今問後發故舍七用五以乘甲五日為二十五日言甲七至乙五至更相去用此二十五日也實如法得一日一日甲行五分至之一乙行七分至之一齊而同之甲定日行三十五分至之七乙定日行三十五分至之五是為齊去長安三十五分甲日行七分乙日行五分也今乙先行發二日巳行十分餘相去二十五分故減乙二日餘令相乘為二十五分草曰置甲五日至乙七日至并之得十二至為法以乙先發二日減七日餘五日以乘甲五日得二十五日為實實如法得二日十二分日之一合問説曰注云日化為至者置甲五日一至乙七日
  hash: sha256:b0d5a82acf21d50cffa25c005cb46b0593cdbbf3febc88660c3068d68a8562bb
