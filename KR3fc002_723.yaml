body:
  text: 百為實實如法而一得三十三即人數也副置人數三十三以所出四百乘之得一萬三千二百減盈三千四百餘九千八百以所出三百乘之得九千九百減盈一百亦餘九千八百即金價也合問買羊草曰置人出五於右行不足四十五居其下置人出七於左行不足三居其下人出不足右行人出不足右行令不足三維乘所出五得十五令不足四十五維乘所出七得三百一十五人出不足右行人出不足左行以十五減三百一十五餘三百為實以不足三
