body:
  text: 句以甲邪行率帶分弦二十九乘之得二百九十步爲甲邪行實於上副置南行十步爲見句以乙東行率帶分股二十一乘之得二百一十步爲乙東行實於下以甲南行率帶分句二十爲法各除實上得十四步半爲見弦卽甲邪行及乙數也下得十步半爲見股卽乙東行數也合問説曰注云令句弦并自乘爲朱黃相連之方者句自乘爲朱方弦自乘爲黃方句弦并自乘爲朱黃相連之方云股自乘爲靑幂之矩者股幂之矩居朱方之表也云令其矩引之直者移矩幂爲直積也云加損同之者令靑幂出入相補成一直積以句弦并爲袤差爲廣也同之者同以句弦并爲母也云引黃斷其半爲弦率至故亦以股率同其袤者黃卽黃方也此圖大體以兩弦爲袤引黃使長中分之以弦爲廣句弦并爲袤卽帶分之弦爲弦率也以帶分之弦減朱黃相連之方餘帶分之句以句爲廣句弦并爲袤者爲句率弦與句各以句弦并爲袤故亦以句弦并乘股爲股率所以同其袤也云南行十
