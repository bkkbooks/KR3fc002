body:
  text: 句以甲邪行率帶分弦二十九乘之得二百九十步為甲邪行實於上副置南行十步為見句以乙東行率帶分股二十一乘之得二百一十步為乙東行實於下以甲南行率帶分句二十為法各除實上得十四步半為見弦即甲邪行及乙數也下得十步半為見股即乙東行數也合問説曰注云令句弦并自乘為朱黃相連之方者句自乘為朱方弦自乘為黃方句弦并自乘為朱黃相連之方云股自乘為靑幂之矩者股幂之矩居朱方之表也云令其矩引之直者移矩幂為直積也云加損同之者令靑幂出入相補成一直積以句弦并為袤差為廣也同之者同以句弦并為母也云引黃斷其半為弦率至故亦以股率同其袤者黃即黃方也此圖大體以兩弦為袤引黃使長中分之以弦為廣句弦并為袤即帶分之弦為弦率也以帶分之弦減朱黃相連之方餘帶分之句以句為廣句弦并為袤者為句率弦與句各以句弦并為袤故亦以句弦并乘股為股率所以同其袤也云南行十
