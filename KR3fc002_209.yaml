body:
  text: 買矢簳草曰置矢簳五千八百二十枚為實以出錢九百八十為法除之得五是貴簳五枚一錢也益一枚於五枚是賤簳六枚一錢也實餘九百二十為多者之錢以實餘九百二十減法九百八十餘六十為少者之錢乃置法餘六十錢於上位以少數五乘之得三百枚又置九百二十錢於下位以多數六乘之得五千五百二十枚上位三百枚五枚一錢下位五千五百二十枚六枚一錢合問說曰其率者錢多物少以物數為法錢數為實反其率者錢少物多以錢數為法物數為實實如法而一不滿法者實餘也反以實餘減法術云法少者法餘為少數共錢也實多者實餘為多數共錢也云二物各以所得多少之數乘法實即物數者以多數乘實餘少數乘法餘為貴賤二物數也買絲貴賤銖率之當以一銖為所求率乘出錢為實所買率為法今乃反之以所買絲為實錢數為法買羽貴賤率之當以一羽為所求率乘出錢為實所買率為法今乃反之以所買羽為實錢數為法買矢簳貴賤率之當
