body:
  text: 今有粟四斗五升欲為糳米問得幾何答曰為糳米二斗一升五分升之三術曰以粟求糳米十二之二十五而一臣淳風等謹按糳米之率二十有四以為率太繁故因而半之半所求之率以乘所有之數所求之率既減半所有之率亦減半是故十二乘之二十五而一也草曰置粟四斗五升展為四十五升以糳米率十二乘之得五百四十升為實以粟率二十五為法除之得二斗一升二十五分升之一十五子母各以五約之為五分升之三即糳米也合問説曰因而半之者以等數二約之也置粟率五十於上位糳米率二十四於下位以下減上上位餘二轉以上餘減下位下位亦餘二是二為等數也以等數二約糳米率二十四得十二為所求率以等數二約粟率五十得二十五為所有率故以十二乘之二十五而一也今有粟七斗九升欲為御米問得幾何答曰為御米三斗三升五十分升之九術曰以粟求御米二十一之五十而一草曰置粟七斗九升展為七十九升以御米率
