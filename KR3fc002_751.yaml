body:
  text: 為法實如法得大器容一百二十分斛之六十五五約之為二十四分斛之十三小器容一百二十分斛之三十五五約之為二十四分斛之七若以今有術轉求之則大器容五斗十二分斗之五小器容二斗十二分斗之十一各為所有數一斛為所求率十斗為所有率而今有之亦合所問今有漆三得油四油四和漆五今有漆三斗欲令分以易油還自和餘漆問出漆得油和漆各幾何答曰出漆一斗一升四分升之一得油一斗五升和漆一斗八升四分升之三術曰假令出漆九升不足六升令之出漆一斗二升有餘二升按此術三斗之漆出九升得油一斗二升可和漆一斗五升餘有二斗一升則六升無油可和故曰不足六升令之出漆一斗二升則易得油一斗六升可和漆二斗於三斗之中巳出一斗二升餘有一斗八升見在油合和得漆二斗則是有餘二升以盈不足維乘之為實并盈不足為法實如法而一得出漆升數求油及和漆者四五各為所求率四三各為所有率而今有之即得也出漆草曰置假令出漆九升不足六升於右行令之出漆一斗二升有餘二升於左行
  hash: sha256:0e37e9a45dd545e6ac1fb57df2bcd9c0bec93be1363b50c3213fa8abaf2a3a16
