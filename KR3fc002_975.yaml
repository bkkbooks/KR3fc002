body:
  text: 云幂圖方在句中至不失本率者明大小句股有相與之勢也幂圖者即上句股相乘幂之圖也方在句中者即所問句中容方也如圖方之兩𠔳各自成小句股云句面之小股至則中方又可知者今有之義也并句股得十七步為所有率股十二步為所求率見句五步作句面之小句股并為所有數而今有之得三步十七分步之九為句面之小股即中方也并句股得十七步為所有率句五步為所求率見股十二步作股面之小句股并為所有數而今有之得三步十七分步之九為股面之小句亦即中方也云此則雖不效者效放也注以今有術求中方雖不效術文之但言法實而為法實之所由生也兼言衰分者以句股為列衰副并為法有似衰分故兼言之也説詳容圓術今有句八步股十五步問句中容圓徑幾何
