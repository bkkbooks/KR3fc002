body:
  text: 千二百為實以分母七乘丙縣一千二百八十人得八千九百六十為法實如法而一得五日八千九百六十分日之六千四百以等數一千二百八十約子母為七分日之五置丁縣所當出一百七十一人七分人之三通分內子得一千二百以其居所及行道三十三日乘之得三萬九千六百為實以分母七乘丁縣九百九十人得六千九百三十為法實如法而一得五日六千九百三十分日之四千九百五十以等數九百九十約子母為七分日之五置戊縣所當出二百八十五人七分人之五通分內子得二千以其居所及行道三十五日乘之得七萬為實以分母七乘戊縣一千七百五十人得一萬二千二百五十為法實如法而一得五日一萬二千二百五十分日之八千七百五十以等數一千七百五十約子母為七分日之五云丁分最少宜就戊除至有餘從甲除之適𥁞者丁分三從戊分五得八滿法七除之餘分一從乙分五得六又以丙分四從之得一十滿法七除之餘分三以從甲分四得七以法除之適𥁞故加
