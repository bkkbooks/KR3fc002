body:
  text: 六分子五從之得一百三十一於上位置從二十三步以分母十一乘之得二百五十三分子六從之得二百五十九於下位上下相乘得三萬三千九百二十九爲實分母七分母十一相乘得七十七爲法實如法而一得四百四十步七十七分步之四十九以畝法二百四十步除之得一畝二百步七十七分步之四十九分母子各以等數七約之爲十一分步之七合問今有圭田廣十二步正從二十一步問爲田幾何荅曰一百二十六步又有圭田廣五步二分步之一從八步三分步之二問爲田幾何荅曰二十三步六分步之五如圖子丑爲正從寅卯爲廣以甲段與乙段顚倒相補成直積注所謂以盈補虛爲直田也術曰半廣以乘正從半廣者以盈補虛爲直田也亦可半正從以乘廣按半廣乘從以取中平之數故廣從相乘爲積步畝法除之卽得也草曰置廣十二步半之得六步以乘正從二十
