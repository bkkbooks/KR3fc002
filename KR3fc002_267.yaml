body:
  text: 為法以一十斤乘今有絲兩數為實實如法得縑數設問者曰今有與人絲一十四斤約得縑一十斤今與人絲四十五斤半問得縑幾何答曰三十二斤半術曰以一十四斤為法以一十斤乘今有絲斤數為實實如法得縑數此問今有數止於斤故徑以一十四斤為法下生絲注云凡所謂率者細則俱細粗則俱粗也今有絲一斤耗七兩今有絲二十三斤五兩問耗幾何答曰一百六十三兩四銖半術曰以一斤展十六兩為法以七兩乘今有絲兩數為實實如法得耗數按此術亦今有之義以一斤為十六兩為所有率七兩為所求率今有絲為所有數而今有之即得草曰置今有絲二十三斤五兩於位通為三百七十三兩以耗七兩乘之得二千六百一十一兩為實次置絲一斤展為十六兩以為法實如法得一百六十三兩實餘三兩以二十四乘之得七十二銖為實實如法得四銖又退法除之得半銖并之得共耗一百六十三兩四銖半合問
