body:
  text: 為一方錐也圖説見方錐術五今謂四柱屋隅為陽馬者何晏景福殿賦承以陽馬張協七命陽馬承阿是也云假令廣袤各一尺高一尺相乘之之字衍云邪解立方得兩塹堵圖説見塹堵術云邪解塹堵其一為陽馬一為鱉臑陽馬居二鱉臑居一不易之率也具圖於后如圖丙乙辛庚癸壬為塹堵自丙解至庚分丙乙辛壬立幂為二一為陽馬一為鱉臑陽馬有庚辛壬癸下幂丙壬辛與丙壬癸二立句股幂丙癸庚與丙辛庚二邪倚句股幂鱉臑有丙乙辛與乙辛庚二顚倒句股幂有丙乙庚與丙辛庚二邪幂云合兩鱉臑成一陽馬合三陽馬而成一立方具圖於后
  hash: sha256:0a7ff0cad95cf06700ac81e8be3b9f591d25501c67c23dcaadb353b1051ba41b
