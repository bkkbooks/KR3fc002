body:
  text: 爲一方錐也圖説見方錐術五今謂四柱屋隅爲陽馬者何晏景福殿賦承以陽馬張協七命陽馬承阿是也云假令廣袤各一尺高一尺相乘之之字衍云邪解立方得兩壍堵圖説見壍堵術云邪解壍堵其一爲陽馬一爲鼈臑陽馬居二鼈臑居一不易之率也具圖於后如圖丙乙辛庚癸壬爲壍堵自丙解至庚分丙乙辛壬立幂爲二一爲陽馬一爲鼈臑陽馬有庚辛壬癸下幂丙壬辛與丙壬癸二立句股幂丙癸庚與丙辛庚二邪倚句股幂鼈臑有丙乙辛與乙辛庚二顚倒句股幂有丙乙庚與丙辛庚二邪幂云合兩鼈臑成一陽馬合三陽馬而成一立方具圖於后
  hash: sha256:542bf77078114474f767d66d84c0cc294a761b04280d34f724ffb30852ad9409
