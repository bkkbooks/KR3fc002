body:
  text: 假令不足右行升升假令有餘左行升升令有餘二升維乘九升得十八升令不足六升維乘一斗二升得七十二升假令不足右行升升假令有餘左行升升并之得九十升為實并有餘二升不足六升得八升為法實如法得一斗一升八分升之二半之為四分升之一即出漆也合問得油草曰如前求到出漆一斗一升四分升之一通分內子得四十五以四乘之得一百八十升為實以分母四乘三得十二為法實如法得油一斗五升合問和漆草曰如前求得油一斗五升以五乘之得
  hash: sha256:0a7d3244f8c0f6dfdb1aaced227bc90d4de48aee522aa8ceb649fbcca5b8b434
