body:
  text: 邪解壍堵以爲陽馬者亦必當以半爲分一從一橫耳者從解方棊以爲壍堵則横解壍堵以爲陽馬橫解方棊以爲壍堵則從解壍堵以爲陽馬皆當以半爲分也云設陽馬爲分內棊鼈臑爲分外棊原本分內下脫棊字云雖或隨脩短廣狹猶有此分常率者卽上文所云陽馬居二鼈臑居一不易之常率也云如殊形異體亦同也者申言鼈臑殊形陽馬異體莫不純合之理也云其使鼈臑廣袤高各二尺至而固有常然之勢也者以赤棊四黑棊五次成立方者四申明陽馬居二鼈臑居一之理也原本作其使鼈臑廣袤各高二尺各高爲高各之誤赤棊四者壍堵二鼈臑二也黑棊五者立方一壍堵二陽馬二也云棊之赤黑接爲壍堵者各以一赤鼈臑接一黑陽馬得二壍堵合成一方也云於是中效其廣又中分其高令赤黑壍堵各自適當一方高二尺方二尺每二分鼈臑則一陽馬也者以赤黑壍堵棊各一割之爲六鼈臑合之仍爲一立方也云其餘兩棊各積本體合成一方焉者以所餘赤黑壍堵棊各一合之又成一
