body:
  text: 邪解塹堵以為陽馬者亦必當以半為分一從一橫耳者從解方棊以為塹堵則橫解塹堵以為陽馬橫解方棊以為塹堵則從解塹堵以為陽馬皆當以半為分也云設陽馬為分內棊鱉臑為分外棊原本分內下脫棊字云雖或隨修短廣狹猶有此分常率者即上文所云陽馬居二鱉臑居一不易之常率也云如殊形異體亦同也者申言鱉臑殊形陽馬異體莫不純合之理也云其使鱉臑廣袤高各二尺至而固有常然之勢也者以赤棊四黑棊五次成立方者四申明陽馬居二鱉臑居一之理也原本作其使鱉臑廣袤各高二尺各高為高各之誤赤棊四者塹堵二鱉臑二也黑棊五者立方一塹堵二陽馬二也云棊之赤黑接為塹堵者各以一赤鱉臑接一黑陽馬得二塹堵合成一方也云於是中效其廣又中分其高令赤黑塹堵各自適當一方高二尺方二尺每二分鱉臑則一陽馬也者以赤黑塹堵棊各一割之為六鱉臑合之仍為一立方也云其餘兩棊各積本體合成一方焉者以所餘赤黑塹堵棊各一合之又成一
