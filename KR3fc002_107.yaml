body:
  text: 百二十五步并中得六百七十五步二而一得三百三十七步半如畝法二百四十步而一得一畝九十七步半合問草曰置弦七十八步二分步之一通分內子得一百五十七分於上位又置矢十三步九分步之七通分內子得一百二十四分於下位上下相乘得一萬九千四百六十八分為實兩母相乘得十八為法除之得一千八十一步十八分步之一十約為九分步之五為矢乘弦幂下位自乘得一萬五千三百七十六分為實矢母九自乘得八十一為法除之得一百八十九步八十一分步之六十七為矢自乘幂并兩幂得一千二百七十一步八十一分步之三十一二而一得六百三十五步八十一分步之五十六如畝法二百四十步而一得二畝一百五十五步八十一分步之五十六合問說曰注云方中之圓圓裏十二弧之幂合外方之幂四分之三也者外方容十二弧幂之十六圓裏容十二弧幂之十二十六分之十二約之為四分之三也
