body:
  text: 之得黃方之面其外之靑知亦以股弦差爲廣故以股弦差加之則爲句也加橫不出卽戶高兩不出加之得戶袤潢按戶袤之袤皆當作袤惟荅文袤一丈不誤注其外之靑知知當作矩草曰置從不出二尺爲股弦差橫不出四尺爲句弦差相乘得八尺倍之得一十六尺爲弦并差幂開方除之得四尺爲弦并差副置上中下三位以從不出二尺加上位得六尺爲句卽戶廣也以橫不出四尺加中位得八尺爲股卽戶高也并兩不出得六尺以加下位得十尺爲弦卽戶袤也合問説曰此問以句弦差股弦差求句股弦也云凡并句股之幂卽爲弦幂或矩於表或方於裏者如上注所云句幂之矩居表則股幂方其裏股幂之矩居表則句幂方其裏是也云連之者舉表矩而方之至得黃方之面者明句弦差股弦差相乘倍之爲弦并差之幂也作股方於弦幂裏矩於表者爲句幂復舉句幂之矩而方之又從句方裏令爲靑矩之表此靑矩之表句方與句矩同用幂也句方內減靑矩之表餘黃方幂
