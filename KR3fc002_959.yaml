body:
  text: 之得黃方之面其外之靑知亦以股弦差為廣故以股弦差加之則為句也加橫不出即戶高兩不出加之得戶袤潢按戶袤之袤皆當作袤惟答文袤一丈不誤注其外之靑知知當作矩草曰置從不出二尺為股弦差橫不出四尺為句弦差相乘得八尺倍之得一十六尺為弦并差幂開方除之得四尺為弦并差副置上中下三位以從不出二尺加上位得六尺為句即戶廣也以橫不出四尺加中位得八尺為股即戶高也并兩不出得六尺以加下位得十尺為弦即戶袤也合問説曰此問以句弦差股弦差求句股弦也云凡并句股之幂即為弦幂或矩於表或方於裏者如上注所云句幂之矩居表則股幂方其裏股幂之矩居表則句幂方其裏是也云連之者舉表矩而方之至得黃方之面者明句弦差股弦差相乘倍之為弦并差之幂也作股方於弦幂裏矩於表者為句幂復舉句幂之矩而方之又從句方裏令為靑矩之表此靑矩之表句方與句矩同用幂也句方內減靑矩之表餘黃方幂
