body:
  text: 如圖庚癸爲下廣癸壬爲下袤甲乙爲上袤戊至巳爲高術曰倍下袤上袤從之以廣乘之又以高乘之六而一推明義理者舊說云凡積芻甍有上下廣曰童甍謂其屋葢之茨也是故甍之下廣袤與童之上廣袤等正斬方亭兩邊合之卽芻甍之形也假令下廣二尺袤三尺上袤一尺無廣高一尺其用棊也中央壍堵二兩端陽馬各二倍下袤上袤從之爲七尺以高廣乘之得幂十四尺陽馬之幂各居一壍堵之幂各居三以高乘之得積十四尺其於本棊也皆一而爲六故六而一卽得亦可令上下袤差乘廣以高乘之三而一卽四陽馬也下廣乘上袤而半之高乘之卽二壍堵并之以爲甍積也潢按注以高廣乘之高字衍陽馬之幂各居一一當作二草曰置下袤四丈倍之得八丈以上袤二丈加之得一十丈展爲一百尺以廣三丈展爲三十尺乘之得三千尺以高一丈展爲一十尺乘之得三萬尺六而一得五千尺卽芻甍積也合問注草曰置下袤四十尺以上袤二十尺減之餘二十尺爲差以廣三十尺乘之得六百尺又以
  hash: sha256:e12dd636f471b81ef1d2bb0989084377f9a1d6b0dbaa311bd11522162c030494
