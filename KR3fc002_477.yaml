body:
  text: 如圖庚癸為下廣癸壬為下袤甲乙為上袤戊至巳為高術曰倍下袤上袤從之以廣乘之又以高乘之六而一推明義理者舊説云凡積芻甍有上下廣曰童甍謂其屋蓋之茨也是故甍之下廣袤與童之上廣袤等正斬方亭兩邊合之即芻甍之形也假令下廣二尺袤三尺上袤一尺無廣高一尺其用棊也中央塹堵二兩端陽馬各二倍下袤上袤從之為七尺以高廣乘之得幂十四尺陽馬之幂各居一塹堵之幂各居三以高乘之得積十四尺其於本棊也皆一而為六故六而一即得亦可令上下袤差乘廣以高乘之三而一即四陽馬也下廣乘上袤而半之高乘之即二塹堵并之以為甍積也潢按注以高廣乘之高字衍陽馬之幂各居一一當作二草曰置下袤四丈倍之得八丈以上袤二丈加之得一十丈展為一百尺以廣三丈展為三十尺乘之得三千尺以高一丈展為一十尺乘之得三萬尺六而一得五千尺即芻甍積也合問注草曰置下袤四十尺以上袤二十尺減之餘二十尺為差以廣三十尺乘之得六百尺又以
  hash: sha256:8f88bb4c3008d523b1729a06db8e40ff700983d4e1eaaa2af55b3a65d73a629c
