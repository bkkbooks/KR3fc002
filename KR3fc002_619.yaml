body:
  text: 有率故所行七十六步爲所求率故所得返五十爲所有數而今有之得三十八返爲所求數是今有術也云因令重者得返少輕者得返多者負一石一十七斤者五十返則負一石者當五十七返十二分返之一也云又因其率以乘法實者以後實乘前實後法乘前法而并除之是重今有之義也若以原術推之以故行七十六步爲所有率五十返爲所求率今行百步爲所有數而今有之得六十五返十九分返之十五是行步多者得返多行步少者得返少也豈有是理乎更以故籠重一百三十七斤爲所有率五十返爲所求率今籠重一百二十斤爲所有數而今有之得四十三返一百三十七分返之一百九是負重者得返多負輕者得返少也又豈有是理乎知兩次用今有術之得數誤則知原術用重今有之得數誤矣今有程傳委輸空車日行七十里重車日行五十里今載太倉粟輸上林五日三返問太倉去上林幾何荅曰四十八里十八分里之十一術曰并空重里數以三返乘之爲法令空重相
