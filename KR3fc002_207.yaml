body:
  text: 銖三百八十四除之得二十斤餘一百五十五銖以兩積銖二十四除之得六兩餘十一銖又置實餘一萬九十九錢於下位以多數六乘之得六萬五百九十四銖以石積銖四萬六千八十除之得一石餘一萬四千五百一十四銖以鈞積銖一萬一千五百二十除之得一鈞餘二千九百九十四銖以斤積銖三百八十四除之得七斤餘三百六銖以兩積銖二十四除之得一十二兩餘一十八銖上位得一鈞二十斤六兩十一銖五銖一錢下位得一石一鈞七斤一十二兩一十八銖六銖一錢合問買羽草曰置羽二千一百翭爲實以出錢六百二十爲法除之得三是貴羽三翭一錢也益一翭於三翭是賤羽四翭一錢也實餘二百四十爲多者之錢以實餘二百四十減法六百二十餘三百八十爲少者之錢乃置法餘三百八十錢於上位以少數三乘之得一千一百四十翭又置實餘二百四十錢於下位以多數四乘之得九百六十翭上位一千一百四十翭三翭一錢下位九百六十翭四翭一錢合問
  hash: sha256:2a5cda29d1e36493220d6091bd13c4d7804bf2100a1846915d3b5b806dc8cf85
