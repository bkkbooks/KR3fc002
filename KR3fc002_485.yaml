body:
  text: 乙丑與子卯為中央立方二即左視圖甲丑與子寅也甲乙酉戌庚未為前面塹堵二乙丙寅亥巳酉為右端塹堵一丙寅戊壬亥為右後陽馬一乙酉巳辛戌為右前陽馬一云倍下袤為八上袤從之為十以高廣乘之得積三十尺是為得中央立方各三兩端塹堵各四兩旁塹堵各六四角陽馬亦各六者置下袤以下廣乘之又以高乘之得中央立方積各一兩端塹堵積各二兩旁塹堵積各二四角陽馬積各三倍之得中央立方積各二兩端塹堵積各四兩旁塹堵積各四四角陽馬積各六於上位置上袤以下廣乘之又以高乘之得中央立方積各一兩旁塹堵積各二於下位并上下位得中央立方各三兩端塹堵各四兩旁塹堵各六四角陽馬亦各六置於左方云復倍上袤下袤從之為八以高廣乘之得積八尺是為得中央立方亦各三兩端塹堵各二者置上袤以上
  hash: sha256:207b69ebfc550cadd5888990ed8777a69a5df2c2cbc8ace04c1f794b6b979a5d
