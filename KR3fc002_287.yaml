body:
  text: 十錢為實實如法而一合問若先以貸人千錢與月息三十相約得一百與三為率次以三十日與九日相約得一十與三為率乃以一十乘百錢得千錢為法三乘今貸人錢七百五十得二千二百五十又以三乘之得六千七百五十為實實如法而一亦合問此與注以三十日約息者殊塗而同歸也九章算術細草圖說卷三門下晚學生沈欽裴算校
