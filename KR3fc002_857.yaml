body:
  text: 乘之并以爲法以其下實乘列衰各自爲實實如法而一卽得與用方程求得者同故云異術求之卽其數也曰諸曰皆可者包再程者而言并包三程以上而言也注於此發其凡者此問兩行下實皆重八兩徑以相減得一行二物正負相當之率對易其數卽各當之率易曉故也今有甲乙二人持錢不知其數甲得乙半而錢五十乙得甲太半而亦錢五十問甲乙持錢各幾何荅曰甲持三十七錢半乙持二十五錢術曰如方程損益之此問者言一甲半乙而五十太半甲一乙亦五十也各以分母乘其全內子行定二甲一乙而錢一百二甲三乙而錢一百五十於是乃如方程諸物有分者倣此草曰置二甲一乙錢一百於右行次置二甲三乙錢一百五十於左行令右行直除左行左行甲空餘二乙錢五十上法下實實如法得二十五爲乙持錢求甲持錢以乙錢二十五乘右行一乙仍得錢二十五以減右行錢一百餘錢七十五如二甲而一得三十七錢半爲甲持錢合
