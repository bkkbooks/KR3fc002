body:
  text: 十三分之一為一百四十四分之一為一百五五分之一為八十四六分之一為七十七分之一為六十并之得一千八十九以為法置田二百四十步亦以一為四百二十乘之為實實如法得從步草曰置一步二分步之一三分步之一四分步之一五分步之一六分步之一七分步之一於位以最下分母七遍乘諸分子及全步皆為七各以其母除之則一為七半為二分之七三分之一為三分之七四分之一為四分之七五分之一為五分之七六分之一為六分之七七分之一為一置之於左又以分母六遍乘諸分子及巳通者各以其母除其子則一為四十二半為二十一三分之一為一十四四分之一為四分之四十二約為二分之二十一五分之一為五分之四十二六分之一為七七分之一為六置之於左又以分母五遍乘諸分子及巳通者各以其母除其子則一為二百一十半為一百五三分之一為七十四分之一為二分之一百五五分之一為四十二六分之一為三十五七
  hash: sha256:ba757a2b40c31a2eafab71949d643a953a53112277082ed36866affeb7ea332d
