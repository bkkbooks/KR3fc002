body:
  text: 者盈朒俱十二以盈補朒得不盈不朒之正數也云故可并以為實并盈不足為法者并三十二與二十一得五十三為實并盈三不足四得七為法實如法得七又七分之四即不盈不朒之正數也今各問俱不答正數者求得法實則正數可知且其意不在求正數也至米在十斗桶中以下乃求正數耳云齊之三十二者是四假令有盈十二者以不足四維乘所出八得三十二是四因所出率即四假令以不足四乘盈三有盈十二也云齊之二十一者是三假令亦朒十二者以盈三維乘所出七得二十一是三因所出率即三假令以盈三乘不足四亦朒十二也云并七假令合為一實故并三四為法者并三十二二十一得五十三為實并盈三不足四得七為法也云此問兩設俱見零分故齊其子同其母者指共買璡共買牛而言也共買璡人出半人出少半齊而同之則半為六之三少半為六之二共買牛七家共出一百九十九家共出二百七十齊而同之則七家共出一百九十為六十三分之一千七百一十九家共出二
