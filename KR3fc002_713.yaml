body:
  text: 者盈朒俱十二以盈補朒得不盈不朒之正數也云故可并以爲實并盈不足爲法者并三十二與二十一得五十三爲實并盈三不足四得七爲法實如法得七又七分之四卽不盈不朒之正數也今各問俱不荅正數者求得法實則正數可知且其意不在求正數也至米在十斗桶中以下乃求正數耳云齊之三十二者是四假令有盈十二者以不足四維乘所出八得三十二是四因所出率卽四假令以不足四乘盈三有盈十二也云齊之二十一者是三假令亦朒十二者以盈三維乘所出七得二十一是三因所出率卽三假令以盈三乘不足四亦朒十二也云并七假令合爲一實故并三四爲法者并三十二二十一得五十三爲實并盈三不足四得七爲法也云此問兩設俱見零分故齊其子同其母者指共買璡共買牛而言也共買璡人出半人出少半齊而同之則半爲六之三少半爲六之二共買牛七家共出一百九十九家共出二百七十齊而同之則七家共出一百九十爲六十三分之一千七百一十九家共出二
