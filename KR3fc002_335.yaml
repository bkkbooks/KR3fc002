body:
  text: 則常微少其加借算而命分則又微多其數不可得而定故惟以面命之為不失耳譬猶以三除十以其餘為三分之一而復其數可舉不以面命之加定法如前求其微數微數無名者以為分子其一退以十為母其再退以百為母退之彌下其分彌細則朱幂雖有所乘之數不足言之也若實有分者通分內子為定實乃開之訖開其母報除臣淳風等謹按分母可開者竝通之積先令二母既開之後一母尚存故開分母求一母為法以報除也若母不可開者又以母再乘定實乃開之訖令如母而一臣淳風等謹按分母不可開者本一母也又以母乘之乃合二母既開之後亦一母存焉故令如母而一得全面也又按此術開方者求方幂之一面也借一算者假借一算空有列位之名而無除積之實方隅得面是故借算列之於下也步之超一等者方十自乘其積有百方百自乘其積有萬故超位至百而言十至萬而言百也議所得以一乘所借一算為法而以除者先得黃甲之面以方為積者兩相乘故開方除之還令兩面上下相命是自乘而除之也除巳倍法為定法者實積未盡當復更除故豫張兩面朱幂定袤以待復除故曰定除也其復除折法而下者欲除朱幂本當副置所得成方倍之為定法以折議乘之而以除如是當復步之而止乃得相命故使就上折之而下也復置借算步之如初以復議一乘之所得副以加定法以除者欲除朱幂之角黃乙之幂以所得副從定法者再以黃乙之幂加定法是則張兩靑幂之袤故如前開之即合所問潢按術文又以母再乘定實再字衍注故曰定除也除當作法再以黃乙之幂加定法幂當作面草曰置積五萬五千二百二十五步為實借一
