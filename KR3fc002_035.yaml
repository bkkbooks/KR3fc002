body:
  text: 副并為平實者定此平實立限衆子所當損益如限為平母相乘為法母相乘為法者亦齊其子又同其母以列數乘未并者各自為列實亦以列數乘法此當副并列數為平實若然則重有分故反以列數乘同齊臣淳風等謹按問云所平之分多少不定或三或二列位無常平三知置位三重平二知置位二重凡此之例一準平分不可預定多少故直云列數而已以平實減列實餘約之為所減并所減以益於少以法命平實各得其平潢按注此當副并列數為平實當作此當副置列數除平實草曰置三分三分四分在右方之一之二之三在左方母互乘子三分之一得十二三分之二得二十四四分之三得二十七副并得六十三為平實母相乘得三十六為法以列數三乘未并者三分之一得三十六三分之二得七十二四分之三得八十一亦以列數三乘法得一百八以平實六十三減列實七十二餘九減列實八十一餘十八以等數九約所餘得一與二為所減亦以等數九約列實三十六得四并所減一與二以加之得七又以等數九約法一百八為十二以命之是為減四分之三者二減三分
