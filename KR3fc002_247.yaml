body:
  text: 乘為動本母不乘為不動如大夫五分之一以異母四三二一乘其子不以本母五乘之不更四分之一以異母五三二一乘其子不以本母四乘之簪裊三分之一以異母五四二一乘其子不以本母三乘之上造二分之一以異母五四三一乘其子不以本母二乘之公士一分之一以異母五四三二乘其子不以本母一乘之是各異母動而本母不動也大夫五分之一以異母連乘之二十四為衰不更四分之一以異母連乘之三十為衰簪裊三分之一以異母連乘之四十為衰上造二分之一以異母連乘之六十為衰公士一分之一以異母連乘之一百二十為衰是動者為不動者衰也云亦可先同其母各以分母約其子為返衰者其子字疑有誤當云亦可先同其母各以分母約之乘其子為返衰此子皆一可以省乘或作各以分母約其母為返衰其母即共母也置共母一百二十於位以分母五約之得二十四四約之得三十三約之得四十二約之得六十一約之仍得一百二十各為泛衰又以總等二遍約之得十二
