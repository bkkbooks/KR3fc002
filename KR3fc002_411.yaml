body:
  text: 者謂以四乘五除也以溝積尺為實實如法而一得用徒人數按此術本置人功去其五分之一者謂以四乘之五而一除去出土之功取其定功乃通分內子以為法以分母乘溝積尺為實者法裏有分實裏通之實如法而一即用徒人數此以一人之積尺除其衆尺故用徒人數不盡者等數約之而命分也潢按設問并出土功五分之四當作五分之一觀術文及下夏程人功可知注本置人功當作置本人功故用徒人數故字疑是得字之誤或作故得用徒人數亦通草曰置程功七百六十六尺以出土功分子一減分母五餘四乘之得三千六十四尺以五除之得六百一十二尺五分尺之四為定功復置定功以五通分內子得三千六十四尺為法置溝積四千三百七十五尺以分母五乘之得二萬一千八百七十五尺為實實如法而一得七人三千六十四分人之四百二十七即用徒人數也合問今有塹上廣一丈六尺三寸下廣一丈深六尺三寸袤一十三丈二尺一寸問積幾何答曰一萬九百四十三尺八寸八寸者謂穿地方尺深八寸此積餘有方寸中二分四𨤲五毫乘之貴欲從易非其常定也
