body:
  text: 乘又以五日乘之爲實實如法得一里此亦如上術率一百七十五里之路往返用六日也於今有術則五日爲所有數一百七十五里爲所求率六日爲所有率以此所得則三返之路今求一返當以三約之因令乘法而并除也爲術亦可各置空重行一里用日之率以爲列衰副并爲法以五日乘列衰爲實實如法所得卽各空重行日數也各以一日所行以乘爲凡日所行三返約之爲上林去太倉之數臣淳風等謹按此術重往空還一輸再還道置空行一里用七十分日之一重行一里用五十分日之一齊而同之空重行一里之路往返用一百七十五分日之六定言之者一百七十五里之路往返用六日故并空重者并齊也空重相乘者同其母也於今有術五日爲所有數一百七十五爲所求率六爲所有率以此所得則三返之路今求一返者當以三約之故令乘法而并除亦當約之也草曰置空行七十里重行五十里并之得一百二十里以三返乘之得三百六十爲法令空行七十里重行五十里相乘得三千五百里又以五日乘之得一萬七千五百里爲實實如法得四十八里三百六十分里之二十二以等數約子母爲十八分里之十一説曰注云此亦如上術率也者如上第四術注所云也云爲術亦可各置空重行一里用日之率以爲列衰副并爲法以五日乘列衰爲實實如法所得卽各空重行日數也者置空行一里
