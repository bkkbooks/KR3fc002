body:
  text: 實不以三十六乘之於率不通不可以減故先以法三十六乘中行下實二十四斗得八百六十四斗所以同之也云俱令法為母而除下禾實者令下禾實與中行下實俱以法為母而於中行下實內減去中行下禾列實也云以下禾先見之實令乘下禾秉數即得下禾一位之列實減於下實則其數是中禾之實也者以下禾先見之實九十九斗乘中行下禾一秉仍得九十九斗為下禾一位之列實以減下實八百六十四斗餘七百六十五斗是中禾之實也云餘中禾一位之實也故以一位秉數約之乃得一秉之實也者中行下實餘七百六十五斗為中禾一位之列實故以一位五秉約之得一百五十三斗為中禾一秉之實亦寄法為分母也云此右行三禾共實合三位之實故以二位秉數約之乃得上禾一位之實者約猶減也右行下實合上中下禾三位之共實故以中下禾二位秉數之實減之乃得上禾一位之實也云此右行三禾共實合中下禾之實其數並見者中禾實三十六分斗之一百五十三下禾實三十六
