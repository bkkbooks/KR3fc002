body:
  text: 乘得一百八十三寸六十分二十五𨤲以一百五十七乘之得二萬八千八百二十五寸五十九分二十五𨤲二百而一得一百四十四寸一十二分七十九𨤲六十二毫五十秒爲斛幂以正深一尺展爲一十寸乘之得一千四百四十一寸又二百七十九分六百二十五𨤲收爲十分寸之三云王莽銅斛於今尺爲深九寸五分五𨤲徑一尺三寸六分八𨤲二毫以𡽪術計之於今斛爲容九斗七升四合有奇者置斛徑一尺三寸六分八𨤲二毫自乘得一百八十七寸一十九分七十一𨤲二十四毫以一百五十七乘之得二萬九千三百八十九寸九十四分八十四𨤲六十八毫二百而一得一百四十六寸九十四分九十七𨤲四十二毫三十四秒爲斛幂以深九寸五分五𨤲乘之得一千四百三寸三百七十分三十九𨤲三百四十七毫爲斛積以一斛展爲一十斗乘之得一萬四千三十三斗七升三抄九撮三圭四粟十分粟之七以今斛積一千四百四十一寸三分除之得九斗七升三合有奇不足四合音義引此注作徑一尺
