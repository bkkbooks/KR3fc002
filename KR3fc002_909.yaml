body:
  text: 九正左行餘菽五斗答二斗黍二斗直錢三十七正次以左行減第四行菽二十斗正黍三斗負直錢四十二正第四行菽空答八斗黍十一斗直錢一百六負又以左行減第二行菽三十斗答八斗正黍九斗負直錢七十六正第二行菽空答四斗黍二十一斗直錢一百四十六負次以第二行減第四行答八斗黍十一斗直錢一百六負第四行答空黍三十一斗正直錢一百八十六正上法下實實如法得六即黍價求答價以第二行黍二十一乘黍價六得錢一百二十六減直錢一百四十六餘錢二十如答四而一得五即答價求菽價以左行答二乘答價五得錢十黍二乘黍價六得錢十二并之得錢二十二減直錢三十七餘錢十五如菽五而一得三即菽價求麥價以右行菽九負乘菽價三得錢二十七負并直錢四正得錢三十一為下實以答三乘答價五得錢十五黍二乘黍價六得錢十二并之得錢二十七減下實三十一餘錢四如麥一而一得四即麥價求麻價以第三行答三負乘答價五得錢十五負并直錢四正
