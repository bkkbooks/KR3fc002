body:
  text: 減不足四十五餘四十二爲法置所出七以所出五減之餘二以二約法四十二得二十一卽人數也以二約實三百得一百五十卽羊價也合問其一術草曰置所出七以所出五減之餘二爲法以不足三減不足四十五餘四十二爲實實如法得二十一卽人數也副置人數二十一以所出五乘之得一百五增不足四十五得一百五十以所出七乘之得一百四十七增不足三亦得一百五十卽羊價也合問今有共買豕人出一百盈一百人出九十適足問人數豕價各幾何荅曰一十人豕價九百今有共買犬人出五不足九十人出五十適足問人數犬價各幾何荅曰二人犬價一百盈適足不足適足術曰以盈及不足之數爲實置所出率以少減
  hash: sha256:b08b42ce86898cad5ee45e53a14d379445ddb7d47660b15fffe654ec8691af50
