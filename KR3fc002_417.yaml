body:
  text: 圖同於塹而長於塹草曰置上廣一丈八尺下廣三尺六寸并之得二丈一尺六寸半之得一丈八寸展為一十尺八寸以深一丈八尺展為一十八尺乘之得一百九十四尺四寸又以袤五萬一千八百二十四尺乘之得一千七萬四千五百八十五尺六寸即渠積也合問秋程人功三百尺問用徒幾何答曰三萬三千五百八十二人功內少一十四尺四寸草曰置渠積一千七萬四千五百八十五尺六寸為實以程功三百尺為法實如法而一得三萬三千五百八十一人餘二百八十五尺六寸以減三百尺餘一十四尺四寸為所少數亦收
  hash: sha256:61395abf1d7b01a84c6f303a325d3cd1c9f080b2902a8f8d8395a7c2bdb42e39
