body:
  text: 步也潢按注善行者行一百步爲追及率脫爲字草曰置善行者一百步以不善行者六十步減之餘四十步爲法以善行者之一百步乘不善行者先行一百步得一萬步爲實實如法得二百五十步合問説曰注云約之追及率得五先行率得二者以先行率四十步與追及率一百步求等得二十以約追及率得五約先行率得二今有不善行者先行十里善行者追之一百里先至不善行者二十里問善行者幾何里及之荅曰三十三里少半里術曰置不善行者先行十里以善行者先至二十里增之以爲法以不善行者先行十里乘善行者一百里爲實實如法得一里按此術不善行者旣先行十里後不及二十里并之得三十里也謂之先行率善行者一百里爲追及率約之先行率得三三爲所有率而今有之卽得也其意如上術潢按注多脫文校正於後按此術不善行者旣先行十里後不及二十里并之得三十里也謂之先行率善行者一百里
