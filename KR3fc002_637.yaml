body:
  text: 步也潢按注善行者行一百步為追及率脫為字草曰置善行者一百步以不善行者六十步減之餘四十步為法以善行者之一百步乘不善行者先行一百步得一萬步為實實如法得二百五十步合問說曰注云約之追及率得五先行率得二者以先行率四十步與追及率一百步求等得二十以約追及率得五約先行率得二今有不善行者先行十里善行者追之一百里先至不善行者二十里問善行者幾何里及之答曰三十三里少半里術曰置不善行者先行十里以善行者先至二十里增之以為法以不善行者先行十里乘善行者一百里為實實如法得一里按此術不善行者既先行十里後不及二十里并之得三十里也謂之先行率善行者一百里為追及率約之先行率得三三為所有率而今有之即得也其意如上術潢按注多脫文校正於後按此術不善行者既先行十里後不及二十里并之得三十里也謂之先行率善行者一百里
