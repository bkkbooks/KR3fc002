body:
  text: 二十七乘之得九百七十二升為實以粟率二十五為法除之得三斗八升二十五分升之二十二即稗飯也合問說曰注云此術與大䵂多同者大䵂之率五十有四稗飯之率亦五十有四皆因其可半而半之以二十七為所求率二十五為所有率是多同也今有粟八斗六升欲為糳飯問得幾何答曰為糳飯八斗二升二十五分升之一十四術曰以粟求糳飯二十四之二十五而一臣淳風等謹按糳飯率四十八此亦半二率而乘除草曰置粟八斗六升展為八十六升以糳飯率二十四乘之得二千六十四升為實以粟率二十五為法除之得八斗二升二十五分升之一十四即糳飯也合問說曰注云亦者亦糳米也糳米之率二十有四以粟求糳米十二之二十五而一是半二率而乘除糳飯之率四十有八以粟求糳飯二十四之二十五而一亦半二率而乘除也
  hash: sha256:da6d0a3521c015b176e81ea8ba11df365c79b9ab49a54a776eb8fdca150c5f10
