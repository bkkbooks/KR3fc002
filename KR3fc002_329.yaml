body:
  text: 二七分之一為七分之一百三十二八分之一為二分之三十三九分之一為九分之一百三十二十分之一為十分之一百三十二十一分之一為一十二十二分之一為一十一置之於左又以分母一十遍乘諸分子及已通者各以其母除其子則一為一千三百二十半為六百六十三分之一為四百四十四分之一為三百三十五分之一為二百六十四六分之一為二百二十七分之一為七分之一千三百二十八分之一為一百六十五九分之一為九分之一子三百二十十分之一為一百三十二十一分之一為一百二十十二分之一為一百一十置之於左又以分母九遍乘諸分子及已通者各以其母除其子則一為一萬一千八百八十半為五千九百四十三分之一為三千九百六十四分之一為二千九百七十五分之一為二千三百七十六六分之一為一千九百八十七分之一為七分之一萬一千八百八十八分之一為一千四百八十五九分之一為一千三百二十十分之一為一千一百八十八十一分之一
