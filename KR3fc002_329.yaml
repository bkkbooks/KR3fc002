  text: 二七分之一爲七分之一百三十二八分之一爲二分之三十三九分之一爲九分之一百三十二十分之一爲十分之一百三十二十一分之一爲一十二十二分之一爲一十一置之於左又以分母一十徧乘諸分子及已通者各以其母除其子則一爲一千三百二十半爲六百六十三分之一爲四百四十四分之一爲三百三十五分之一爲二百六十四六分之一爲二百二十七分之一爲七分之一千三百二十八分之一爲一百六十五九分之一爲九分之一子三百二十十分之一爲一百三十二十一分之一爲一百二十十二分之一爲一百一十置之於左又以分母九徧乘諸分子及已通者各以其母除其子則一爲一萬一千八百八十半爲五千九百四十三分之一爲三千九百六十四分之一爲二千九百七十五分之一爲二千三百七十六六分之一爲一千九百八十七分之一爲七分之一萬一千八百八十八分之一爲一千四百八十五九分之一爲一千三百二十十分之一爲一千一百八十八十一分之一
