body:
  text: 約分母子為一百七十五分日之六是為空重行一里之路往返用日分也云各置所當出粟以其一斛之費乘之如算數而一得率算出九錢一百三十三分錢之三者此以算數為所有率所當出粟乘一斛之費為所求率一算為所有數而今有之得算出錢置甲縣一萬八千九百四十七斛一百三十三分斛之四十九通分內子得二百五十二萬以其一斛之費二十乘之得五千四十萬為實以分母一百三十三乘甲算四萬二千得五百五十八萬六千為法實如法得九錢五百五十八萬六千分錢之一十二萬六千以等數四萬二千約子母為一百三十三分錢之三置乙縣一萬八百二十七斛一百三十三分斛之九通分內子得一百四十四萬以其一斛之費二十八錢五分六釐乘之得四千一百一十二萬六千四百為實以分母一百三十三乘三萬四千二百七十二得四百五十五萬八千一百七十六為法實如法得九錢四百五十五萬八千一百七十六分錢之一十萬二千八百一十六以等數三萬四千二百七
