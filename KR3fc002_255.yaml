body:
  text: 之八為丙所得合問説曰粟率五十糲米率三十糲飯率七十五是衰也置分母五十三十七十五於右方各分子之一於左方母互乘子五十分之一得二千二百五十三十分之一得三千七百五十七十五分之一得一千五百是返衰也返衰者率多者衰少率少者衰多也上衰分注云重疊則可約故又求總等七百五十以約泛衰得甲三乙五丙二為列衰副并得一十以為法也注云三人所持升數雖等論其本率精粗不同者甲乙丙所持雖皆三升而粟率五十糲米率三十糲飯率七十五精粗不同也云米率雖少令最得多飯率雖多返使得少者米率三十得四升一十分升之五飯率七十五得一升一十分升之八云故令返之使精得多而粗得少者置粟率米率飯率而返衰之得甲三乙五丙二為列衰故甲所得居十分之三乙所得居十分之五丙所得居十分之二是使精得多而粗得少也今有絲一斤價直二百四十今有錢一千三百二十八問得絲幾何
