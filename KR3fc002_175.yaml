body:
  text: 十分錢之一千七百五十子母各以五十約之為四十七分錢之三十五即一箇錢也合問說曰所買率所有率也所出錢數所有數也此以出錢為所有數一枚為所求率所買為所有率今有之義以所有數乘所求率為實以所有率為法但一乘不長故不復乘是以徑將所買之率為法所出之錢為實實如法而一得所求數以其省乘而為經率則經有徑義今有出錢五千七百八十五買𣾰一斛六斗七升太半升欲斗率之問斗幾何答曰一斗三百四十五錢五百三分錢之一十五今有出錢七百二十買縑一匹二丈一尺欲丈率之問丈幾何答曰一丈一百一十八錢六十一分錢之二今有出錢二千三百七十買布九匹二丈七尺欲匹率之問匹幾何答曰一匹二百四十四錢一百二十九分錢之一百二十四
