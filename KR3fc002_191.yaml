body:
  text: 二銖以斤積銖三百八十四除之得二十斤餘二百一十二銖以兩積銖二十四除之得八兩二十銖上位得七斤一十兩九銖鈞二千一十二錢下位得一石二鈞二十斤八兩二十銖鈞二千一十三錢合問買絲斤率之草曰置絲一斤以斤積銖通之得三百八十四以出錢一萬三千九百七十乘之得五百三十六萬四千四百八十錢爲實次置所買絲一石二鈞二十八斤三兩五銖通之得七萬九千九百四十九銖爲法實如法得六十七錢爲賤絲一斤之價每斤增一錢得六十八錢爲貴絲一斤之價實餘七千八百九十七銖爲貴絲以實餘七千八百九十七銖減所買絲七萬九千九百四十九銖餘七萬二千五十二銖爲賤絲乃置賤絲七萬二千五十二銖於上位以石積銖四萬六千八十除之得一石餘二萬五千九百七十二銖以鈞積銖一萬一千五百二十除之得二鈞餘二千九百三十二銖以斤積銖三百八十四除之得七斤餘二百四十四銖以兩積銖二十四除之得十兩餘四銖又
  hash: sha256:5cf4fe6d35966b53ff2959ac1946aa3a73cce4f63b19a938749be9a13542eafe
