body:
  text: 母除其子則一為三千九百六十半為一千九百八十三分之一為一千三百二十四分之一為九百九十五分之一為七百九十二六分之一為六百六十七分之一為七分之三千九百六十八分之一為四百九十五九分之一為四百四十十分之一為三百九十六十一分之一為三百六十置之於左又以分母七遍乘諸分子及巳通者仍以分母除其子則一為二萬七千七百二十半為一萬三千八百六十三分之一為九千二百四十四分之一為六千九百三十五分之一為五千五百四十四六分之一為四千六百二十七分之一為三千九百六十八分之一為三千四百六十五九分之一為三千八十十分之一為二千七百七十二十一分之一為二千五百二十并之得八萬三千七百一十一以為法置田二百四十步亦以一為二萬七千七百二十乘之得六百六十五萬二千八百步為實實如法得七十九步八萬三千七百一十一分步之三萬九千六百三十一即從步也合問
  hash: sha256:112ddd90a4f985aff983aef990b1a7e8ec56fae9b4f01f7e6dd0fcc51b07d429
