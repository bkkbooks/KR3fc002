body:
  text: 子母各以四十約之為七分尺之六通分內子得二萬一千三百八十四尺又以七乘之得一十四萬九千六百八十八尺為定實開方除之得三百八十六尺八寸九分餘實四尺一十二寸七十九分棄之置三百八十六尺八寸九分以分母七除之得五十五尺二寸七分收為五丈五尺一百分尺之二十七即周也九章算術細草圖説卷五門下晚學生沈欽裴算校
