body:
  text: 子母各以四十約之爲七分尺之六通分內子得二萬一千三百八十四尺又以七乘之得一十四萬九千六百八十八尺爲定實開方除之得三百八十六尺八寸九分餘實四尺一十二寸七十九分棄之置三百八十六尺八寸九分以分母七除之得五十五尺二寸七分收爲五丈五尺一百分尺之二十七卽周也九章算術細草圖説卷五門下晚學生沈欽裴算校
