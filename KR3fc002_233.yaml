body:
  text: 為列衰副并得一萬二千一百七十五為法以所發徭三百七十八人乘未并者北鄉得一百六十五萬五千二百六十二人西鄉得一百三十六萬七千六百四人南鄉得一百五十七萬九千二百八十四人各自為實實如法得一百三十五人一萬二千一百七十五分人之一萬一千六百三十七為北鄉所遣得一百一十二人一萬二千一百七十五分人之四千四為西鄉所遣得一百二十九人一萬二千一百七十五分人之八千七百九為南鄉所遣合問說曰此所發徭三百七十八人為三鄉共出之數今欲以算數多少衰出之當以北鄉算八千七百五十八西鄉算七千二百三十六南鄉算八千三百五十六為列衰術為其太繁故求總等二以遍約之得北鄉四千三百七十九西鄉三千六百一十八南鄉四千一百七十八為列衰副并得一萬二千一百七十五以為法注云三鄉算數約可半者為列衰即以總等二約之也云此術今有之義者於今有術列衰各為所求率副并為所有率所發徭三百七十八人為
