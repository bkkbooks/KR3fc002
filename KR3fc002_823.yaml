body:
  text: 秉負下禾二十四秉正下實三斗正以異減同并左行左行中禾空下禾二十五秉正下實四斗正上禾中禾下禾實秉秉斗中行負正正左行正正左行上為法下為實實四斗即下禾一秉之實寄法二十五為分母求中禾以法二十五乘中行下實一斗得二十五斗於下位以下禾實四斗乘中行下禾一秉得四斗以減下位餘二十一斗為中禾一位之實如中禾三秉而一得七斗為中禾一秉之實寄法二十五為分母求上禾亦以法二十五乘右行下實一斗得二十五斗於下位以中禾實七斗乘右行中禾一秉得七斗以減下位餘一十八斗為上禾一位之實如上禾二秉而一得九斗為上禾一秉之實寄法二十五為分母乃置上禾實九斗中禾實七斗下禾實四斗各以法二十五命之
