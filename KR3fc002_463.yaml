body:
  text: 壬庚乙甲為鱉臑甲乙壬為上平句股幂壬乙庚為立句股幂甲乙庚為旁句股幂甲壬庚為外邪句股幂丙辛癸丁為鱉臑丁丙癸為上平句股幂癸丙辛為立句股幂丁丙辛為旁句股幂丁癸辛為外邪句股幂合而觀之是兩鱉臑夾一塹堵即羡除之形也云下廣末廣皆塹堵之廣原文脫末廣二字云以深袤乘者并三廣以深袤乘也不言并三廣承上可知也云得積五尺鱉臑居二塹堵居三其於本棊皆以為六故六而一者注所用棊下廣末廣皆一尺為塹堵之廣上廣三尺中一尺為塹堵之廣兩旁各一尺為鱉臑之廣置塹堵之廣一尺以深袤各一尺乘之得積一尺三因之為立方三共積三尺為一塹堵之六倍置兩鱉臑之廣各一尺以深袤各一尺乘之得立方二共積二尺為兩鱉臑之六倍也云合四陽馬以為方錐圖説巳見前云邪畫方錐之底亦令
