body:
  text: 壬庚乙甲爲鼈臑甲乙壬爲上平句股幂壬乙庚爲立句股幂甲乙庚爲旁句股幂甲壬庚爲外邪句股幂丙辛癸丁爲鼈臑丁丙癸爲上平句股幂癸丙辛爲立句股幂丁丙辛爲旁句股幂丁癸辛爲外邪句股幂合而觀之是兩鼈臑夾一壍堵卽羡除之形也云下廣末廣皆壍堵之廣原文脫末廣二字云以深袤乘者并三廣以深袤乘也不言并三廣承上可知也云得積五尺鼈臑居二壍堵居三其於本棊皆以爲六故六而一者注所用棊下廣末廣皆一尺爲壍堵之廣上廣三尺中一尺爲壍堵之廣兩旁各一尺爲鼈臑之廣置壍堵之廣一尺以深袤各一尺乘之得積一尺三因之爲立方三共積三尺爲一壍堵之六倍置兩鼈臑之廣各一尺以深袤各一尺乘之得立方二共積二尺爲兩鼈臑之六倍也云合四陽馬以爲方錐圖説巳見前云邪畫方錐之底亦令
