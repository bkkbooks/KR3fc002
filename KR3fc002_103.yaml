body:
  text: 也按方錐下六尺則方周二十四尺以五尺乘而半之則亦方錐之見幂故求圓錐之數折徑以乘下周之半即圓錐之幂也今宛田上徑圓穹而與圓錐同術則幂失之於少矣然其術難用故略舉大較施之大廣田也求圓錐之幂猶求圓田之幂也今用兩全相乘故以四為法除之亦如圓田矣開立圓術說圓方諸率甚備可以驗此草曰置下周三十步於上位徑十六步於下位上下相乘得四百八十步四而一得一百二十步合問草曰置下周九十九步於上位徑五十一步於下位上下相乘得五千四十九步四而一得一千二百六十二步四分步之一如畝法二百四十步而一得五畝六十二步四分步之一合問說曰折徑者以邪弦為半徑也平方平圓之半徑為直徑方錐圓錐之半徑為折徑今法渾圓面任割一分欲求面分之容則取自正頂至所割圓界之度為半徑作平圓其容相等即邪弦為半徑之法也今有弧田弦三十步矢十五步問為田幾何答曰一畝九十七步半又有弧田弦七十八步二分步之一矢十三步九分步之七問為田幾何
