body:
  text: 斛之八十四子母各以三約之為九十九分斛之二十八委菽草曰置下周三丈展為三十尺自乘得九百尺以高七尺乘之得六千三百尺十八而一得三百五十尺即菽積也合問𡽪術草曰如前求到六千三百尺以二十五乘之得一十五萬七千五百尺四百七十一而一得三百三十四尺四百七十一分尺之一百八十六即菽積也密率草曰如前求到六千三百尺以七乘之得四萬四千一百尺一百三十二而一得三百三十四尺一百三十二分尺之一十二子母各以十二約之為十一分尺之一即菽積也為菽草曰置菽積三百五十尺以菽斛法二尺四寸三分除之得一百四十四斛二百四十三分斛之八合問𡽪術草曰置菽積三百三十四尺四百七十一分尺之一百八十六通分內子得一十五萬七千五百尺為實次置菽斛法二尺四寸三分亦以四百七十一通之得一千一百四十四尺五
