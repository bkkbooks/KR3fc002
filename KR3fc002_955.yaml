body:
  text: 云今此術先求其半至加得戶高者謂於弦幂內減去半差幂之倍餘半之得句股并幂四分之一開方除之得句股并之半也如上圖弦幂內容朱幂四黃幂一今減去半差自乘者倍餘朱幂四黃幂四分之二又半之為朱幂二黃幂四分之一其於前圖句股并幂棄四分之三餘四分之一開方除之得句股并之半所謂大方者即句股并幂也云又按此圖幂至然後知其句與股也者先言有并有差求弦後言有弦有差求句股并也云句股適等者至同源而分流焉者言差并與弦可以互求句股適等者與弦亦可互求也云假令至相近耳者言無差者之不可開也云其句股合而自乘之幂至減差於合而半之為句者論有并有弦求句股之法與設問之意更相反覆也云其出此圖也以下就術文推廣言之備開帶從平方法也倍弦為廣袤合截句股差為廣餘者為袤廣袤相乘為實倍弦為從法開方除之得廣即句股差其云矩句者即矩句磬折之謂云從法者與下問以出北門步數并出南門步數為從法者同也云其
