body:
  text: 即為中分節之容也草曰以下三節分四升得三分升之四為下率以上四節分三升得四分升之三為上率齊而同之得上率十二分之九下率十二分之十六上下率以少減多餘十二分升之七為實置四節三節并而半之得三節半以減九節餘五節半為法實如法得六十六分升之七即衰相去也副置下率三分升之四即下第二節容一升六十六分升之二十二以衰相去六十六分升之七加之得下初一升六十六分升之二十九以衰相去六十六分升之七遞減之得次一升六十六分升之一十五次一升六十六分升之八次一升六十六分升之一次六十六分升之六十次六十六分升之五十三次六十六分升之四十六次六十六分升之三十九合問説曰注云此二率者各其平率者下率三分升之四為下第二節所容數上率四分升之三為上第二節第三節所容相并折半之數云實者中間五節半之凡差也故實如法而一即每節之差也者置下率十二分升之十六以上率十
