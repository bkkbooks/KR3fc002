body:
  text: 甲禾二秉負丙禾八秉正重二石正以異減同并左行左行甲禾空乙禾一秉負丙禾八秉正重三石正次令中行乙禾三秉徧乘左行左行得乙禾三秉負丙禾二十四秉正重九石正以異減同并左行左行乙禾空丙禾二十三秉正重十石正上法下實實十石卽丙禾一秉之實寄法二十三爲分母求乙禾重以法二十三乘中行下實一石得二十三石爲下實以丙禾重十石乘中行丙禾一秉仍得十石以并下實得三十三石如乙禾三秉而一得十一石爲乙禾一秉之重寄法二十三爲分母求甲禾重又以法二十三乘右行下實一石得二十三石爲下實以乙禾重十一石乘右行乙禾一秉仍得十一石以并下位得三十四石如甲禾二秉而一得十七石爲甲禾一秉之重寄法二十三爲分母乃置甲禾十七石乙禾十一石丙禾十石皆以法二十三命之得甲禾一秉重二十三分石之十七乙禾一秉重二十三分石之十一丙禾一秉重二十三分石之十合問説曰術云置重過於石之物爲負者甲禾二秉重過於石如乙一秉是乙禾一秉爲甲禾二秉
  hash: sha256:03c8b615a42b2e0ddb9ac60e27d798bf520e726881888b0d725ab33591763d8b
