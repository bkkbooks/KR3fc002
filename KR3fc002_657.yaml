body:
  text: 三三者上部二人各以三加之則得二三下部三人各以三加之則得三三也云下部猶差一人差得一以通於本率即上下部等也者上部二人下部三人是下部差多一人也差得一一疑當作三以差三加於本率則一為四二為五三為六并之得十五為下部四為七五為八并之亦得十五為上部是上下部等也云假令七人分七錢欲令上二人與下五人等則上下部差三人并上部為十三下部為十五者上部二人甲七乙六并為十三下部五人丙五丁四戊三巳二庚一并為十五也云下多上少下不足減上當以上下部列差而後均減乃合所問者以上部十三減下部十五餘二為差實以上下部差三人為差法除實得三之二為差均減錐行衰得錐行定衰如以三之二減甲七甲得六又三之一減乙六乙得五又三之一減丙五丙得四又三之一減丁四丁得三又三之一減戊三戊得二又三之一減已二已得一又三之一減庚一庚得三之一為錐行定衰并上部甲乙二人得十一又三之二并下部丙丁戊已庚五
  hash: sha256:5052e77e5919c229e977ed924beabf0c0e20256d619808b08c9833be567c47e6
