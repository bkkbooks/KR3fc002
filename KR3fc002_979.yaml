body:
  text: 句句弦差減股為圓徑又弦減句股并餘為圓徑并句弦差股弦差減弦餘為圓徑以句弦差乘股弦差而倍之開方除之亦圓徑也草曰置句八步於上位自乘得六十四步為句幂置股十五步於下位自乘得二百二十五步為股幂并句股幂得二百八十九步為弦幂開方除之得一十七步為弦以并上下位得四十步為句股弦并以為法以句乘股得一百二十步倍之得二百四十步為實實如法得六步即容圓徑也合問說曰句股相乘為朱靑黃幂各二者半徑自乘為黃幂二半徑減句餘以半徑乘之為朱幂二半徑減股餘以半徑乘之為靑幂二也如圖句股相乘為朱靑黃幂各二黃方之面即圓徑之半云則倍之為各四可用畫於小𥿄分裁邪正之會者句股相乘倍之為朱靑黃幂各四於邪正會處分裁之以便顚倒相補也
