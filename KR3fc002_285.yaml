body:
  text: 今一日所有錢也云於今有術為所有數息三十為所求率三萬錢為所有率者貸人三萬錢一日息三十今貸人六千七百五十錢則一日息六錢四分錢之三此今有之義也云此又可以一月三十日約息三十錢為十分一日者十分一日疑當作一錢一日以等數三十約一月日為一日約息三十為一錢也云以乘今一日所有錢為實千錢為法者以一錢乘實一日乘法法實不長故徑以今一日所有錢六千七百五十為實千錢為法也云為率者當等之於一者實長法亦長實消法亦消故以三十日乘千錢為所有率則以息三十為所求率若徑以千錢為所有率則亦以三十日約息三十錢得一錢為所求率也云故三十日或可乘本或可約息皆所以等之也者術以三十日乘本注以三十日約息皆所以等之於一也此亦可約前後二率以乘除先以貸人千錢與七百五十錢相約得四與三為率次以三十日與九日相約得一十與三為率乃以四乘一十得四十為法以三乘息三十錢得九十又以三乘之得二百七
  hash: sha256:c18ff60fd7f3815f9ec7225f086a11db10cec2a17f2012886ae413ddcbacb203
