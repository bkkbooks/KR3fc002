body:
  text: 今一日所有錢也云於今有術爲所有數息三十爲所求率三萬錢爲所有率者貸人三萬錢一日息三十今貸人六千七百五十錢則一日息六錢四分錢之三此今有之義也云此又可以一月三十日約息三十錢爲十分一日者十分一日疑當作一錢一日以等數三十約一月日爲一日約息三十爲一錢也云以乘今一日所有錢爲實千錢爲法者以一錢乘實一日乘法法實不長故徑以今一日所有錢六千七百五十爲實千錢爲法也云爲率者當等之於一者實長法亦長實消法亦消故以三十日乘千錢爲所有率則以息三十爲所求率若徑以千錢爲所有率則亦以三十日約息三十錢得一錢爲所求率也云故三十日或可乘本或可約息皆所以等之也者術以三十日乘本注以三十日約息皆所以等之於一也此亦可約前後二率以乘除先以貸人千錢與七百五十錢相約得四與三爲率次以三十日與九日相約得一十與三爲率乃以四乘一十得四十爲法以三乘息三十錢得九十又以三乘之得二百七
  hash: sha256:1b69d7aff7041ded6fbd1612013a37700782f8e8a59ffea87de579cc2c2d118c
