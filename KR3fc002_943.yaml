body:
  text: 索長子不可半者倍其母加差於并則成兩索長故又半之其減差於并而半之得木長也草曰置去本八尺為句自乘得六十四尺為句幂以委地三尺為股弦差除之得二十一尺三分尺之一為股弦并加股弦差三尺得二十四尺三分尺之一為兩弦并半之得一十二尺六分尺之一為弦即索長也合問注求木長草曰如前求到股弦并二十一尺三分尺之一以股弦差三尺減之餘一十八尺三分尺之一為兩股并半之得九尺六分尺之一為股即木長說曰子不可半者倍其母謂三分之一不可半故倍其母為六分之一也今有垣高一丈倚木於垣高與垣齊引木郤行一尺其木至地問木幾何答曰五丈五寸如圖垣高為句去垣為股木長為弦郤行為股弦差
  hash: sha256:cb39efa8219c3bdc05287e288e14b264ba00fafee51dd0a48001a2a65db22566
