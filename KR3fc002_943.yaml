body:
  text: 索長子不可半者倍其母加差於并則成兩索長故又半之其減差於并而半之得木長也草曰置去本八尺爲句自乘得六十四尺爲句幂以委地三尺爲股弦差除之得二十一尺三分尺之一爲股弦并加股弦差三尺得二十四尺三分尺之一爲兩弦并半之得一十二尺六分尺之一爲弦卽索長也合問注求木長草曰如前求到股弦并二十一尺三分尺之一以股弦差三尺減之餘一十八尺三分尺之一爲兩股并半之得九尺六分尺之一爲股卽木長説曰子不可半者倍其母謂三分之一不可半故倍其母爲六分之一也今有垣高一丈倚木於垣高與垣齊引木郤行一尺其木至地問木幾何荅曰五丈五寸如圖垣高爲句去垣爲股木長爲弦郤行爲股弦差
  hash: sha256:2cfb4625f89e530d849f8cdaf8fec223e153630c1dd209ca98e5301ad5ecef2b
