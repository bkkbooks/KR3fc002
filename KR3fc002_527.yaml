body:
  text: 三寸六分八𨤲七毫今以一尺三寸六分八𨤲七毫自乘得一百八十七寸三十三分三十九𨤲六十九毫以一百五十七乘之得二萬九千四百一十一寸四十三分三十一𨤲三十三毫二百而一得一百四十七寸五分七十一𨤲六十五毫六十六秒五十忽為斛幂以深九寸五分五𨤲乘之得一千四百四寸三百九十五分九百三十二𨤲一百毫七百五十秒為斛積以十斗乘之得一萬四千四十三斗九升五合九勺三抄二撮一圭一千分粟之七十五以今斛積一千四百四十一寸三分除之得九斗七升四合有奇為今斛所容與注適合是此本誤而音義所引不誤也云周官考工記㮚氏為量深一尺內方一尺而圓外其實一釜於𡽪術此圓積一千五百七十寸者以內方一尺展為一十寸自乘得一百寸為內方幂倍之得二百寸為外方幂於𡽪術方幂二百圓幂一百五十七置一百五十七寸以深一尺展為一十寸乘之得圓積一千五百七十寸云釡六斗四升方一尺深一尺其積一千寸若此方積容六斗四升則
  hash: sha256:968f19029958e6f3bd98b6844d338370e80ef3618937bbb6b31787a88a6c9287
