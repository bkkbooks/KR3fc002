body:
  text: 八萬八千三百為定法復除折而下以三乘上議一十得三十從中行九百得九百三十為𠔳法復借一算置下行步之中超一下超二至尺而止置上議九一乘中九百三十得八千三百七十為𠔳幂再乘下一算得八十一為隅幂并之得八千四百五十一以加定法二十八萬八千三百得二十九萬六千七百五十一為定法以上議九乘之得三百六十七萬七百五十九減實適盡上議得三百一十九尺置分母五百一十二開立方除之得八以除三百一十九尺得三十九尺八分尺之七即立方也合問草曰置積一百九十三萬七千五百四十一尺二十七分尺之一十七通分內子得五千二百三十一萬三千六百二十四尺為定實借一算步之超二等至百而止置上議三百再乘所借一算得九萬為方法以上議三百乘之得二千七百萬以減實實餘二千五百三十一萬三千六百二十四尺除巳以三乘方法九萬得二十七萬為定法復除折而下以三乘上議三百得九百為𠔳法置中行復借一算置下行步之中
