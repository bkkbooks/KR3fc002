body:
  text: 令一尺七寸半維乘二日得三十五日令一尺五寸維乘三日得四十五日假令不足右行日寸假令有餘左行日寸并之得八十日為實并有餘一尺七寸半不足一尺五寸得三十二寸半為法實如法得二日三百二十五分日之一百五十以等數二十五約分母子為十三分日之六合問求各長草曰蒲生日自半一日長三尺次日半之長一尺五寸後日半之長七寸五分以七寸五分乘日分子六得四十五寸如日分母十三而一得三寸十三分寸之六增前二日定長四尺五寸得四尺八寸十三分寸之六即蒲長也莞生日自倍一日長一尺次日倍之長二尺後日倍之長四尺以四尺乘日分子六得二十四尺如日分母十三而一得一尺八寸十三分寸之六增前二日定長三尺得四尺八寸十三分
  hash: sha256:6eabbd647fb8c7dbad64c33fc9ef429aaec38ee5f4ac84636aea4957b2cda869
