body:
  text: 一綆正七十六逮井正上為法下為實實不滿法以法命之是為戊綆逮井七百二十一分之七十六故以七百二十一為井深七十六為戊綆之長乃置井深七丈二尺一寸於下位以戊綆長七尺六寸乘原列左行戊六綆得四丈五尺六寸以減下位餘二丈六尺五寸為甲綆之長以甲綆長二丈六尺五寸乘右行甲二綆得五丈三尺以減下位餘一丈九尺一寸為乙綆之長以乙綆長一丈九尺一寸乘第二行乙三綆得五丈七尺三寸以減下位餘一丈四尺八寸為丙綆之長以丙綆長一丈四尺八寸乘第三行丙四綆得五丈九尺二寸以減下位餘一丈二尺九寸為丁綆之長合問説曰注云此率初如方程為之又云舉率以言之是明以法七百二十一為井深率實七十六為戊綆長率言率以該凡也答以丈尺寸者取其易明即方程注所云且為有所據而言也云名各一逮井者甲二綆加乙一綆而一逮井乙三綆加丙一綆而一逮井丙四綆加丁一綆而一逮井丁五綆加戊一綆而一逮井戊六綆加
  hash: sha256:1830f963fa7cb1062b51eed6fb90af5b630610c2ef30b2e1fe287e2ad73b69f7
