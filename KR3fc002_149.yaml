body:
  text: 內子得五十四斗二升展爲五百四十二升以麥率九乘之得四千八百七十八升爲實以分母五乘粟率十得五十爲法除之得九斗七升五十分升之二十八子母各半之爲二十五分升之一十四卽麥也合問説曰注云先以等數五約之者置粟率五十於上位四術率並四十五於下位以下減上上位餘五轉以上餘減下位下位亦餘五是五爲等數也以等數五約四術率四十五得九爲所求率以等數五約粟率五十得十爲所有率故以九乘十除也今有粟七斗五升七分升之四欲爲稻問得幾何荅曰爲稻九斗三十五分升之二十四術曰以粟求稻六之五而一臣淳風等謹按稻率六十亦約二率而乘除草曰置粟七斗五升七分升之四通分內子得五十二斗九升展爲五百二十九升以稻率六乘之得三千一百七十四升爲實以分母七乘稻率五得三十五爲法除之得九斗三十五分升之二十四卽稻也合問
  hash: sha256:57f1f35c9d4ccf85d3a5287ff97de109ee1f959d01222a2247a5533e548c5ab1
