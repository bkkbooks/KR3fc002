body:
  text: 今有甲持粟三升乙持糲米三升丙持糲飯三升欲令合而分之問各幾何答曰甲二升一十分升之七乙四升一十分升之五丙一升一十分升之八術曰以粟率五十糲米率三十糲飯率七十五為衰而返衰之副并為法以九升乘未并者各自為實實如法得一升按此術三人所持升數雖等論其本率精粗不同米率雖少令最得多飯率雖多返使得少故令返之使精得多而粗得少於今有術副并為所有率未并者各為所求率九升為所有數而今有之即得草曰置粟率五十糲米率三十糲飯率七十五為衰而返衰之甲五十分之一得二千二百五十乙三十分之一得三千七百五十丙七十五分之一得一千五百各為泛衰求總等得七百五十以遍約之甲得三乙得五丙得二為列衰副并得一十為法以九升乘未并者甲得二十七升乙得四十五升丙得一十八升各自為實實如法得二升一十分升之七為甲所得得四升一十分升之五為乙所得得一升一十分升
  hash: sha256:a47104b7f0d60ddaedf4d1261974be880a40fd80c4c23db62357ad7efb3909ca
