body:
  text: 秉正而一得八斗為上禾一秉之實合問説曰損實第一問上禾皆正是同減異并之例第二問上禾一正一負是異減同并之例此問益實六斗本為下禾多於上禾之數術命上禾為正則下禾與六斗皆宜為負乃以下禾為負上禾與六斗皆正又益實一斗本為上禾多於下禾之數術命上禾為負則上禾與一斗皆宜為負乃以上禾為負下禾與一斗皆正注云六斗為差實差實者下禾之餘實是以下禾與六斗同名與前各問同術術文所列正負自係傳刻之誤故正之又方程列行無論多少減至一法一實必然同名依術文所列正負算之所餘法實異名與此書之例亦為不符矣術云損實不云益者但損而不益其云益實不云損者但益而不損非取此與彼之謂前損益一問兼言損益注云今欲全其實當加所損今欲知本實當減所加亦非取此與彼也取此與彼則如後甲乙懷錢術甲得乙半而錢五十乙得甲太半而亦錢五十是取乙之半與甲取甲之太半與乙也注云故亦互其算者亦亦前損實也前術
  hash: sha256:e42fef2e69e254faeba657a97a03f03ab2a868f6f69ce1c9f4ad263fbddb1dcf
