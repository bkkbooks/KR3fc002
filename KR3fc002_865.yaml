body:
  text: 武馬一匹力引二十二石七分石之六中馬一匹力引十七石七分石之一下馬一匹力引五石七分石之五合問説曰此問本無正負以右減左而分正負與上中下三禾各取一秉問同爲諸物借取之例以右行直除左行同名相除中馬一匹在右爲正在左爲負正無人負之也以中行徧乘左行異名相除同名相益載四十石在中爲正在左仍爲正正無人正之也今有五家共井甲二綆不足如乙一綆乙三綆不足如丙一綆丙四綆不足如丁一綆丁五綆不足如戊一綆戊六綆不足如甲一綆各得所不足一綆皆逮問井深綆長各幾何荅曰井深七丈二尺一寸甲綆長二丈六尺五寸乙綆長一丈九尺一寸丙綆長一丈四尺八寸丁綆長一丈二尺九寸戊綆長七尺六寸術曰如方程以正負術入之此率初如方程爲之名各一逮井其
