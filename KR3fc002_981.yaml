body:
  text: 云令顚倒相補至并句股弦以為法者釋以句乘股倍之為實并句股弦為法得容圓徑之義也四黃幂合成正方即圓徑自乘幂四朱幂合成長方即圓徑為廣半圓徑減句餘倍之為袤相乘幂四靑幂合成長方即圓徑為廣半圓徑減股餘倍之為袤相乘幂合之成修幂圓徑為廣并句股弦為袤云又以圖之大體言之至皆圓徑之半者謂立規於句股中心自立規處度至句至股至弦皆半徑也故曰三徑均乃運規成圓又畫中弦以觀其會則句股之中成小句股弦者四句面之小股股面之小句小方之面皆圓徑之半
