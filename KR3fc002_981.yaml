body:
  text: 云令顚倒相補至并句股弦以爲法者釋以句乘股倍之爲實并句股弦爲法得容圓徑之義也四黃幂合成正方卽圓徑自乘幂四朱幂合成長方卽圓徑爲廣半圓徑減句餘倍之爲袤相乘幂四靑幂合成長方卽圓徑爲廣半圓徑減股餘倍之爲袤相乘幂合之成修幂圓徑爲廣并句股弦爲袤云又以圖之大體言之至皆圓徑之半者謂立規於句股中心自立規處度至句至股至弦皆半徑也故曰三徑均乃運規成圓又畫中弦以觀其會則句股之中成小句股弦者四句面之小股股面之小句小方之面皆圓徑之半
