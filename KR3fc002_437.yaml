body:
  text: 亭積也合問𡽪術草曰如前求到一萬九千尺又以二十五乘之得四十七萬五千尺九百四十二而一得五百四尺九百四十二分尺之二百三十二子母各半之爲四百七十一分尺之一百一十六卽圓亭積也密率草曰如前求到一萬九千尺以七乘之得一十三萬三千尺二百六十四而一得五百三尺二百六十四分尺之二百八子母各以八約之爲三十三分尺之二十六卽圓亭積也今有方錐下方二丈七尺高二丈九尺問積幾何答曰七千四十七尺如圖庚辛爲下方甲乙爲高術曰下方自乘以高乘之三而一按此術假令方錐下方二尺高一尺卽四陽馬如術爲之用十二陽馬成三方錐故三而一得陽馬也潢按注得陽馬也陽馬當作方錐草曰置下方二丈七尺展爲二十七尺自乘得
  hash: sha256:8981a1761324dbf2de8a7d73756f7355723d754e856d0f8117a948026c5daf2b
