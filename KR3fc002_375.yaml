body:
  text: 分尺之一十又有積一萬六千四百四十八億六千六百四十三萬七千五百尺問爲立圓徑幾何荅曰一萬四千三百尺依密率爲徑一萬四千六百四十三尺四分尺之三開立圓術曰置積尺數以十六乘之九而一所得開立方除之卽丸徑立圓卽丸也爲術者蓋依周三徑一之率令圓幂居方幂四分之三圓囷居立方亦四分之三更令圓囷爲方率十二爲丸率九丸居圓囷又四分之三也置四分自乘得十六三分自乘得九故九居立方十六分之九也故以十六乘積九而一得立方之積丸徑與立方等故開立方而除得徑也然此意非也何以驗之取立方棊八枚皆令立方一寸積之爲立方二寸規之爲圓囷徑二寸高二寸又復横規之則其形有似牟合方蓋矣八棊皆似陽馬圓然也按合蓋者方率也丸居其中卽圓率也推此言之謂夫圓囷爲方率豈不闕哉以周三徑一爲圓率則圓幂傷少令圓囷爲方率則丸積傷多互相通補是以九與十六之率偶與實相近而丸猶傷多耳觀立方之內合蓋之外雖衰殺有漸而多少不掩判合總結方圓相纒濃纎詭互不可等正欲陋形措意懼失正理敢不闕疑以俟能言者黃金方寸重十六兩金丸徑寸重九兩率生於此未曾驗也周官考工記㮚氏爲量攺煎金錫則不耗不耗然後權之權之然後凖之凖之然後量之言鍊金使極精而後分之則可以爲率也令丸徑自乘三而一開方除之卽丸中之立方也假令丸中立方五尺五尺爲句句自乘幂二十五尺倍之得五十尺以爲股幂謂平面方五尺之弦也以此弦幂爲股亦以五尺爲句并句股幂得七
