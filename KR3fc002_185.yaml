body:
  text: 其率如欲令差分按出錢五百七十六買竹七十八箇以除錢得七實餘三十是為三十箇復可增一錢然則實餘之數即是貴者之數故曰實貴也本以七十八箇為法今以貴者減之則其餘悉是賤者之數故曰法賤也其求石鈞斤兩以積銖各除法實各得其積數餘各為銖者謂石鈞斤兩積銖除實又以石鈞斤兩積銖除法餘各為銖即合所問術曰各置所買石鈞斤兩以為法以所率乘錢數為實實如法而一不滿法者反以實減法法賤實貴買竹草曰置錢五百七十六為實以所買竹七十八箇為法除之得七錢為賤竹之價實餘三十為貴竹每箇增一錢得八錢為貴竹之價以實餘三十減所買竹七十八箇餘四十八箇為賤竹是為四十八箇箇七錢三十箇箇八錢合問買絲草曰置錢一千一百二十為實次置所買絲一石二鈞十八斤通之得一百九十八斤為法實如法得五錢為賤絲之價實餘一百三十斤為貴絲每斤增一錢得六錢為貴絲之價以實餘一百三十減所買絲一百九十八斤餘六十八斤為賤絲置六十八斤以鈞積斤三十除之得二鈞八斤又置實餘一百三十斤以石積
