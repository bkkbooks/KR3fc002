body:
  text: 四百四十四尺為法實如法而一得一十六人四百四十四分人之八子母各以四約之為一百一十一分人之二即用徒人數也合問今有溝上廣一丈五尺下廣一丈深五尺袤七丈問積幾何答曰四千三百七十五尺如圖乙丙為上廣辛壬為下廣戊至巳為深丁丙為袤草曰置上廣一丈五尺下廣一丈并之得二丈五尺半之得一丈二尺五寸展為一十二尺五寸以深五尺乘之得六十二尺五寸又以袤七丈展為七十尺乘之得四千三百七十五尺即溝積也合問春程人功七百六十六尺并出土功五分之四定功六百一十二尺五分尺之四問用徒幾何答曰七人三千六十四分人之四百二十七術曰置本人功去其五分之一餘為法去其五分之一
  hash: sha256:195d9bffd3d04ca5af4af397128269dfcc91112c14d53b31f7c3f0bc2976b523
