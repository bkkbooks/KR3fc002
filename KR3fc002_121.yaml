body:
  text: 乘之得四萬五千四百分爲實以法一千二百五十六除之得三十六步一千二百五十六分步之一百八十四於下位上下相減餘十六步一千二百五十六分步之二百四半之得八步一千二百五十六分步之一百二子母各半之爲六百二十八分步之五十一卽徑也密率求徑草曰如前求到中周五百二分以七乘之得三千五百一十四分爲實以分母八乘二十二得一百七十六爲法除之得十九步一百七十六分步之一百七十於上位如前求到外周九百八分以七乘之得六千三百五十六分爲實以法一百七十六除之得三十六步一百七十六分步之二十於下位上下相減餘十六步一百七十六分步之二十六半之得八步一百七十六分步之一十三卽徑也爲田草曰如前求到中周分五百二外周分九百八并之得一千四百一十分半之得七百五分於上位置徑十二步三分步之二通分內子得三十八分於下位上下相乘得二萬六千七百九十分爲實以分母八乘分母三得二十四
