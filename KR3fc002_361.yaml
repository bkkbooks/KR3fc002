body:
  text: 千二百為定法復除折而下以三乘上議二十得六十從中行三百得三百六十為𠔳法復借一算置下行步之至尺而止議得三置於實上次前議以議三一乘中三百六十得一千八十為三𠔳幂再乘下一算得九為隅幂并之得一千八十九以加定法四萬三千二百得四萬四千二百八十九為定法與議三相乘得一十三萬二千八百六十七以減實適盡上議得一百二十三尺即立方也合問草曰置積一千九百五十三尺八分尺之一通分內子得一萬五千六百二十五尺為定實借一算步之超二等至十而止置上議二十再乘所借一算得四百為方法議與法相乘得八千以減實實餘七千六百二十五尺除巳置方法四百三之得一千二百為定法復除折而下以三乘議二十得六十為𠔳法置中行復借一算置下行步之中超一下超二至尺而止置上議五次前議以議五一乘中六十得三百為𠔳幂再乘下一算得二十五為隅幂并之得三百二十五以加定法一千二百得一千五百二十五
