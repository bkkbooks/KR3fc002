body:
  text: 行上禾乘中行爲齊同之意者張邱建算經李淳風注云同齊者謂同行首齊諸下而以直減中行潢按同行首者如以右行上禾乘中行上禾是也齊諸下者如以右行上禾徧乘中行中禾下禾并下實是也方田章合分術注云母互乘子謂之齊羣母相乘謂之同齊同之意本諸此也云爲齊同者謂中行上禾亦乘右行也者旣以右行上禾徧乘中行又以中行上禾徧乘右行故云亦也云從簡易者古人直除之術較兩行互乘對減爲簡易也云雖不言齊同以齊同之意觀之其義然矣者謂右行徧乘中行卽以右行直減中行所餘與兩行互乘對減者同故云齊同之意也云亦令兩行相乘去行之中禾也者注承齊同而言以中左兩行互乘對減則兩行之中禾皆去若直除則但去左行之中禾也云非但一秉者左行下禾餘三十六秉也云欲約衆秉之實當以禾秉數爲法者以下禾秉數爲法也云列此下禾之秉實者當云列此中下禾之秉實云乘兩行者亦承齊同而言非術文意也依術文列此中行中禾五秉下禾一
