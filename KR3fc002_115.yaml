body:
  text: 餘積步之分等數約之以畝法除之即畝數也潢按此田截齊中外之周至餘則環實也劉𡽪注當止此自按此術以下是李淳風注當在密率術下密率術一節是淳風補術上注乃其自注也古率求徑草曰置中周九十二步三而一得三十步三分步之二於上位又置外周一百二十二步三而一得四十步三分步之二於下位上下相減餘十步半之得五步即徑也𡽪術求徑草曰置中周九十二步以五十乘之得四千六百步一百五十七而一得二十九步一百五十七分步之四十七於上位又置外周一百二十二步以五十乘之得六千一百步一百五十七而一得三十八步一百五十七分步之一百三十四於下位上下相減餘九步一百五十七分步之八十七半之得四步一百五十七分步之一百二十二即徑也密率求徑草曰置中周九十二步以七乘之得六百四十四步二十二而一得二十九步二十二分步之六於上位又置外周一百二十二步
