body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門撰衰分以御貴賤稟稅衰分衰分差也術曰各置列衰列衰相與率也重疊則可約副并為法以所分乘未并者各自為實法集而衰別數本一也今以所分乘上別以下集除之一乘一除適足相消故所分猶存且各應率而別也於今有術列衰各為所求率副并為所有率所分為所有數又以經分言之假令甲家三人乙家二人丙家一人并六人共分十二為人得二也欲復作逐家者則當列置人數以一人所得乘之今此術先乘而後除也實如法而一不滿法者以法命之説曰注云衰分差也李籍音義云以差而平分故曰衰分云列衰相與率也重疊則可約者列衰各為所求率副并為所有率故曰相與率也衰數有重疊則求總等以約之云法集而衰別數本一也者各置列衰故曰衰別副并為法故曰法集列衰為副并之分數副并為列衰之合數故曰數本一也云今以所分乘上別以下集除之者上別各置列衰於上位也下集副并為
