body:
  text: 百三十八萬為實以分母二千八百七十三乘丁戶一萬三千三百三十八得三千八百三十二萬七十四為法實如法而一得三錢三千八百三十二萬七十四分錢之一千八百四十一萬九千七百七十八以等數一萬三千三百三十八約子母為二千八百七十三分錢之一千三百八十一置戊縣所當出粟九百三十九斛二千八百七十三分斛之二千二百五十三通分內子得二百七十萬以其一斛之費一十九乘之得五千一百三十萬為實以分母二千八百七十三乘戊戶五千一百三十得一千四百七十三萬八千四百九十為法實如法而一得三錢一千四百七十三萬八千四百九十分錢之七百八萬四千五百三十以等數五千一百三十約子母為二千八百七十三分錢之一千三百八十一云計經賦之率既有戶算之率亦有遠近貴賤之率此二率者各自相與通者戶算之率即下文戶率也遠近貴賤之率即下文錢率也此二率者各自相與通也云通則甲二十乙十二丙七丁十三戊五者置五縣戶數求
