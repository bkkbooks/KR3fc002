body:
  text: 術曰以去閫一尺自乘所得以不合二寸半之而一所得增不合之半即得門廣此去閫一尺為句門廣為股不合二寸以半之得一寸為股弦差求弦故當半之今即以兩弦為廣數故不復半之也潢按注門廣為股當作半門廣為弦草曰置去閫一尺展作一十寸為句自乘得一百寸為句幂又為股弦差與股弦并相乘幂以不合二寸半之得一寸為股弦差以除之得一百寸為股弦并以股弦差一寸加之得一百一寸即一丈一寸為倍弦即門廣也合問今有戶高多於廣六尺八寸兩隅相去適一丈問戶高廣各幾何答曰廣二尺八寸高九尺六寸如圖戶廣為句戶高為股兩隅相去為弦高多於廣為句股差術曰令一丈自乘為實半相多令自乘倍之減實半其餘以開方除之所得減相多之半即戶
  hash: sha256:10b22c39a0d1ecd6cb7db5adb4b42df8917488e034c2a6422920153d004e6195
