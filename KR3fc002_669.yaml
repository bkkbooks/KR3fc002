body:
  text: 一至以甲一至乘七日得七至乙一至乘五日得五至并之為十二至亦并齊之意也甲五日乙七日相乘得三十五日亦以同為實也以十二至除三十五日即得一至之日分也今有一人三日為牡瓦三十八枚一人二日為牝瓦七十六枚今令一人一日作瓦牝牡相半問成瓦幾何答曰二十五枚少半枚術曰并牝牡為法牝牡相乘為實實如法得一枚此術亦與鳬雁術同牝牡瓦相并猶如鳬鴈日飛相并也臣淳風等謹按此術并牝牡為法者并齊之意牝牡相乘為實者猶以同為實也故實如法即得也潢按永樂大典三日二日皆作一日當依攺正否則於算不合草曰置牡瓦三十八牝瓦七十六并之得一百一十四為法以牡三十八牝七十六相乘得二千八百八十八為實實如法得二十五枚一百一十四分枚之三十八以等數三十八約子母為三分枚之一即少半枚合問説曰注云此術亦與鳬鴈術同牝牡瓦相并猶如鳬鴈日飛相并也者一日為牡瓦三十八枚
