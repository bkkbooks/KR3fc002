body:
  text: 萬三千一百七十八億六千三百萬尺九而一得二萬九千二百四十二億七百萬尺為實開立方除之得一萬四千三百尺即立圓徑合問密率草曰置積一萬六千四百四十八億六千六百四十三萬七千五百尺以二十一乘之得三十四萬五千四百二十一億九千五百一十八萬七千五百尺十一而一得三萬一千四百一億九千九百五十六萬二千五百尺為實開立方除之得一萬四千六百四十三尺一百分尺之七十五約為四分尺之三即立圓徑也説曰取立方棊一枚令立樞於左後之下隅如圖甲壬立方各面皆等其幂則上甲丙下庚壬左甲癸右乙壬前丁壬後甲辛令立樞於庚為左後之下隅從規去其右上之𠔳如圖作甲辛弧於後幂作丁壬弧於前幂自左上甲丁依前後弧剖至右下辛壬分立方為左凸右凹二形右凹形
