body:
  text: 三百九十六爲法除之得一斤三百九十六分斤之一百一十六以等數四約子母爲九十九分斤之二十九卽絡絲數也原術重今有又一術兩次今有也今有惡粟二十斗舂之得糲米九斗今欲求粺米十斗問惡粟幾何荅曰二十四斗六升八十一分升之七十四術曰置糲米九斗以九乘之爲法亦置粺米十斗以十乘之又以惡粟二十斗乘之爲實實如法得一斗按此術置今有求粺米十斗以糲米率十乘之如糲率九而一卽糲亦化爲惡粟矣此亦重今有之義爲術之意猶絡絲也雖各有率不問中間故令後實乘前實後法乘前法而并除之也潢按注文多脫誤攺正於後按此術置今欲求粺米十斗以糲米率十乘之如粺米率九而一則粺化爲糲又以惡粟二十斗乘之如糲米九斗而一卽糲亦化爲惡粟矣草曰置糲米九斗以粺率九乘之得八十一爲法亦置粺米十斗以糲率十乘之得一百斗又以惡粟二十斗乘之得二千斗爲實實如法得
  hash: sha256:80ef24691f962254d227ac155d183fa006794ab65dad0f6d74094d76b59584f2
