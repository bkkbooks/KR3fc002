body:
  text: 三百九十六為法除之得一斤三百九十六分斤之一百一十六以等數四約子母為九十九分斤之二十九即絡絲數也原術重今有又一術兩次今有也今有惡粟二十斗舂之得糲米九斗今欲求稗米十斗問惡粟幾何答曰二十四斗六升八十一分升之七十四術曰置糲米九斗以九乘之為法亦置稗米十斗以十乘之又以惡粟二十斗乘之為實實如法得一斗按此術置今有求稗米十斗以糲米率十乘之如糲率九而一即糲亦化為惡粟矣此亦重今有之義為術之意猶絡絲也雖各有率不問中間故令後實乘前實後法乘前法而并除之也潢按注文多脫誤攺正於後按此術置今欲求稗米十斗以糲米率十乘之如稗米率九而一則稗化為糲又以惡粟二十斗乘之如糲米九斗而一即糲亦化為惡粟矣草曰置糲米九斗以稗率九乘之得八十一為法亦置稗米十斗以糲率十乘之得一百斗又以惡粟二十斗乘之得二千斗為實實如法得
  hash: sha256:28a3adeb5b4061f69bc0ca5a54089f561e7a24e6fd71fbb7a55f136251b83dee
