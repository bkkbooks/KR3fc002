body:
  text: 每行各自為率故也交通大典作廣通云故令赤黑相消奪之者本設諸行意主相減其相除者為減餘其相益者亦為減餘故曰消云奪者謂以相除相益者奪其位也云於算或減或益同行異位殊為二品者頭位同名者各位同減異并頭位異名者名位異減同并各有并減之差見於下位也云著此二條者謂同名異名二術也云赤黑相推足以定上下之程者即上同行異位殊為二品之説也云減益雖殊足以通左右之數者左右正負錯雜不盡可減必減之益之其數乃可通也云差實雖分足以應同異之率者下位所列差實有時相減有時相并其算不同然皆與各位同名異名之率相應也云然則其正無人負之負無人正之其率不妄也者此據同名相除者言之異名相除之率不妄從可知也云此為以赤除赤以黑除黑行求相減為去頭位也者赤除赤黑除黑同名相除也行求相減纍去頭位則餘一法一實矣云益行減行當作以行減行各以其類謂同名者為類異名者非其類也非其類者猶無對也非所得
