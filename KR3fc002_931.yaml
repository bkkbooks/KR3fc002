body:
  text: 如圖句自乘爲朱方股自乘爲靑方令出入相補各從其類因就其餘不移動也合成弦方之幂開方除之卽弦也今有圓材徑二尺五寸欲爲方版令厚七寸問廣幾何荅曰二尺四寸五分潢按五分二字衍如圖圓徑爲弦版厚爲句版廣爲股術曰令徑二尺五寸自乘以七寸自乘減之其餘開方除之卽廣此以圓徑二尺五寸爲弦版厚七寸爲句所求廣爲股也草曰置徑二尺五寸展作二十五寸爲弦自乘得六百二十五寸爲弦幂又置厚七寸爲句自乘得四十九寸爲句幂以句幂減弦幂餘五百
  hash: sha256:9d5bcd4ee493861afc366d79420f31f2c50a634fa01a333aeca56722ac0e049c
