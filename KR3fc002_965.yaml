body:
  text: 弦幂一股弦相乘幂二於弦幂內減去句矩幂餘股幂二股弦相乘幂二移作直積以股為廣倍股弦并為袤故倍股弦并除積得股今有二人同所立甲行率七乙行率三乙東行甲南行十步而邪東北與乙會問甲乙行各幾何答曰乙東行十步半甲邪行十四步半及之如圖甲南行為句乙東行為股甲邪行為弦術曰令七自乘三亦自乘并而半之以為甲邪行率邪行率減於七自乘餘為南行率以三乘七為乙東行率此以南行為句東行為股邪行為弦句弦并七欲知弦者當以
