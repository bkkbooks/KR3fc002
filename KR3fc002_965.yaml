body:
  text: 弦幂一股弦相乘幂二於弦幂內減去句矩幂餘股幂二股弦相乘幂二移作直積以股爲廣倍股弦并爲袤故倍股弦并除積得股今有二人同所立甲行率七乙行率三乙東行甲南行十步而邪東北與乙會問甲乙行各幾何荅曰乙東行十步半甲邪行十四步半及之如圖甲南行爲句乙東行爲股甲邪行爲弦術曰令七自乘三亦自乘并而半之以爲甲邪行率邪行率減於七自乘餘爲南行率以三乘七爲乙東行率此以南行爲句東行爲股邪行爲弦句弦并七欲知弦者當以
