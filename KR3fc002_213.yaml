body:
  text: 宜以多乘法宜以少者二百四十錢爲實餘以多四乘之得九百六十翭故曰多乘實三百八十錢爲法餘以少三乘之得一千一百四十翭故曰少乘法也云其求石鈞斤兩以積銖各除法實者如買絲一問以石鈞斤兩積銖除多數所乘之餘實又以石鈞斤兩積銖除少數所乘之餘法各得其數餘各爲銖卽合所問也云是錢有二價物有貴賤故以羽乘錢反二率也者錢少物多若仍以物數爲法錢數爲實得每物均平價幾分錢之幾不見貴賤之殊也故反之以錢數爲法物數爲實求得二物之多數少數以乘實餘法餘并得二物共數而錢之二價物之貴賤俱可知矣故曰以羽乘錢反二率也二率者所有率與所求率也九章算術細草圖説卷二門下晚學生沈欽裴算校
  hash: sha256:6329e0b01a1233218099ca303f5f9336575a8cfbc15c5532ab4e02aed9ae2c16
