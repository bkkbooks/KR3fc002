body:
  text: 六術曰以練絲十二兩乘靑絲一斤十二銖為法以靑絲一斤銖數乘練絲一斤兩數又以絡絲一斤乘之為實實如法得一斤按練絲一斤為靑絲一斤十二銖此練率三百八十四靑率三百九十六也又絡絲一斤為練絲十二兩此絡率十六練率十二也置今有靑絲一斤以練率三百八十四乘之為實實如靑絲率三百九十六而一所得靑絲一斤練絲之數也又以絡率十六乘之所得為實以練率十二為法所得即練絲用絡絲之數也是謂重今有也雖各有率不用中間故令後實乘前實後法乘前法而并除也故以練絲兩數為實靑絲銖數為法一曰又置絡絲一斤兩數與練絲十二兩約之絡得四練得三此其相與之率又置練絲一斤銖數與靑絲一斤十二銖約之練得三十二靑得三十三亦其相與之率齊其靑絲絡絲同其二練絡得一百二十八靑得九十九練得九十六即三率悉通矣今有練絲一斤為所有數絡絲一百二十八為所求率靑絲九十九為所有率為率之意猶此但不先約諸率耳凡率錯互不通者皆積齊同用之放此雖四五轉不異也言同其二練者以明三率之相與通耳於術無以異也又一術今有靑絲一斤銖數乘練絲一斤兩數為實以靑絲一斤十二銖為法所得即用練絲兩數以絡絲一斤乘所得為實以練絲十二兩為法所得即用絡絲斤數也潢按注所得靑絲一斤用練絲之數也原本脫用字今有練絲一斤為所有數練當作靑草曰置靑絲一斤十二銖展為三百九十六銖以練絲十二兩乘之得四千七百五十二為法
