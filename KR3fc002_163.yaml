body:
  text: 約糲率三十得十爲所有率故九乘而十除今有糲米六斗四升五分升之三欲爲糲飯問得幾何荅曰爲糲飯一十六斗一升半術曰以糲米求糲飯五之二而一臣淳風等謹按糲飯之率七十有五宜以本糲米乘此率術欲從省先以等數十五約之所求之率得五所有之率得二故五乘二除義由於此草曰置糲米六斗四升五分升之三通分內子得三十二斗三升展爲三百二十三升以糲飯率五乘之得一千六百一十五升爲實以分母五乘糲米率二得一十爲法除之得一十六斗一升半卽糲飯也合問説曰注云先以等數十五約之者置糲米率三十於上位糲飯率七十五於下位以上減下下位餘十五轉以下餘減上上位亦餘十五是十五爲等數也以等數十五約糲飯率七十五得五爲所求率以等數十五約糲米率三十得爲所有率故五乘二除也今有糲飯七斗六升七分升之四欲爲飱問得幾何荅曰爲飱九斗一升三十五分升之三十
