body:
  text: 幂爲十二弧之一弧幂今以六弧之一面乘半徑得十二弧之一弧幂者四故三因之得十二弧之幂也割十二弧爲二十四弧以下意悉𩔖此葢以半徑乘一面得大小句股幂各四屢割之則大股以漸而增小句及小弦以漸而減而半徑乘一面得大小句股各四之率則不易也三因四幂得十二弧幂六因四幂得二十四弧幂十二因四幂得四十八弧幂二十四因四幂得九十六弧幂四十八因四幂得一百九十二弧幂皆可推而知如圖六弧之一面乘半徑得大小句股各四因而三之爲十二弧之幂二十四弧以下皆可𩔖推云割之彌細所失彌少者以十二弧之幂與圓幂相課所失多以三千七十二弧之幂與圓幂相課所失少云割之又割以至於不可割則與圓周合體而無所失者割之彌細則弧面漸小
