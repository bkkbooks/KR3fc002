body:
  text: 實倍高為法則得折之高數也草曰置去本三尺為句自乘得九尺為句幂又為股弦差乘股弦并幂以竹高一丈展作一十尺為股弦并除之得一十分尺之九為股弦差以減股弦并一十尺餘九尺一十分尺之一為兩股并半之得四尺二十分尺之十一為股即折者之高也合問注求折之高草曰置竹高一十尺為股弦并自乘得一百尺為股弦并幂去本三尺為句自乘得九尺為句矩幂以減股弦并幂餘九十一尺為倍股弦并乘股幂以為實置竹高一十尺倍之得二十尺為倍股弦并以為法實如法得四尺二十分尺之十一為股即折之高也說曰注云此術與繫索者之類更相反覆者繫索諸術句及股弦差求弦此術句及股弦并求股故云更相反覆也云亦可如上術者如上葭生術也上術於句矩幂內減去股弦差幂餘為實倍差為法得股此術於股弦并幂內減去句矩幂餘為實倍并為法得股具圖於後如圖股弦并幂內容股幂一
  hash: sha256:701ababbfa7b6303c1995d6b0cb26a72dd29a283d95f045786fad870f95aff67
