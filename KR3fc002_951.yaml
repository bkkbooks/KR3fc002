body:
  text: 廣加相多之半卽戸高令戸廣爲句高爲股兩隅相去一丈爲弦高多於廣六尺八寸爲句股差按圖爲位弦幂適滿萬寸倍之減句股差幂開方除之其所得卽高廣并數以差減并而半之卽戸廣加相多之數卽戸高也今此術先求其半一丈自乘爲朱幂四黃幂一半差自乘又倍之爲黃幂四分之二減實半其餘有朱幂二黃幂四分之一其於大方棄四分之三適得四分之一故開方除之得高廣并數之半減差半得廣加得戸高又按此圖幂句股并自乘加差幂爲兩弦幂半之開方得弦今倍弦幂減差幂求句股并葢先見其弦然後知其句與股也句股適等者并而自乘卽爲兩弦幂皆各爲方先見其弦然後知其句與股者倍弦幂卽爲句股適等者并而自乘之幂半相多自乘倍之又半股并自乘亦倍之合爲弦幂其無差數者句股各自乘并之爲實與句股相乘倍之爲實皆開方得弦弦幂半之爲實開方卽得句股及股長句短同源而分流焉假令句股各五弦幂五十開方除之得七尺有餘一不盡假令弦十其幂有百半之爲句股二幂各得五十當亦不可開故曰圓三徑一方五斜七雖不正得盡理亦可言相近耳其句股合而自乘之幂令弦自乘倍之爲兩弦幂以減之其餘開方除之爲句股差加差於合而半之爲股減差於合而半之爲句股弦卽高廣袤其出此圖也其倍弦爲廣袤合矩句卽爲幂得廣卽句股差其矩句之幂倍爲從法開之亦句股差其餘以句股幂減半其餘差爲從法開方除之卽句也潢按注又半股并自乘亦倍之半字下脫句字股弦卽高廣袤當作句股弦卽高廣袤草曰置兩隅相去一丈展作一百寸爲弦自乘得一萬寸爲弦實置高多於廣六尺八寸半之得三尺四寸展作三十四寸爲句股差自乘得
  hash: sha256:d4ffbf53f7a532e11d6d7eb77504fdce8f2ed80d6bcdf37599306b4fe69226e3
