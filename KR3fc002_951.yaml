body:
  text: 廣加相多之半即戶高令戶廣為句高為股兩隅相去一丈為弦高多於廣六尺八寸為句股差按圖為位弦幂適滿萬寸倍之減句股差幂開方除之其所得即高廣并數以差減并而半之即戶廣加相多之數即戶高也今此術先求其半一丈自乘為朱幂四黃幂一半差自乘又倍之為黃幂四分之二減實半其餘有朱幂二黃幂四分之一其於大方棄四分之三適得四分之一故開方除之得高廣并數之半減差半得廣加得戶高又按此圖幂句股并自乘加差幂為兩弦幂半之開方得弦今倍弦幂減差幂求句股并蓋先見其弦然後知其句與股也句股適等者并而自乘即為兩弦幂皆各為方先見其弦然後知其句與股者倍弦幂即為句股適等者并而自乘之幂半相多自乘倍之又半股并自乘亦倍之合為弦幂其無差數者句股各自乘并之為實與句股相乘倍之為實皆開方得弦弦幂半之為實開方即得句股及股長句短同源而分流焉假令句股各五弦幂五十開方除之得七尺有餘一不盡假令弦十其幂有百半之為句股二幂各得五十當亦不可開故曰圓三徑一方五斜七雖不正得盡理亦可言相近耳其句股合而自乘之幂令弦自乘倍之為兩弦幂以減之其餘開方除之為句股差加差於合而半之為股減差於合而半之為句股弦即高廣袤其出此圖也其倍弦為廣袤合矩句即為幂得廣即句股差其矩句之幂倍為從法開之亦句股差其餘以句股幂減半其餘差為從法開方除之即句也潢按注又半股并自乘亦倍之半字下脫句字股弦即高廣袤當作句股弦即高廣袤草曰置兩隅相去一丈展作一百寸為弦自乘得一萬寸為弦實置高多於廣六尺八寸半之得三尺四寸展作三十四寸為句股差自乘得
  hash: sha256:88867fb178c3b8cabb0ffd754478333f7c2aaa08e266b64b44b36c4b5609b624
