body:
  text: 句矩內減靑矩之表餘兩端之廉則兩廉與黃方幂等明矣兩端之廉兩差相乘幂也各以股弦差為廣句弦差為袤黃方之幂弦并差自乘幂也開方除之得弦并差云其外之靑矩至則為句也者明以弦并差加股弦差為句之理也如圖句弦差股弦差相乘倍之為兩𠔳其幂與黃方等故開方除之得黃方之面加股弦差即句加句弦差即股加兩差即弦今有竹高一丈末折抵地去本三尺問折者高幾何答曰四尺二十分尺之十一如圖去本為句餘高為股末折抵地為弦竹高為股弦并術曰以去本自乘此去本三尺為句折之餘高為股末折抵地為弦以句及股弦并求股故先令句自乘見矩幂令如高而一竹高一丈為股弦并以除此幂得差所得以減竹高而半其餘即折者之高也此術與繫索者之類更相反覆也亦可如上術令高自乘為股弦并幂去本自乘為矩幂減之餘為
