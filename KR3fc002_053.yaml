body:
  text: 如圖子寅丑為舌廣辰卯巳為踵廣寅卯為正從甲段一邪田乙段一邪田所謂中分箕田為兩邪田也術曰并踵舌而半之以乘正從畝法而一中分箕田則為兩邪田故其術相似又可并踵舌半正從以乘之草曰置舌廣二十步踵廣五步并之得二十五步半之得十二步半以乘正從三十步得三百七十五步如畝法二百四十步而一得一畝一百三十五步合問草曰置舌廣一百一十七步踵廣五十步并之得一百六十七步半之得八十三步半以乘正從一百三十五步得一萬一千二百七十二步半如畝法二百四十步而一得四十六畝二百三十二步半合問今有圓田周三十步徑十步臣淳風等謹按術意以周三徑一為率周三十步合徑十步今依密率合徑九步十一分步之六問為田幾何答曰七十五步此於𡽪術當為田七十一步一百五十七分步之一百三臣淳風等謹依密率為田七十一步二十二分步之一十三又有圓田周一百八十一步徑六十步三分步之一
