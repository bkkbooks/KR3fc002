body:
  text: 之餘一十尺爲上下方差自乘得一百尺以高五十尺乘之得五千尺三而一得一千六百六十六尺三分尺之二卽四陽馬積也置上方四十尺下方五十尺相乘得二千尺以高五十尺乘之得一十萬尺卽中央立方及四面壍堵積也并之得一十萬一千六百六十六尺三分尺之二以爲方亭積數也説曰注云其用棊也中央立方一四面壍堵四四角陽馬四凡所謂解之以棊者今悉具圖於後如圖甲乙丙丁爲上幂子丑寅卯爲下幂卯寅丙丁爲前幂子丑乙甲爲後幂卯子甲丁爲左幂寅丑乙丙爲右幂説同上
  hash: sha256:34468a68c16843519d6f582231fd7409994cc310fb5fe55d19f1a7c8a63de8af
