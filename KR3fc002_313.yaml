body:
  text: 之一爲六十三九分之一爲五十六置之於左又以分母五徧乘諸分子及巳通者仍以分母除其子則一爲二千五百二十半爲一千二百六十三分之一爲八百四十四分之一爲六百三十五分之一爲五百四六分之一爲四百二十七分之一爲三百六十八分之一爲三百一十五九分之一爲二百八十并之得七千一百二十九以爲法置田二百四十步亦以一爲二千五百二十乘之得六十萬四千八百步爲實實如法得八十四步七千一百二十九分步之五千九百六十四卽從步也合問今有田廣一步半三分步之一四分步之一五分步之一六分步之一七分步之一八分步之一九分步之一十分步之一求田一畝問從幾何荅曰八十一步七千三百八十一分步之六千九百三十九術曰下有一十分以一爲二千五百二十半爲一千二百六十三分之一爲八百四十四分之一爲六百三十五分之一爲五百四六分之一爲四百二十七分之一爲三百六十八分之一
