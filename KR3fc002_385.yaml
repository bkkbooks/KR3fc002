body:
  text: 卽所去右上之𠔳也剖前後二幂故曰從規右凹形有上幂右幂皆正方其俯幂爲甲丁壬辛長方兩側幂則前爲壬丙丁後爲辛乙甲皆內弧形共五幂左凸形有左幂下幂皆正方其仰幂爲甲丁壬辛長方兩側幂則前爲壬癸丁後爲辛庚甲皆外弧形共五幂又合而橫規之去其前上之𠔳如圖又合左凸右凹二形爲一立方作甲癸弧於左幂作乙壬弧於右幂自後上甲乙依左右弧剖至前下壬癸分立方爲前凹後凸二形前凹形卽所去前上之𠔳也剖左右二幂故曰橫規前凹形有前幂上幂皆正方其俯幂爲甲乙壬癸長方兩側幂則左爲癸丁甲右爲壬丙乙皆內弧形共五幂
