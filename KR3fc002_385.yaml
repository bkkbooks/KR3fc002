body:
  text: 即所去右上之𠔳也剖前後二幂故曰從規右凹形有上幂右幂皆正方其俯幂為甲丁壬辛長方兩側幂則前為壬丙丁後為辛乙甲皆內弧形共五幂左凸形有左幂下幂皆正方其仰幂為甲丁壬辛長方兩側幂則前為壬癸丁後為辛庚甲皆外弧形共五幂又合而橫規之去其前上之𠔳如圖又合左凸右凹二形為一立方作甲癸弧於左幂作乙壬弧於右幂自後上甲乙依左右弧剖至前下壬癸分立方為前凹後凸二形前凹形即所去前上之𠔳也剖左右二幂故曰橫規前凹形有前幂上幂皆正方其俯幂為甲乙壬癸長方兩側幂則左為癸丁甲右為壬丙乙皆內弧形共五幂
