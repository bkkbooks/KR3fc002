body:
  text: 得五十三以人出七乘之得四十九增不足四亦得五十三即物價也合問買雞草曰置人出九於右行盈十一居其下置人出六於左行不足十六居其下人出盈右行人出不足左行令不足十六維乘所出九得一百四十四令盈十一維乘所出六得六十六人出盈右行人出不足左行并之得二百一十為實并盈十一不足十六得二十七為法以所出六減所出九餘三以三約實二百一十得七十為雞價以三約法二十七得九為人數合問
