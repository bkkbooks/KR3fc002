body:
  text: 為中方者以方錐之面為外方邪畫方錐之底得中錐之面為方錐也如圖庚辛壬癸為方錐之底邪畫之得子丑寅卯為中方云就中方削而上合全為中方錐之半按中方錐之中字衍云於是陽馬之棊悉中解矣中錐積得方錐積之半也如圖子丑寅卯為中錐之底甲為削而上合之處此中錐積得方錐積之半中錐離而為四鱉臑焉如圖甲子心丑為一鱉臑甲卯心寅為一鱉臑甲子心卯為一鱉臑甲丑心寅為一鱉臑故外錐之半亦為四鱉臑雖背正異形與常所
  hash: sha256:c5e6392a2ea7f9347db4d7477c8f76018ab9a2684edac0ab9c1cbccf533338c4
