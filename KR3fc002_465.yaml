body:
  text: 爲中方者以方錐之面爲外方邪畫方錐之底得中錐之面爲方錐也如圖庚辛壬癸爲方錐之底邪畫之得子丑寅卯爲中方云就中方削而上合全爲中方錐之半按中方錐之中字衍云於是陽馬之棊悉中解矣中錐積得方錐積之半也如圖子丑寅卯爲中錐之底甲爲削而上合之處此中錐積得方錐積之半中錐離而爲四鼈臑焉如圖甲子心丑爲一鼈臑甲卯心寅爲一鼈臑甲子心卯爲一鼈臑甲丑心寅爲一鼈臑故外錐之半亦爲四鼈臑雖背正異形與常所
