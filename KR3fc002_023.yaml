body:
  text: 推動有參差故為術者先治諸分術曰可半者半之不可半者副置分母子之數以少減多更相減損求其等也以等數約之等數約之即除也其所以相減者皆等數之重疊故以等數約之草曰置分母十八於下位置分子十二於上位副之以上減下下位餘六以餘六減副上上位亦餘六是六為等數也以等數六約十八得三以等數六約十二得二是為三分之二合問草曰置分母九十一於下位置分子四十九於上位副之以上減下下位餘四十二以四十二減副上四十九上位餘七以七減下餘四十二下位亦餘七是七為等數也以等數七約九十一得十三以等數七約四十九得七是為十三分之七合問說曰注云按約分者物之數量不可悉全者全即分母乘全之全謂如法而一得全數也不可悉全者謂實不滿法以法命之是有分也云先治諸分者統約分合分減分課分平分經分乘分而言張邱建亦云學算者不患乘除之為難而患通分之為難也
