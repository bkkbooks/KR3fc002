body:
  text: 謂鱉臑參不相似實則同也如圖甲辛子丑形甲癸卯寅形甲庚子卯形甲壬丑寅形外錐半之四鱉臑也甲辛子丑形與中錐之甲心子丑形甲癸卯寅形與中錐之甲心卯寅形甲庚子卯形與中錐之甲心子卯形甲壬丑寅形與中錐之甲心丑寅形背正異形外錐半之四鱉臑皆有下廣有下袤有高而甲庚甲辛甲壬甲癸皆為邪面甲之頂鋭在底幂之外中錐四鱉臑有下廣有下袤有高而甲心常為直面甲之頂鋭居底幂之中常所謂鱉臑有下廣無袤有上袤無廣有高是參不相似也然其積皆居陽馬
  hash: sha256:d3ceaf6d8edb5d1314d3e0d0df1eaba573f89c738c53683dd8aef5bbe9ab1eb3
