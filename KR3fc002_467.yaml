body:
  text: 謂鼈臑參不相似實則同也如圖甲辛子丑形甲癸卯寅形甲庚子卯形甲壬丑寅形外錐半之四鼈臑也甲辛子丑形與中錐之甲心子丑形甲癸卯寅形與中錐之甲心卯寅形甲庚子卯形與中錐之甲心子卯形甲壬丑寅形與中錐之甲心丑寅形背正異形外錐半之四鼈臑皆有下廣有下袤有高而甲庚甲辛甲壬甲癸皆爲邪面甲之頂銳在底幂之外中錐四鼈臑有下廣有下袤有高而甲心常爲直面甲之頂銳居底幂之中常所謂鼈臑有下廣無袤有上袤無廣有高是參不相似也然其積皆居陽馬
  hash: sha256:c89cd1edb333b915e2a9be3021ddec29dd7b91014433fdc16c166ee53ea36e83
