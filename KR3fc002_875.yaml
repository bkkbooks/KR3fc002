body:
  text: 十一步為法十斗為實實即黑禾一步之實寄法一百一十一為分母求黃禾實以法一百一十一乘第三行下實四斗得四百四十四斗為下實以黑禾實十斗乘第三行黑禾七步得七十斗為黑禾列實以減下實餘三百七十四斗如黃禾二十二步而一得十七斗為黃禾一步之實寄法一百一十一為分母求靑禾實以法一百一十一乘第二行下實一斗得一百一十一斗為下實以黑禾實十斗乘第二行黑禾一步得十斗為黑禾列實又以黃禾實十七斗乘第二行黃禾一步得十七斗為黃禾列實并黃黑列實二十七斗以減下實餘八十四斗如靑禾三步而一得二十八斗為靑禾一步之實寄法一百一十一為分母求白禾實以法一百一十一乘第一行下實一斗得一百一十一斗為下實以黃禾實十七斗乘第一行黃禾一步得十七斗為黃禾列實又以靑禾實二十八斗乘第一行靑禾一步得二十八斗為靑禾列實并靑黃列實得四十五斗以減下實餘六十六斗如白禾二步而一得三十三斗為白禾一步之實寄法一百一十一為分母乃置白禾實三十三斗
