body:
  text: 十二約子母為一百三十三分錢之三置丙縣七千二百一十八斛一百三十三分斛之六通分內子得九十六萬以其一斛之費二十四錢一分六釐乘之得二千三百一十九萬三千六百為實以分母一百三十三乘丙算一萬九千三百二十八得二百五十七萬六百二十四為法實如法得九錢二百五十七萬六百二十四分錢之五萬七千九百八十四以等數一萬九千三百二十八約子母為一百三十三分錢之三置丁縣六千七百六十六斛一百三十三分斛之一百二十二通分內子得九十萬以其一斛之費二十三錢六分乘之得二千一百二十四萬為實以分母一百三十三乘丁算一萬七千七百得二百三十五萬四千一百為法實如法得九錢二百三十五萬四千一百分錢之五萬三千一百以等數一萬七千七百約子母為一百三十三分錢之三置戊縣九千二十二斛一百三十三分斛之七十四通分內子得一百二十萬以其一斛之費二十三錢四釐乘之得二千七百六十四萬八千為實以分母一百三
