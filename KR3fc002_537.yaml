body:
  text: 如圖甲庚爲高庚壬辛癸爲周術曰置米積尺此卽猶圓堢壔之積以十二乘之令高而一所得開方除之卽周於𡽪術當置米積尺以三百一十四乘之爲實二十五乘囷高爲法所得開方除之卽周也此亦據見幂以求周失之於微少也晉武庫中有漢時王莽所作銅斛其篆書字題斛旁云律嘉量斛方一尺而圓其外庣旁九𨤲五毫幂一百六十二寸深一尺積一千六百二十寸容十斗及斛厎云律嘉量斗方尺而圓其外庣旁九𨤲五毫幂一尺六寸二分深一寸積一百六十二寸容一斗合龠皆有文字升居斗旁合龠在斛耳上後有讚文與今律歴志同亦魏晉所常用今祖疏王莽銅斛文字尺寸分數然不盡得升合勺之文字按此術本周自相乘以高乘之十二而一得此積今還元置此積以十二乘之令高而一卽復本周自乘之數凡物自乘開方除之復其本周自乘之數故開方除之卽得也臣淳風等謹依密率以八十八乘之爲實七乘囷高爲法實如法而一開方除之卽周也潢按注此卽猶圓堢壔之積卽當作積晉武庫中以下一百三十一字疑是淳風引祖冲之語觀下有今祖疏云云可知凡物自乘開方除之復其本周自乘之數周自乘之四字衍少廣註可証草曰置米二千斛以米斛積一尺六寸二分乘
