body:
  text: 潢按注差實者下禾之餘實下當作上草曰置上禾六秉正下禾十秉負損實一斗八升正於右行次置上禾五秉負下禾十五秉正損實五升正於左行上禾下禾損實正負正右行負正正左行以右行上禾六秉徧乘左行左行得上禾三十秉負下禾九十秉正下實三十升正以異減同并左行左行上禾空下禾四十秉正下實一百二十升正上禾下禾下實正負正右行負正正左行正正左行上爲法下爲實實如法得三升爲下禾一秉之
