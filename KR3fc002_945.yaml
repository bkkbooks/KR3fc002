body:
  text: 術曰以垣高十尺自乘如郤行尺數而一所得以加郤行尺數而半之即木長數此以垣高一丈為句所求倚木者為弦引郤行一尺為股弦差其為術之意與繫索問同也草曰置垣高一丈展作一十尺為句自乘得一百尺為句幂亦為股弦差與股弦并相乘幂以郤行一尺為股弦差除之得一百尺為股弦并加股弦差一尺得一百一尺為兩弦并半之得五十尺半收作五丈五寸為弦即木長也合問説曰注云為術之意與繫索問同者皆以句及股弦差求弦也今有圓材埋在壁中不知大小以鐻鐻之深一寸鐻道長一尺問徑幾何答曰材徑二尺六寸如圖鐻道為句材徑為弦鐻深為股弦差之一半術曰半鐻道自此術以鐻道一尺為句材徑弦鐻深一寸為股弦差之一半故鐻長亦半之也臣淳風等謹按下鐻深得一寸為半股弦差注云為股弦差者鐻道
  hash: sha256:fa6d97fb126a25dc23032cc6941172f6d8bc10e578d81f9fdc8cfa1bd06d92b4
