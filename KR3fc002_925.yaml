body:
  text: 以為法也以法除下實即得所求物之價矣云無正負者以設問實與物皆正也云擇異同者以所求有麻麥菽答黍之別也此與以減行求麻價麻菽同名相從麻答異名相消餘以為法者殊故曰亦可也云又可以一術為之置五行通率為麻七麥四菽三答五黍六以為列衰減行麻一斗菽四斗正答三斗負各以其率乘之訖令同名相從異名相消餘為法又置下實乘列衰所得各為實者一術即前其一術也置減行麻一斗菽四斗正答三斗負各以其列衰麻七菽三答五乘之得麻七斗菽十二斗正答十五斗負既乘訖并麻七斗菽十二斗得十九斗以答十五斗減之餘四斗為法又置減行下實四各以其列衰麻七菽三答五乘之麻得二十八菽得十二答得二十各自為實實如法而一得各價云此可以實約法則不復乘列衰各以列衰如所約知其價者此下實與法同為四法實相約得一一乘不長故不復乘即以列衰為各價也九章算術細草圖說卷八晚學生沈欽裴算校
