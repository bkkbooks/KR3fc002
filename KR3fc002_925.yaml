body:
  text: 以爲法也以法除下實卽得所求物之價矣云無正負者以設問實與物皆正也云擇異同者以所求有麻麥菽荅黍之別也此與以減行求麻價麻菽同名相從麻荅異名相消餘以爲法者殊故曰亦可也云又可以一術爲之置五行通率爲麻七麥四菽三荅五黍六以爲列衰減行麻一斗菽四斗正荅三斗負各以其率乘之訖令同名相從異名相消餘爲法又置下實乘列衰所得各爲實者一術卽前其一術也置減行麻一斗菽四斗正荅三斗負各以其列衰麻七菽三荅五乘之得麻七斗菽十二斗正荅十五斗負旣乘訖并麻七斗菽十二斗得十九斗以荅十五斗減之餘四斗爲法又置減行下實四各以其列衰麻七菽三荅五乘之麻得二十八菽得十二荅得二十各自爲實實如法而一得各價云此可以實約法則不復乘列衰各以列衰如所約知其價者此下實與法同爲四法實相約得一一乘不長故不復乘卽以列衰爲各價也九章算術細草圖説卷八晚學生沈欽裴算校
  hash: sha256:9f8241e72bef50369d6024f8ec05c08881568ad6574f6c35eb220e92d5bed92f
