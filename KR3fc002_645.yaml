body:
  text: 乘主人均行日分子十三以母二十四而一得一百六十二里半以此乘主人均行日分母二十四如客馬與主人均行用日分子五而一亦得主人馬一日行七百八十里也潢按注以母二十四而一以當作如草曰置三分日之一四分日之三齊而同之則三分日之一為十二分日之四四分日之三為十二分日之九相減餘十二分日之五半之得二十四分日之五以五為法副置二十四分日之五增三分日之一即增二十四分日之八共得二十四分日之十三以十三乘三百里得三千九百里為實實如法得七百八十里為主人馬一日行合問説曰注云然則主人用日率者客馬行率也客用日率者主人馬行率也母同則子齊是為客馬行率五主人馬行率十三者主人用日率二十四分日之五以五為所有率即是客馬行率也客用日率二十四分日之十三以十三為所求率即是主人馬行率也故以客馬日行三百里為所有數而今有之得主人馬一日行也云母同則子齊者同其母於二十四則分子五與十三為齊故可以五為客馬行率十三為主人
