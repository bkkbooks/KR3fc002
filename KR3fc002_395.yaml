body:
  text: 夫疊幂成立積緣幂勢既同則積不容異由此觀之規之外三棊旁蹙為一即一陽馬也三分立方則陽馬居一內棊居二可知矣合八小方成一大方合八內棊成一合蓋內棊居小方三分之二則合蓋居立方亦三分之二較然驗矣如圖合二內棊為一形觀之則二甲庚面合為一甲庚面二庚辛面合為一庚辛面二辛壬面以辛聯之為壬辛壬面即立方之一面二庚癸面以庚聯之為癸庚癸面惟甲壬稜面在兩旁為一弧面幂之界甲壬稜外各有一甲癸壬半弧面幂此合蓋上半四分之二也又并二內棊為一形合之則甲壬稜之在兩旁者必各合為一壬甲壬稜面兩甲癸壬半弧面幂必合又形兩甲癸壬半弧面幂得二全弧面幂又形亦自有壬辛
