body:
  text: 二弧云當取此分寸之三十六以增於一百九十二弧之幂以爲圓幂三百一十四寸二十五分寸之四者祖氏密率徑一百一十三周三百五十五今設圓徑爲二十寸則其周六十二寸一百一十三分寸之九十四半之得三十一寸一百一十三分寸之四十七以半徑一十寸乘之得三百一十四寸一百一十三分寸之一十八爲圓幂置分子一十八以六百二十五乘之得一萬一千二百五十如分母一百一十三而一得九十九餘分六十三在半法以上收爲一從九十九得一百以六百二十五命之爲六百二十五分寸之一百并全三百一十四寸得三百一十四寸六百二十五分寸之一百是爲密率之圓幂與一百九十二弧之幂三百一十四寸六百二十五分寸之六十四相課則密率多六百二十五分寸之三十六故取此分寸之三十六以增於一百九十二弧之幂得三百一十四寸六百二十五分寸之一百子母各以二十五約之爲二十五分寸之四是密率之圓幂得三百一十四寸二十五分寸之四也云置徑自
  hash: sha256:bc5e604457af5041c81c33dd7709a3710f14d462ee336887a96fed8a4992160d
