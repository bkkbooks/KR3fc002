body:
  text: 草曰置三畝一錢四畝一錢五畝一錢於位以畝為母錢為子母互乘子三分之一得二十四分之一得十五五分之一得十二并之得四十七錢以為法三母相乘得六十又以百錢乘之得六千畝為實實如法得一百二十七畝四十七分畝之三十一收為一頃二十七畝四十七分畝之三十一合問説曰注云令畝互乘錢者齊其錢以錢為子齊其子也畝數相乘者同其畝以畝為母同其母也今有程耕一人一日發七畝一人一日耕三畝一人一日耰種五畝今令一人一日自發耕耰種之問治田幾何答曰一畝一百一十四步七十一分步之六十六術曰置發耕耰畝數令互乘人數并以為法畝數相乘為實實如法得一畝此猶鳬鴈術也臣淳風等謹按此術亦發耕耰種畝數互乘人者齊其人畝數相乘者同其畝故并齊為法以同為實計田一百五畝發用十五人耕用三十五人種用二十一人并之得七十一工治得一百五畝故以為實而一人一日所治故以人數為法除之即得也
