body:
  text: 草曰置三畝一錢四畝一錢五畝一錢於位以畝爲母錢爲子母互乘子三分之一得二十四分之一得十五五分之一得十二并之得四十七錢以爲法三母相乘得六十又以百錢乘之得六千畝爲實實如法得一百二十七畝四十七分畝之三十一收爲一頃二十七畝四十七分畝之三十一合問説曰注云令畝互乘錢者齊其錢以錢爲子齊其子也畝數相乘者同其畝以畝爲母同其母也今有程耕一人一日發七畝一人一日耕三畝一人一日耰種五畝今令一人一日自發耕耰種之問治田幾何荅曰一畝一百一十四步七十一分步之六十六術曰置發耕耰畝數令互乘人數并以爲法畝數相乘爲實實如法得一畝此猶鳬鴈術也臣淳風等謹按此術亦發耕耰種畝數互乘人者齊其人畝數相乘者同其畝故并齊爲法以同爲實計田一百五畝發用十五人耕用三十五人種用二十一人并之得七十一工治得一百五畝故以爲實而一人一日所治故以人數爲法除之卽得也
