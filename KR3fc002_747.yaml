body:
  text: 酒亦以盈朒維乘行酒是齊同之意也今有大器五小器一容三斛大器一小器五容二斛問大小器各容幾何荅曰大器容二十四分斛之十三小器二十四分斛之七術曰假令大器五斗小器亦五斗盈十斗令之大器五斗五升小器二斗五升不足二斗按大器容五斗大器五容二斛五斗以減三斛餘五斗卽小器一所容故曰小器亦五斗小器五容二斛五斗大器一合爲三斛課於兩斛乃多十斗令之大器五斗五升大器五合容二斛七斗五升以減三斛餘二斗五升卽小器一所容故曰小器二斗五升大器一容五斗五升小器五合容一斛二斗五升合爲一斛八斗課於二斛少二斗故曰不足二斗以盈不足維乘之各并爲實并盈不足爲法除之潢按荅小器二十四分斛之七小器下當有容字注小器五容二斛五斗大器一合爲三斛大器一下當有容五斗三字草曰置大器五斗小器五斗盈十斗於右行置大器五斗五升小器二斗五升不足二斗於左行大器小器有餘右行斗斗斗
