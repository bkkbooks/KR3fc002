body:
  text: 率三爲股自乘得九爲股幂又爲句弦并與句弦差相乘幂卽爲帶分句弦差以句弦并爲母以帶分句弦并與帶分句弦差相并得三十四爲帶分兩弦并半之得一十七爲帶分弦以句弦并爲母爲甲邪行率以帶分弦一十七減帶分句弦并二十五餘八爲帶分句以句弦并爲母爲甲南行率又置乙行率三爲股以句弦并五乘之得一十五爲帶分股以句弦并爲母爲乙東行率置邑方一十里半之得五里以里法三百步通之得一千五百步爲小股以甲南行率帶分句八乘之得一萬二千爲實以乙東行率帶分股一十五爲法實如法得八百步爲小句卽甲出南門步數以半邑方一千五百步增之得二千三百步爲大句卽甲南行步數也置甲南行二千三百步爲大句副之以甲邪行率帶分弦一十七乘之得三萬九千一百步爲邪行實於上以乙東行率帶分股一十五乘副得三萬四千五百步爲東行實於下以甲南行率帶分句八爲法各除實上得四千八百八十七步半爲大弦卽甲邪行及乙數也下得四千三百一十二步半爲大股卽乙東
  hash: sha256:6c3bfeb0a2ebedeab08bee6c6bf2c253fbc13943da5239423d7f2e94ab6a8ed8
