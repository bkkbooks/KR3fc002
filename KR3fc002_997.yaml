body:
  text: 率三為股自乘得九為股幂又為句弦并與句弦差相乘幂即為帶分句弦差以句弦并為母以帶分句弦并與帶分句弦差相并得三十四為帶分兩弦并半之得一十七為帶分弦以句弦并為母為甲邪行率以帶分弦一十七減帶分句弦并二十五餘八為帶分句以句弦并為母為甲南行率又置乙行率三為股以句弦并五乘之得一十五為帶分股以句弦并為母為乙東行率置邑方一十里半之得五里以里法三百步通之得一千五百步為小股以甲南行率帶分句八乘之得一萬二千為實以乙東行率帶分股一十五為法實如法得八百步為小句即甲出南門步數以半邑方一千五百步增之得二千三百步為大句即甲南行步數也置甲南行二千三百步為大句副之以甲邪行率帶分弦一十七乘之得三萬九千一百步為邪行實於上以乙東行率帶分股一十五乘副得三萬四千五百步為東行實於下以甲南行率帶分句八為法各除實上得四千八百八十七步半為大弦即甲邪行及乙數也下得四千三百一十二步半為大股即乙東
  hash: sha256:6e72721676f0e80903a02776e9a5fefa5dbe103afcbc262428caca4a0114cb35
