body:
  text: 草曰置上中周二丈外周四丈并之得六丈半之得三丈為上袤又置下中周一丈四尺外周二丈四尺并之得三丈八尺半之得一丈九尺為下袤次置上袤三丈倍之得六丈以下袤一丈九尺從之得七丈九尺展為七十九尺以上廣一丈展為一十尺乘之得七百九十尺於上位復置下袤一丈九尺倍之得三丈八尺以上袤三丈從之得六丈八尺展為六十八尺以下廣五尺乘之得三百四十尺於下位并二位得一千一百三十尺以深一丈展為一十尺乘之得一萬一千三百尺六而一得一千八百八十三尺三寸六分寸之二即三分寸之一為少半寸即曲池積也合問今有盤池上廣六丈袤八丈下廣四丈袤六丈深二丈問積幾何答曰七萬六百六十六尺太半尺如圖甲丁為上廣丁丙為上袤庚癸為下廣癸壬為下袤戊至巳為深
  hash: sha256:a76803580f9f9c136e89e12b53c664d31f689cef5c898108a51712a46e2eec53
