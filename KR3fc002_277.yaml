body:
  text: 草曰置今有田一頃二十六畝一百五十九步通分內子得三萬三百九十九步於上位又置粟六升太半升通分內子得二十升於下位上下相乘得六十萬七千九百八十升為實次置田一畝通為二百四十步又以分母三乘之得七百二十步為法實如法得八百四十四升七百二十分升之三百子母各以六十約之為一十二分升之五收為八斛四斗四升一十二分升之五即所收粟也合問説曰此問以今有數止於步故通田一畝為二百四十步又以所求率有分母三故以三乘二百四十步得七百二十步為法亦重有分者同而通之之義也又可先約二率以乘除置所通七百二十步與所通二十升相約得步率三十六粟率一是為田三十六步可收粟一升也置所通今有田積步三萬三百九十九以粟率一乘之仍得三萬三百九十九升為實以步率三十六為法除之得八百四十四升三十六分升之一十五收為八斛四斗四升一十二分升之五合問於今有術三十六步為所有率一升為
  hash: sha256:53edcf8a5945b0c6f8d37b777b02897cb8958b12f39d9608e9e5b43afb2efa0c
