body:
  text: 半之乘十五日得駑馬十五日之凡行又以十五日乘半里以減駑馬初日之行餘以乘日分子如日分母而一所得加前里即駑馬定行里數其奇半里者為半法以半法增殘分即得其不盡者而命分按令十五日不足三百三十七里半者據良馬十五日凡行四千二百六十里除先去齊三千里定還迎駑馬一千二百六十里駑馬凡十五日凡行一千四百二里半并良駑二馬所行得二千六百六十二里半課於三千里少三百三十七里半故曰不足令之十六日多一百四十里者據良馬十六日凡行四千六百四十八里先除去齊三千里定還迎駑馬一千六百四十八里駑馬十六日凡行一千四百九十二里并良駑二馬所行得三千一百四十里課於三千里餘有一百四十里故謂之多也以盈不足維乘假令之數并而為實并盈不足為法實如法而一得日數者即設差不盈不朒之正數以二馬初日所行里乘十五日為十五日平行數求初末益疾減遲之數者并一與十四以十四乘而半之為中平之積又令益疾減遲里數乘之各為減益之中平里故各減益平行數得十五日定行里若求後一日以十六日之定行里數乘日分子如日分母而一各得日分子之定行里數故各并十五日定行里即得其駑馬奇半里者法為全里之分故破半里為半法以增殘分即合所問也潢按注求良馬行者至即得其不盡者而命分疑是術文誤書為注又求良馬行文多脫誤今依求駑馬行文校補求良馬行者十四乘益疾里數以并良馬初日之行又加良馬初日之行里數而半之乘十五日得良馬十五日之凡行又以十五乘益疾里加良馬初日之行以乘日分子如日分母而一
