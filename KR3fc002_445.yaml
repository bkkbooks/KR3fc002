body:
  text: 萬三千尺二而一得四萬六千五百尺即塹堵積也合問説曰注云邪解立方得兩塹堵雖復橢方亦為塹堵者為設問塹堵廣袤高三不等是得橢方之半也如圖甲壬為立方甲乙丙丁為上幂庚辛壬癸為下幂甲乙辛庚為前幂丁丙壬癸為後幂甲丁癸庚為左幂乙丙壬辛為右幂邪解立方得兩塹堵其一塹堵有乙丙壬辛右幂庚辛壬癸下幂乙辛庚與丙壬癸前後兩立句股幂乙丙癸庚仰修幂又一塹堵有甲乙丙丁上幂甲丁癸庚左幂乙甲庚與丙丁癸前後兩倒句股幂乙丙癸庚俯修幂
  hash: sha256:c7157481c284941a1e35446e4e6523951587eea38629bb80e7632bb8e676a0cb
