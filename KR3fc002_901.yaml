body:
  text: 二千二百八十負以第三行減之第四行菽空荅一十二萬九千六百斗正黍七萬二千九百斗負直錢二十一萬六百正又令第三行菽九十徧乘左行左行得菽二萬二百五十斗荅二萬四千三百斗負黍三萬二千四百斗直錢一萬二千一百五十正以同減異并左行左行菽空荅八萬九千一百斗正黍三萬四千四百二十五斗負直錢二十三萬八千九百五十正乃令第四行荅一十二萬九千六百徧乘左行左行得荅一百一十五億四千七百三十六萬斗正黍四十四億六千一百四十八萬斗負直錢三百九億六千七百九十二萬正以第四行減之左行荅空黍二十億三千三百九十一萬斗正直錢一百二十二億三百四十六萬正上法下實實如法得六錢爲黍一斗之價以黍價六乘第四行黍七萬二千九百斗負得錢四十三萬七千四百負以并下實二十一萬六百正得錢六十四萬八千正如荅一十二萬九千六百斗正而一得五錢爲荅一斗之價又以黍價六乘第三行黍二百九十七斗正得錢一千七百
  hash: sha256:2ad268d75a8739dd7ba78e6d68bec85b7474cfb516274b03c944a35f91bee124
