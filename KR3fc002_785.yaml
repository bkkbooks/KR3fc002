body:
  text: 假令有餘左行錢錢并之得一十一億三千一百二十六萬四千錢為實并盈不足得三萬七千一百二十九錢三分為法實如法得三萬四百六十八錢三十七萬一千二百九十三分錢之八萬四千八百七十六即本持錢也以本減五返歸錢六萬餘二萬九千五百三十一錢三十七萬一千二百九十三分錢之二十八萬六千四百一十七即利也合問注又術草曰置後返歸一萬以十乘之得十萬為實十三為法實如法得七千六百九十二錢十三分錢之四即後所持之本加一萬一千得一萬八千六百九十二錢十三分錢之四通分內子得二十四萬三千又以十乘之得二百四十三萬為實以分母十三乘法十三得一百六十九為法實如法得一萬四千三百七十八錢一百六十九分錢之一百一十八即第四返之
  hash: sha256:c772f426ba68a56ef8130206794ba1a8b98b7be486fb64a1eeb304d5fa1a904c
