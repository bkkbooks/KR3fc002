body:
  text: 四乘之得一百四十四萬爲乙實以丙衰十六乘之得九十六萬爲丙實以丁衰十五乘之得九十萬爲丁實以戊衰二十乘之得一百二十萬爲戊實以巳衰十六乘之得九十六萬爲巳實實如法而一得甲縣一萬八千九百四十七斛一百三十三分斛之四十九乙縣一萬八百二十七斛一百三十三分斛之九丙縣七千二百一十八斛一百三十三分斛之六丁縣六千七百六十六斛一百三十三分斛之一百二十二戊縣九千二十二斛一百三十三分斛之七十四巳縣七千二百一十八斛一百三十三分斛之六合問説曰注云置空行一里用七十分日之一重行一里用五十分日之一齊而同之空重行一里之路往返用一百七十五分日之六者列置七十分日之一五十分日之一母互乘子七十分日之一得五十五十分日之一得七十并之得一百二十所謂并空重者齊其子也七十五十相乘得三千五百所謂空重相乘者同其母也以分母三千五百分子一百二十求等得二十
