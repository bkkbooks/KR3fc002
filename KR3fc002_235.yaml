body:
  text: 所有數而今有之即得李籍音義云算者計口出錢漢律人出一算一算百二十錢賈人與奴婢倍算徭役也今有稟粟大夫不更簪裊上造公士凡五人一十五斗今有大夫一人後來亦當稟五斗倉無粟欲以衰出之問各幾何答曰大夫出一斗四分斗之一不更出一斗簪裊出四分斗之三上造出四分斗之二公士出四分斗之一術曰各置所稟粟斛斗數爵次均之以為列衰副并而加後來大夫亦五斗得二十以為法以五斗乘未并者各自為實實如法得一斗稟前五人十五斗者大夫得五斗不更得四斗簪裊得三斗上造得二斗公士得一斗欲令五人各依所得粟多少減與後來大夫即與前來大夫同據前來大夫巳得五斗故言亦也各以所得斗數為衰并得十五而加後來大夫亦五斗凡二十為法也是為六人共出五斗後來大夫亦俱損折今有術副并為所有率未并者各為所求率五斗為所有數而今有之即得草曰置所稟粟大夫五斗不更四斗簪裊三斗
