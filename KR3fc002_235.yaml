body:
  text: 所有數而今有之卽得李籍音義云算者計口出錢漢律人出一算一算百二十錢賈人與奴婢倍算傜役也今有禀粟大夫不更簪褭上造公士凡五人一十五斗今有大夫一人後來亦當禀五斗倉無粟欲以衰出之問各幾何荅曰大夫出一斗四分斗之一不更出一斗簪褭出四分斗之三上造出四分斗之二公士出四分斗之一術曰各置所禀粟斛斗數爵次均之以爲列衰副并而加後來大夫亦五斗得二十以爲法以五斗乘未并者各自爲實實如法得一斗禀前五人十五斗者大夫得五斗不更得四斗簪褭得三斗上造得二斗公士得一斗欲令五人各依所得粟多少減與後來大夫卽與前來大夫同據前來大夫巳得五斗故言亦也各以所得斗數爲衰并得十五而加後來大夫亦五斗凡二十爲法也是爲六人共出五斗後來大夫亦俱損折今有術副并爲所有率未并者各爲所求率五斗爲所有數而今有之卽得草曰置所禀粟大夫五斗不更四斗簪褭三斗
