body:
  text: 開方除之得斛徑一尺四寸三分六釐一毫九秒二忽於上位置內方一尺展為一十寸自乘得一百寸倍之得二百寸開方除之得一尺四寸一分四釐二毫一秒三忽於下位以下減上餘二分一釐九毫七秒九忽半之得一分九毫八秒九忽即庣旁也以九釐五毫減之餘一釐四毫八秒九忽即劉歆庣旁所少數也云以此術求之得幂一百六十一寸有奇其數相近矣者置內方斜徑一十四寸一分四釐二毫一秒三忽於位倍庣旁九釐五毫得一分九釐加之得一十四寸三分三釐二毫一秒三忽為外方面自乘得二百五寸四十分九十九釐五十毫三十三秒六十九忽為方幂以𡽪圓幂率一百五十七乘之得三萬二千二百四十九寸三十六分二十二釐二毫八十九秒三十三忽如𡽪方幂率二百而一得一百六十一寸二十四分六十八釐一十一毫一秒四十四忽六十六微半與斛幂一百六十二寸為相近矣云此術微少而斛差幂六百二十五分寸之一百五以十二弧之幂為率消息者十二弧當作一百九十
