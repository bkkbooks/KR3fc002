body:
  text: 步七十分步之一十以等數一十約子母為七分步之一合問說曰注云先走率得七追及率得二十五者置先走率七十追及率二百五十以等數一十約之即得今有人持金十二斤出關關稅之十分而取一今關取金二斤償錢五千問金一斤值錢幾何答曰六千二百五十術曰以十乘二斤以十二斤減之餘為法以十乘五千為實實如法得一按此術置十二斤以一乘之十而一得一斤五分斤之一即所當稅者也減二斤餘即關取盈金以盈除所償錢即金值也今術既以十二斤為所稅則是以十為母故以十乘二斤及所償錢通其率於今有術五千錢為所有數十為所求率八為所有率而今有之即得也草曰置關取金二斤以十乘之得二十金以十二斤減之餘八斤為法次置償錢五千亦以十乘之得五萬錢為實實如法得六千二百五十錢合問說曰注云得一斤五分斤之一即所當稅者也減二斤餘即關取盈金以盈除所償錢即金值也者以一斤五分斤之一減二斤餘五分斤之
