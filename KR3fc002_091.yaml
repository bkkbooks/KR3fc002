body:
  text: 與之率者置全徑二尺展為二百分以二十五乘之得五千周數六十二寸八分二十五分寸之八通分內子得一萬五千七百八求等得四約徑五千得一千二百五十為徑率約周一萬五千七百八得三千九百二十七為周率云當求一千五百三十六弧之一面得三千七十二弧之幂而裁其餘分者如前法求得一千五百三十六弧之一面四釐九秒六一二五八二置半徑一尺展為一百萬忽乘之得四十億九千六十一萬二千五百八十二忽又以七百六十八乘之得三萬一千四百一十五億九千四十六萬二千九百七十六忽以百億除之得幂三百一十四寸一五九四六二九七六即三千七十二弧之幂也云六弧之徑盡達規矣當面徑短不至外規者六弧之田以半徑為弦半面為句面徑為股股短不至外規如圖六弧之田子寅半徑為弦子丑半面為句丑寅面徑為股注所謂面徑股短不至外畔
