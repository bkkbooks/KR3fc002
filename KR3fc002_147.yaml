body:
  text: 術曰以粟求菽荅麻麥皆九之十而一臣淳風等謹按四術率並四十五皆是爲粟所求俱合以此率乘其本粟術欲從省先以等數五約之所求之率得九所有之率得十故九乘十除義由於此爲菽草曰置粟三斗少半升通分內子得九斗一升展爲九十一升以菽率九乘之得八百一十九升爲實以分母三乘粟率十得三十爲法除之得二斗七升三十分升之九子母各以三約之爲十分升之三卽菽也合問爲荅草曰置粟四斗一升太半升通分內子得一十二斗五升展爲一百二十五升以荅率九乘之得一千一百二十五升爲實以分母三乘粟率十得三十爲法除之得三斗七升半卽荅也合問爲麻草曰置粟五斗太半升通分內子得一十五斗二升展爲一百五十二升以麻率九乘之得一千三百六十八升爲實以分母三乘粟率十得三十爲法除之得四斗五升三十分升之一十八子母各以六約之爲五分升之三卽麻也合問爲麥草曰置粟一十斗八升五分升之二通分
