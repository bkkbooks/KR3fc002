body:
  text: 術曰以粟求菽答麻麥皆九之十而一臣淳風等謹按四術率並四十五皆是為粟所求俱合以此率乘其本粟術欲從省先以等數五約之所求之率得九所有之率得十故九乘十除義由於此為菽草曰置粟三斗少半升通分內子得九斗一升展為九十一升以菽率九乘之得八百一十九升為實以分母三乘粟率十得三十為法除之得二斗七升三十分升之九子母各以三約之為十分升之三即菽也合問為答草曰置粟四斗一升太半升通分內子得一十二斗五升展為一百二十五升以答率九乘之得一千一百二十五升為實以分母三乘粟率十得三十為法除之得三斗七升半即答也合問為麻草曰置粟五斗太半升通分內子得一十五斗二升展為一百五十二升以麻率九乘之得一千三百六十八升為實以分母三乘粟率十得三十為法除之得四斗五升三十分升之一十八子母各以六約之為五分升之三即麻也合問為麥草曰置粟一十斗八升五分升之二通分
