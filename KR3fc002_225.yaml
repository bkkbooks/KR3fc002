body:
  text: 當一馬也馬食半牛是二馬當一牛即是四羊當一牛也云今術置羊一馬一牛四者通其率以為列衰者四羊當一牛則一牛所食當四羊也二羊當一馬則一馬所食當二羊也牛一食四分馬一食二分羊一食一分母俱是一子有四分二分一分之別母同則子齊齊即衰也故曰通其率以為列衰於今有術四二一列衰為所求率副并七為所百率今有粟五斗為所有數而今有之即得今有甲持錢五百六十乙持錢三百五十丙持錢一百八十凡三人俱出關關稅百錢欲以錢數多少衰出之問各幾何答曰甲出五十一錢一百九分錢之四十一乙出三十二錢一百九分錢之一十二丙出一十六錢一百九分錢之五十六術曰各置錢數為列衰副并為法以百錢乘未并者各自為實實如法得一錢臣淳風等謹按此術甲乙丙持錢數以為列衰副并為所有率未并者各為所求率百錢為所有數而今有之即得草曰置甲持錢五百六十乙持錢三百五十丙
