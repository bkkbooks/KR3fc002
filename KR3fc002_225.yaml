body:
  text: 當一馬也馬食半牛是二馬當一牛卽是四羊當一牛也云今術置羊一馬一牛四者通其率以爲列衰者四羊當一牛則一牛所食當四羊也二羊當一馬則一馬所食當二羊也牛一食四分馬一食二分羊一食一分母俱是一子有四分二分一分之別母同則子齊齊卽衰也故曰通其率以爲列衰於今有術四二一列衰爲所求率副并七爲所百率今有粟五斗爲所有數而今有之卽得今有甲持錢五百六十乙持錢三百五十丙持錢一百八十凡三人俱出關關稅百錢欲以錢數多少衰出之問各幾何荅曰甲出五十一錢一百九分錢之四十一乙出三十二錢一百九分錢之一十二丙出一十六錢一百九分錢之五十六術曰各置錢數爲列衰副并爲法以百錢乘未并者各自爲實實如法得一錢臣淳風等謹按此術甲乙丙持錢數以爲列衰副并爲所有率未并者各爲所求率百錢爲所有數而今有之卽得草曰置甲持錢五百六十乙持錢三百五十丙
