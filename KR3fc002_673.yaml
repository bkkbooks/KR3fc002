body:
  text: 草曰置矯矢五十當以一人乘之一乘不長故省不乘卽以五十除之得一人是矯矢五十用徒一人也置羽矢五十以三十除之得一又三十分之二十是用徒一人太半人也置筈矢五十以十五除之得三又十五分之五是用徒三人少半人也并之得六人以爲法以五十矢爲實實如法得八矢六分矢之二卽少半矢合問説曰注云可令矢互乘一人爲齊矢相乘爲同者列置五十分之一三十分之一十五分之一母互乘子五十之一得四百五十三十之一得七百五十十五之一得一千五百并之得二千七百爲法三母相乘得二萬二千五百爲實實如法得八矢二千七百分矢之九百以九百約子母爲三分矢之一卽少半矢亦合所問此以鳬鴈術爲之也云今先令同于五十矢矢同則徒齊其歸一也者置五十矢於位以五十除之得一以三十除之得一又三分之二以十五除之得三又三分之一各爲五十矢用徒人數是矢同則徒齊亦可并齊以除同故曰其歸一也云以此術爲鳬鴈者當鴈飛九日而一至鳬飛
