body:
  text: 術曰下有半是二分之一以一為二半為一并之得三為法置田二百四十步亦以一為二乘之為實實如法得從步草曰置一步二分步之一於位以分母二乘分子及全步皆為二又以其母除之則一為二半為一并之得三為法置田二百四十步亦以一為二乘之得四百八十步為實實如法得一百六十步即從步也合問今有田廣一步半三分步之一求田一畝問從幾何答曰一百三十步一十一分步之一十術曰下有三分以一為六半為三三分之一為二并之得一十一為法置田二百四十步亦以一為六乘之為實實如法得從步草曰置一步二分步之一三分步之一於位以最下分母三遍乘諸分子及全步皆為三各以其母除之則一為三半為二分之三三分之一為一置之於左又以分母二乘分子及巳通者仍以其母除之則一為六半為三三分之一為二并之得一十一為法置田二百四十步亦以一為六乘之得一千四百四十步為實實如法
