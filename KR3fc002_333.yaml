body:
  text: 答曰一百五十九步又有積七萬一千六百二十四步問為方幾何答曰二百六十八步又有積五十六萬四千七百五十二步四分步之一問為方幾何答曰七百五十一步半又有積三十九億七千二百一十五萬六百二十五步問為方幾何答曰六萬三千二十五步開方求方幂之一面也術曰置積為實借一算步之超一等言百之面十也言萬之面百也議所得以一乘所借一算為法而以除先得黃甲之面上下相命是自乘而除也除巳倍法為定法倍之者豫張兩面朱幂定袤以待復除故曰定法其復除折法而下欲除朱幂者本當副置所得成方倍之為定法以折議乘而以除如是當復步之而止乃得相命故使就上折下復置借算步之如初以復議一乘之欲除朱幂之角黃乙之幂其意如初之所得也所得副以加定法以除以所得副從定法再以黃乙之面加定法者是則張兩靑幂之袤復除折下如前若開之不盡者為不可開當以面命之術或有以皆算加定法而命分者雖粗相近不可用也凡開積為方方之自乘當還復其積分令不加借算而命分
