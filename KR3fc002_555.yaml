body:
  text: 術曰令縣卒各如其居所及行道日數而一以爲衰按此亦以日數爲均居所爲輸甲無行道日但以居所三十日爲率言欲爲均平之率者當使甲三十人而出一人乙三十一人而出一人出一人者計役則皆一人一日是以可爲均平之率甲衰四乙衰五丙衰四丁衰三戊衰五副并爲法以人數乘未并者各自爲實實如法而一各置所當出人數以其居所及行道日數乘之如縣人數而一得戸率人役五日七分日之五臣淳風等謹按爲衰於今有術副并爲所有率未并者各爲所求率以賦卒人數爲所有數此術以別考則意同以廣異聞故存之也有分者上下軰之軰配也今按丁分最少宜就戊除不從乙者丁近戊故也滿法除之有餘從乙丙分又少亦就乙除有餘從甲除之適𥁞從甲丙二分其數正等三者於乙遠近皆同不以甲從乙者方以下從上也潢按注此術以別以疑似之誤居所爲輸當作發卒爲輸草曰令甲縣一千二百人如其居所三十日而一得四十爲甲泛衰令乙縣一千五百五十人如其居所及行道三十一日而一得五十爲乙泛衰令丙縣一千二百八十人如其居所及行道三十二日而一得四十爲丙泛衰令丁縣九百九十人如其居所及行道三十三日而一得三十爲丁泛衰令戊縣一千七百五十人如其
