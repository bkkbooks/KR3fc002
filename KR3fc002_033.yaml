body:
  text: 草曰置九分七分在右方之八之六在左方母互乘子九分之八得五十六七分之六得五十四以少減多餘二爲實母相乘得六十三爲法以法命實爲六十三分之二卽相多也合問草曰置二十一分五十分在右方之八之十七在左方母互乘子二十一分之八得四百五十分之十七得三百五十七以少減多餘四十三爲實母相乘得一千五十爲法以法命實爲一千五十分之四十三卽相多也合問今有三分之一三分之二四分之三問減多益少各幾何而平荅曰減四分之三者二三分之二者一并以益三分之一而各平於十二分之七又有二分之一三分之二四分之三問減多益少各幾何而平荅曰減三分之二者一四分之三者四并以益二分之一而各平於三十六分之二十三平分臣淳風等謹按平分者諸分參差欲令齊等減彼之多增此之少故曰平分也術曰母互乘子齊其子也副并爲平實臣淳風等謹按母互乘子
  hash: sha256:1b299111b2096561f16f97ef7bc5e75db999083706a6a2ebd7710619a1004030
