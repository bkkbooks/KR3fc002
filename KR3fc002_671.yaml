body:
  text: 是為牡瓦一枚用三十八分日之一一日為牝瓦七十六枚是為牝瓦一枚用七十六分日之一齊而同之牡定用二千八百八十八分日之七十六牝定用二千八百八十八分日之三十八則瓦化為日矣并齊得一百一十四日以除同二千八百八十八枚得一日成牝牡瓦各二十五枚少半枚問所云相半即注所云相并也今有一人一日矯矢五十一人一日羽矢三十一人一日筈矢十五今令一人一日自矯羽筈問成矢幾何答曰八矢少半矢術曰矯矢五十用徒一人羽矢五十用徒一人太半人筈矢五十用徒三人少半人并之得六人以為法以五十矢為實實如法得一矢按此術言成矢五十用徒六人一日工也此同功共作猶鳬鴈共至之類亦以同為日并齊為法可令矢互乘一人為齊矢相乘為同今先令同於五十矢矢同則徒齊其歸一也以此術為鳬鴈者當鴈飛九日而一至鳬飛七日而一至七分至之二并之得二至七分至之二以為法以九日為實實如法而一得一人日矯矢之數也潢按注末句得一人日矯矢之數也與上文不屬疑有脫誤
