body:
  text: 菽價率三又菽五當答三即為菽價率三而答價率五孔刻脫此十七字又答六當黍五即為答價率五而黍價率六而率通矣者即新術所云各據二物相當之率對易其數即各當之率也云更置第三行以第四行減之餘有麻一斗菽四斗正孔刻脫正字答三斗負下實四正者算詳前草云求其同為麻之數以菽率三答率五各乘菽答斗數如麻率七而一菽得一斗七分斗之五正答得二斗七分斗之一負則菽答化為麻以并之者菽率三乘菽四斗正得十二斗如麻率七而一得麻一斗七分斗之五正答率五乘答三斗負得十五斗如麻率七而一得麻二斗七分斗之一負則菽答皆化為麻矣云令同名相從異名相消餘為定麻七分斗之四以為法置下實四為實以分母乘之得二十八而分子化為法矣以法除得七即麻一斗之價者麻菽同名麻答異名以麻一斗并菽為麻一斗七分斗之五得二斗七分斗之五以答為麻二斗七分斗之一減之餘麻七分斗之四以分子四為法分母七乘下實四得二十八為實實如法得七即
