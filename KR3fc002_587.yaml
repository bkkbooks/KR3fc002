body:
  text: 七十里并空重行得一百二十乘之得八千四百日爲實實如法得二日四分此分以一十爲母加載輸各一日爲四日四分以六人乘之得二十六人四分以傭價十錢乘之得二百六十四錢以二十五斛除之得十錢五分六釐加一斛粟價十八得二十八錢五分六釐爲乙縣致一斛之費以約乙算三萬四千二百七十二得一千二百爲乙泛衰置丙縣到輸所一百四十里以一百二十乘之得一萬六千八百日爲實實如法得四日八分加載輸各一日爲六日八分以六人乘之得四十人八分以傭價五錢乘之得二百四錢以二十五斛除之得八錢一分六釐加一斛粟價十六得二十四錢一分六釐爲丙縣致一斛之費以約丙算一萬九千三百二十八得八百爲丙泛衰置丁縣到輸所一百七十五里以一百二十乘之得二萬一千日爲實實如法得六日加載輸各一日爲八日以六人乘之得四十八人以傭價五錢乘之得二百四十錢以二十五斛除之得九錢六分加一斛粟價十四得二十三錢六分爲丁縣致一斛之費以約
