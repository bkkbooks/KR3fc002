body:
  text: 潢按乘之當作棄之圖與溝同而長於溝草曰置上廣一丈六尺三寸下廣一丈并之得二丈六尺三寸半之得一丈三尺一寸五分展爲一十三尺一寸五分以深六尺三寸乘之得八十二尺八寸四分五𨤲又以袤一十三丈二尺一寸展爲一百三十二尺一寸乘之得一萬九百四十三尺八寸二分四𨤲五毫其二分四𨤲五毫棄之得一萬九百四十三尺八寸卽壍積也合問夏程人功八百七十一尺并出土功五分之一沙礫水石之功作太半定功二百三十二尺一十五分尺之四問用徒幾何答曰四十七人三千四百八十四分人之四百九術曰置本人功去其出土功五分之一又去沙
  hash: sha256:2a5fe5d7fef1836a1cd3392dd13330fd16e5693c950ee1f3c04ed2dfd6405677
