body:
  text: 草曰置大夫五不更四簪褭三上造二公士一爲列衰副并得一十五爲法以五鹿乘列衰五四三二一之未并者大夫得二十五不更得二十簪褭得一十五上造得一十公士得五各自爲實實如法大夫得一鹿一十五分鹿之一十子母各以五約之爲三分鹿之二不更得一鹿一十五分鹿之五子母各以五約之爲三分鹿之一簪褭得一鹿上造得一十五分鹿之一十約爲三分鹿之二公士得一十五分鹿之五約爲三分鹿之一合問説曰大夫不更簪褭上造公士皆爵名也李籍音義云夫以智率人者也大夫則以智率人之大者也不更次大夫取其不與戍更簪褭次不更取其纓冠乘馬上造次簪褭取其爲造士而居上公士次上造取其爲士而在公又云爵數者謂大夫五不更四簪褭三上造二公士一也潢按副并一十五者衰之總也五鹿者物之總也五四三二一者每衰之分也總衰與總物之比若每衰分數與每物分數之比此今有之義也故注云今有術列衰各爲所求率副并爲所
