body:
  text: 草曰置大夫五不更四簪裊三上造二公士一為列衰副并得一十五為法以五鹿乘列衰五四三二一之未并者大夫得二十五不更得二十簪裊得一十五上造得一十公士得五各自為實實如法大夫得一鹿一十五分鹿之一十子母各以五約之為三分鹿之二不更得一鹿一十五分鹿之五子母各以五約之為三分鹿之一簪裊得一鹿上造得一十五分鹿之一十約為三分鹿之二公士得一十五分鹿之五約為三分鹿之一合問説曰大夫不更簪裊上造公士皆爵名也李籍音義云夫以智率人者也大夫則以智率人之大者也不更次大夫取其不與戍更簪裊次不更取其纓冠乘馬上造次簪裊取其為造士而居上公士次上造取其為士而在公又云爵數者謂大夫五不更四簪裊三上造二公士一也潢按副并一十五者衰之總也五鹿者物之總也五四三二一者每衰之分也總衰與總物之比若每衰分數與每物分數之比此今有之義也故注云今有術列衰各為所求率副并為所
