body:
  text: 今有出錢一萬三千六百七十買絲一石二鈞一十七斤欲石率之問石幾何答曰一石八千三百二十六錢一百九十七分錢之一百七十八經率此術猶經分臣淳風等謹按今有之義一斗為所求率出錢為所有數故以一斗乘錢數有分者通之又以分母乘之為實所買通分內子為所有率故以為法實如法而一得錢數不盡而命分者因法為母實餘為子實見不滿故以命之術曰以所求率乘錢數為實以所買率為法實如法得一買𣾰草曰斗率之者以一斗為所求率也置𣾰一斗通為一十升又以所買率分母三乘之得三十升以出錢五千七百八十五乘之得一十七萬三千五百五十錢為實次置𣾰一斛六斗七升太半升通分內子得五百三升為法實如法得三百四十五錢五百三分錢之一十五即一斗直也合問買縑草曰丈率之者以一丈為所求率也置縑一丈通為一十尺以出錢七百二十乘之得七千二百錢為實次置縑一匹二丈一尺通之得六十一尺為法實如法得一百一十八錢六十
  hash: sha256:e4e52fca0e9721d831ded1cbb967616e8bdf235b134e293be4e2713134ed9b12
