body:
  text: 草曰置分母七分五分在右方分子之四之三在左方分母相乘得三十五為法分子相乘得十二為實實不滿法以法命之為三十五分步之十二合問草曰置分母九分十一分在右方分子之七之九在左方分母相乘得九十九為法分子相乘得六十三為實法實各以等數九約之為十一分步之七合問草曰置分母五分九分在右方分子之四之五在左方分母相乘得四十五為法分子相乘得二十為實法實各以等數五約之為九分步之四合問今有田廣三步三分步之一從五步五分步之二問為田幾何答曰十八步又有田廣七步四分步之三從十五步九分步之五問為田幾何答曰一百二十步九分步之五又有田廣十八步七分步之五從二十三步十一分步之六問為田幾何
  hash: sha256:9fa8500d140ad653afb44c36fc5e4733cbbe49bfc09cd2d07b25ddcf7bf9b84f
