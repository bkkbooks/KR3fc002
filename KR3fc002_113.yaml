body:
  text: 八步六百二十八分步之五十一臣淳風等謹按依周三徑一考之合徑八步二十四分步之一十一依密率合徑八步一百七十六分步之一十三問為田幾何答曰四畝一百五十六步四分步之一於𡽪術當為田二畝二百三十二步五千二十四分步之七百八十七也依周三徑一為田三畝二十五步六十四分步之二十五臣淳風等謹按密率為田二畝二百三十一步一千四百八分步之七百一十七也如圖甲丙為中周乙丁為外周甲乙丙丁皆徑也惟環而不通匝故徑失之於多而過周三徑一之率術曰并中外周而半之以徑乘之為積步此田截齊中外之周周則為長并而半之者亦以盈補虛也此可令中外周各自為圓田以中圓減外圓餘則環實也按此術置中外周步數於上分母子於下母乘子者為中外周俱有餘分故以互乘齊其子母相乘同其母子齊母同故通全步內分子并而半之者以盈補虛得中平之周周則為從徑則為廣故廣從相乘而得其積既合分母還須分母出之故令周徑分母相乘而連除之即得積步不盡以等數除之而命分以畝法除積步得畝數也密率術曰置中外周步數分母子各居其下母互乘子分母相乘通全步內分子并而半之又可以中周減外周餘半之以益中周徑亦通分內子以乘周為實分母相乘為法除之為積步
