body:
  text: 內關七而取一餘米五斗問本持米幾何答曰十斗九升八分升之三術曰置米五斗以所稅者三之五之七之為實以餘不稅者二四六互相乘為法實如法得一斗此亦重今有術也所稅者謂今所當稅之定三五七皆為所求率二四六皆為所有率置今有餘米五斗以七乘之六而一即內關未稅之本米也又以三乘之二而一即外關未稅之本米也今從末求本不問中間故令中率轉相乘而同之亦如絡絲術又一術外關三而取一則其餘本米三分之二也求外關所稅之餘則當置三分乘之二而一欲知中關以四乘之五而一欲知內關以六乘之七而一凡餘分者乘其母而以三五七相乘得一百五為分母二四六相乘得四十八為分子約而言之則是餘米於本所持三十五分之十六也於今有術餘米五斗為所有數分母三十五為所求率分子十六為所有率也潢按術文互字衍凡母互乘子則曰互母相乘子相乘皆不曰互注有脫誤補正於後此亦重今有術也所稅者謂今所當稅之定三五七皆為所求率二四六皆為所有率置今有餘米五斗以七乘之六而一即內關未稅之本米也又以五乘之四而一即中關未稅之本米也又以三乘之二而一即外關未稅之本米也今從末求本不問中間故令中率轉相乘而同之亦如絡絲術
