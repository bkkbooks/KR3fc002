body:
  text: 二十一乘之得一千六百五十九升為實以粟率五十為法除之得三斗三升五十分升之九即御米也合問說曰此亦無等數可約故仍用其本率也置粟率五十於上位御米率二十一於下位以下減上上位餘八轉以上餘減下位下位餘五又以下餘五減上餘八上位餘三轉以上餘三減下餘五下位餘二又以下餘二減上餘三上位餘一是無等數可約也故直以二十一之五十而一也今有粟一斗欲為小䵂問得幾何答曰為小䵂二升一十分升之七術曰以粟求小䵂二十七之百而一臣淳風等謹按小䵂之率十三有半半者二為母以二通之得二十七為所求率又以母二通其粟率得一百為所有率凡本率有分者須即乘除也他皆倣此草曰置粟一斗展為一十升以小䵂率二十七乘之得二百七十升為實以粟率一百為法除之得二升一百分升之七十子母各以一十約之為一十分升之七即小䵂也合問說曰注云半者二為母半即二之一也置小䵂
  hash: sha256:605696bc16517a196d8dba31dc327395fa1e6401e4bf8cc575bdbdac7a0c016e
