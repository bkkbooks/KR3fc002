body:
  text: 行馬空餘十一牛直錢二萬上法下實即以實二萬錢為牛價寄法十一為分母求馬價以法十一乘右行錢二萬得錢二十二萬於下位以牛價二萬乘右行二牛得錢四萬以減下位餘錢十八萬如三馬而一得六萬為馬價寄法十一為分母乃置馬價六萬錢牛價二萬錢皆如法十一而一得五千四百五十四錢十一分錢之六為馬價得一千八百一十八錢十一分錢之二為牛價合問説曰注云一馬半與一牛通分內子右行為三馬二牛直錢二萬二牛半與一馬通分內子左行為二馬五牛直錢二萬者半以二為母故馬牛與錢皆以二通之也今有武馬一匹中馬二匹下馬三匹皆載四十石至阪皆不能上武馬借中馬一匹中馬借下馬一匹下馬借武馬一匹乃皆上問武中下馬一匹各力引幾何答曰武馬一匹力引二十二石七分石之六中馬一匹力引十七石七分石之一
