body:
  text: 上爲法下爲實實九十九斗卽下禾一秉之實寄法三十六爲分母求中禾以法三十六乘中行下實二十四斗得八百六十四斗於下位以下禾實九十九斗乘中行下禾一秉仍得九十九斗爲下禾列實以減下位餘七百六十五斗如中禾五秉而一得一百五十三斗爲中禾一秉之實寄法三十六爲分母求上禾亦以法三十六乘右行下實三十九斗得一千四百四斗於下位以中禾實一百五十三斗秉右行中禾二秉得三百六斗爲中禾列實以下禾實九十九斗乘右行下禾一秉仍得九十九斗爲下禾列實并之得四百五斗以減下位餘九百九十九斗如上禾三秉而一得三百三十三斗爲上禾一秉之實寄法三十六爲分母乃置上禾實三百三十三斗中禾實一百五十三斗下禾實九十九斗皆如法三十六而一得上禾一秉實九斗三十六分斗之九約爲四分斗之一中禾一秉實四斗三十六分斗之九約爲四分斗之一下禾一秉實二斗三十六分斗之二十七約爲四分斗之三合問説曰李籍音義云方者左右也程者課率也左
