body:
  text: 為定法以議五乘之得七千六百二十五減實適盡上議得二十五尺置分母八開立方除之得二以除二十五尺得一十二尺半即立方也合問草曰置積六萬三千四百一尺五百一十二分尺之四百四十七通分內子得三千二百四十六萬一千七百五十九尺為定實借一算步之超二等至百而止置上議三百再乘所借一算得九萬為方法以上議三百乘之得二千七百萬以減實實餘五百四十六萬一千七百五十九尺除巳以三乘方法九萬得二十七萬為定法復除折而下以三乘上議三百得九百為𠔳法置中行復借一算置下行步之中超一下超二至十而止置上議一十一乘中九百得九千為𠔳幂再乘下一算得一百為隅幂皆副之并得九千一百以加定法二十七萬得二十七萬九千一百為定法以上議一十乘之得二百七十九萬一千以減實實餘二百六十七萬七百五十九尺除巳倍下一百為二百并中九千得九千二百從定法二十七萬九千一百得二十
