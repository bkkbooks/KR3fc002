body:
  text: 二十四斗如粟率五而一得四斗八升加故米二斗為六斗八升課於七斗不足二升云若使故米三斗須添粟七斗以滿之七斗得糲米四斗二升課於七斗是為有餘二升者置粟七斗以米率三乘之得二十一斗如粟率五而一得四斗二升加故米三斗為七斗二升課於七斗有餘二升今有垣高九尺瓜生其上蔓日長七寸瓠生其下蔓日長一尺問幾何日相逢瓜瓠各長幾何答曰五日十七分日之五瓜長三尺七寸十七分寸之一瓠長五尺二寸十七分寸之十六術曰假令五日不足五寸令之六日有餘一尺二寸按假令五日不足五寸者瓜生五日下垂蔓三尺五寸瓠生五日上延蔓五尺課於九尺之垣是為不足五寸令之六日有餘一尺二寸者若使瓜生六日下垂蔓四尺二寸瓠生六日上延蔓六尺課於九尺之垣是為有餘一尺二寸以盈不足維乘假令之數者欲為齊同之意實如法而一即設差不盈不朒之正數即得日數以瓜瓠一日之長乘之故各得其長之數也草曰置假令五日於右行不足五寸居其下置令之六日於左行有餘一尺二寸居其下
