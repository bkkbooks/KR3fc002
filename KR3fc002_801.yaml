body:
  text: 右課率總統羣物故曰方程術云以右行上禾遍乘中行而以直除又乘其次亦以直除者除即減也以右行頭位遍乘中行左行而減之減不盡者作幾度減之古法不用左右行互乘對減故曰直除也云以中行中禾不盡者遍乘左行而以直除者去左行之中禾也云左方下禾不盡者上為法下為實實即下禾之實者法除實不盡下禾實以法為分母故不云實如法而一也中禾上禾之實亦以法為分母故總云實皆如法各得一斗也注云程課程也者兩行相並為方多少相課為程以程為課程者即方田章課分術以少減多之謂云羣物總雜者所列非一物也云各列有數者二物則列二位三物則列三位是為列數各以其實乘之則為列實也云總言其實者其實即下實方程有以共實為下實者行中有正無負有以差實為下實者行中有正有負有共實而𠮓為差實者行中本無正負遍乘直除而後分正負也云令每行為率者每行各自為率無所同也云二物者再程三物者三程皆如物數程之並列為行者如上
