body:
  text: 一分錢之二即一丈直也合問買布草曰匹率之者以一匹為所求率也置布一匹通為四十尺以出錢二千三百七十乘之得九萬四千八百錢為實次置布九匹二丈七尺通之得三百八十七尺為法實如法得二百四十四錢三百八十七分錢之三百七十二子母各以三約之為一百二十九分錢之一百二十四即一匹直也合問買絲草曰石率之者以一石為所求率也置絲一石通為一百二十斤以出錢一萬三千六百七十乘之得一百六十四萬四百錢為實次置絲一石二鈞一十七斤通之得一百九十七斤為法實如法得八千三百二十六錢一百九十七分錢之一百七十八即一石直也合問說曰此四問是算家定位法也買𣾰率止於升故通一斗為十升買縑率止於尺故通一丈為十尺買布率亦止於尺故通一匹為四十尺買絲率止於斤故通一石為一百二十斤所以齊其位也乘除皆置實于上置法于下上下相觀以法步實上位有十步至十有百步至百有千
  hash: sha256:ddd32497ebf88c7e6779e0dd23a92fd77dc8d3e3918ae55d0549de9601256311
