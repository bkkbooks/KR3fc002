body:
  text: 説曰稻率六十以粟求稻合以此數乘之今與粟率五十退位求之所求之率得六所有之率得五故六之五而一亦約二率而乘除也今有粟七斗八升欲爲䜴問得幾何荅曰爲豉九斗八升二十五分升之七術曰以粟求豉六十三之五十而一草曰置粟七斗八升展爲七十八升以豉率六十三乘之得四千九百一十四升爲實以粟率五十爲法除之得九斗八升五十分升之一十四子母各半之爲二十五分升之七卽豉也合問説曰此亦無等數可約故仍用其本率也置粟率五十於上位豉率六十三於下位以上減下下餘十三轉以下餘減上上餘十一又以上餘十一減下餘十三下位餘二又轉以下餘二減上餘十一上位餘一是無等數可約故直以六十三乘之五十而一也今有粟五斗五升欲爲飱問得幾何荅曰爲飱九斗九升術曰以粟求飱九之五而一臣淳風等謹按飱率九十退位與求
  hash: sha256:1a59e237638daf6e6633d0d652a2c02fb0f4fb20b8b3e618689b10ae28c108bc
