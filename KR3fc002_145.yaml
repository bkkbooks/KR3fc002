body:
  text: 今有粟九斗八升欲為御飯問得幾何答曰為御飯八斗二升二十五分升之八術曰以粟求御飯二十一之二十五而一臣淳風等謹按此術半率亦與糳飯多同草曰置粟九斗八升展為九十八升以御飯率二十一乘之得二千五十八升為實以粟率二十五為法除之得八斗二升二十五分升之八即御飯也合問説曰御飯之率四十有二半之得二十一為所求率亦半粟率得二十五為所有率半二率而乘除與糳飯多同也今有粟三斗少半升欲為菽問得幾何答曰為菽二斗七升一十分升之三今有粟四斗一升太半升欲為答問得幾何答曰為答三斗七升半今有粟五斗太半升欲為麻問得幾何答曰為麻四斗五升五分升之三今有粟一十斗八升五分升之二欲為麥問得幾何答曰為麥九斗七升二十五分升之一十四
  hash: sha256:9e96f9ce1aa4a63fd9b0d398073f8c1d4779e80164462f1cb455d7844e32938b
