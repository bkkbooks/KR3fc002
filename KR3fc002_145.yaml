body:
  text: 今有粟九斗八升欲爲御飯問得幾何荅曰爲御飯八斗二升二十五分升之八術曰以粟求御飯二十一之二十五而一臣淳風等謹按此術半率亦與糳飯多同草曰置粟九斗八升展爲九十八升以御飯率二十一乘之得二千五十八升爲實以粟率二十五爲法除之得八斗二升二十五分升之八卽御飯也合問説曰御飯之率四十有二半之得二十一爲所求率亦半粟率得二十五爲所有率半二率而乘除與糳飯多同也今有粟三斗少半升欲爲菽問得幾何荅曰爲菽二斗七升一十分升之三今有粟四斗一升太半升欲爲荅問得幾何荅曰爲荅三斗七升半今有粟五斗太半升欲爲麻問得幾何荅曰爲麻四斗五升五分升之三今有粟一十斗八升五分升之二欲爲麥問得幾何荅曰爲麥九斗七升二十五分升之一十四
  hash: sha256:dc890e1085ee883d96f7eee48fb5c6344c7507bdb9955b94f8846abd33be80cb
