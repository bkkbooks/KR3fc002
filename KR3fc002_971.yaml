body:
  text: 步者所有見句求見弦股故以弦股率乘如句率而一者今有之義也如圖朱方為句幂黃方為弦幂朱黃相連之方為句弦并幂股自乘為靑幂之矩令出入相補以句弦差為廣并為袤加朱黃相連之方以兩弦為袤并為廣今有句五步股十二步問句中容方幾何答曰方三步十七分步之九術曰并句股為法句股相乘為實實如法而一得方一步句股相乘為朱靑黃幂各二令黃幂連於下隅朱靑各以類合共成修幂中方黃為廣并句股為袤故并句股為法幂圖方在句中則方之兩𠔳各自成小句股而其相與之勢不失本率也句面之小股股面之小句從橫相連合而成中方令股為中方率并句股為廣率據見句五步而今有之得中方也復令句為中方率以并句股為袤率據股十二步而今有之則中方又可知此則雖不效而法實有法由生矣不容圓率以今有衰分言之可以見
