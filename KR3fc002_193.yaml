body:
  text: 置貴絲七千八百九十七銖於下位以斤積銖三百八十四除之得二十斤餘二百一十七銖以兩積銖二十四除之得九兩餘一銖上位得一石二鈞七斤十兩四銖斤六十七錢下位得二十斤九兩一銖斤六十八錢合問買絲兩率之草曰置絲一兩以兩積銖通之得二十四以出錢一萬三千九百七十乘之得三十三萬五千二百八十錢為實次置所買絲一石二鈞二十八斤三兩五銖通之得七萬九千九百四十九銖為法實如法得四錢為賤絲一兩之價每兩增一錢得五錢為貴絲一兩之價實餘一萬五千四百八十四銖為貴絲以實餘一萬五千四百八十四銖減所買絲七萬九千九百四十九銖餘六萬四千四百六十五銖為賤絲乃置賤絲六萬四千四百六十五銖於上位以石積銖四萬六千八十除之得一石餘一萬八千三百八十五銖以鈞積銖一萬一千五百二十除之得一鈞餘六千八百六十五銖以斤積銖三百八十四除之得一十七斤餘三百三十七銖以兩積銖二十四除之得一十四兩
