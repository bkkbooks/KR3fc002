body:
  text: 總等得一千二十六以約各縣戶數得甲二十乙十二丙七丁十三戊五即戶率也戊五下當有為之戶率四字不言求等約之者省文也云一斛之費為之錢率者即甲二十乙丙各十八丁二十七戊十九也云錢率約戶率者則錢為母戶為子子不齊令母互乘為齊即衰也者各縣錢率約戶率甲得二十分之二十乙得十八分之十二丙得十八分之七丁得二十七分之十三戊得十九分之五令五母相乘得三百三十二萬四千二百四十為共母母互乘子得甲分子三百三十二萬四千二百四十乙分子二百二十一萬六千一百六十丙分子一百二十九萬二千七百六十丁分子一百六十萬五百六十戊分子八十七萬四千八百置各分子求總等得三千二百四十以約各分子得甲衰一千二十六乙衰六百八十四丙衰三百九十九丁衰四百九十四戊衰二百七十注於令母互乘為齊之下不言求等約之者亦省文也云若其不然以一斛之費約戶數取衰竝有分當通分內子約之於算甚繁者此問以一斛之費約
