body:
  text: 得一百二十各爲泛衰又求總等得二以徧約之得十二十五二十三十六十爲列衰副并得一百三十七爲法以百錢乘未并者大夫得一千二百錢不更得一千五百錢簪褭得二千錢上造得三千錢公士得六千錢各自爲實實如法得八錢一百三十七分錢之一百四爲大夫所出得一十錢一百三十七分錢之一百三十爲不更所出得一十四錢一百三十七分錢之八十二爲簪褭所出得二十一錢一百三十七分錢之一百二十三爲上造所出得四十三錢一百三十七分錢之一百九爲公士所出合問説曰置爵數各自爲衰而返衰之者列置大夫五分之一不更四分之一簪褭三分之一上造二分之一公士一分之一而返衰之返衰之者母互乘子也合分術曰母互乘子并以爲實母相乘爲法此術母互乘子爲列衰乘所有數各自爲實副并列衰爲法其術雖別其義則通故均輸章第三問注融會合分衰分注而言之也於今有術副并爲所有率未并者各爲所求率百錢爲所有數而今有之卽得
