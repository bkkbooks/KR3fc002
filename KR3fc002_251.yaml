body:
  text: 得一百二十各為泛衰又求總等得二以遍約之得十二十五二十三十六十為列衰副并得一百三十七為法以百錢乘未并者大夫得一千二百錢不更得一千五百錢簪裊得二千錢上造得三千錢公士得六千錢各自為實實如法得八錢一百三十七分錢之一百四為大夫所出得一十錢一百三十七分錢之一百三十為不更所出得一十四錢一百三十七分錢之八十二為簪裊所出得二十一錢一百三十七分錢之一百二十三為上造所出得四十三錢一百三十七分錢之一百九為公士所出合問説曰置爵數各自為衰而返衰之者列置大夫五分之一不更四分之一簪裊三分之一上造二分之一公士一分之一而返衰之返衰之者母互乘子也合分術曰母互乘子并以為實母相乘為法此術母互乘子為列衰乘所有數各自為實副并列衰為法其術雖別其義則通故均輸章第三問注融會合分衰分注而言之也於今有術副并為所有率未并者各為所求率百錢為所有數而今有之即得
