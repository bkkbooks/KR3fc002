body:
  text: 其一術草曰并盈十一不足十六得二十七為實以所出六減九餘三為法實如法得九即人數也副置人數九以人出九乘之得八十一減盈十一得七十以人出六乘之得五十四增不足十六亦得七十即雞價也合問買璡草曰置人出半即人出二分之一於右行盈四居其下置人出少半即人出三分之一於左行不足三居其下人出盈右行人出不足左行次置所出率齊而同之則二分之一為六分之三三分之一為六分之二人出盈右行人出不足左行令不足三維乘三得九令盈四維乘二得八
