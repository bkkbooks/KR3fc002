body:
  text: 十三乘戊算二萬三千四十得三百六萬四千三百二十爲法實如法得九錢三百六萬四千三百二十分錢之六萬九千一百二十以等數二萬三千四十約子母爲一百三十三分錢之三置巳縣七千二百一十八斛一百三十三分斛之六通分內子得九十六萬以其一斛之費二十三錢九分二釐乘之得二千二百九十六萬三千二百爲實以分母一百三十三乘巳算一萬九千一百三十六得二百五十四萬五千八十八爲法實如法得九錢二百五十四萬五千八十八分錢之五萬七千四百八以等數一萬九千一百三十六約子母爲一百三十三分錢之三欽裴新術置六縣賦粟六萬斛爲實如并衰本數六千六百五十而一得九錢六千六百五十分錢之一百五十以等數五十約子母爲一百三十三分錢之三今有粟七斗三人分舂之一人爲糲米一人爲粺米一人爲糳米令米數等問取粟爲米各幾何荅曰
  hash: sha256:09b3ce67a160689c6a58813b0751f74d238e19624ece7d4f8be5a01ea66e9531
