body:
  text: 約法二萬二千六百八十得一百二十六即家數也以約實六十七萬五千得三千七百五十即牛價也合問其一術草曰并盈三十不足三百三十得三百六十以分母六十三乘之得二萬二千六百八十為實以所出分子一千七百一十減一千八百九十餘一百八十以約實得一百二十六即家數也置家一百二十六以所出一百九十乘之得二萬三千九百四十如七家而一得三千四百二十增不足三百三十得三千七百五十復置家一百二十六以所出二百七十乘之得三萬四千二十如九家而一得三千七百八十減盈三十亦得三千七百五十即牛價也合問說曰術云盈不足相與同者如共買物人出八盈三人出七不足四三四相乘得十二是之謂同餘皆放此注云齊其假令者假令即所出率也以不足四維乘所出率八得三十二以盈三維乘所出率七得二十一所以齊之也云同其盈朒者盈朒即盈不足以盈三朒四相乘得十二所以同之也云通計齊則不盈不朒之正數
