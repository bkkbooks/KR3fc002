body:
  text: 於今斛為容九斗七升四合有奇周官考工記㮚氏為量深一尺內方一尺而圓外其實一釜於𡽪術此圓積一千五百七十六寸左氏傳曰齊舊四量豆區釜鍾四升曰豆各自其四以登於釡釡十則鍾鍾六斛四斗釡六斗四升方一尺深一尺其積一千寸若此方積容四斗二升則通外圓積成旁容十斗四合一籥五分籥之三也以數相乘之則斛之制方一尺而圓其外庣旁一𨤲七毫幂一百五十六寸四分寸之一深一尺積一千五百六十二寸半容十斗王莽銅斛與漢書律歷志所論斛同潢按委粟術注得圓幂之積幂當作錐得三十六而連除圓錐之積除字下脫得字程粟注五分斛之三當作三分斛之二於𡽪術此圓積一千五百七十六寸六字衍若此方積容四斗二升當作容六斗四升則通外圓積成旁旁疑當作量聲之誤也委粟草曰置下周一十二丈展為一百二十尺自乘得一萬四千四百尺以高二丈展為二十尺乘之得二十八萬八千尺三十六而一得八千尺即粟積也合問𡽪術草曰如前求到二十八萬八千尺以二十五乘之得七百二十萬尺九百四十二而一得七千六百四十三尺九百四十二分尺之二百九十四子母各以六約之為一百五十七分尺
