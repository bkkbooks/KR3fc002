body:
  text: 得一百三十步一十一分步之一十即從步也合問今有田廣一步半三分步之一四分步之一求田一畝問從幾何答曰一百一十五步五分步之一術曰下有四分以一為一十二半為六三分之一為四四分之一為三并之得二十五以為法置田二百四十步亦以一為一十二乘之為實實如法而一得從步草曰置一步二分步之一三分步之一四分步之一於位以最下分母四遍乘諸分子及全步皆為四各以其母除之則一為四半為二三分之一為三分之四四分之一為一置之於左又以分母三乘分子及巳通者仍以其母除之則一為一十二半為六三分之一為四四分之一為三并之得二十五以為法置田二百四十步亦以一為一十二乘之得二千八百八十步為實實如法得一百一十五步二十五分步之五子母各以五約之為五分步之一即從步也合問
