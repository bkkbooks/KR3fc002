body:
  text: 先并而半之即為廣狹之中平今先得其中平故又倍之知兩廣全也減上廣餘即下廣按此術穿地四為堅三垣即堅也今以堅求穿地當四乘之三而一深袤相乘者為深袤立幂以深袤立幂除積即坑廣又三之為法與堅率并除所得倍之者為坑有兩廣先并而半之為中平之廣今此得中平之廣故倍之還為兩廣并故減上廣餘即下廣也潢按注實穿地四為堅三實當作術即上術曰穿地四為壤五為堅三為墟四也為深袤之立實也以深袤乘之立實立實皆當作立幂草曰置垣積五百七十六尺四之得二千二百四尺為實以深一丈展為一十尺袤一丈六尺展為一十六尺相乘得一百六十尺又以三乘之得四百八十尺為法除實得四尺四百八十分尺之三百八十四子母各以九十六約之為五分尺之四倍之得九尺五分尺之三以上廣六尺減之餘三尺五分尺之三即穿地下廣也合問說曰注云為深袤之立幂也者廣袤相乘為平幂深袤相乘為立幂也云以深袤乘之立幂除垣積則坑廣又云坑有兩廣先并而半之即為廣狹之中平者上術云并上下廣而半之以高若深乘之又以袤乘之即積尺故今以深袤乘
