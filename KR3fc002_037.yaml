body:
  text: 之二者一并以益三分之一而各平於十二分之七合問草曰置二分三分四分在右方之一之二之三在左方母互乘子二分之一得十二三分之二得十六四分之三得十八副并得四十六爲平實母相乘得二十四爲法以列數三乘未并者二分之一得三十六三分之二得四十八四分之三得五十四亦以列數三乘法得七十二以平實四十六減列實四十八餘二減列實五十四餘八以等數二約所餘得一與四爲所減亦以等數二約列實三十六得十八并所減一與四加之得二十三又以等數二約法七十二爲三十六以命之是爲減三分之二者一四分之三者四并以益二分之一而各平於三十六分之二十三合問今有七人分八錢三分錢之一問人得幾何荅曰人得一錢二十一分錢之四又有三人三分人之一分六錢三分錢之一四分錢之三問人得幾何荅曰人得二錢八分錢之
