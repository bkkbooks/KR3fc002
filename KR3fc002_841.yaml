body:
  text: 草曰置上禾三秉正下禾十秉負益實六斗負於右行次置上禾二秉負下禾五秉正益實一斗負於左行上禾下禾益實正負負右行負正一負左行以右行上禾三秉遍乘左行左行得上禾六秉負下禾十五秉正下實三斗負以異減同并左行左行上禾空下禾五秉負下實十五斗負上禾下禾下實正負負右行負正負左行負負左行上為法下為實實如法得三斗為下禾一秉之實求上禾以下禾實三斗乘右行下禾十秉得三十斗負以減右行差實六斗負不足減反減之得下實二十四斗正為上禾列實如上禾三
  hash: sha256:a81cd7779f2b207b55272e8491e2639fb03fe1f26c208d61e54992523248fe2f
