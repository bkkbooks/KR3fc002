body:
  text: 答曰一百二十三尺今有積一千九百五十三尺八分尺之一問為立方幾何答曰一十二尺半今有積六萬三千四百一尺五百一十二分尺之四百四十七問為立方幾何答曰三十九尺八分尺之七又有積一百九十三萬七千五百四十一尺二十七分尺之一十七問為立方幾何答曰一百二十四尺太半尺開立方立方適等求其一面也術曰置積為實借一算步之超二等言千之面十言百萬之面百議所得以再乘所借一算為法而除之再乘者亦求為方幂以上議命而除之則立方等也除巳三之為定法為當復除故豫張三面以定方幂為定法也復除折而下復除者三面方幂以皆自乘之數須得折議定其厚薄爾開平幂者方百之面十開立幂者方千之面十據定法巳有成方之幂故復除當以千為百折下一等也以三乘所得數置中行設三𠔳之定長復借一算置下行欲以為隅方立方等未有定數且置一算定其位步之中超一下超二位上方法長自乘而一折中𠔳法但有長故降一等下隅法無面長故又降一等也復置議以一乘中為三𠔳備幂也再
