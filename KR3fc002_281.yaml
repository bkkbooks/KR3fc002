body:
  text: 之爲二十五又置所有數先取錢一千二百以等數一百約之爲一十二乃置一歲三百五十四日於位以一十二乘之得四千二百四十八日爲實以二十五爲法除之得一百六十九日二十五分日之二十三合問今有貸人千錢月息三十今有貸人七百五十錢九日歸之問息幾何荅曰六錢四分錢之三術曰以月三十日乘千錢爲法以三十日乘千錢爲法者得三萬是爲貸人錢三萬一日息三十也以息三十乘今所貸錢數又以九日乘之爲實實如法得一錢以九日乘今所貸錢爲今一日所有錢於今有術爲所有數息三十爲所求率三萬錢爲所有率此又可以一月三十日約息三十錢爲十分一日以乘今一日所有錢爲實千錢爲法爲率者當等之於一也故三十日或可乘本或可約息皆所以等之也潢按注十分一日四字有誤當作一錢一日草曰置今貸人七百五十錢於位以月息三十乘之得二萬二千五百錢又以九日乘之得二十萬二千五百錢爲實次置貸人千錢於位以月三十日乘之得三萬錢爲法實如法得六錢三萬分錢之二萬二千五百子母各以七千五
