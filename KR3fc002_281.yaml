body:
  text: 之為二十五又置所有數先取錢一千二百以等數一百約之為一十二乃置一歲三百五十四日於位以一十二乘之得四千二百四十八日為實以二十五為法除之得一百六十九日二十五分日之二十三合問今有貸人千錢月息三十今有貸人七百五十錢九日歸之問息幾何答曰六錢四分錢之三術曰以月三十日乘千錢為法以三十日乘千錢為法者得三萬是為貸人錢三萬一日息三十也以息三十乘今所貸錢數又以九日乘之為實實如法得一錢以九日乘今所貸錢為今一日所有錢於今有術為所有數息三十為所求率三萬錢為所有率此又可以一月三十日約息三十錢為十分一日以乘今一日所有錢為實千錢為法為率者當等之於一也故三十日或可乘本或可約息皆所以等之也潢按注十分一日四字有誤當作一錢一日草曰置今貸人七百五十錢於位以月息三十乘之得二萬二千五百錢又以九日乘之得二十萬二千五百錢為實次置貸人千錢於位以月三十日乘之得三萬錢為法實如法得六錢三萬分錢之二萬二千五百子母各以七千五
