body:
  text: 畝畝錢乃并善田得二十萬畝并惡田得一百四十萬畝各為實并多一萬二千錢不足四千錢得一萬六千錢為法實如法得善田一十二畝半惡田八十七畝半合問今有黃金九枚白銀十一枚稱之重適等交易其一金輕十三兩問金銀一枚各重幾何答曰金重二斤三兩十八銖銀重一斤十三兩六銖術曰假令黃金三斤白銀二斤十一分斤之五不足四十九於右行令之黃金二斤白銀一斤十一分斤之七多十五於左行以分母各乘其行內之數以盈不足維乘所出率并以為實并盈不足為法實如法得黃金重分母乘法以除得銀重約之得分也按此術假令黃金九白銀十一俱重二十七斤金九約之得三斤銀十一約之得二斤十一分斤之五各為金銀一枚重數就金重二十七斤之中減一金之重以益銀銀重二十七斤之中減一銀之重以益金則金重二十六斤十一分斤之五銀重二十七斤十一分斤之六以少減多則金輕十七兩十一分兩之五課於十三兩多四
