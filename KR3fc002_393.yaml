body:
  text: 正方大近下幂者內棊正方大外棊正方小而相等二長方隨之爲消長爾按陽馬方高數參等者倒而立之横截去上則高自乘與斷上幂數亦等焉如圖方高等之陽馬方謂從橫二面與高爲參等高爲句與高相聯之兩面爲股大句股旣等每截一分其小句股亦必等句自乘卽餘高自乘幂股自乘卽斷上幂句股旣等則二幂必等倒而立之謂以陽馬頂銳向下立之令餘高在下斷上幂在上與外三棊同勢也如圖以方高參等陽馬倒而立之甲爲頂銳向下庚辛壬癸方幂爲底向上截子甲爲餘高子丑爲斷上方子丑寅卯爲子丑斷上幂亦爲子甲餘高自乘幂以子甲句與子丑股相等故也若截辰甲爲餘高辰巳爲斷上方辰巳午未爲辰巳斷上幂亦爲辰甲餘高自乘幂以辰甲句與辰巳股相等故也
  hash: sha256:f84bbc6a49f69465684450ae6f71b5520892662681fe22b93813ca71f4a43dd0
