body:
  text: 正方大近下幂者內棊正方大外棊正方小而相等二長方隨之為消長爾按陽馬方高數參等者倒而立之橫截去上則高自乘與斷上幂數亦等焉如圖方高等之陽馬方謂從橫二面與高為參等高為句與高相聯之兩面為股大句股既等每截一分其小句股亦必等句自乘即餘高自乘幂股自乘即斷上幂句股既等則二幂必等倒而立之謂以陽馬頂鋭向下立之令餘高在下斷上幂在上與外三棊同勢也如圖以方高參等陽馬倒而立之甲為頂鋭向下庚辛壬癸方幂為底向上截子甲為餘高子丑為斷上方子丑寅卯為子丑斷上幂亦為子甲餘高自乘幂以子甲句與子丑股相等故也若截辰甲為餘高辰巳為斷上方辰巳午未為辰巳斷上幂亦為辰甲餘高自乘幂以辰甲句與辰巳股相等故也
