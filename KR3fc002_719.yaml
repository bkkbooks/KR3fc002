body:
  text: 盈不足各居其下令維乘所出率以少減多餘為實兩盈兩不足以少減多餘為法有分者通之副置所出率以少減多餘以約法實實為物價法為人數按此術兩盈者兩設皆逾於正數兩不足者兩設皆不足於正數其所以𠮓化則兩不足亦猶兩盈而或有勢同而情違者當其為實俱令不足其相乘減則遺其所不足焉故其餘所以為實者無朒數以損焉蓋出而有餘兩盈兩設皆逾於正數假令與共買物人出八盈三人出九盈十齊其假令同其兩盈兩盈俱三十舉齊則兼去其餘所以為實者無盈數兩盈以少減多餘為法齊之八十者是十假令而凡盈三十是三以十齊之齊之二十七者是三假令而凡盈三十是十以三齊之兩盈共十三以三減十餘七假令為一實故令以三減十餘七為法所出率以少減多餘謂之設差因設差為少設則兩盈之差是為定實故以少設約法則為人數約實則得物價其一術曰置所出率以少減多餘為法兩盈兩不足以少減多餘為實實如法而一得人數以所出率乘之減盈增不足即物價置所出率以少減多得一人之差兩盈兩不足相減餘為衆人之差故以一人之差除之得人數以所出率乘之減盈增不足即物價買金草曰置人出四百於右行盈三千四百居其下置人出三百於左行盈一百居其下人出盈右行
