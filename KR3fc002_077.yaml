body:
  text: 句自乘得七千三百一十九萬一千四百四十七忽餘分零四於上位又以二十四弧之半面為小股置其幂一百七十億三千七百八萬七千三百六十六忽餘分半忽於下位并上下位得一百七十一億一千二十七萬八千八百一十三忽餘分五四棄之開方除之得一寸三分八亳六忽謂之小弦餘實一十六萬九千一百七十七忽棄之即四十八弧之一面也置半徑一尺展為一百萬忽乘之得一千三百八億六百萬忽又以二十四乘之得幂三萬一千三百九十三億四千四百萬忽復展一寸為十萬忽自乘得一百億以除之得三百一十三寸一百億分寸之九十三億四千四百萬分母子各以等數一千六百萬約之為六百二十五分寸之五百八十四即九十六弧之幂也割四十八弧以為九十六弧草曰亦令半徑為弦四十八弧之半面為句為之求股置次上弦幂一百七十一億一千二十七萬八千八百一十三忽四而一得四十二億七千七百五十六萬九千七百三忽餘分二五棄之則句幂也以減弦幂一
  hash: sha256:40c35c4791170afd1b9b44e0643321ff4ed8933ef97a12cae668400817502ef1
