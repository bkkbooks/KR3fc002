body:
  text: 為見句自乘得一萬步為實以出東門十五步為句率以為法實如法得六百六十六步十五分步之一十分母子各以五約之得三分步之二即太半步為見股即出南門見木步數也合問說曰術以容方自乘為實餘句為法實如法得餘股今有邑東西七里南北九里各中開門出東門十五里有木問出南門幾何步而見木答曰三百一十五步如圖出東門里數為股率東門南至隅里數為句率南門東至隅里數為見股出南門為見股之句術曰東門南至隅步數以乘南門東至隅步數為實以木去門步數為法實如法而一此以東門南至隅四里半為句率出東門十五里為股率南門東至隅三里半為見股所問出南門即見股之句為術之意與上同也草曰置邑東西七里半之得三里半以里法三
