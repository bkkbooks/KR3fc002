body:
  text: 十五尺是爲大弦幂開方除之則大弦可知也大弦則中立方之長邪邪卽九徑也故中立方自乘之幂於丸徑自乘之幂三分之一也令大弦還乘其幂卽丸外立方之積也大弦幂開之不盡令其幂七十五再自乘之爲面命得外立方積四十二萬一千八百七十五尺之面又令中立方五尺自乘又以方乘之得積一百二十五尺一百二十五尺自乘爲面命得積一萬五千六百二十五尺之面皆以六百二十五約之外立方積六百七十五尺之面中立方積二十五尺之面也張衡算又謂立方爲質立圓爲渾衡言質之與中外之渾六百七十五尺之面開方除之不足一謂外質積二十六也內渾二十五之面謂積五尺也今𡽪令質言中渾渾又言質則二質相與之率猶衡二渾相與之率也衡蓋亦先二質之率推以言渾之率也衡又言質六十四之面渾二十五之面質復言渾謂居質八分之五也又云方八之面圓六之面圓渾相推知其復以圓囷爲方率渾爲圓率也失之遠矣衡說之自然欲協其陰陽奇耦之說而不顧疎密矣雖有文辭斯亂道破義病也置外質積二十六以九乘之十六而一得積一十四尺八分之五卽質之渾也以分母乘全內子得一百一十七又內質積五以分母乘之得四十是爲質居渾一百一十七分之四十而渾率猶爲傷多也假令方二尺方四面并得八尺也謂之方周其中令圓徑與方等亦二尺也丸半徑以乘圓周之半卽圓幂也半方以乘方周之半卽方幂也然則方周知方幂之率也圓周知圓幂之率也按如衡術方周率八之面圓周率五之面也令方周六十四尺之面卽圓周四十尺之面也又令徑一尺方周四尺自乘得十六尺之而是爲圓周率十二之面而徑率一之面也衡亦以周三徑一之率爲非是故更著此法然增周太多過其實矣臣淳風等謹按祖暅之謂劉𡽪張衡二人皆以圓囷爲方率丸爲圓率乃設新法祖暅之開立圓術曰以二十一乘積十一而一開立方除之卽立圓徑其意何也取立方棊一枚令立樞於左後之下隅從規去其右上之𠔳又令而横規之去其前上之𠔳右
