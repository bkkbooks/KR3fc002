body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門撰粟米以御交質變易粟米之法凡此諸率相與大通其特相求各如本率可約者約之別術然也粟率五十糲米三十稗米二十七糳米二十四御米二十一小䵂十三半大䵂五十四糲飯七十五稗飯五十四糳飯四十八御飯四十二菽答麻麥各四十五稻六十豉六十三飱九十熟菽一百三半糵一百七十五説曰粟米之法自粟率至糵凡十七物皆通之為相與之率故曰大通其特相求乃以二物相求如首問粟欲為糲米是也其二率有可約者如粟率五十米率三十退位求之為三與五即以十約之也有不可約者聽之如二問粟欲為
  hash: sha256:521dc495064a946495d5dc74548a2d8c2d56afd59c0e1e207eb022a759e803a4
