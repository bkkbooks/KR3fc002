body:
  text: 魏劉𡽪注唐朝議大夫行太史令上輕車都尉臣李淳風等奉敕注釋鍾祥李潢雲門譔粟米以御交質𠮓易粟米之法凡此諸率相與大通其特相求各如本率可約者約之別術然也粟率五十糲米三十粺米二十七糳米二十四御米二十一小䵂十三半大䵂五十四糲飯七十五粺飯五十四糳飯四十八御飯四十二菽荅麻麥各四十五稻六十豉六十三飱九十熟菽一百三半糵一百七十五説曰粟米之法自粟率至糵凡十七物皆通之爲相與之率故曰大通其特相求乃以二物相求如首問粟欲爲糲米是也其二率有可約者如粟率五十米率三十退位求之爲三與五卽以十約之也有不可約者聽之如二問粟欲爲
  hash: sha256:3919bfeb4aaf7b8e9246362af9d8bb16ddcf1d23259671d4322032d7bae033c4
