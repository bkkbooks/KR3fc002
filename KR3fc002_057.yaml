body:
  text: 幂二十五寸減弦幂餘七十五寸開方除之下至秒忽又一退法求其微數微數無名者以為分子以下為分母約作五分忽之二故得股八寸六分六𨤲二秒五忽五分忽之二以減半徑餘一寸三分三𨤲九毫九秒四忽五分忽之三謂之小句觚之半面又謂之小股為之求弦其幂二千六百七十九億四千九百一十九萬三千四百四十五忽餘分弃之開方除之即十二觚之一面也割十二觚以為二十四觚術曰亦令半徑為弦半面為句為之求股置上小弦幂四而一得六百六十九億八千七百二十九萬八千三百六十一忽餘分棄之即句幂也以減弦幂其餘開方除之得股九寸六分五𨤲九毫二秒五忽五分忽之四以減半徑餘三分四𨤲七秒四忽五分忽之一謂之小句觚之半面又謂之小股為之求小弦共幂六百八十一億四千八百三十四萬九千四百六十六忽餘分棄之開方除之即二十四觚之一面也割二十四觚以為四十八觚術曰亦令半徑為弦半面為句為之求股置上小弦幂四而一得一百七十億三千七百八萬七千三百六十六忽餘分棄之即句幂也以減弦幂其餘開方除之得股九寸九分一𨤲四毫四秒四忽五分忽之四以減半徑餘八𨤲五毫五秒五忽五分忽之一謂之小句觚之半面又謂之小股為之求小弦其幂一百七十一億一千二十七萬八千八百一十三忽餘分棄之開方除之得小弦一寸三分八毫六忽餘分棄之即四十八觚之一面以半徑一尺乘之又以二十四乘之得幂三萬一千三百九十三億四千四百萬忽以百億除之得幂三百一十三寸六百二十五分寸之五百八十四即九十六觚之幂也割四十八觚以為九十六觚術曰亦令半徑為弦半面為句為之求股置次上弦幂四而一得四十二億七千七百五十六萬九千七百三忽餘分棄之則句幂也以減弦幂其餘開方除之得股九寸九分七𨤲八毫五秒八忽十分忽之九以減半徑餘二𨤲一毫四秒一忽十分忽之一謂之小句觚之半面又謂之小股為之求小弦其幂四十二億八千二百一十五萬四千一十二忽餘分棄之開方
