body:
  text: 上造二斗公士一斗為列衰副并得一十五加後來大夫亦五斗得二十以為法以五斗乘未并者大夫得二十五斗不更得二十斗簪裊得一十五斗上造得一十斗公士得五斗各自為實實如法得一斗二十分斗之五子母各以五約之為四分斗之一為大夫所出粟得一斗為不更所出粟得二十分斗之一十五約為四分斗之三為簪裊所出粟得二十分斗之一十約為四分斗之二為上造所出粟得二十分斗之五約為四分斗之一為公士所出粟合問說曰注云禀前五人十五斗者大夫得五斗不更得四斗簪裊得三斗上造得二斗公士得一斗者置禀粟一十五斗依爵數五四三二一均分之也云欲令五人各依所得粟多少減與後來大夫即與前來大夫同者後來大夫與前來大夫爵數同故得粟數亦同也云是為六人共出五斗後來大夫亦俱損折者大夫二人當各得五斗今各得三斗四分斗之三不更四斗今賸三斗簪裊三斗今賸二斗四分斗之一上造二斗今賸一斗四分斗之二公士一斗今賸四
