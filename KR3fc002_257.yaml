body:
  text: 荅曰五斤八兩一十二銖五分銖之四術曰以一斤價數爲法以一斤乘今有錢數爲實實如法得絲數按此術今有之義以一斤價爲所有率一斤爲所求率今有錢爲所有數而今有之卽得草曰置今有錢一千三百二十八於位以一斤乘之得一千三百二十八斤爲實以價直二百四十錢爲法實如法得五斤實餘一百二十八斤以十六乘之得二千四十八兩爲實實如法得八兩實餘一百二十八兩以二十四乘之得三千七十二銖爲實實如法得一十二銖實餘一百九十二銖以法命之爲二百四十分銖之一百九十二子母各以四十八約之爲五分銖之四并之得五斤八兩一十二銖五分銖之四合問説曰此問所求率止於斤故以一斤價數爲法以一斤乘今有錢數爲實雖一乘不長而錢化爲斤矣實如法得斤數不滿法者當以法命之爲幾分斤之幾今欲退求兩數以十六乘實餘則斤化爲兩實如法得兩數不滿法者當以法命之爲幾分兩之幾今欲退求銖數以二十四
