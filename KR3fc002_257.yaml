body:
  text: 答曰五斤八兩一十二銖五分銖之四術曰以一斤價數為法以一斤乘今有錢數為實實如法得絲數按此術今有之義以一斤價為所有率一斤為所求率今有錢為所有數而今有之即得草曰置今有錢一千三百二十八於位以一斤乘之得一千三百二十八斤為實以價直二百四十錢為法實如法得五斤實餘一百二十八斤以十六乘之得二千四十八兩為實實如法得八兩實餘一百二十八兩以二十四乘之得三千七十二銖為實實如法得一十二銖實餘一百九十二銖以法命之為二百四十分銖之一百九十二子母各以四十八約之為五分銖之四并之得五斤八兩一十二銖五分銖之四合問說曰此問所求率止於斤故以一斤價數為法以一斤乘今有錢數為實雖一乘不長而錢化為斤矣實如法得斤數不滿法者當以法命之為幾分斤之幾今欲退求兩數以十六乘實餘則斤化為兩實如法得兩數不滿法者當以法命之為幾分兩之幾今欲退求銖數以二十四
