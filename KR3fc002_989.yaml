body:
  text: 百步通之得一千五十步為見股又置南北九里半之得四里半以里法三百步通之得一千三百五十步為句率以乘見股得一百四十一萬七千五百步為實又置出東門十五里以里法三百步通之得四千五百步為股率以為法實如法得三百一十五步為見句即出南門見木步數也合問説曰注云為術之意與上同也者術亦以容方面相乘為實餘股為法實如法得餘句今有邑方不知大小各中開門出北門三十步有木出西門七百五十步見木問邑方幾何答曰一里如圖出北門步數為小句出西門步數為大股相乘為半方邑自乘居一隅之積分因而四之得四隅之積分開方除之得邑方術曰令兩出門步數相乘因而四之為實開方除之即得邑方按前術半邑方自乘出東門步數除之即出南門步數今兩出門相乘為半方邑自乘居一隅之積分因而四之即得四隅之積分故以為實開方除之即邑
