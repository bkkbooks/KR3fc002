body:
  text: 左前外棊前丁癸壬為左凸形原有之立幂左甲丁癸為甲癸弧所分之立幂并甲壬面所分之甲丁壬與甲癸壬二幂共四幂右前外棊以丙壬立面聯前丁壬右乙壬為二弧幂并甲壬面所分之甲丁壬與甲乙壬二幂及上幂共五幂與內棊相對右後外棊後甲乙辛為右凹形原有之立幂右乙辛壬為乙壬弧所分之立幂并甲壬面所分之甲乙壬與甲辛壬二幂共四幂與左前外棊相對更合四棊復橫斷之以句股言之令餘高為句內棊斷上方為股本方之數其弦也句股之法以句幂減弦幂則餘為股幂若令餘高自乘減本方之幂餘即內棊斷上方之幂也本方之幂
  hash: sha256:ee4237a68f49277ebead1855e31a335a7946ed48f2bd03ac75c787bbd89e26dc
