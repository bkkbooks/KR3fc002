body:
  text: 左前外棊前丁癸壬爲左凸形原有之立幂左甲丁癸爲甲癸弧所分之立幂并甲壬面所分之甲丁壬與甲癸壬二幂共四幂右前外棊以丙壬立面聯前丁壬右乙壬爲二弧幂并甲壬面所分之甲丁壬與甲乙壬二幂及上幂共五幂與內棊相對右後外棊後甲乙辛爲右凹形原有之立幂右乙辛壬爲乙壬弧所分之立幂并甲壬面所分之甲乙壬與甲辛壬二幂共四幂與左前外棊相對更合四棊復橫斷之以句股言之令餘高爲句內棊斷上方爲股本方之數其弦也句股之法以句幂減弦幂則餘爲股幂若令餘高自乘減本方之幂餘卽內棊斷上方之幂也本方之幂
  hash: sha256:2f59325c6e63e33d02c28d60bf5365eddbeb791b3f7c6219fd94b1dac51e17f1
