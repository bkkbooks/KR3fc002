body:
  text: 七十五升爲實以四爲法除之得一斗八升四分升之三卽和漆也合問今有玉方一寸重七兩石方一寸重六兩今有石立方三寸中有玉并重十一斤問玉石重各幾何荅曰玉十四寸重六斤二兩石十三寸重四斤十四兩術曰假令皆玉多十三兩令之皆石不足十四兩不足爲玉多爲石各以一寸之重乘之得玉石之積重立方三寸是一面之方計積二十七寸玉方一寸重七兩石方一寸重六兩是爲玉石重差一兩假令皆玉合有一百八十九兩課於十一斤有餘十三兩玉重而石輕故有此多卽二十七寸之中有十三寸寸損一兩則以爲石重故言多爲石言多之數出於石以爲玉假令皆石合有一百六十二兩課於十一斤少十四兩故曰不足此不足卽以重爲輕故令減少數於石重卽二十七寸之中有十四寸寸增一兩則以爲玉重也草曰置石立方三寸自乘得九寸再乘得二十七寸爲積假令皆玉以七兩乘積二十七寸得一百八十九兩展十一斤爲一百七十六兩減之多十三兩多爲石卽石十三寸也以六兩乘之得七十八兩以十六兩除之得四斤十四兩爲石重令之皆石以六兩乘積二十七寸得一百六十二兩以一百七十六兩減之不足十四
