body:
  text: 行醇酒行酒有餘右行升升醇酒行酒不足左行升升令不足維乘右行五升得醇酒十升維乘右行一斗五升得行酒三十升令有餘一十維乘左行二升得醇酒二十升維乘左行一斗八升得行酒一百八十升醇酒行酒有餘右行升升醇酒行酒不足左行升升乃并醇酒得三十升并行酒得二百一十升各為實并有餘一十不足二得十二為法實如法得醇酒二升半行酒一斗七升半合問説曰注云此問已有重設及其齊同之意也者先設醇酒又設行酒是重設也以盈朒維乘醇
  hash: sha256:b25d58eb1b671e7decb5c09b49f63151e7a92f25aac3d3804e021ed88744739e
