body:
  text: 法於下位也以所分乘上別以下集除之者古者乘除皆列位三重乘則下法上實得數在中除則下法中實得數在上具見孫子算經衰分術兼用乘除乘則以列衰置上所分置下上下相乘得數在中除則以副并置下乘得數置中以下除中得數在上也云一乘一除適足相消者以所分乘列衰之小者為實實如法而一則得數亦小以所分乘列衰之大者為實實如法而一則得數亦大是適足相消也云所分猶存者謂得所求後仍以所分乘別一列衰不以所得減所分也云且各應率而別者各得數應所求率而別所求率即列衰也云於今有術列衰各為所求率副并為所有率所分為所有數者明衰分之術與今有同也今有術以所有數乘所求率為實以所有率為法實如法而一此術以所分乘未并者各自為實副并為法實如法而一未并者即列衰故以所分為所有數列衰各為所求率副并為所有率也云又以經分言之者經分直求一人之分即除也其術見方田章云假令甲家三人乙家二人丙家一人并六
