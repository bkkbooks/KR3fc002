body:
  text: 五十於上位米率三十於下位以下減上上餘二十轉以上餘二十減下位三十下餘一十又以下餘一十減上餘二十上位亦餘一十是一十為等數也以等數一十約米率三十得三為所求率以等數一十約粟率五十得五為所有率故三之五而一也今有粟二斗一升欲為稗米問得幾何答曰為稗米一斗一升五十分升之十七術曰以粟求稗米二十七之五十而一臣淳風等謹按稗米之率二十有七故直以二十七之五十而一也草曰置粟二斗一升展為二十一升以稗米率二十七乘之得五百六十七升為實以粟率五十為法除之得一斗一升五十分升之十七即稗米也合問説曰此無等數可約故仍用其本率置粟率五十於上位稗米率二十七於下位以下減上上餘二十三轉以上餘減下位下位餘四又以下餘四減上餘二十三上位餘三又以上餘三減下餘四下位餘一是無等數可約也故直以二十七之五十而一也
