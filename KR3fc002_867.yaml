body:
  text: 後法得七百二十一實七十六是為七百二十一綆而七十六逮井而戊一綆逮之數定逮七百二十一分之七十六是故七百二十一為井深七十六為戊綆之長舉率以言之潢按永樂大典七十六逮井下有并用逮之數以法除實者十字草曰置甲二綆乙一綆一逮井於右行次置乙三綆丙一綆一逮井於第二行次置丙四綆丁一綆一逮井於第三行次置丁五綆戊一綆一逮井於第四行次置甲一綆戊六綆一逮井於第五行令右行甲二綆遍乘左行左行得甲二綆戊十二綆二逮井以同減異并左行左行甲綆空乙一綆負戊十二綆正一逮井正次令第二行乙三綆遍乘左行左行得乙三綆負戊三十六綆正三逮井正以異減同并左行左行乙綆空丙一綆正戊三十六綆正四逮井正次令第三行丙四綆遍乘左行左行得丙四綆正戊一百四十四綆正十六逮井正以同減異并左行左行丙綆空丁一綆負戊一百四十四綆正十五逮井正次令第四行丁五綆遍乘左行左行得丁五綆負戊七百二十綆正七十五逮井正以異減同并左行左行丁綆空戊七百二十
