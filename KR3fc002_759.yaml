body:
  text: 善田惡田不足左行畝畝錢左右行錢皆通分內子得善田二十畝惡田八十畝多一萬二千錢於右行善田十畝惡田九十畝不足四千錢於左行善田惡田有餘右行畝畝錢善田惡田不足左行畝畝錢令不足四千錢維乘右行善田二十畝得善田八萬畝維乘右行惡田八十畝得惡田三十二萬畝令多一萬二千錢維乘左行善田十畝得善田一十二萬畝維乘惡田九十畝得惡田一百八萬畝善田惡田有餘右行畝畝錢善田惡田不足左行
