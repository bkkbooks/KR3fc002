body:
  text: 六寸太半寸卽山高也合問今有井徑五尺不知其深立五尺木於井上從木末望水岸入徑四寸問井深幾何荅曰五丈七尺五寸如圖入徑爲句率立木爲股率井徑減入徑餘爲見句井深爲見股術曰置井徑五尺以入徑四寸減之餘以乘立木五尺爲實以入徑四寸爲法實如法得一寸此以入徑四寸爲句率立木五尺爲股率井徑四尺六寸爲見句問井深者見句之股也潢按井徑四尺六寸爲見句當作井徑減入徑四寸餘有四尺六寸爲見句草曰置井徑五尺以入徑四寸減之餘四尺六寸通作四十六寸爲見句以立木五尺通作五十寸爲股率乘之得二千三百寸爲實以入徑四寸爲句率以爲法實如法得五百七十五寸卽五丈七尺五寸爲見股卽井深也合問九章算術細草圖説卷九門下晚學生沈欽裴算校
