body:
  text: 弧背之名至今因之不得云古人謂之弧背也漢書律歴志之六觚郊祀志之八觚雖訓觚爲角然皆體之稜面如竈觚觚稜之𩔖不得據彼以易此也云六弧之一面與圓徑之半其數均等則六弧之六面爲全徑之三倍可知矣故云合徑率一而外周率三也如圖作甲乙丙丁戊已圓又作庚丙辛壬癸戊圓庚丙與庚戊皆六弧之一面亦卽圓徑之半云又按爲圖以六弧之一面乘半徑二因而六之得十二弧之幂若又割之次以十二弧之一面乘一弧之半徑四因而六之則得二十四弧之幂者據下文及徑自乘三之四而一術注校之二因而六之當作因而三之四因而六之當作因而六之後記注割六弧爲十二弧術半徑一尺爲弦半面五寸爲句求得股八寸六分有奇作大句股幂又以股減半徑得股弦差爲小句半面五寸爲小股求得小弦五寸一分有奇爲十二弧之一面作小句股幂并大小二句股
  hash: sha256:bc39cefce55f01e9b19149a44b7d0bb407b84aacdd161fe4a0a32512adf97057
