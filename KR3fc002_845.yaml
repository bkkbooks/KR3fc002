body:
  text: 以差損多令多數與少數相當此術以差益少令少數與多數相當也以右行上禾徧乘左行而減之左行上禾空異名相除也餘下禾五秉本在右行爲負移入左行仍爲負負無人負之也實十五斗負同名相益也以右行下禾列實減右行下位差實前注所云行中正負雜者同名減實也不足減反減之𠮓負爲正前注所云負無人正之也今有牛五羊二直金十兩牛二羊五直金八兩問牛羊各直金幾何荅曰牛一直金一兩二十一分兩之十三羊一直金二十一分兩之二十術曰如方程假令爲同齊頭位爲牛左右行相乘定更置牛十羊四直金二十兩左行牛十羊二十五直金四十兩牛數等同金多二十兩者羊差二十一使之然也以少行減多行則牛數盡惟羊與直金之數見可得而知也以小推大雖四五行不異也潢按注更置下脫右行二字草曰置牛五羊二直金十兩於右行牛二羊五直金八兩於左行以右行牛五徧乘左行左行得牛十羊二十五直金四十兩以右行減之左
  hash: sha256:d699f62dc393b04525e0d65f71d0bed06ff6551a3526235ddb5737f8029e21b8
