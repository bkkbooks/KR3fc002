body:
  text: 云弧體法當應規今弧面不至外畔失之於少者弧體得十二弧幂之半較半圓幂少六小弧矢幂故為失之於少云若不滿半圓者益復疏濶宜依句股鋸圓材之術以弧弦為鋸道長以矢為鋸深而求其徑者句股章鋸圓材術半鋸道自乘如深寸而一以深寸增之即材徑是句與股弦差求弦術也云既知圓徑至則必近密率矣者與前記注割圓之術同也今有環田中周九十二步外周一百二十二步徑五步此欲令與周三徑一之率相應故言徑五步也據中外周以𡽪術言之當徑四步一百五十七分步之一百二十二也臣淳風等謹按依密率合徑四步二十二分步之十七問為田幾何答曰二畝五十五步於𡽪術當為田二畝三十一步一百五十七分步之二十三臣淳風等謹依密率為田二畝三十步二十二分步之十五如圖甲乙丙丁為外周庚辛壬癸為中周甲庚乙辛壬丙癸丁皆徑也并中外周而半之以徑乘之為積又有環田中周六十二步四分步之三外周一百一十三步二分步之一徑十二步三分步之二此田環而不通匝故徑十二步三分步之二若據上周求徑者此徑失之於多過周三徑一之率蓋為疏矣於𡽪術當徑
