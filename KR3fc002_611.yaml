body:
  text: 貸人千錢與此同潢按注文複舛攺正於後按此術以負鹽二斛升數乘所行一百里得二萬里是爲負鹽一升行二萬里於今有術爲所率率以今負鹽升數乘所行里今負鹽一升凡所行里也於今有術爲所有數四十錢爲所求率也衰分章貸人千錢與此同草曰置鹽二斛展爲二百升以一百里乘之又以分母三通之得六萬里爲法次置今負鹽一斛七斗三升少半升卽一百七十三升三分升之一通分內子得五百二十升以四十錢乘之得二萬八百錢又以八十里乘之得一百六十六萬四千錢爲實實如法得二十七錢六萬分錢之四萬四千以等數四千約子母爲十五分錢之十一合問説曰此重今有之義也依今有術置二斛升數以分母三通之得六百升爲所有率四十錢爲所求率今負鹽通分內子得五百二十升爲所有數而今有之得三十四錢六百分錢之四百
  hash: sha256:c1dfa74c9a7f0aac6151a18e967d8bb683349a96487be74784290b1f488dd686
