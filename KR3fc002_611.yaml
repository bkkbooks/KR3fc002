body:
  text: 貸人千錢與此同潢按注文復舛攺正於後按此術以負鹽二斛升數乘所行一百里得二萬里是為負鹽一升行二萬里於今有術為所率率以今負鹽升數乘所行里今負鹽一升凡所行里也於今有術為所有數四十錢為所求率也衰分章貸人千錢與此同草曰置鹽二斛展為二百升以一百里乘之又以分母三通之得六萬里為法次置今負鹽一斛七斗三升少半升即一百七十三升三分升之一通分內子得五百二十升以四十錢乘之得二萬八百錢又以八十里乘之得一百六十六萬四千錢為實實如法得二十七錢六萬分錢之四萬四千以等數四千約子母為十五分錢之十一合問説曰此重今有之義也依今有術置二斛升數以分母三通之得六百升為所有率四十錢為所求率今負鹽通分內子得五百二十升為所有數而今有之得三十四錢六百分錢之四百
  hash: sha256:706b4acab8dc3ce352d2cb3ff8f7b7e8d13233a929401f592bf3e769e00fe4eb
