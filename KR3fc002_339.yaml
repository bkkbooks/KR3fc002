body:
  text: 之以五十加定法得二百五十爲定法以上議三十乘之得一萬二千五百以減實實餘二千七百八十一步除巳以所副五十從定法得三百爲定法折而下復置借算步之超一等至步而止置上議九乘借算得九以加定法得三百九爲定法以上議九乘之得二千七百八十一以減實適盡上議得一百五十九步卽方也合問草曰置積七萬一千八百二十四步爲實借一算步之超一等至百而止置上議二百以乘所借一算得二百爲法以上議二百乘之得四萬以減實實餘三萬一千八百二十四步除巳倍法得四百爲定法折而下復置借算步之超一等至十而止置上議六十以乘借算得六十副之以六十加定法得四百六十爲定法以上議六十乘之得二萬七千六百以減實實餘四千二百二十四步除巳以所副六十從定法得五百二十爲定法折而下復置借算步之超一等至步而止置上議八乘借算得八以從定法得五百二十八爲定法以上議八乘之得四千二
  hash: sha256:bf5d93076fd00f9bcf4d6d5d668a07a863ff5bbfeb3a1e145edae14fbbc725be
