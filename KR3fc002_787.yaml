body:
  text: 本加一萬二千得二萬六千三百七十八錢一百六十九分錢之一百一十八通分內子得四百四十五萬八千又以十乘之得四千四百五十八萬為實以分母一百六十九乘十三得二千一百九十七為法實如法得二萬二百九十一錢二千一百九十七分錢之六百七十三即第三返之本加一萬三千得三萬三千二百九十一錢二千一百九十七分錢之六百七十三通分內子得七千三百一十四萬一千錢又以十乘之得七億三千一百四十一萬為實以分母二千一百九十七乘十三得二萬八千五百六十一為法實如法得二萬五千六百八錢二萬八千五百六十一分錢之一萬九千九百一十二即第二返之本加一萬四千得三萬九千六百八錢二萬八千五百六十一分錢之一萬九千九百一十二通分內子得一十一億三千一百二十六萬四千錢又以十乘之得一百一十三億一千二百六十四萬為實以分母二萬八千五百六十一乘十三得三十七萬一千二百九十三為法實如法得三萬四百六十八錢
