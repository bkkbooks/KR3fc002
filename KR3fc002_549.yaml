body:
  text: 車一千六百二十二乘各以二十五斛乘之得甲縣粟八萬三千一百斛乙丙縣粟各六萬三千一百七十五斛丁縣粟四萬五百五十斛合問説曰注云各置所當出車以其行道日數乘之如戶數而一得率戶用車二日四十七分日之三十一故謂之均求此率以戶當各計車之衰分也者此以各縣戶數為所有率行道日數為所求率出車為所有數戶用車日為所求數所有率為戶所有數為車故云求此率以戶當各計車之衰分也甲縣出車三千三百二十四乘四十七分乘之二十二通分內子得一十五萬六千二百五十以行道八日乘之得一百二十五萬為實以分母四十七乘甲戶一萬得四十七萬為法實如法而一得二日四十七萬分日之三十一萬以等數一萬約子母為四十七分日之三十一乙縣出車二千五百二十六乘四十七分乘之二十八通分內子得一十一萬八千七百五十以行道十日乘之得一百一十八萬七千五百為實以分母四十七乘乙戶九千
  hash: sha256:5d621d8b2c61e9eb61958ef1b16f97197c2a5bbc560303954236fba99bfeaf97
