body:
  text: 去六分之一加減之得各數今有竹九節下三節容四升上四節容三升問中間二節欲均容各多少答曰下初一升六十六分升之二十九次一升六十六分升之二十二次一升六十六分升之一十五次一升六十六分升之八次一升六十六分升之一次六十六分升之六十次六十六分升之五十三次六十六分升之四十六次六十六分升之三十九術曰以下三節分四升為下率以上四節分三升為上率此二率者各其平率也上下率以少減多餘為實按此上下節各分所容為率者各其平率上下以少減多者餘為中間五節半之凡差故以為實也置四節三節各半之以減九節餘為法實如法得一升即衰相去也按此術上下節所容巳定之節中間相去節數也實者中間五節半之凡差也故實如法而一則每節之差也下率一升少半升者下第二節容也一升少半升者下三節通分四升之平率平率
