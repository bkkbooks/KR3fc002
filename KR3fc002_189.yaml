body:
  text: 銖二十四除之得九兩餘一十七銖上位得一鈞九兩一十二銖石八千五十一錢下位得一石一鈞二十七斤九兩一十七銖石八千五十二錢合問買絲鈞率之草曰置絲一鈞以鈞積銖通之得一萬一千五百二十以出錢一萬三千九百七十乘之得一億六千九十三萬四千四百錢為實次置所買絲一石二鈞二十八斤三兩五銖通之得七萬九千九百四十九銖為法實如法得二千一十二錢為賤絲一鈞之價每鈞增一錢得二千一十三錢為貴絲一鈞之價實餘七萬七千一十二銖為貴絲以實餘七萬七千一十二銖減所買絲七萬九千九百四十九銖餘二千九百三十七銖為賤絲乃置賤絲二千九百三十七銖於上位以斤積銖三百八十四除之得七斤餘二百四十九銖以兩積銖二十四除之得一十兩餘九銖又置貴絲七萬七千一十二銖於下位以石積銖四萬六千八十除之得一石餘三萬九百三十二銖以鈞積銖一萬一千五百二十除之得二鈞餘七千八百九十
