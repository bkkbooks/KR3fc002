body:
  text: 乙寅午巳申爲右前陽馬云陽馬之幂各二壍堵之幂各居三者置下袤以廣乘之得陽馬幂一壍堵幂一倍之得陽馬幂二壍堵幂二又置上袤以廣乘之得壍堵幂一并之得陽馬幂二壍堵幂三云其於本棊也皆一而爲六故六而一卽得者求壍堵積者廣袤相乘以高乘之二而一今有壍堵幂三又當以三除求陽馬積者廣袤相乘以高乘之三而一今有陽馬幂二又當以二除故并五幂以高乘之以六除之也芻童曲池盤池冥谷皆同術術曰倍上袤下袤從之亦倍下袤上袤從之各以其廣乘之并以高若深乘之皆六而一按此術假令芻童上廣一尺袤二尺下廣三尺袤四尺高一尺其用棊也中央立方二四面壍堵六四角陽馬四倍下袤爲八上袤從之爲十以下廣乘之得積三十尺是爲得中央立方各三兩邊壍堵各四兩旁壍堵各六四角陽馬亦各六復倍上袤下袤從之爲八以高廣乘之得積八尺是爲得中央立方亦各三兩端壍堵各二并兩旁三品棊皆一而爲六故六而一卽得爲術又可令上下廣袤差相乘以高乘之三而一卽四陽馬上下廣袤互相乘并而半之以高乘之卽四面六壍堵與二立方并之爲芻童積又可令上下廣袤互相乘而半之上下廣袤又各自乘并以高乘之三而一卽得也其曲池者并上中外周而半之以
