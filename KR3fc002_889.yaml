body:
  text: 行得四十二犬負一百五十六雞正一百一十四兔正直錢一千八百一十二正以同減異并第三行第三行犬空餘三十雞六十五兔直錢二千五百七十五皆正又令第二行六犬徧乘左行左行得四十二犬一百一十四雞六兔直錢七千八百七十八皆正以異減同并左行左行犬空餘二百四十雞五十五兔直錢七千一百一十五皆正又令第三行三十雞徧乘左行左行得七千二百雞一千六百五十兔直錢二十一萬三千四百五十皆正以第三行減之左行雞空餘一萬三千九百五十兔負直錢四十萬四千五百五十負上法下實實如法得二十九爲兔價以兔價二十九乘第三行六十五兔正得錢一千八百八十五正以減直錢二千五百七十五正餘錢六百九十正如三十雞正而一得二十三爲雞價又以雞價二十三乘第二行十八雞正得錢四百一十四正以兔價二十九乘第二行七兔正得錢二百三正并之得錢六百一十七正以并第二行直錢一百九負得錢七百二十六負如六犬負而一得一百二十
