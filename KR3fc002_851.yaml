body:
  text: 空羊三十七正豕四十九負錢三千八百正又以中行羊三十三徧乘左行羊三十七正豕四十九負錢三千八百正左行得羊一千二百二十一正豕一千六百一十七負錢十二萬五千四百正以異減同并左行左行羊空豕四十八正錢一萬四千四百正上爲法下爲實實如法得三百爲豕價求羊價以豕價三百乘中行豕四十五正得錢一萬三千五百正并中行錢三千負得錢一萬六千五百負如羊三十三負而一得五百爲羊價求牛價又以豕價三百乘右行豕十三負得錢三千九百負并右行錢一千正得錢四千九百正爲下實以羊價五百乘右行羊五正得錢二千五百正以減下實餘錢二千四百正如牛二正而一得一千二百爲牛價合問説曰注云設欲以此行如方程法者此行中行也中行錢適足下實虛缺先令牛二徧乘中行而以右行直除之移右行下實爲中行下實正無人負之是不終於虛缺矣云注曰者正無人負之之注也前注作人此注作實前注在同名
