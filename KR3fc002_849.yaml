body:
  text: 牛價一千二百羊價五百豕價三百術曰如方程置牛二羊五正豕十三負餘錢數正次置牛三正羊九負豕三正次置牛五負羊六正豕八正不足錢負以正負術入之此中行買賣相折錢適足但互買賣算而巳故下無錢直也設欲以此行如方程法先令牛二徧乘左行而以右行直除之是終於下實虛缺矣故注曰正無實負負無實正方爲類也方將以別實加不足之數與實物作實盈不足章黃金白銀與此相當假令黃金九白銀十一稱之重適等交易其一金輕十三兩問金銀一枚各重幾何與此同潢按注先令牛二徧乘左行左當作中方將以別實加不足之數不足當作適足草曰置牛二羊五正豕十三負有餘錢一千正於右行次置牛三正羊九負豕三正錢空於中行次置牛五負羊六正豕八正不足錢六百負於左行以右行牛二徧乘中行中行得牛六正羊十八負豕六正以同減異并中行中行牛空羊三十三負豕四十五正錢三千負又以右行牛二徧乘左行左行得牛十負羊十二正豕十六正錢一千二百負以異減同并左行左行牛
