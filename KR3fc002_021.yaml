body:
  text: 之即畝數按此術廣從里數相乘得積里故方里之中有三頃七十五畝故以乘之即得畝數也草曰置廣一里於位展為三百步亦展從一里為三百步以乘之得九萬步為實以畝法二百四十步為法除之得三百七十五畝收為三頃七十五畝合問草曰置廣二里於位以從三里乘之得六里又以三百七十五乘之得二千二百五十畝收為二十二頃五十畝合問說曰古者三百步為里以三百步自乘得九萬步如畝法而一得三百七十五畝故注云故方里之中有三頃七十五畝也術從簡易以廣從里數相乘得積里以三百七十五乘之即畝數可省一通分又省一除也今有十八分之十二問約之得幾何答曰三分之二又有九十一分之四十九問約之得幾何答曰十三分之七約分按約分者物之數量不可悉全必以分言之分之為數繁則難用設有四分之二者繁而言之亦可為八分之四約而言之則二分之一也雖則異辭至於為數亦同歸爾法實相
