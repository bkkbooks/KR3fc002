body:
  text: 立方也兩棊原本誤作兩端云是為別種而方者率居三通其體而方者率居一者各以一赤鱉臑接一黑陽馬為二塹堵合之成立方一以一赤塹堵一黑塹堵割為六鱉臑合成立方一又以一赤塹堵一黑塹堵合成立方一是為別種而方者率居三也其原有之黑立方棊一是通其體而方者率居一也云按餘數具而可知者至安取餘哉疑文有錯誤不敢強為之説云無以知錐亭之數者按宋本作錐亭之類其義較長蓋方錐圓錐方亭圓亭形體不一故云類也云功實之主也者疑亦有脫文蓋謂陽馬鱉臑者為程功積實之主也今有鱉臑下廣五尺無袤上袤四尺無廣高七尺問積幾何答曰二十三尺少半尺如圖庚辛為下廣乙丙為上袤乙辛為高術曰廣袤相乘以高乘之六而一按此術臑者臂骨也或曰
