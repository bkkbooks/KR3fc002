body:
  text: 立方也兩棊原本誤作兩端云是爲別種而方者率居三通其體而方者率居一者各以一赤鼈臑接一黑陽馬爲二壍堵合之成立方一以一赤壍堵一黑壍堵割爲六鼈臑合成立方一又以一赤壍堵一黑壍堵合成立方一是爲別種而方者率居三也其原有之黑立方棊一是通其體而方者率居一也云按餘數具而可知者至安取餘哉疑文有錯誤不敢强爲之説云無以知錐亭之數者按宋本作錐亭之類其義較長葢方錐圓錐方亭圓亭形體不一故云類也云功實之主也者疑亦有脫文葢謂陽馬鼈臑者爲程功積實之主也今有鼈臑下廣五尺無袤上袤四尺無廣高七尺問積幾何答曰二十三尺少半尺如圖庚辛爲下廣乙丙爲上袤乙辛爲高術曰廣袤相乘以高乘之六而一按此術臑者臂骨也或曰
  hash: sha256:551dfbed5f60b800aaab65b0dbaae87275cade108da242d133d7bcf9f36a16a2
