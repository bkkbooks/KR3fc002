body:
  text: 劉徽九章算術注原序昔在庖犧氏始畫八卦以通神明之德以𩔖萬物之情作九九之術以合六爻之𠮓曁於黃帝神而化之引而伸之於是建歴紀協律品用稽道原然後兩儀四象精微之氣可得而效焉記稱隸首作數其詳未之聞也按周公制禮而有九數九數之流則九章是矣往者暴秦焚書經術散壞自時厥後漢北平侯張蒼大司農中丞耿壽昌皆以善算命世蒼等因舊文之遺殘各稱刪補故校其目則與古或異而所論者多近語也徽㓜習九章長再詳覽觀陰陽之割裂總算術之根源探𦣱之暇遂悟其意是以敢竭頑魯采其所見爲之作注事𩔖相推各有攸歸故枝條雖分而同本𠏉者知發其一端而巳又所析理以辭解體用圖庶亦約而能周通而不黷覽之者思過半矣且算在六藝古者以賓興賢能教習國子雖曰九數其能窮纎入微探測無方至於以法相傳亦猶規矩度量可得而共非特難爲也當今好之者寡故世雖多通才達學而未必能綜於此耳周官大司徒職夏至日中立八尺之表其景尺有五寸謂之地中説云南戴日下萬五千里夫云爾者以術推之按九章立四
  hash: sha256:30779dfd0812376ca5f84d89fcd6496d87504c973610c68d927e2399ea8837ca
