body:
  text: 即內外四棊之斷上幂然則餘高自乘即外三棊之斷上幂矣不問高卑勢皆然也如圖合內外四棊仍為一立方復自中半以子丑面橫斷之截甲辛弧於寅則丑庚餘高為句丑寅內棊斷上方為股庚寅本方之數為弦以丑庚句自乘幂減庚寅弦自乘幂餘即丑寅股自乘幂此以立幂之句股言之也更以平幂之句股觀之如圖截去立方子丑以上半段存子丑以下半段則并黃朱靑白幂為本方弦幂黃幂為內棊斷上幂以減本方幂餘朱靑白幂為餘高幂亦即外三棊之斷上幂朱幂正方即右前外棊斷上幂白幂長方即左前外棊斷上幂靑幂長方即右後外棊斷上幂不拘在甲庚本方何處橫斷之以斷上方為股皆得大小二正方與相等二長方為本方之幂亦為內外四棊之斷上幂但近上幂者內棊正方小外棊
