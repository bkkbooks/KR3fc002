body:
  text: 股自乘為幂如并而一所得為句弦差加差於并而半之為弦以弦減差餘為句如是或有分當通而約之乃定術以句弦并為分母差為分子故令句弦并自乘為朱黃相連之方股自乘為靑幂之矩令其矩引之直加損同之以句弦并為袤差為廣其圓大體以兩弦為袤句弦并為廣引黃斷其半為弦率七自乘者句弦并之率故弦減之餘為句率同立處是中停也列用率皆句弦并為袤弦與句各為之廣故亦以股率同其袤也置南行十步以甲邪行率乘之副置十步以乙東行率乘之各自為實實如南行率而一各得行數南行十步者所有見句求見弦股故以弦股率如句率而一潢按永樂大典本無差為分子句引黃之黃作橫故以弦股率下當有乘字草曰置甲行率七為句弦并自乘得四十九為句弦并幂即為帶分句弦并以句弦并為母又置乙行率三為股自乘得九為股幂又為句弦并與句弦差相乘幂即為帶分句弦差以句弦并為母以帶分句弦并與帶分句弦差相并得五十八為帶分兩弦并半之得二十九為帶分弦以句弦并為母為甲邪行率以帶分弦二十九減帶分句弦并四十九餘二十為帶分句以句弦并為母為甲南行率又置乙行率三為股以句弦并七乘之得二十一為帶分股以句弦并為母為乙東行率置南行十步為見
