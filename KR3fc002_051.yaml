body:
  text: 如圖子丑為正廣寅丑為一畔從子卯為一畔從移甲段補乙段亦是以盈補虛術曰并兩邪而半之以乘正從若廣又可半正從若廣以乘并畝法而一并而半之者以盈補虛也草曰置一頭廣三十步一頭廣四十二步并之得七十二步半之得三十六步以乘正從六十四步得二千三百四步如畝法二百四十步而一得九畝一百四十四步合問草曰置一畔從一百步一畔從七十二步并之得一百七十二步半之得八十六步以乘正廣六十五步得五千五百九十步如畝法二百四十步而一得二十三畝七十步合問今有箕田舌廣二十步踵廣五步正從三十步問為田幾何答曰一畝一百三十五步又有箕田舌廣一百一十七步踵廣五十步正從一百三十五步問為田幾何答曰四十六畝二百三十二步半
  hash: sha256:d64336e4634c95e879584159089af84d227473c1704cf42df396d9aff26d99d4
