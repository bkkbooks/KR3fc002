body:
  text: 十四銖十六兩爲斤斤積三百八十四銖三十斤爲鈞鈞積一萬一千五百二十銖四鈞爲石石積四萬六千八十銖石率之者一石爲所求率以石積銖通之鈞率之者一鈞爲所求率以鈞積銖通之斤率之者一斤爲所求率以斤積銖通之兩率之者一兩爲所求率以兩積銖通之旣以石鈞斤兩積銖通所求率亦以石鈞斤兩積銖通所有率置所買絲一石二鈞二十八斤三兩五銖通爲七萬九千九百四十九銖者一乘石積銖得四萬六千八十銖於上位二乘鈞積銖得二萬三千四十銖於次位二十八乘斤積銖得一萬七百五十二銖於副位三乘兩積銖得七十二銖於下位并之又加五銖共得七萬九千九百四十九銖爲法旣以分母乘法實當以分母報除故注云謂石鈞斤兩積銖除實又以石鈞斤兩積銖除法餘各爲銖卽合所問也若轉求出錢數石率之者以石積銖四萬六千八十爲法以賤絲一萬一千七百四十八銖乘八千五十一錢得九千四百五十八萬三千一百四十八錢爲實實如法得二千五十二
