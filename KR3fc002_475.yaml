body:
  text: 推此上連無成不方故方錐與陽馬同實如圖庚辛壬癸爲陽馬底方推而上之辰巳午未與子丑寅卯皆方也故與方錐同實云角而割之者相半之勢此大小鼈臑可知更相表裏但體有背正也者言此羡除之兩旁各一小鼈臑居裏有末廣而無上廣各一大鼈臑居表有上廣而無末廣是體有背正也具圖於后如圖丁甲乙丙辛庚爲壍堵其兩旁子甲乙庚與丑丁丙辛小鼈臑居裏有末廣而無上廣壬庚乙子與丙辛癸丑大鼈臑居表有上廣而無末廣是體有背正也今有芻甍下廣三丈袤四丈上袤二丈無廣高一丈問積幾何答曰五千尺
