body:
  text: 人出盈左行令盈一百維乘所出四百得四萬令盈三千四百維乘三百得一百二萬人出盈右行人出盈左行以四萬減一百二萬餘九十八萬為實以盈一百減盈三千四百餘三千三百為法乃置所出四百以所出三百減之餘一百以約法三千三百得三十三即人數也以約實九十八萬得九千八百即金價也合問其一術草曰置所出四百以所出三百減之餘一百為法以盈一百減盈三千四百餘三千三
