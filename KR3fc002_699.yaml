body:
  text: 牛價三千七百五十按此術并盈不足者為衆家之差故以為實置所出率各以家數除之各得一家所出率以少減多者得一家之差以除即家數以出率乘之減盈故得牛價也盈不足按盈者謂之朓不足者謂之朒所出率謂之假令盈朒維乘兩設者欲為齊同之意術曰盈不足相與同共買物者置所出率盈不足各居其下令維乘所出率并以為實并盈不足為法據共買物人出八盈三人出七不足四齊其假令同其盈朒盈朒俱十二通計齊則不盈不朒之正數故可并以為實并盈不足為法齊之三十二者是四假令有盈十二齊之二十一者是三假令亦朒十二并七假令合為一實故并三四為法有分者通之若兩設有分者齊其子同其母此問兩設俱見零分故齊其子同其母副置所出率以少減多餘以約法實實為物價法為人數令下維乘上訖以同約之不可約故以乘同之所出率以少減多者餘謂之設差以為少設則并盈朒是為定實故以少設約法則為人數約實則為物價盈朒當與少設相通不可遍約亦當分母乘設差為約法實其一術曰并盈不足為實以所出率以少減多餘為法實如法得一人以所出率乘之減盈增不足即物價此術意謂盈不足為衆人之差以所出率以少減多餘為一人之差以一人之差約衆人之差故得人數也潢按注以出率乘之出字上當有所字減盈故
