body:
  text: 除之得十斗九升四十八分升之十八約為八分升之三即外關未稅之本米也云今從末求本不問中間故令中率轉相乘而同之末者餘米五斗也本者外關未稅之本米也中間者內關中關之本米也中率者三五七也今以餘米五斗徑求外關未稅之本米不問內關中關未稅之本米故以三五七轉相乘而同之也又一術文亦有脫誤當作求外關所稅之餘則當置本持米以二乘之三而一蓋自外關三而取一至七而一是以本米求餘米也自凡餘分者乘其母至為所有率也是以餘米求本米也云則是餘米於本所持三十五分之十六者置分母一百五以等數三約之得三十五又置分子四十八以等數三約之得十六原術是重今有又一術是今有也今有人持金出五關前關二而稅一次關三而稅一次關四而稅一次關五而稅一次關六而稅一并五關所稅適重一斤問本持金幾何答曰一斤三兩四銖五分銖之四術曰置一斤通所稅者以乘之為實亦通其不
