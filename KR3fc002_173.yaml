body:
  text: 乘而五除今有出錢一百六十買瓴甓十八枚瓴甓甎也問枚幾何答曰一枚八錢九分錢之八今有出錢一萬三千五百買竹二千三百五十箇問箇幾何答曰一箇五錢四十七分錢之三十五經率臣淳風等謹按今有之義以所求率乘所有數合以瓴甓一枚乘錢一百六十為實但以一乘不長故不復乘是以徑將所買之率與所出之錢為法實也又按此今有之義出錢為所有數一枚為所求率所買為所有率而今有之即得所求數一乘不長故不復乘是以徑將所買之率為法以所出之錢為實實如法得一枚錢不盡者等數而命分術曰以所買率為法所出錢數為實實如法得一潢按臣淳風等謹按一假宜在劉注之後傳寫者誤置在前又增又字於劉注按此今有之義之上宜并正之買瓴甓草曰置錢一百六十為實以所買十八枚為法除之得八錢十八分錢之十六子母各半之為九分錢之八即一枚錢也合問買竹草曰置錢一萬三千五百為實以所買二千三百五十箇為法除之得五錢二千三百五
