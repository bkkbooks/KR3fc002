body:
  text: 草曰置米五斗以所稅者三乘之得十五斗又以五乘之得七十五斗又以七乘之得五百二十五斗爲實以餘不稅者二四六相乘得四十八爲法實如法得十斗又退除之得九升四十八分升之十八以等數六約子母爲八分升之三并之得十斗九升八分升之三合問説曰注云所稅者謂今所當稅之定定疑當作本外關三而取一則二爲餘米三爲本米中關五而取一則四爲餘米五爲本米內關七而取一則六爲餘米七爲本米今以餘米求本米故三五七皆爲所求率二四六皆爲所有率也云置今有餘米五斗以七乘之六而一卽內關未稅之本米也者七乘五斗得三十五斗六而一得五斗八升六分升之二卽內關未稅之本米也置此本米通分內子得三十五斗又以五乘之得一百七十五斗爲實以分母六乘四得二十四爲法除之得七斗二升二十四分升之二十二卽中關未稅之本米也又置此本米通分內子得一百七十五斗以三乘之得五百二十五斗爲實以分母二十四乘二得四十八爲法
