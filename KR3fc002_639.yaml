body:
  text: 爲追及率約之追及率得十先行率得三於今有術不善行者先行十里爲所有數十爲所求率三爲所有率而今有之卽得也其意如上術草曰置不善行者先行十里以善行者先至二十里增之得三十里爲法以不善行者先行十里乘善行者一百里得一千里爲實實如法得三十三里三分里之一卽少半里合問説曰注云追及率得十先行率得三者置先行率三十追及率一百以等數一十約之卽得今有兔先走一百步犬追之二百五十步不及三十步而止問犬不止復行幾何步及之荅曰一百七步七分步之一術曰置兔先走一百步以犬走不及三十步減之餘爲法以不及三十步乘犬追步數爲實實如法得一步按此術以不及三十步減先走一百步餘七十步爲兔先走率犬行二百五十步爲追及率約之先走率得七追及率得二十五於今有術不及三十步爲所有數二十五爲所求率七爲所有率而今有之卽得也草曰置兔先走一百步以犬走不及三十步減之餘七十步爲法以不及三十步乘犬追二百五十步得七千五百步爲實實如法得一百七
