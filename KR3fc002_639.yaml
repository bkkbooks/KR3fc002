body:
  text: 為追及率約之追及率得十先行率得三於今有術不善行者先行十里為所有數十為所求率三為所有率而今有之即得也其意如上術草曰置不善行者先行十里以善行者先至二十里增之得三十里為法以不善行者先行十里乘善行者一百里得一千里為實實如法得三十三里三分里之一即少半里合問說曰注云追及率得十先行率得三者置先行率三十追及率一百以等數一十約之即得今有兔先走一百步犬追之二百五十步不及三十步而止問犬不止復行幾何步及之答曰一百七步七分步之一術曰置兔先走一百步以犬走不及三十步減之餘為法以不及三十步乘犬追步數為實實如法得一步按此術以不及三十步減先走一百步餘七十步為兔先走率犬行二百五十步為追及率約之先走率得七追及率得二十五於今有術不及三十步為所有數二十五為所求率七為所有率而今有之即得也草曰置兔先走一百步以犬走不及三十步減之餘七十步為法以不及三十步乘犬追二百五十步得七千五百步為實實如法得一百七
